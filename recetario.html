uindillas secas","cantidad":null,"resto":"Una pizca de guindillas secas","escalable":false},{"texto":"1 lima","cantidad":1.0,"resto":"lima","escalable":true,"modo":"simple"}],"elaboracion":["Poner los fideos de arroz en remojo con agua a temperatura ambiente durante 25 minutos, hasta que estén flexibles pero aún firmes.","Mezclar la pulpa de tamarindo con agua hirviendo en un bol; disolverla con un tenedor y colar, reservando la pasta resultante.","Envolver el azúcar de palma en papel húmedo y calentarlo en el microondas 15 segundos para ablandarlo.","Rallar el azúcar de palma ablandado en un bol; añadir 80 g de la pasta de tamarindo, la salsa de pescado y el agua; mezclar hasta que el azúcar se disuelva por completo. Esta es la salsa base del pad thai.","Cortar el tofu en dados; pelar y limpiar los langostinos; picar finamente las chalotas y el rábano encurtido; picar los cacahuetes; moler las gambas secas hasta obtener un polvo; picar el ajo.","Calentar un wok a fuego fuerte; sellar los langostinos 15 segundos por cada lado; reservar.","Añadir aceite y freír el tofu hasta que esté dorado; reservar.","Bajar a fuego medio, añadir aceite y las chalotas; saltear 1 minuto.","Añadir las gambas secas molidas y cocinar 30-45 segundos, hasta que estén aromáticas.","Añadir el ajo picado y cocinar 1 minuto, hasta que las chalotas empiecen a dorarse.","Añadir los fideos hidratados, el rábano encurtido, la salsa pad thai y un chorrito de agua; saltear 2 minutos.","Apartar los ingredientes a un lado, cascar el huevo en el hueco vacío y revolverlo hasta que cuaje; mezclar todo junto.","Añadir los langostinos y el tofu reservados y una cucharada de cacahuetes; mezclar.","Añadir el cebollino picado y los brotes de soja; saltear y servir de inmediato.","Decorar con más brotes de soja, cebollino, el resto de los cacahuetes, una cucharada de guindillas secas y las mitades de lima."]},{"categoria":"PANES Y BOLLERÍA","titulo":"Croissants Auténticos con Hojaldre Casero (diegodoal)","raciones":"unos 8 croissants","racionesBase":8,"tiempo":"2 h activas (+ reposos en nevera de unas 24-26 h repartidos en 3 días)","ingredientes":[{"texto":"10 g de levadura fresca (o 4 g de levadura seca de panadero)","cantidad":10.0,"resto":"g de levadura fresca (o 4 g de levadura seca de panadero)","escalable":true,"modo":"simple"},{"texto":"130 ml de agua templada","cantidad":130.0,"resto":"ml de agua templada","escalable":true,"modo":"simple"},{"texto":"250 g de harina de fuerza","cantidad":250.0,"resto":"g de harina de fuerza","escalable":true,"modo":"simple"},{"texto":"30 g de azúcar","cantidad":30.0,"resto":"g de azúcar","escalable":true,"modo":"simple"},{"texto":"5 g de sal","cantidad":5.0,"resto":"g de sal","escalable":true,"modo":"simple"},{"texto":"1 yema de huevo (18 g)","cantidad":1.0,"resto":"yema de huevo (18 g)","escalable":true,"modo":"simple"},{"texto":"25 g de mantequilla fundida","cantidad":25.0,"resto":"g de mantequilla fundida","escalable":true,"modo":"simple"},{"texto":"138 g de mantequilla, para el laminado","cantidad":138.0,"resto":"g de mantequilla, para el laminado","escalable":true,"modo":"simple"},{"texto":"1 huevo batido con un poco de agua, para pincelar","cantidad":1.0,"resto":"huevo batido con un poco de agua, para pincelar","escalable":true,"modo":"simple"}],"elaboracion":["Esta receta se hace en tres días, así que conviene organizarse con tiempo.","Día 1: disolver la levadura fresca en el agua templada. Mezclar la harina de fuerza, el azúcar y la sal en otro bol. Añadir la yema, la levadura disuelta y la mantequilla fundida, e integrar todos los ingredientes. Amasar 2 minutos sobre la mesa, pasar a un bol y refrigerar 10 minutos tapado con un paño húmedo.","Sacar de la nevera, doblar cada lado hacia el centro sin romper la masa, tapar con film y refrigerar 10 minutos. Repetir el pliegue una vez más.","Colocar la masa sobre papel de horno; con el propio papel doblado, formar un molde de 18x18 cm y estirar la masa dentro hasta esas medidas. Refrigerar 12 horas.","Día 2: poner la mantequilla del laminado sobre papel de horno y, doblando el papel, formar un molde de 10x10 cm; estirar la mantequilla dentro hasta que ocupe esas medidas de manera uniforme. Refrigerar 30 minutos.","Desgasificar la masa sobre la mesa. Colocar el bloque de mantequilla con las esquinas alineadas hacia los lados de la masa, doblar las esquinas de la masa hacia el centro y sellar bien con el rodillo.","Enharinar la superficie y estirar la masa hasta 45 cm de largo, con presión uniforme; recortar los sobrantes de los lados. Doblar un lado hasta dos tercios de la plancha, y el lado contrario hasta que los extremos coincidan; doblar el pliegue grande sobre el pequeño y presionar ligeramente con el rodillo. Envolver en film y refrigerar 30 minutos.","Volver a estirar hasta 45 cm y hacer un pliegue sencillo (en tres, como una carta), presionar ligeramente, envolver y refrigerar 12 horas.","Día 3: estirar la masa hasta 40x25 cm sobre superficie enharinada. Marcar 4 puntos separados 10 cm en un lado, y los puntos centrales entre ellos en el lado contrario. Unir los puntos con un cuchillo para formar los triángulos.","Estirar con cuidado cada triángulo con las manos y enrollarlos apretados, dejando la punta hacia abajo. Repetir con todos.","Pincelar con huevo batido mezclado con agua y dejar levar 2 horas sin tapar, pincelando de nuevo si se seca la superficie. Dar una última capa de huevo batido y hornear a 200° durante 20 minutos, girando la bandeja a mitad de cocción.","Dejar reposar 1 minuto y pasar a una rejilla hasta que se enfríen del todo."]},{"categoria":"PANES Y BOLLERÍA","titulo":"Focaccia, el Pan Perfecto para Principiantes (diegodoal)","raciones":"8 personas","racionesBase":8,"tiempo":"30 min (+ 2 h de levado)","ingredientes":[{"texto":"500 g de harina de trigo de fuerza","cantidad":500.0,"resto":"g de harina de trigo de fuerza","escalable":true,"modo":"simple"},{"texto":"4 g de sal","cantidad":4.0,"resto":"g de sal","escalable":true,"modo":"simple"},{"texto":"12 g de levadura fresca (o 5 g de levadura seca de panadero, o 4 g de levadura instantánea)","cantidad":12.0,"resto":"g de levadura fresca (o 5 g de levadura seca de panadero, o 4 g de levadura instantánea)","escalable":true,"modo":"simple"},{"texto":"325 g de agua","cantidad":325.0,"resto":"g de agua","escalable":true,"modo":"simple"},{"texto":"50 ml de aceite de oliva virgen extra","cantidad":50.0,"resto":"ml de aceite de oliva virgen extra","escalable":true,"modo":"simple"},{"texto":"Sal en escamas al gusto","cantidad":null,"resto":"Sal en escamas al gusto","escalable":false},{"texto":"150 g de tomates cherry","cantidad":150.0,"resto":"g de tomates cherry","escalable":true,"modo":"simple"},{"texto":"80 g de aceitunas","cantidad":80.0,"resto":"g de aceitunas","escalable":true,"modo":"simple"},{"texto":"1 cebolla pequeña, en rodajas finas","cantidad":1.0,"resto":"cebolla pequeña, en rodajas finas","escalable":true,"modo":"simple"},{"texto":"Pimienta negra al gusto","cantidad":null,"resto":"Pimienta negra al gusto","escalable":false}],"elaboracion":["Disolver la levadura fresca en agua templada; reservar.","Mezclar la harina y la sal en un bol grande. Añadir el agua con la levadura y mezclar hasta que la harina quede totalmente hidratada.","Pasar a la mesa y amasar 7-8 minutos, hasta que quede lisa y elástica.","Colocar en un bol untado con aceite y dejar levar entre 1 y 2 horas, hasta que doble su volumen.","Untar generosamente una bandeja de horno con aceite y espolvorear con sal en escamas.","Volcar la masa sobre la bandeja y estirarla con los dedos untados en aceite, sin desgasificarla ni romperla.","Dejar levar 30 minutos más, hasta que doble de nuevo.","Cortar los tomates cherry por la mitad y la cebolla en aros.","Presionar la masa con los dedos, formando hoyuelos por toda la superficie (la marca característica de la focaccia).","Repartir los toppings elegidos y las hierbas secas al gusto.","Rociar generosamente con aceite de oliva virgen extra y sal en escamas.","Hornear a 220°, sin grill, durante 20 minutos, hasta que esté dorada, girando la bandeja a mitad de cocción.","Dejar enfriar por completo sobre una rejilla antes de cortar."]},{"categoria":"PANES Y BOLLERÍA","titulo":"Bollitos de Canela, Versión Pro (diegodoal)","raciones":"unas 12 unidades","racionesBase":12,"tiempo":"1 h (+ 4 h de reposo en nevera)","ingredientes":[{"texto":"Para la masa: 15 g de levadura fresca (o 6 g instantánea, o 9 g seca)","cantidad":null,"resto":"Para la masa: 15 g de levadura fresca (o 6 g instantánea, o 9 g seca)","escalable":false},{"texto":"150 ml de leche","cantidad":150.0,"resto":"ml de leche","escalable":true,"modo":"simple"},{"texto":"275 g de harina de fuerza","cantidad":275.0,"resto":"g de harina de fuerza","escalable":true,"modo":"simple"},{"texto":"70 g de harina integral","cantidad":70.0,"resto":"g de harina integral","escalable":true,"modo":"simple"},{"texto":"2 huevos","cantidad":2.0,"resto":"huevos","escalable":true,"modo":"simple"},{"texto":"45 g de miel","cantidad":45.0,"resto":"g de miel","escalable":true,"modo":"simple"},{"texto":"3 g de extracto de vainilla","cantidad":3.0,"resto":"g de extracto de vainilla","escalable":true,"modo":"simple"},{"texto":"3 g de sal","cantidad":3.0,"resto":"g de sal","escalable":true,"modo":"simple"},{"texto":"115 g de mantequilla","cantidad":115.0,"resto":"g de mantequilla","escalable":true,"modo":"simple"},{"texto":"Para el relleno: 70 g de mantequilla","cantidad":null,"resto":"Para el relleno: 70 g de mantequilla","escalable":false},{"texto":"80 g de azúcar moreno","cantidad":80.0,"resto":"g de azúcar moreno","escalable":true,"modo":"simple"},{"texto":"45 g de miel","cantidad":45.0,"resto":"g de miel","escalable":true,"modo":"simple"},{"texto":"5 g de canela molida","cantidad":5.0,"resto":"g de canela molida","escalable":true,"modo":"simple"},{"texto":"3 g de cardamomo molido","cantidad":3.0,"resto":"g de cardamomo molido","escalable":true,"modo":"simple"},{"texto":"Para el glaseado: 30 g de mantequilla","cantidad":null,"resto":"Para el glaseado: 30 g de mantequilla","escalable":false},{"texto":"40 g de miel","cantidad":40.0,"resto":"g de miel","escalable":true,"modo":"simple"},{"texto":"100 g de azúcar granulado","cantidad":100.0,"resto":"g de azúcar granulado","escalable":true,"modo":"simple"}],"elaboracion":["Disolver la levadura fresca en 115 ml de leche templada y reservar. Separar las yemas de las claras y refrigerar las yemas.","En un bol grande, mezclar parte de la harina de fuerza con la levadura disuelta, las claras y la miel; batir hasta que doble su volumen. Añadir el resto de la harina de fuerza mezclada con la integral, sin remover, y dejar fermentar 30 minutos.","Mezclarlo todo, añadir las yemas reservadas, la vainilla, la sal y los 35 ml de leche fría restantes; mezclar con una espátula. Incorporar la mantequilla a temperatura ambiente poco a poco.","Amasar 12-15 minutos, hasta que quede lisa y elástica. Pasar a un bol enharinado, tapar y refrigerar un mínimo de 4 horas (idealmente 12).","Para el relleno, mezclar todos los ingredientes en un cazo a fuego bajo hasta que se integren; dejar enfriar del todo.","Dar forma de rectángulo a la masa sobre papel de horno y estirarla con el rodillo hasta 40x30 cm. Extender el relleno dejando un borde de 2 cm libre. Enrollar apretado, ayudándose del papel de horno.","Refrigerar el rulo 30 minutos. Engrasar un molde de muffins. Cortar el rulo en 12 porciones y colocarlas en el molde. Dejar levar 20 minutos.","Hornear a 180° durante 20-25 minutos, dándoles la vuelta a mitad de cocción. Mientras tanto, fundir la mantequilla con la miel para el glaseado y dejar templar 10 minutos.","Pincelar los bollitos recién horneados con el glaseado, espolvorear con azúcar y dejar enfriar 15 minutos sobre una rejilla antes de servir."]},{"categoria":"PANES Y BOLLERÍA","titulo":"Cinnamon Rolls con Frosting de Queso Crema (diegodoal)","raciones":"12 cinnamon rolls","racionesBase":12,"tiempo":"1 h 30 min (+ 2 h de fermentación)","ingredientes":[{"texto":"Para la masa: 600 g de harina de trigo","cantidad":null,"resto":"Para la masa: 600 g de harina de trigo","escalable":false},{"texto":"110 g de azúcar","cantidad":110.0,"resto":"g de azúcar","escalable":true,"modo":"simple"},{"texto":"6 g de sal","cantidad":6.0,"resto":"g de sal","escalable":true,"modo":"simple"},{"texto":"5 g de levadura instantánea de panadero","cantidad":5.0,"resto":"g de levadura instantánea de panadero","escalable":true,"modo":"simple"},{"texto":"250 ml de leche entera","cantidad":250.0,"resto":"ml de leche entera","escalable":true,"modo":"simple"},{"texto":"2 huevos grandes","cantidad":2.0,"resto":"huevos grandes","escalable":true,"modo":"simple"},{"texto":"1 yema grande","cantidad":1.0,"resto":"yema grande","escalable":true,"modo":"simple"},{"texto":"80 g de mantequilla sin sal","cantidad":80.0,"resto":"g de mantequilla sin sal","escalable":true,"modo":"simple"},{"texto":"Para el relleno: 250 g de azúcar moreno","cantidad":null,"resto":"Para el relleno: 250 g de azúcar moreno","escalable":false},{"texto":"18 g de canela molida","cantidad":18.0,"resto":"g de canela molida","escalable":true,"modo":"simple"},{"texto":"100 g de mantequilla sin sal","cantidad":100.0,"resto":"g de mantequilla sin sal","escalable":true,"modo":"simple"},{"texto":"Para el frosting: 120 g de queso crema","cantidad":null,"resto":"Para el frosting: 120 g de queso crema","escalable":false},{"texto":"80 g de azúcar glas","cantidad":80.0,"resto":"g de azúcar glas","escalable":true,"modo":"simple"},{"texto":"30 ml de leche entera","cantidad":30.0,"resto":"ml de leche entera","escalable":true,"modo":"simple"},{"texto":"Extracto de vainilla al gusto","cantidad":null,"resto":"Extracto de vainilla al gusto","escalable":false}],"elaboracion":["Los cinnamon rolls son los bollitos más famosos de Estados Unidos: una masa de brioche muy tierna, intercalada con azúcar de canela y cubierta con un glaseado de queso crema justo de dulzor. Son un proyecto de repostería perfecto para principiantes, porque darles forma no requiere ninguna habilidad especial, y además se congelan de maravilla ya glaseados, así que merece la pena hacer tanda grande.","En un bol, mezclar la harina, el azúcar, la sal y la levadura instantánea con unas varillas.","Hacer un hueco en el centro y añadir la leche templada, los huevos y la yema. Romper las yemas con una espátula y empezar a batir, incorporando la harina poco a poco. Continuar con las manos cuando la espátula ya no dé más de sí.","Incorporar la mantequilla a temperatura ambiente en dos tandas.","Pasar la masa a una superficie ligeramente enharinada y amasar 10 minutos, hasta que deje de estar pegajosa y quede elástica.","Pasar la masa a un bol ligeramente enharinado y dejarla fermentar 2 horas a temperatura ambiente, o bien toda la noche en la nevera, cubierta con film.","Mezclar el azúcar moreno y la canela en un bol; reservar.","Pasar la masa a una superficie enharinada y, con un rodillo, estirarla dándole forma de rectángulo de aproximadamente 70x30 cm.","Extender la mantequilla en pomada por toda la superficie, dejando un borde de 1 cm sin cubrir.","Espolvorear todo el azúcar de canela por encima y presionar ligeramente con las palmas para que se adhiera a la mantequilla.","Enrollar la masa a lo ancho, procurando que quede bien apretado.","Cortar los extremos del rollo y dividir el resto en 12 porciones de 4-5 cm de ancho.","Colocar los rollitos en una fuente engrasada con mantequilla, con el corte hacia arriba.","Dejar levar 30-45 minutos, hasta que estén hinchados y, al presionarlos con un dedo, recuperen la forma solo parcialmente.","Hornear a 180° durante 20 minutos, con calor solo por abajo.","Mientras se hornean, mezclar el queso crema y el azúcar glas con unas varillas hasta que se integren.","Añadir la leche y el extracto de vainilla; mezclar y reservar.","Sacar los rollitos del horno y dejar que reposen en la fuente 15 minutos.","Verter el glaseado por encima y servir."]},{"categoria":"PANES Y BOLLERÍA","titulo":"Panini Italianos con Schiacciata Casera (diegodoal)","raciones":"4 paninis (2 de cada tipo)","racionesBase":4,"tiempo":"1 h 30 min (+ 24 h de reposo de la biga)","ingredientes":[{"texto":"Para la biga (masa previa): 110 g de harina de fuerza","cantidad":null,"resto":"Para la biga (masa previa): 110 g de harina de fuerza","escalable":false},{"texto":"50 ml de agua templada","cantidad":50.0,"resto":"ml de agua templada","escalable":true,"modo":"simple"},{"texto":"0,5 g de levadura fresca","cantidad":0.5,"resto":"g de levadura fresca","escalable":true,"modo":"simple"},{"texto":"Para la masa principal: 550 g de harina de fuerza","cantidad":null,"resto":"Para la masa principal: 550 g de harina de fuerza","escalable":false},{"texto":"15 g de sal","cantidad":15.0,"resto":"g de sal","escalable":true,"modo":"simple"},{"texto":"425 ml de agua","cantidad":425.0,"resto":"ml de agua","escalable":true,"modo":"simple"},{"texto":"10 g de levadura fresca","cantidad":10.0,"resto":"g de levadura fresca","escalable":true,"modo":"simple"},{"texto":"25 g de miel","cantidad":25.0,"resto":"g de miel","escalable":true,"modo":"simple"},{"texto":"30 ml de aceite de oliva virgen extra","cantidad":30.0,"resto":"ml de aceite de oliva virgen extra","escalable":true,"modo":"simple"},{"texto":"Para el panino de mortadela y pistacho: 200 g de pistachos pelados","cantidad":null,"resto":"Para el panino de mortadela y pistacho: 200 g de pistachos pelados","escalable":false},{"texto":"Aceite de oliva virgen extra y sal, al gusto","cantidad":null,"resto":"Aceite de oliva virgen extra y sal, al gusto","escalable":false},{"texto":"100 g de queso stracciatella","cantidad":100.0,"resto":"g de queso stracciatella","escalable":true,"modo":"simple"},{"texto":"30 g de nueces","cantidad":30.0,"resto":"g de nueces","escalable":true,"modo":"simple"},{"texto":"150 g de mortadela siciliana con pistachos","cantidad":1 paño húmedo y dejar fermentar 1 hora y media, hasta que doble su volumen. Pasar a una bandeja de horno engrasada y estirar con cuidado hasta los bordes, sin romper la masa. Pincelar toda la superficie con aceite de oliva y dejar fermentar 30-45 minutos más, hasta que quede hinchada y esponjosa.","Con las yemas de los dedos, marcar hoyuelos profundos por toda la superficie. Dejar reposar 5 minutos y hornear 20 minutos a la temperatura máxima del horno, con calor solo por abajo (gratinar los últimos 5 minutos si se quiere más color). Nada más sacarla del horno, pincelar generosamente con aceite de oliva.","Panino de mortadela y pistacho: tostar los pistachos en una sartén a fuego medio 6 minutos, hasta que estén fragantes y algo dorados. Triturarlos en la procesadora unos 10 minutos, hasta conseguir una pasta cremosa y aceitosa sin grumos. Cortar un cuadrado de schiacciata, abrirlo por la mitad y untar aceite en ambos lados. Montar con la stracciatella, la pasta de pistacho, unas nueces troceadas, la rúcula aliñada con sal y aceite, y abundante mortadela. Añadir un poco más de stracciatella y pasta de pistacho en la otra mitad y cerrar.","Panino de jamón y pecorino: rallar el pecorino. Fundir la mantequilla en un cazo hasta que burbujee, añadir la harina, mezclar y cocinar hasta que pierda el sabor a crudo. Añadir la leche caliente poco a poco; cuando esté incorporada, añadir el queso rallado poco a poco removiendo hasta que emulsione. Sazonar generosamente con sal y pimienta negra recién molida.","Cortar otro cuadrado de schiacciata, abrirlo por la mitad, untar aceite y después la crema de pecorino en ambos lados. Montar con las hojas de albahaca, la mozzarella en láminas finas, el tomate en láminas finas sazonado con sal y aceite, y el jamón cocido. Cerrar y servir."]},{"categoria":"BOCADILLOS","titulo":"Bocadillo Cubano Casero (diegodoal)","raciones":"6 bocadillos","racionesBase":6,"tiempo":"1 h 30 min (+ unas 8 h entre marinado y horneado lento del cerdo)","ingredientes":[{"texto":"Para el cerdo asado: 2 kg de aguja o paletilla de cerdo, deshuesada","cantidad":null,"resto":"Para el cerdo asado: 2 kg de aguja o paletilla de cerdo, deshuesada","escalable":false},{"texto":"Sal al gusto","cantidad":null,"resto":"Sal al gusto","escalable":false},{"texto":"Para el mojo: 60 ml de zumo de lima","cantidad":null,"resto":"Para el mojo: 60 ml de zumo de lima","escalable":false},{"texto":"120 ml de zumo de naranja","cantidad":120.0,"resto":"ml de zumo de naranja","escalable":true,"modo":"simple"},{"texto":"60 ml de aceite de oliva virgen extra","cantidad":60.0,"resto":"ml de aceite de oliva virgen extra","escalable":true,"modo":"simple"},{"texto":"1 cucharada de orégano seco","cantidad":1.0,"resto":"cucharada de orégano seco","escalable":true,"modo":"simple"},{"texto":"Para el pan cubano: 350 g de harina de fuerza","cantidad":null,"resto":"Para el pan cubano: 350 g de harina de fuerza","escalable":false},{"texto":"15 g de azúcar","cantidad":15.0,"resto":"g de azúcar","escalable":true,"modo":"simple"},{"texto":"5 g de levadura de panadero instantánea","cantidad":5.0,"resto":"g de levadura de panadero instantánea","escalable":true,"modo":"simple"},{"texto":"9 g de sal","cantidad":9.0,"resto":"g de sal","escalable":true,"modo":"simple"},{"texto":"250 ml de agua templada","cantidad":250.0,"resto":"ml de agua templada","escalable":true,"modo":"simple"},{"texto":"30 g de manteca de cerdo","cantidad":30.0,"resto":"g de manteca de cerdo","escalable":true,"modo":"simple"},{"texto":"Para montar (por bocadillo): 150 g de cerdo asado desmenuzado","cantidad":null,"resto":"Para montar (por bocadillo): 150 g de cerdo asado desmenuzado","escalable":false},{"texto":"4 lonchas finas de jamón cocido","cantidad":4.0,"resto":"lonchas finas de jamón cocido","escalable":true,"modo":"simple"},{"texto":"2 lonchas de queso emmental","cantidad":2.0,"resto":"lonchas de queso emmental","escalable":true,"modo":"simple"},{"texto":"Mostaza amarilla al gusto","cantidad":null,"resto":"Mostaza amarilla al gusto","escalable":false},{"texto":"4-5 rodajas de pepinillos encurtidos","cantidad":4.0,"cantidad2":5.0,"resto":"rodajas de pepinillos encurtidos","escalable":true,"modo":"rango"},{"texto":"10 g de mantequilla","cantidad":10.0,"resto":"g de mantequilla","escalable":true,"modo":"simple"}],"elaboracion":["Empezar por el cerdo, que necesita tiempo: limpiar la pieza y salarla generosamente por todos los lados. Mezclar los ingredientes del mojo, reservar la mitad y marinar la carne con la otra mitad un mínimo de 2 horas, mejor de un día para otro.","Envolver la carne en papel de aluminio y hornear a 180°, con calor solo por abajo, durante 2 horas. Desenvolver, regar con los propios jugos y devolver al horno 2 horas más, rociándola cada 30 minutos para que no se seque. Dejar reposar 15 minutos y mezclar el mojo reservado con los jugos de la bandeja. Desmenuzar la carne con dos tenedores y mezclarla con ese mojo.","Para el pan: mezclar la harina, el azúcar, la levadura y la sal. Añadir el agua templada y amasar hasta integrar; incorporar la manteca a temperatura ambiente y seguir amasando unos 8-9 minutos, hasta conseguir una masa lisa y elástica. Dejar fermentar a temperatura ambiente 1 hora y media, hasta que doble su volumen.","Dividir en dos porciones de unos 300 g y darles forma de barra alargada. Dejar fermentar tapadas 45 minutos más, hasta que suban ligeramente. Greñar la superficie y hornear a 180° (calor solo por abajo, con un recipiente de agua hirviendo dentro del horno) durante 10 minutos; retirar el agua y seguir horneando 15-20 minutos más, hasta que quede dorado. Dejar enfriar del todo sobre una rejilla.","Para montar, cortar el pan y untar mostaza en ambas mitades. En una mitad poner el queso y el jamón, y en la otra el queso y el cerdo asado; si se quiere, calentar unos 3 minutos en el horno para que funda un poco el queso. Añadir los pepinillos sobre el jamón, cerrar el bocadillo y prensarlo.","Untar mantequilla por fuera de una de las caras y tostar en una plancha o sartén a fuego medio-alto 3-4 minutos con algo de peso encima (una tapa, otra sartén) para que quede bien prensado. Untar la otra cara, dar la vuelta y tostar 3-4 minutos más. Cortar en diagonal y servir."]},{"categoria":"BOCADILLOS","titulo":"Döner Kebab Casero (diegodoal)","raciones":"2 döner kebabs grandes (4-6 raciones)","racionesBase":2,"tiempo":"1 h 30 min (+ 2 h de congelado de la carne y fermentaciones del pan)","ingredientes":[{"texto":"Para el pan turco (2 panes): masa madre previa: 120 g de harina de trigo, 1 cucharadita de azúcar, 10 g de levadura instantánea, 200 ml de leche entera","cantidad":null,"resto":"Para el pan turco (2 panes): masa madre previa: 120 g de harina de trigo, 1 cucharadita de azúcar, 10 g de levadura instantánea, 200 ml de leche entera","escalable":false},{"texto":"40 ml de aceite de oliva","cantidad":40.0,"resto":"ml de aceite de oliva","escalable":true,"modo":"simple"},{"texto":"250 ml de agua","cantidad":250.0,"resto":"ml de agua","escalable":true,"modo":"simple"},{"texto":"425 g de harina de trigo","cantidad":425.0,"resto":"g de harina de trigo","escalable":true,"modo":"simple"},{"texto":"Para pincelar: 1 yema de huevo, 1 cucharada de agua, 1 cucharada de yogur o kéfir","cantidad":null,"resto":"Para pincelar: 1 yema de huevo, 1 cucharada de agua, 1 cucharada de yogur o kéfir","escalable":false},{"texto":"1 cucharada de sésamo blanco y negro","cantidad":1.0,"resto":"cucharada de sésamo blanco y negro","escalable":true,"modo":"simple"},{"texto":"Para la salsa blanca: 2 cucharadas de mayonesa","cantidad":null,"resto":"Para la salsa blanca: 2 cucharadas de mayonesa","escalable":false},{"texto":"100 g de yogur griego","cantidad":100.0,"resto":"g de yogur griego","escalable":true,"modo":"simple"},{"texto":"Sal, curry, sumac (opcional), comino molido, eneldo seco, orégano, glutamato (opcional) y cayena, al gusto","cantidad":null,"resto":"Sal, curry, sumac (opcional), comino molido, eneldo seco, orégano, glutamato (opcional) y cayena, al gusto","escalable":false},{"texto":"Para la carne: 6 contramuslos de pollo con piel","cantidad":null,"resto":"Para la carne: 6 contramuslos de pollo con piel","escalable":false},{"texto":"1 cucharadita de sal, 1 cucharadita de pimienta negra recién molida","cantidad":1.0,"resto":"cucharadita de sal, 1 cucharadita de pimienta negra recién molida","escalable":true,"modo":"simple"},{"texto":"½ cucharadita de romero seco, ½ cucharadita de comino molido","cantidad":0.5,"resto":"cucharadita de romero seco, ½ cucharadita de comino molido","escalable":true,"modo":"simple"},{"texto":"1 cucharadita de cebolla en polvo, ½ cucharadita de ajo en polvo","cantidad":1.0,"resto":"cucharadita de cebolla en polvo, ½ cucharadita de ajo en polvo","escalable":true,"modo":"simple"},{"texto":"½ cucharadita de perejil seco, ½ cucharadita de pimentón dulce","cantidad":0.5,"resto":"cucharadita de perejil seco, ½ cucharadita de pimentón dulce","escalable":true,"modo":"simple"},{"texto":"½ cucharadita de glutamato (opcional), ½ cucharadita de orégano seco","cantidad":0.5,"resto":"cucharadita de glutamato (opcional), ½ cucharadita de orégano seco","escalable":true,"modo":"simple"},{"texto":"Para montar: pan turco, salsa blanca, la carne, lechuga iceberg, tomate, pepino, cebolla roja encurtida, al gusto","cantidad":null,"resto":"Para montar: pan turco, salsa blanca, la carne, lechuga iceberg, tomate, pepino, cebolla roja encurtida, al gusto","escalable":false}],"elaboracion":["Pan turco: mezclar los ingredientes de la masa previa y dejar reposar 1 hora, hasta que burbujee. Añadir el aceite, el agua y la harina; amasar 3-4 minutos hasta que quede lisa. Dejar fermentar 1 hora y media, hasta que doble su volumen.","Dividir en dos porciones de 500 g y formar bolas; dejar reposar 15 minutos tapadas. Estirarlas en círculos de 25 cm sobre papel de horno enharinado y dejar reposar 30 minutos más. Pincelar con la mezcla de yema, agua y yogur, marcar con los dedos un patrón de hoyuelos por toda la superficie y espolvorear sésamo.","Hornear 15 minutos a la temperatura máxima del horno, con calor solo por abajo y un recipiente con agua dentro del horno; si se quiere más color, gratinar los últimos 3 minutos.","Salsa blanca: mezclar todos los ingredientes.","Carne: limpiar los contramuslos y salpimentarlos generosamente con todas las especias por ambos lados. Congelar 2 horas hasta que estén bien duros (esto facilita cortarlos finos). Aparte, confitar las pieles de pollo en una olla con un poco de agua a fuego medio (unos 40 minutos) hasta que queden crujientes; reservar esa grasa.","Cortar los contramuslos congelados en láminas lo más finas posible con un cuchillo afilado. Calentar una sartén a fuego fuerte con la grasa de pollo reservada; poner las láminas de carne y presionarlas 1 minuto sin moverlas. Dar la vuelta cuando los bordes doren, presionar de nuevo, cocinar 1 minuto más y pasar a un bol; sazonar con sal.","Cuartear el pan, abrirlo, untar salsa blanca por dentro y montar con la lechuga, el tomate, el pepino, la cebolla encurtida, la carne y un poco más de salsa."]},{"categoria":"BOCADILLOS","titulo":"Pitas Auténticas con Falafel Casero (diegodoal)","raciones":"9 pitas rellenas","racionesBase":9,"tiempo":"1 h 45 min (+ remojo toda la noche de los garbanzos y 3 h de reposo del tzatziki)","ingredientes":[{"texto":"Para el falafel (28 bolitas): 400 g de garbanzos secos","cantidad":null,"resto":"Para el falafel (28 bolitas): 400 g de garbanzos secos","escalable":false},{"texto":"1 cebolla","cantidad":1.0,"resto":"cebolla","escalable":true,"modo":"simple"},{"texto":"1 guindilla serrana (o 3 jalapeños)","cantidad":1.0,"resto":"guindilla serrana (o 3 jalapeños)","escalable":true,"modo":"simple"},{"texto":"2 dientes de ajo","cantidad":2.0,"resto":"dientes de ajo","escalable":true,"modo":"simple"},{"texto":"5 ramitas de cilantro","cantidad":5.0,"resto":"ramitas de cilantro","escalable":true,"modo":"simple"},{"texto": ejil y la menta; triturar esta mezcla con el zumo de limón, el comino, la sal y el sumac hasta formar una pasta, y mezclarla con los garbanzos.","Añadir la harina de garbanzo poco a poco hasta que la masa se sostenga sin desmoronarse; refrigerar un mínimo de 30 minutos. Con las manos mojadas, formar bolitas de 40 g y congelarlas un mínimo de 30 minutos. Freír en abundante aceite a 180° hasta que queden doradas, y escurrir sobre una rejilla.","Salsa tahini: triturar el ajo, el perejil, el cilantro, el comino, la sal, el tahini, el aceite, el zumo de limón y agua hasta que quede fina, añadiendo más agua fría poco a poco hasta la textura deseada. Dejar reposar en la nevera 30 minutos.","Tzatziki: pelar el pepino y rallarlo por el lado grueso del rallador. Salarlo y dejarlo reposar 15 minutos en la nevera; escurrirlo apretándolo en papel de cocina para quitar el exceso de agua. Mezclar con el yogur, el ajo picado, el zumo de limón, la menta, la sal y la cayena. Refrigerar un mínimo de 3 horas antes de servir.","Pan de pita: mezclar la harina, la sal y la levadura. Hacer un hueco, añadir el agua y el aceite, incorporar poco a poco y amasar 6-7 minutos hasta que quede lisa y elástica. Dejar fermentar en un bol aceitado 2 horas, hasta que doble su volumen.","Precalentar una cazuela de hierro fundido (o sartén apta para horno) dentro del horno a la temperatura máxima durante 30 minutos. Desgasificar la masa, dividirla en 9 porciones de 65 g, bolear y estirarlas finas con el rodillo (sin llegar a ser traslúcidas).","Aceitar la cazuela caliente, colocar una pita y hornear 3 minutos. Repetir con el resto de las pitas.","Para montar, abrir cada pita, rellenar con el falafel, la salsa tahini, el tzatziki, la lechuga, los tomates cherry y la cebolla encurtida."]},{"categoria":"SÁNDWICHES","titulo":"Sandwich BLT (diegodoal)","raciones":"1 sándwich","racionesBase":1,"tiempo":"15 minutos","ingredientes":[{"texto":"2 rebanadas de pan","cantidad":2.0,"resto":"rebanadas de pan","escala de Dijon","cantidad":null,"resto":"Una pizca de mostaza de Dijon","escalable":false},{"texto":"Un chorrito de zumo de limón","cantidad":null,"resto":"Un chorrito de zumo de limón","escalable":false},{"texto":"100 g de atún en conserva","cantidad":100.0,"resto":"g de atún en conserva","escalable":true,"modo":"simple"},{"texto":"2 pepinillos y 1 cucharadita de alcaparras, picados","cantidad":2.0,"resto":"pepinillos y 1 cucharadita de alcaparras, picados","escalable":true,"modo":"simple"},{"texto":"2 hojas de lechuga","cantidad":2.0,"resto":"hojas de lechuga","escalable":true,"modo":"simple"},{"texto":"Un puñado de patatas fritas de bolsa","cantidad":null,"resto":"Un puñado de patatas fritas de bolsa","escalable":false}],"elaboracion":["Hacer una mayonesa casera batiendo la yema con la sal, la mostaza y el zumo de limón, añadiendo el aceite poco a poco. Mezclar con el atún escurrido, los pepinillos y las alcaparras picados. Montar el sándwich con la lechuga aliñada, la mezcla de atún, unas patatas fritas por encima (para dar textura crujiente) y cerrar."]},{"categoria":"SÁNDWICHES","titulo":"Burger de Pollo Frito, Desde Cero (diegodoal)","raciones":"12 hamburguesas","racionesBase":12,"tiempo":"1 h 45 min (+ unas 2 h entre fermentación del pan y marinado del pollo)","ingredientes":[{"texto":"Para los panes de patata (12 unidades): 2 patatas medianas","cantidad":null,"resto":"Para los panes de patata (12 unidades): 2 patatas medianas","escalable":false},{"texto":"420 g de harina de trigo","cantidad":420.0,"resto":"g de harina de trigo","escalable":true,"modo":"simple"},{"texto":"55 g de mantequilla","cantidad":55.0,"resto":"g de mantequilla","escalable":true,"modo":"simple"},{"texto":"110 ml de leche","cantidad":110.0,"resto":"ml de leche","escalable":true,"modo":"simple"},{"texto":"55 ml de agua","cantidad":55.0,"resto":"ml de agua","escalable":true,"modo":"simple"},{"texto":"3 g de levadura de panadero instantánea","cantidad":3.0,"resto":"g de levadura de panadero inst ,"resto":"cucharadita de glutamato (opcional)","escalable":true,"modo":"simple"},{"texto":"½ cucharadita de pimentón dulce","cantidad":0.5,"resto":"cucharadita de pimentón dulce","escalable":true,"modo":"simple"},{"texto":"Para el pollo frito: 5 contramuslos de pollo","cantidad":null,"resto":"Para el pollo frito: 5 contramuslos de pollo","escalable":false},{"texto":"Sal y pimienta negra, al gusto","cantidad":null,"resto":"Sal y pimienta negra, al gusto","escalable":false},{"texto":"300 g de kéfir","cantidad":300.0,"resto":"g de kéfir","escalable":true,"modo":"simple"},{"texto":"250 g de harina de trigo","cantidad":250.0,"resto":"g de harina de trigo","escalable":true,"modo":"simple"},{"texto":"40 g de maicena","cantidad":40.0,"resto":"g de maicena","escalable":true,"modo":"simple"},{"texto":"2 cucharaditas de pimentón","cantidad":2.0,"resto":"cucharaditas de pimentón","escalable":true,"modo":"simple"},{"texto":"2 cucharaditas de pimienta blanca molida","cantidad":2.0,"resto":"cucharaditas de pimienta blanca molida","escalable":true,"modo":"simple"},{"texto":"1 cucharadita de glutamato (opcional)","cantidad":1.0,"resto":"cucharadita de glutamato (opcional)","escalable":true,"modo":"simple"},{"texto":"1 litro de aceite de girasol, para freír","cantidad":1.0,"resto":"litro de aceite de girasol, para freír","escalable":true,"modo":"simple"}],"elaboracion":["Panes de patata: cocinar las patatas enteras en el microondas, tapadas y con tres agujeros para que respiren, unos 10 minutos. Dejar templar, partir por la mitad, pelar y aplastar con un tenedor.","Mezclar la harina, la levadura y la sal en un bol grande. Tamizar la patata machacada sobre la harina hasta que quede una textura arenosa. Hacer un hueco, añadir la leche, el agua, la miel y el huevo, y mezclar bien.","Incorporar la mantequilla en pomada en tres tandas, integrando bien cada una. Amasar sobre superficie enharinada 8-9 minutos, hasta que la masa recupere su forma al presionarla. Dejar fermentar en un bol enharinado 60-90 minutos, hasta que doble su volumen.","Fabricar 12 moldes de 9 cm de diámetro con papel de aluminio. Dividir la masa en 12 porciones de 90 g y bolear. Colocar en una bandeja con papel de horno dentro de los moldes, tapar y dejar fermentar 20 minutos, hasta que recuperen la forma lentamente al presionar. Pincelar cada uno con huevo batido y leche.","Hornear a 190° durante 20 minutos, hasta que doren. Nada más sacarlos, pincelar con mantequilla fundida; retirar los moldes de aluminio cuando se enfríen.","Pepinillos: cortar el pepino en rodajas y ponerlas en un tarro. Calentar el vinagre, el agua, el glutamato, la sal y el azúcar hasta que hierva, removiendo de vez en cuando. Verter con cuidado sobre el pepino, dejar enfriar a temperatura ambiente y refrigerar.","Salsa: mezclar todos los ingredientes.","Pollo frito: quitar la piel y deshuesar los contramuslos. Mezclarlos con el kéfir, la sal y la pimienta, asegurándose de que queden bien cubiertos. Tapar y refrigerar un mínimo de 2 horas.","Calentar el aceite a 160°. Mezclar la harina, la maicena, la pimienta blanca, el pimentón, la sal y el glutamato en un recipiente aparte. Escurrir un poco el pollo marinado, dejando que algo de líquido caiga sobre la mezcla de harina para crear grumos (esto da la textura crujiente característica). Rebozar cada contramuslo por separado, presionando bien para que quede totalmente cubierto.","Freír unos 6 minutos, hasta que quede crujiente y dorado. Pasar a una rejilla y salar inmediatamente. Montar la burger con el pan, la salsa, el pollo frito y los pepinillos."]},{"categoria":"SÁNDWICHES","titulo":"Sando: los Sándwiches Japoneses más Famosos (diegodoal)","raciones":"2 sandos (katsu y gyukatsu)","racionesBase":2,"tiempo":"45 min (+ 45 min de reposo de la carne en la nevera)","ingredientes":[{"texto":"Para el katsu-sando (cerdo): 4 rebanadas de pan de molde japonés (shokupan)","cantidad":null,"resto":"Para el katsu-sando (cerdo): 4 rebanadas de pan de molde japonés (shokupan)","escalable":false},{"texto":"1 filete de cerdo","cantidad":1.0,"resto":"filete de cerdo","escalable":true,"modo":"simple"},{"texto":"100 g de panko","cantidad":100.0,"resto":"g de panko","escalable":true,"modo":"simple"},{"texto":"2 huevos","cantidad":2.0,"resto":"huevos","escalable":true,"modo":"simple"},{"texto":"50 g de harina","cantidad":50.0,"resto":"g de harina","escalable":true,"modo":"simple"},{"texto":"2 cucharadas de mayonesa japonesa","cantidad":2.0,"resto":"cucharadas de mayonesa japonesa","escalable":true,"modo":"simple"},{"texto":"Un puñado de col en juliana","cantidad":null,"resto":"Un puñado de col en juliana","escalable":false},{"texto":"Sal y pimienta negra, al gusto","cantidad":null,"resto":"Sal y pimienta negra, al gusto","escalable":false},{"texto":"Para el gyukatsu-sando (ternera): 4 rebanadas de pan de molde japonés","cantidad":null,"resto":"Para el gyukatsu-sando (ternera): 4 rebanadas de pan de molde japonés","escalable":false},{"texto":"1 filete de solomillo de ternera","cantidad":1.0,"resto":"filete de solomillo de ternera","escalable":true,"modo":"simple"},{"texto":"100 g de panko","cantidad":100.0,"resto":"g de panko","escalable":true,"modo":"simple"},{"texto":"2 huevos","cantidad":2.0,"resto":"huevos","escalable":true,"modo":"simple"},{"texto":"50 g de harina","cantidad":50.0,"resto":"g de harina","escalable":true,"modo":"simple"},{"texto":"4 cucharadas de salsa tonkatsu","cantidad":4.0,"resto":"cucharadas de salsa tonkatsu","escalable":true,"modo":"simple"},{"texto":"Para la mayonesa japonesa: 3 yemas de huevo","cantidad":null,"resto":"Para la mayonesa japonesa: 3 yemas de huevo","escalable":false},{"texto":"Un chorrito de vinagre de arroz","cantidad":null,"resto":"Un chorrito de vinagre de arroz","escalable":false},{"texto":"Una pizca de sal","cantidad":null,"resto":"Una pizca de sal","escalable":false},{"texto":"1 cucharadita de mostaza de Dijon","cantidad":1.0,"resto":"cucharadita de mostaza de Dijon","escalable":true,"modo": o hasta que el centro alcance 56° (para que quede rosado en el interior).","Cortar el pan en cuatro, retirando la corteza. Mezclar la salsa tonkatsu con la mayonesa a partes iguales y untar el pan junto con el filete.","Cubrir con las rebanadas restantes y cortar por la mitad.","Mayonesa japonesa: separar las yemas en un bol. Añadir el vinagre, la sal y la mostaza; batir.","Incorporar el aceite poco a poco sin dejar de batir, hasta emulsionar. Refrigerar hasta su uso.","Salsa tonkatsu: mezclar todos los ingredientes en un bol y reservar."]},{"categoria":"CALZONES","titulo":"Calzone (asun)","raciones":"2 calzones","racionesBase":2,"tiempo":"45 min (+ fermentación de la masa de pizza)","ingredientes":[{"texto":"100 g de queso de Burgos o requesón","cantidad":100.0,"resto":"g de queso de Burgos o requesón","escalable":true,"modo":"simple"},{"texto":"100 g de jamón serrano a daditos","cantidad":100.0,"resto":"g de jamón serrano a daditos","escalable":true,"modo":"simple"},{"texto":"100 g de mozzarella rallada","cantidad":100.0,"resto":"g de mozzarella rallada","escalable":true,"modo":"simple"},{"texto":"3 cucharadas de aceite de oliva","cantidad":3.0,"resto":"cucharadas de aceite de oliva","escalable":true,"modo":"simple"},{"texto":"Sal y pimienta, al gusto","cantidad":null,"resto":"Sal y pimienta, al gusto","escalable":false},{"texto":"1 masa para pizza (para 2 calzones)","cantidad":1.0,"resto":"masa para pizza (para 2 calzones)","escalable":true,"modo":"simple"}],"elaboracion":["Preparar una masa de pizza, tal como se explica en el libro.","Picar en la Thermomix ligeramente el jamón serrano, a continuación añadir el queso de Burgos y la mozzarella, la sal y la pimienta, y mezclar a velocidad 3 unos 15 segundos, formando una pasta.","Con la masa de pizza se forma un disco, de 25 cm de diámetro y 1/2 cm de grueso.","Untar el disco con una cucharada de aceite.","Se rellena, se pone la mezcla en la mitad del disco y la otra mitad se dobla sobre esta formando una media lun var. En la misma sartén, sofreír las verduras 5-6 minutos, hasta que empiecen a caramelizarse ligeramente. Cocer los huevos 10 minutos.","Añadir las especias al sofrito, tostarlas 15 segundos, devolver la carne, añadir el caldo y dejar reducir 20 minutos. Picar las aceitunas y añadirlas al relleno ya frío.","Montaje y cocción: poner una cucharada de relleno y un trozo de huevo cocido en el centro de cada disco de masa, cerrar sellando bien el borde (con el repulgue tradicional, doblando pequeños triángulos sobre el borde). Pincelar con huevo batido. Hornear a 180° durante 20-25 minutos, hasta que queden doradas, o freírlas a 160° durante 5 minutos."]},{"categoria":"EMPANADAS Y AREPAS","titulo":"Arepas con Reina Pepiada (diegodoal)","raciones":"6 arepas","racionesBase":6,"tiempo":"1 hora","ingredientes":[{"texto":"475 g de harina de maíz precocida (masarepa)","cantidad":475.0,"resto":"g de harina de maíz precocida (masarepa)","escalable":true,"modo":"simple"},{"texto":"Una pizca generosa de sal","cantidad":null,"resto":"Una pizca generosa de sal","escalable":false},{"texto":"375 ml de agua templada","cantidad":375.0,"resto":"ml de agua templada","escalable":true,"modo":"simple"},{"texto":"25 ml de aceite de girasol","cantidad":25.0,"resto":"ml de aceite de girasol","escalable":true,"modo":"simple"},{"texto":"Un poco de grasa para cocinar (aceite o mantequilla)","cantidad":null,"resto":"Un poco de grasa para cocinar (aceite o mantequilla)","escalable":false},{"texto":"300 g de pechuga de pollo","cantidad":300.0,"resto":"g de pechuga de pollo","escalable":true,"modo":"simple"},{"texto":"2 hojas de laurel","cantidad":2.0,"resto":"hojas de laurel","escalable":true,"modo":"simple"},{"texto":"1 cucharadita de granos de pimienta negra","cantidad":1.0,"resto":"cucharadita de granos de pimienta negra","escalable":true,"modo":"simple"},{"texto":"Sal al gusto","cantidad":null,"resto":"Sal al gusto","escalable":false},{"texto":"1 huevo, 75 ml de aceite de oliva y un chorrito de obar la textura aplastando una bolita: si los bordes se agrietan, añadir agua (de dos en dos cucharadas) hasta que queden lisos.","Dejar reposar 5 minutos. Formar bolas de 140 g haciéndolas rodar contra la mesa hasta que queden lisas, y aplanarlas entre dos trozos de film hasta unos 10 cm de diámetro, sellando bien el borde para que quede un círculo perfecto.","Calentar una sartén antiadherente con un poco de grasa a fuego medio-alto durante 4 minutos. Cocinar cada arepa 6 minutos por cada lado y después 10-12 minutos más (dándole vueltas si hace falta) hasta que quede dorada y suene hueca al golpearla.","Cortar el cerdo en trozos grandes y picar la cebolla fina. Sellar la carne 2 minutos por cada lado en aceite muy caliente hasta que quede bien dorada; reservar. En la misma olla, pochar la cebolla y el ajo picado con sal y pimienta 5 minutos. Devolver la carne, cubrir con el caldo de pollo y el zumo de naranja, añadir el laurel, llevar a hervor, bajar el fuego, tapar y cocer 2 horas. Sacar la carne, subir el fuego y reducir la salsa hasta que espese. Desmenuzar el cerdo, retirar el laurel de la salsa y mezclarlo todo; rectificar de sal.","Abrir las arepas, poner una capa de queso gouda (se puede fundir un poco con el soplete), rellenar con el cerdo y servir."]},{"categoria":"DUMPLINGS","titulo":"Manti (diegodoal) (Dumplings Turcos Rellenos de Ternera)","raciones":"4 personas","racionesBase":4,"tiempo":"1 h 30 min (+ 30 min de reposo de la masa)","ingredientes":[{"texto":"Para la masa: 300 g de harina de trigo","cantidad":null,"resto":"Para la masa: 300 g de harina de trigo","escalable":false},{"texto":"Una pizca generosa de sal","cantidad":null,"resto":"Una pizca generosa de sal","escalable":false},{"texto":"130 ml de agua","cantidad":130.0,"resto":"ml de agua","escalable":true,"modo":"simple"},{"texto":"30 ml de mantequilla fundida","cantidad":30.0,"resto":"ml de mantequilla fundida","escalable":true,"modo":"simple"},{"texto":"Para el relleno: 1 cebolla dulce","ca  la cebolla escurrida, el perejil picado, el ajo picado, la sal, la pimienta y la carne picada. Amasar a mano siempre en la misma dirección hasta que quede bien integrado y la mezcla se pegue a las paredes del bol.","Golpear la mezcla contra el bol unas 10 veces (esto ayuda a que quede compacta) y refrigerar.","Estirar la masa sobre superficie enharinada hasta 1 mm de grosor aproximadamente (no hace falta que quede traslúcida) y cortarla en cuadrados de 2,5 cm. Poner una bolita de relleno del tamaño de un guisante en el centro de cada cuadrado y doblarlos dando forma de manti. Enharinarlos y reservar.","Mantequilla de pimentón: fundir la mantequilla en un cazo, añadir la guindilla y el pimentón cuando empiece a burbujear, mezclar y reservar. Salsa de yogur: mezclar el yogur con el ajo picado (opcional).","Cocer los manti en agua abundante con sal durante unos 3 minutos, o hasta 15 segundos después de que el último suba a la superficie. Escurrir y servir de inmediato, terminando con la salsa de yogur, la mantequilla de pimentón por encima y perejil picado."]},{"categoria":"DUMPLINGS","titulo":"Xiaolongbao (diegodoal) (Dumplings Rellenos de Sopa)","raciones":"Unas 30-32 xiaolongbao","racionesBase":30,"tiempo":"1 h 30 min (+ unas 6-7 h entre remojo, cocción del caldo y enfriado)","ingredientes":[{"texto":"Para el caldo de cerdo: 600 g de espinazo de cerdo salado","cantidad":null,"resto":"Para el caldo de cerdo: 600 g de espinazo de cerdo salado","escalable":false},{"texto":"1 codillo de cerdo (unos 500 g)","cantidad":1.0,"resto":"codillo de cerdo (unos 500 g)","escalable":true,"modo":"simple"},{"texto":"250 g de aguja de cerdo","cantidad":250.0,"resto":"g de aguja de cerdo","escalable":true,"modo":"simple"},{"texto":"6 cm de jengibre fresco","cantidad":6.0,"resto":"cm de jengibre fresco","escalable":true,"modo":"simple"},{"texto":"1,5 litros de agua","cantidad":1.5,"resto":"litros de agua","escalable":true,"modo":"simple"},{"texto":"Para el relleno: 250 g de carne picada de cerdo","cantidad":null,"resto":"Para el relleno: 250 g de carne picada de cerdo","escalable":false},{"texto":"1 cucharadita de bicarbonato","cantidad":1.0,"resto":"cucharadita de bicarbonato","escalable":true,"modo":"simple"},{"texto":"1 cucharadita de sal","cantidad":1.0,"resto":"cucharadita de sal","escalable":true,"modo":"simple"},{"texto":"2 dientes de ajo","cantidad":2.0,"resto":"dientes de ajo","escalable":true,"modo":"simple"},{"texto":"3 cm de jengibre fresco","cantidad":3.0,"resto":"cm de jengibre fresco","escalable":true,"modo":"simple"},{"texto":"1 cucharadita de pimienta blanca","cantidad":1.0,"resto":"cucharadita de pimienta blanca","escalable":true,"modo":"simple"},{"texto":"1 cucharadita de azúcar","cantidad":1.0,"resto":"cucharadita de azúcar","escalable":true,"modo":"simple"},{"texto":"1 cucharadita de salsa de soja","cantidad":1.0,"resto":"cucharadita de salsa de soja","escalable":true,"modo":"simple"},{"texto":"1 cucharadita de glutamato (opcional)","cantidad":1.0,"resto":"cucharadita de glutamato (opcional)","escalable":true,"modo":"simple"},{"texto":"1 cucharada de vino de arroz","cantidad":1.0,"resto":"cucharada de vino de arroz","escalable":true,"modo":"simple"},{"texto":"1 cucharadita de aceite de sésamo","cantidad":1.0,"resto":"cucharadita de aceite de sésamo","escalable":true,"modo":"simple"},{"texto":"250 g de caldo de cerdo gelatinizado (del apartado anterior)","cantidad":250.0,"resto":"g de caldo de cerdo gelatinizado (del apartado anterior)","escalable":true,"modo":"simple"},{"texto":"Para la masa: 170 g de harina de trigo","cantidad":null,"resto":"Para la masa: 170 g de harina de trigo","escalable":false},{"texto":"90 ml de agua hirviendo","cantidad":90.0,"resto":"ml de agua hirviendo","escalable":true,"modo":"simple"}],"elaboracion":["Caldo de cerdo: dejar el espinazo salado en remojo en agua fría un mínimo de 2 horas. Escurrir y limpiar cada pieza a fondo. Poner en una olla junto con el codillo, cubrir con agua y llevar a hervor; hervir 15 minutos desespumando, tirar el agua y volver a limpiar los huesos.","Calentar la olla con un poco de aceite y dorar muy bien la aguja de cerdo hasta que quede oscura; hacer lo mismo con el jengibre partido por la mitad. Devolver el espinazo y el codillo a la olla, cubrir con agua fría.","Llevar a hervor a fuego medio-alto y bajar después a fuego lento; cocer 2-3 horas desespumando de vez en cuando. Retirar los sólidos y reducir el caldo hasta unos 600 ml. Colar sobre una bandeja, dejar enfriar del todo y refrigerar un mínimo de 2 horas, hasta que solidifique.","Relleno: mezclar la carne picada con el bicarbonato y la sal, removiendo siempre en la misma dirección con una espátula durante 1 minuto, hasta que la grasa empiece a desnaturalizarse. Añadir el ajo picado, el jengibre rallado, la pimienta blanca, el azúcar, la soja, el vino de arroz, el aceite de sésamo y el glutamato; seguir mezclando en la misma dirección hasta integrar.","Sacar el caldo solidificado de la nevera, recortar la grasa de la superficie y cortarlo en dados. Añadir 250 g de esos dados al relleno con movimientos suaves, sin deshacerlos. Refrigerar el relleno un mínimo de 15 minutos antes de usar.","Masa: mezclar la harina con el agua hirviendo, amasar 5 minutos hasta que quede elástica, envolver en film y dejar reposar 30 minutos. Dividir en dos mitades, formar un rulo con cada una y cortar cada rulo en 10 porciones (unos 12 g cada una); mantenerlas tapadas.","Estirar cada porción en un disco fino y rellenar con la mezcla de carne y caldo gelatinizado, cerrando en pliegues hacia el centro hasta formar el característico hatillo del xiaolongbao.","Colocar los dumplings sobre cuadrados de papel de horno dentro de una vaporera. Cocer al vapor 8 minutos sobre agua hirviendo (con unos 3 dedos de profundidad). Servir de inmediato, con cuidado al morderlos porque estarán rellenos de caldo caliente."]},{"categoria":"DUMPLINGS","titulo":"Gyozas Caseras (diegodoal)","raciones":"Unas 40 gyozas", l; añadir el agua hirviendo poco a poco con una espátula hasta hidratar por completo (usar agua muy caliente da a la masa la elasticidad necesaria para que no se rompa al doblarla).","Amasar 7-8 minutos hasta que quede elástica y lisa.","Tapar con un paño húmedo y dejar reposar 1 hora a temperatura ambiente.","Escaldar la col 10 minutos; enfriar, picarla finamente y exprimir el exceso de agua con las manos.","Mezclar en un bol toda la carne, la col escurrida, el jengibre rallado, el vino, el ajo, las cebolletas picadas, la soja, la pimienta molida, la sal y el azúcar. Mezclar siempre en la misma dirección hasta que quede pastosa. Refrigerar.","Dividir la masa en 4 porciones; formar \"troncos\" de 2 cm de diámetro con cada una; reposar 20 minutos.","Cortar cada tronco en 16 piezas iguales; aplastar cada una con la palma.","Estirar cada pieza con el rodillo formando un círculo fino con el centro algo más grueso.","Colocar una cucharadita de relleno en el centro; humedecer la mitad del borde con agua.","Doblar y sellar con el dibujo de pliegues deseado.","Mezclar la soja, el vinagre y el sésamo para la salsa de mojar.","Calentar una sartén antiadherente a fuego medio; añadir aceite y las gyozas; dorar 2 minutos por la base.","Añadir agua fría y tapar; cocer 4 minutos a fuego medio-bajo, hasta que el agua se evapore y la base quede crujiente.","Servir con aceite picante y la salsa de gyoza."]},{"categoria":"BAOS Y OKONOMIYAKI","titulo":"Baos de Char Siu (diegodoal)","raciones":"Unos 12 baos","racionesBase":12,"tiempo":"55 min (+ 2 h de fermentación)","ingredientes":[{"texto":"Para la masa: 12 g de levadura fresca","cantidad":null,"resto":"Para la masa: 12 g de levadura fresca","escalable":false},{"texto":"140 ml de agua","cantidad":140.0,"resto":"ml de agua","escalable":true,"modo":"simple"},{"texto":"380 g de harina de fuerza","cantidad":380.0,"resto":"g de harina de fuerza","escalable":true,"modo":"simple"},{"texto":"80 g de maicena","cantidad":80.0,"resto":"g de maicena","escalable":true,"modo":"simple"},{"texto":"70 g de azúcar blanco","cantidad":70.0,"resto":"g de azúcar blanco","escalable":true,"modo":"simple"},{"texto":"12 g de sal","cantidad":12.0,"resto":"g de sal","escalable":true,"modo":"simple"},{"texto":"30 g de mantequilla sin sal","cantidad":30.0,"resto":"g de mantequilla sin sal","escalable":true,"modo":"simple"},{"texto":"Para el relleno de char siu: 2 tiras de panceta de cerdo char siu","cantidad":null,"resto":"Para el relleno de char siu: 2 tiras de panceta de cerdo char siu","escalable":false},{"texto":"Jugos de asar el char siu (o sustituto: 2 cucharadas de salsa de ostras, 1 cucharada de azúcar moreno, 50 ml de agua)","cantidad":null,"resto":"Jugos de asar el char siu (o sustituto: 2 cucharadas de salsa de ostras, 1 cucharada de azúcar moreno, 50 ml de agua)","escalable":false},{"texto":"1 cucharada de salsa de soja oscura","cantidad":1.0,"resto":"cucharada de salsa de soja oscura","escalable":true,"modo":"simple"},{"texto":"1 cucharada de harina de trigo","cantidad":1.0,"resto":"cucharada de harina de trigo","escalable":true,"modo":"simple"},{"texto":"1 cucharada de mirin","cantidad":1.0,"resto":"cucharada de mirin","escalable":true,"modo":"simple"},{"texto":"Harina de trigo para espolvorear","cantidad":null,"resto":"Harina de trigo para espolvorear","escalable":false}],"elaboracion":["Disolver la levadura fresca en el agua; reservar.","Mezclar la harina de fuerza, la maicena, el azúcar y la sal.","Añadir la mezcla de levadura para hidratar la harina.","Incorporar la mantequilla a temperatura ambiente.","Amasar 7-8 minutos hasta que quede lisa y elástica.","Pasar a un bol enharinado y dejar levar 2 horas, hasta que doble su volumen, tapada con un paño húmedo.","Relleno: picar el char siu en trozos pequeños. Picar finamente dos chalotas.","Calentar aceite de girasol a fuego medio; sofreír las chalotas 2 minutos.","Añadir los jugos del char siu (o el sustituto), la soja oscura y el mirin; cocinar 2 minutos."," piente, mezclar el agua templada, la leche y el aceite de girasol.","Hacer un hueco en el centro de los ingredientes secos y añadir los líquidos; mezclar poco a poco.","Cuando se forme una masa, pasarla a la mesa y amasar durante 8 minutos, hasta que quede lisa y elástica.","Colocar la masa en un bol engrasado y dejar levar 2 horas a temperatura ambiente, hasta que doble su volumen.","Volcar la masa sobre la mesa y amasarla hasta desgasificarla por completo; dejar reposar 5 minutos.","Con un rodillo, estirar la masa hasta 1 cm de grosor, girándola constantemente para que quede uniforme.","Colocar el lado menos liso hacia arriba y engrasarlo de manera uniforme con aceite de girasol.","Cortar círculos de 10 cm con un cortapastas. Reunir los recortes, volver a amasar y cortar más círculos.","Preparar tantos cuadrados de papel vegetal como baos.","Doblar cada círculo por la mitad, con la parte engrasada hacia dentro. Colocarlo sobre un cuadrado de papel vegetal y, con un rodillo, estirarlo hacia afuera con un único movimiento (esto evita que se pegue al abrirlo tras la cocción).","Dejar levar a temperatura ambiente 45 minutos, hasta que doblen su tamaño.","Colocar los baos con su papel en una vaporera de bambú, sobre una cacerola con dos dedos de agua hirviendo, y cocer al vapor 15 minutos sin destapar en ningún momento.","Apagar el fuego y dejar la vaporera reposando sobre la cacerola 5 minutos más antes de abrir.","Spicy mayo: batir los huevos con la sal y el zumo de limón. Añadir el aceite de girasol poco a poco sin dejar de batir, hasta emulsionar por completo.","Añadir la sriracha, mezclar y reservar en la nevera.","Cebolla en vinagre: cortar la cebolla morada muy fina y cubrirla con vinagre blanco y dos cucharadas de azúcar. Mezclar y dejar macerar en la nevera un mínimo de 1 hora.","Montaje: calentar abundante aceite de girasol a 160°.","Pasar la harina de trigo a una fuente y rebozar en ella el pollo marinado, asegurándose de que cada pieza quede perfectamente cubierta.","Freír 5 minutos, o hasta que esté dorado.","Cortar cada pieza de pollo por la mitad. Untar un poco de spicy mayo dentro del bao, añadir el pollo y un poco más de salsa por encima.","Terminar con cebolla en vinagre y cebollino. Repetir con el resto de los baos y servir de inmediato."]},{"categoria":"BAOS Y OKONOMIYAKI","titulo":"Okonomiyaki: Comida Callejera Japonesa en Casa (diegodoal)","raciones":"4 okonomiyaki (4 personas)","racionesBase":4,"tiempo":"1 hora","ingredientes":[{"texto":"Para la base: 240 g de harina de trigo","cantidad":null,"resto":"Para la base: 240 g de harina de trigo","escalable":false},{"texto":"50 g de maicena","cantidad":50.0,"resto":"g de maicena","escalable":true,"modo":"simple"},{"texto":"2 huevos","cantidad":2.0,"resto":"huevos","escalable":true,"modo":"simple"},{"texto":"350 ml de dashi (o agua)","cantidad":350.0,"resto":"ml de dashi (o agua)","escalable":true,"modo":"simple"},{"texto":"4 g de levadura química","cantidad":4.0,"resto":"g de levadura química","escalable":true,"modo":"simple"},{"texto":"500 g de col (media col aproximadamente)","cantidad":500.0,"resto":"g de col (media col aproximadamente)","escalable":true,"modo":"simple"},{"texto":"10 g de jengibre encurtido","cantidad":10.0,"resto":"g de jengibre encurtido","escalable":true,"modo":"simple"},{"texto":"30 g de tenkasu (trocitos de tempura frita)","cantidad":30.0,"resto":"g de tenkasu (trocitos de tempura frita)","escalable":true,"modo":"simple"},{"texto":"3 lonchas de panceta","cantidad":3.0,"resto":"lonchas de panceta","escalable":true,"modo":"simple"},{"texto":"12 gambas","cantidad":12.0,"resto":"gambas","escalable":true,"modo":"simple"},{"texto":"Salsa okonomiyaki, al gusto","cantidad":null,"resto":"Salsa okonomiyaki, al gusto","escalable":false},{"texto":"Mayonesa japonesa, al gusto","cantidad":null,"resto":"Mayonesa japonesa, al gusto","escalable":false},{"texto":"Alga nori y katsuobushi para decorar","cantidad":null,"resto":"Alga nori y katsuobushi para de mple"},{"texto":"1 cebolla dulce","cantidad":1.0,"resto":"cebolla dulce","escalable":true,"modo":"simple"},{"texto":"4 dientes de ajo","cantidad":4.0,"resto":"dientes de ajo","escalable":true,"modo":"simple"},{"texto":"Sal, un manojo de cilantro, zumo de ½ lima, pimienta negra","cantidad":null,"resto":"Sal, un manojo de cilantro, zumo de ½ lima, pimienta negra","escalable":false},{"texto":"Para servir: la barbacoa, la salsa verde, tortillas de maíz, cebolla dulce picada, cilantro","cantidad":null,"resto":"Para servir: la barbacoa, la salsa verde, tortillas de maíz, cebolla dulce picada, cilantro","escalable":false}],"elaboracion":["Limpiar las carrilleras y cortarlas en trozos grandes y uniformes. Sellarlas en una cazuela apta para horno (tipo Dutch oven) hasta que queden doradas por todos los lados.","Añadir el caldo, los chiles guajillo, el laurel, el orégano, el comino, el epazote, los ajos aplastados, la canela y el agua. Llevar a hervor y después cocer tapado a fuego muy lento entre 3 y 5 horas, hasta que la carne esté muy tierna. Destapar los últimos 30 minutos para que la salsa reduzca.","Desmenuzar la carne con dos tenedores o un cuchillo. Colar la salsa (desechando los chiles y aromáticos enteros) y volver a mezclarla con la carne desmenuzada.","Para la salsa verde: partir los tomatillos por la mitad y lavarlos; quitar el tallo y las semillas de los jalapeños. Poner todo junto con la cebolla y el ajo troceados en una bandeja bajo el grill del horno 10 minutos, hasta que se tuesten ligeramente. Triturar con un poco de agua y sal durante 2 minutos; añadir el cilantro y el zumo de lima y triturar 1 minuto más. Rectificar de sal y dejar enfriar en la nevera un mínimo de 2 horas.","Para servir, calentar las tortillas de maíz directamente sobre la llama o en la plancha hasta que se tuesten un poco, y montar los tacos con la barbacoa, la salsa verde, la cebolla y el cilantro."]},{"categoria":"COMIDA MEXICANA","titulo":"Tacos al Pastor Caseros desde Cero (diegodoal imple"},{"texto":"2 jalapeños","cantidad":2.0,"resto":"jalapeños","escalable":true,"modo":"simple"},{"texto":"1 tomate","cantidad":1.0,"resto":"tomate","escalable":true,"modo":"simple"},{"texto":"Un puñado de cilantro fresco","cantidad":null,"resto":"Un puñado de cilantro fresco","escalable":false},{"texto":"2 limas","cantidad":2.0,"resto":"limas","escalable":true,"modo":"simple"},{"texto":"Sal y pimienta, al gusto","cantidad":null,"resto":"Sal y pimienta, al gusto","escalable":false},{"texto":"Tortillas de maíz para servir","cantidad":null,"resto":"Tortillas de maíz para servir","escalable":false}],"elaboracion":["Retirar tallos y semillas de los chiles y ponerlos en remojo en agua hirviendo durante 15 minutos, hasta que se ablanden.","Triturar el ajo, el achiote, el azúcar, la pimienta gorda, el comino, el orégano, la canela, la sal, el zumo de piña, el vinagre, los chiles hidratados y un poco de su agua de remojo hasta obtener una pasta fina y homogénea.","Cortar el cerdo en filetes del grosor de un dedo; mezclarlos con el adobo en un bol, masajeando bien para que penetre por toda la carne. Tapar con film y marinar toda la noche, idealmente 24 horas.","Ensartar los filetes marinados en brochetas metálicas; colocarlas sobre una bandeja de horno bajo el grill al máximo, con calor solo por arriba.","A los 10 minutos, dar la vuelta a las brochetas y pincelarlas con el adobo reservado. Devolver al horno.","A los 5 minutos, retirar, pincelar de nuevo con el adobo y volver a hornear.","Pasados otros 5 minutos, retirar y cubrir con papel de aluminio; dejar reposar 10 minutos.","Cortar la carne en trozos pequeños del tamaño de un bocado.","Ensalada de piña: pelar y cortar la piña en 4 trozos; pelar la cebolla y cortarla en 3 rodajas gruesas. Dorar los trozos de piña en una sartén muy caliente hasta que caramelicen por todos los lados; añadir la cebolla y los jalapeños y caramelizar también.","Picar el tomate y la piña asada; picar finamente la cebolla y los jalapeños; mezclar todo en un bol.","Añadir cilantro, zumo de lima, sal y pimienta; mezclar y dejar enfriar antes de servir.","Tostar las tortillas de maíz en una sartén caliente 10 segundos por cada lado; envolverlas en un paño limpio para mantenerlas calientes.","Rellenar cada tortilla con carne y ensalada de piña; servir con medias limas y cilantro fresco."]},{"categoria":"COMIDA MEXICANA","titulo":"Tacos de Birria de Res 100% Auténticos (diegodoal)","raciones":"Unos 20 tacos (6-8 personas)","racionesBase":20,"tiempo":"1 hora (+ 3 h 30 min de cocción y 2 h de enfriado del consomé)","ingredientes":[{"texto":"9 tomates maduros","cantidad":9.0,"resto":"tomates maduros","escalable":true,"modo":"simple"},{"texto":"5 chiles anchos","cantidad":5.0,"resto":"chiles anchos","escalable":true,"modo":"simple"},{"texto":"8 chiles guajillos","cantidad":8.0,"resto":"chiles guajillos","escalable":true,"modo":"simple"},{"texto":"2 chiles chipotles en adobo","cantidad":2.0,"resto":"chiles chipotles en adobo","escalable":true,"modo":"simple"},{"texto":"1 cebolla","cantidad":1.0,"resto":"cebolla","escalable":true,"modo":"simple"},{"texto":"7 dientes de ajo","cantidad":7.0,"resto":"dientes de ajo","escalable":true,"modo":"simple"},{"texto":"1 cucharada de pimienta negra en grano","cantidad":1.0,"resto":"cucharada de pimienta negra en grano","escalable":true,"modo":"simple"},{"texto":"1 cucharada de pimienta gorda (Jamaica)","cantidad":1.0,"resto":"cucharada de pimienta gorda (Jamaica)","escalable":true,"modo":"simple"},{"texto":"1 cucharada de semillas de comino","cantidad":1.0,"resto":"cucharada de semillas de comino","escalable":true,"modo":"simple"},{"texto":"1 cucharada de orégano mexicano","cantidad":1.0,"resto":"cucharada de orégano mexicano","escalable":true,"modo":"simple"},{"texto":"½ rama de canela (preferiblemente de Ceilán)","cantidad":0.5,"resto":"rama de canela (preferiblemente de Ceilán)","escalable":true,"modo":"simple"},{"texto":"1 cucharada de concentrado de tomate","cantidad":1.0
