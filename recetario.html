<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Las Recetas de Mamá</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Vollkorn:wght@600;700&family=EB+Garamond+SC&display=swap" rel="stylesheet">
<style>
  :root{
    --dark:#141F2B;
    --cream:#F3EFE3;
    --gold:#B8863B;
    --panel:#16212F;
    --panel2:#1F2E40;
    --line: rgba(184,134,59,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(ellipse at top, #223349 0%, #141F2B 60%, #0D141C 100%);
    color: var(--cream);
    font-family:'EB Garamond', Georgia, serif;
    min-height:100vh;
  }
  .wrap{max-width:980px;margin:0 auto;padding:28px 18px 80px;}

  header.top{
    text-align:center;
    padding: 18px 10px 26px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 24px;
  }
  header.top .orn{color:var(--gold); font-size:18px; letter-spacing:6px;}
  header.top h1{
    font-family:'Vollkorn', serif;
    font-weight:700;
    font-size: clamp(22px, 4vw, 34px);
    margin: 6px 0 2px;
    color: var(--cream);
    letter-spacing: .5px;
  }
  header.top p{
    font-family:'EB Garamond SC','EB Garamond', serif;
    letter-spacing: 2px;
    color: var(--gold);
    font-size: 12px;
    margin: 4px 0 0;
  }

  .controls{
    position: sticky; top:0; z-index: 20;
    background: linear-gradient(#141F2B 78%, transparent);
    padding: 10px 0 16px;
  }
  .search-row{display:flex; gap:10px; margin-bottom:12px;}
  #buscador{
    flex:1;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--cream);
    font-family: inherit;
    font-size: 16px;
    padding: 12px 16px;
    border-radius: 8px;
    outline: none;
  }
  #buscador::placeholder{color:#8FA6BD;}
  #buscador:focus{border-color: var(--gold);}
  #contador{
    font-family:'EB Garamond SC','EB Garamond',serif;
    font-size: 12px;
    letter-spacing: 1px;
    color:#C9BB99;
    white-space: nowrap;
    align-self:center;
    padding-left: 4px;
  }

  .cats{
    display:flex; flex-wrap:wrap; gap:7px;
  }
  .chip{
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--cream);
    font-family:'EB Garamond SC','EB Garamond',serif;
    font-size: 11px;
    letter-spacing: .6px;
    padding: 6px 12px;
    border-radius: 999px;
    cursor:pointer;
    user-select:none;
    transition: transform .1s ease;
  }
  .chip:hover{transform: translateY(-1px);}
  .chip.active{
    color:#141F2B;
    font-weight:600;
    border-color: transparent;
  }

  #lista{ margin-top: 18px; }
  #lista.grid-view{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 14px;
  }
  #lista.list-view{
    display:flex;
    flex-direction:column;
    gap:0;
  }
  .volver-btn{
    display:none;
    background:none;
    border: 1px solid var(--line);
    color: var(--cream);
    font-family:'EB Garamond SC','EB Garamond',serif;
    font-size: 11px;
    letter-spacing: .6px;
    padding: 7px 14px;
    border-radius: 999px;
    cursor:pointer;
    margin-bottom: 4px;
  }
  .volver-btn:hover{border-color:var(--gold); color:var(--gold);}
  .modo-box{
    display:flex;
    align-items:center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .cat-activa{
    font-family:'EB Garamond SC','EB Garamond',serif;
    font-size: 13px;
    letter-spacing: 1px;
    padding: 6px 14px;
    border-radius: 999px;
    display:none;
  }

  .list-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 16px;
    padding: 13px 10px 13px 14px;
    border-bottom: 1px solid var(--line);
    border-left: 3px solid transparent;
    cursor:pointer;
    transition: background .12s ease;
  }
  .list-row:hover{background: rgba(184,134,59,.07);}
  .list-row .lr-cat{
    font-family:'EB Garamond SC','EB Garamond',serif;
    font-size: 9.5px;
    letter-spacing: 1.1px;
    margin-bottom: 3px;
  }
  .list-row .lr-title{
    font-family:'Vollkorn',serif;
    font-weight:700;
    font-size: 16px;
    color: var(--cream);
    line-height:1.25;
  }
  .list-row .lr-title .tag{font-size: 12px; font-weight:400; font-style: italic; opacity:.8;}
  .list-row .lr-rac{
    color:#C9BB99;
    font-size: 12px;
    font-style: italic;
    white-space: nowrap;
    text-align: right;
    flex-shrink:0;
  }
  .card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px 16px 14px;
    cursor:pointer;
    transition: border-color .15s ease, transform .15s ease;
  }
  .card:hover{border-color: var(--gold); transform: translateY(-2px);}
  .card .eyebrow{
    font-family:'EB Garamond SC','EB Garamond',serif;
    font-size: 10px;
    letter-spacing: 1.2px;
    margin-bottom: 6px;
  }
  .card h3{
    font-family:'Vollkorn',serif;
    font-weight:700;
    font-size: 17px;
    margin: 0 0 6px;
    color: var(--cream);
    line-height:1.25;
  }
  .card h3 .tag{font-size: 12px; font-weight:400; font-style: italic; opacity:.8;}
  .card .rac{color:#C9BB99; font-size:12px; font-style:italic;}

  #vacio{
    text-align:center;
    color:#8FA6BD;
    padding: 60px 20px;
    font-size: 16px;
    font-style: italic;
    display:none;
  }

  /* ---- vista detalle ---- */
  #detalle{
    position: fixed; inset:0;
    background: rgba(10,8,6,.86);
    backdrop-filter: blur(2px);
    display:none;
    z-index: 50;
    overflow-y: auto;
    padding: 30px 14px 70px;
  }
  #detalle.open{display:block;}
  .panel{
    max-width: 720px;
    margin: 0 auto;
    background: linear-gradient(180deg, var(--panel2), var(--panel));
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 30px 28px 34px;
    position: relative;
  }
  .cerrar{
    position:absolute; top:14px; right:16px;
    background:none; border:1px solid var(--line); color:var(--cream);
    width:34px; height:34px; border-radius:50%;
    font-size:16px; cursor:pointer; line-height:1;
  }
  .cerrar:hover{border-color:var(--gold); color:var(--gold);}
  .d-eyebrow{
    font-family:'EB Garamond SC','EB Garamond',serif;
    font-size: 12.5px; letter-spacing: 2px; text-align:center; margin-bottom:6px;
  }
  .d-titulo{
    font-family:'Vollkorn',serif; font-weight:700; text-align:center;
    font-size: clamp(20px,3.5vw,26px); margin:0 0 4px; color:var(--cream);
  }
  .d-titulo .tag{font-size:.5em; font-weight:400; font-style:italic; color:var(--gold);}
  .d-rule{border:none; border-top:1.5px solid var(--gold); width:34%; margin: 14px auto 18px;}

  .raciones-box{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin-bottom: 20px; flex-wrap:wrap;
  }
  .raciones-box span.lbl{
    font-family:'EB Garamond SC','EB Garamond',serif; font-size:12px; letter-spacing:1px; color:#C9BB99;
  }
  .raciones-box span.tiempo-lbl{
    color: var(--gold);
    border-left: 1px solid var(--line);
    padding-left: 10px;
  }
  .stepper{display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:4px 6px;}
  .stepper button{
    background:transparent; border:none; color:var(--gold); font-size:18px; width:30px; height:30px;
    cursor:pointer; border-radius:6px;
  }
  .stepper button:hover{background: rgba(184,134,59,.18);}
  .stepper input{
    width: 46px; text-align:center; background:transparent; border:none; color:var(--cream);
    font-family:'EB Garamond SC','EB Garamond',serif; font-size:14px;
  }
  .reset-link{
    background:none;border:none;color:#8FA6BD;font-family:'EB Garamond',serif;font-style:italic;
    font-size:12px; cursor:pointer; text-decoration:underline;
  }
  .reset-link:hover{color:var(--gold);}

  h4.sec{
    font-family:'EB Garamond SC','EB Garamond',serif;
    font-size: 14px; letter-spacing:1px; text-align:center; color:var(--cream);
    margin: 22px 0 10px;
  }
  .ing-box{
    background: rgba(243,239,227,.05);
    border: .7px solid var(--line);
    border-radius: 8px;
    padding: 10px 18px;
  }
  .ing-box div{
    font-style: italic;
    font-size: 14.5px;
    padding: 5px 0;
    border-bottom: 1px dotted rgba(184,134,59,.22);
  }
  .ing-box div:last-child{border-bottom:none;}
  .ing-box .num{color:var(--gold); font-style:normal; font-weight:600;}

  .d-rule2{border:none; border-top:.8px solid var(--gold); width:16%; margin: 20px auto 4px;}
  .elab p{
    font-size: 15.5px; line-height: 1.65; text-align: justify; text-indent: 20px;
    margin: 0 0 12px;
  }

  ::selection{background: var(--gold); color:#141F2B;}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="orn">❧</div>
    <h1>Las Recetas de Mamá</h1>
    <p>BUSCADOR DE RECETAS</p>
  </header>

  <div class="controls">
    <div class="search-row">
      <input id="buscador" type="text" placeholder="Buscar por título…" autocomplete="off">
      <div id="contador"></div>
    </div>
    <div class="cats" id="cats"></div>
    <div class="modo-box" id="modo-box">
      <button class="volver-btn" id="volver">← Volver a categorías</button>
      <span class="cat-activa" id="cat-activa"></span>
    </div>
  </div>

  <div id="lista"></div>
  <div id="vacio">No se ha encontrado ninguna receta.</div>
</div>

<div id="detalle">
  <div class="panel">
    <button class="cerrar" id="cerrar">✕</button>
    <div class="d-eyebrow" id="d-cat"></div>
    <h2 class="d-titulo" id="d-titulo"></h2>
    <hr class="d-rule">
    <div class="raciones-box" id="raciones-box"></div>
    <h4 class="sec">Ingredientes</h4>
    <div class="ing-box" id="d-ing"></div>
    <hr class="d-rule2">
    <h4 class="sec">Elaboración</h4>
    <div class="elab" id="d-elab"></div>
  </div>
</div>

<script>
const DATA_EMBEBIDA = {"categorias":["ENTRANTES Y ENSALADAS","CROQUETAS","SALSAS Y VINAGRETAS","SOPAS","CREMAS","GAZPACHOS Y CREMAS FRÍAS","PURÉS","ARROCES","PASTAS","NOODLES","PANES Y BOLLERÍA","BOCADILLOS","SÁNDWICHES","CALZONES","EMPANADAS Y AREPAS","DUMPLINGS","BAOS Y OKONOMIYAKI","COMIDA MEXICANA","PESCADOS Y MARISCOS","AVES (POLLO, PAVO Y PICHÓN)","TERNERA Y VACUNO","CERDO","CORDERO","CONEJO","CAZA Y CHARCUTERÍA","VERDURAS","REPOSTERÍA","REPOSTERÍA ITALIANA Y FRANCESA","REPOSTERÍA AMERICANA","POSTRES JAPONESES","POSTRES DE ORIENTE MEDIO","GALLETAS","BEBIDAS"],"recetas":[{"categoria":"ENTRANTES Y ENSALADAS","titulo":"Salpicón de Mariscos (mamá)","raciones":"4 personas","racionesBase":4,"tiempo":"25 min (+ 1 h de reposo en nevera)","ingredientes":[{"texto":"400 g de langostinos","cantidad":400.0,"resto":"g de langostinos","escalable":true,"modo":"simple"},{"texto":"400 g de pescadilla","cantidad":400.0,"resto":"g de pescadilla","escalable":true,"modo":"simple"},{"texto":"150 g de rollitos de mar","cantidad":150.0,"resto":"g de rollitos de mar","escalable":true,"modo":"simple"},{"texto":"500 g de mejillones","cantidad":500.0,"resto":"g de mejillones","escalable":true,"modo":"simple"},{"texto":"Vinagreta (se bate todo): 4 pepinillos, 2 pimientos (roto), 1 cebolleta (caldo — no vinagre)","cantidad":null,"resto":"Vinagreta (se bate todo): 4 pepinillos, 2 pimientos (roto), 1 cebolleta (caldo — no vinagre)","escalable":false}],"elaboracion":["Se pone una olla con agua al fuego con un chorro de aceite, el limón, sal y una hoja de laurel, y se deja que rompa a hervir a fuego fuerte (unos 8-10 minutos hasta que arranque). Si el marisco está congelado, se echa cuando el agua ya está hirviendo con fuerza; si está vivo, se pone desde el agua fría, antes de que arranque el hervor. Se cuece cada cosa el tiempo justo (los langostinos y la pescadilla, 2-3 minutos; los mejillones, unos 5 minutos al vapor hasta que se abran), hasta que esté hecho pero jugoso, y se va sacando y escurriendo.","Una vez que está todo cocido y templado, se coloca en la cazuela, preferiblemente de barro. Primero se coloca la merluza, después los langostinos y los rollitos de mar y, por último, se cubre todo con la vinagreta. Se deja reposar en la nevera al menos 1 hora antes de servir para que coja bien el sabor."]},{"categoria":"ENTRANTES Y ENSALADAS","titulo":"Revuelto de Ajetes (mamá)","raciones":"4 personas","racionesBase":4,"tiempo":"20 minutos","ingredientes":[{"texto":"100 g de rollitos de mar","cantidad":100.0,"resto":"g de rollitos de mar","escalable":true,"modo":"simple"},{"texto":"100 g de jamón serrano en taquitos","cantidad":100.0,"resto":"g de jamón serrano en taquitos","escalable":true,"modo":"simple"},{"texto":"1 manojo de espárragos trigueros","cantidad":1.0,"resto":"manojo de espárragos trigueros","escalable":true,"modo":"simple"},{"texto":"200 g de langostinos","cantidad":200.0,"resto":"g de langostinos","escalable":true,"modo":"simple"},{"texto":"150 g de setas","cantidad":150.0,"resto":"g de setas","escalable":true,"modo":"simple"},{"texto":"2 dientes de ajo picados","cantidad":2.0,"resto":"dientes de ajo picados","escalable":true,"modo":"simple"},{"texto":"6 huevos","cantidad":6.0,"resto":"huevos","escalable":true,"modo":"simple"}],"elaboracion":["En una sartén con un poco de aceite, a fuego medio, rehogar los langostinos y el jamón con el ajo picado hasta que el ajo empiece a dorarse. Añadir después las setas y dejar que se hagan unos minutos, removiendo de vez en cuando. Cuando estén hechas, se echan los ajetes y los espárragos troceados y se rehogan un par de minutos más, hasta que estén tiernos. Después se añade el huevo batido, bajando un poco el fuego y dando vueltas a todo sin parar, como en un revuelto, hasta que el huevo esté muy cuajado. Y lo último, se incorporan los rollitos de mar, dándoles apenas un golpe de calor para que no se resequen, y se sirve enseguida."]},{"categoria":"ENTRANTES Y ENSALADAS","titulo":"Aguacates Rellenos de Gambas (mamá)","raciones":"4 personas","racionesBase":4,"tiempo":"25 minutos","ingredientes":[{"texto":"4 aguacates maduros","cantidad":4.0,"resto":"aguacates maduros","escalable":true,"modo":"simple"},{"texto":"200 g de gambas","cantidad":200.0,"resto":"g de gambas","escalable":true,"modo":"simple"},{"texto":"150 g de colas de cangrejo","cantidad":150.0,"resto":"g de colas de cangrejo","escalable":true,"modo":"simple"},{"texto":"Salsa rosa (mayonesa + tomate; opcional: ajo majado y kétchup en vez de tomate)","cantidad":null,"resto":"Salsa rosa (mayonesa + tomate; opcional: ajo majado y kétchup en vez de tomate)","escalable":false}],"elaboracion":["Se quita la carne del aguacate con cuidado de no romper la piel, para poder rellenarla después, y se deja limpia. Se trocea la carne en tacos pequeños.","Se cuecen las gambas en agua con sal 2-3 minutos, hasta que estén hechas; se escurren, se pelan y, si son muy grandes, se trocean, igual con las colas de cangrejo.","Se hace la salsa rosa mezclando bien la mayonesa con el tomate. Se mezclan todos los ingredientes muy bien, removiendo con cuidado para que no se deshaga el aguacate, y con esto se rellenan los aguacates.","Para adornar, coger algo de ingrediente oscuro que resalte, como aceituna negra o caviar. También se puede poner huevo duro muy picadito encima, o la cola de cangrejo en láminas."]},{"categoria":"ENTRANTES Y ENSALADAS","titulo":"Crema de Palitos de Cangrejo y Mejillones (mamá)","raciones":"6 personas (como entrante)","racionesBase":6,"tiempo":"10 minutos","ingredientes":[{"texto":"12 palitos de cangrejo","cantidad":12.0,"resto":"palitos de cangrejo","escalable":true,"modo":"simple"},{"texto":"10 cucharadas de mayonesa","cantidad":10.0,"resto":"cucharadas de mayonesa","escalable":true,"modo":"simple"},{"texto":"3 latas de mejillones al natural, bien escurridos","cantidad":3.0,"resto":"latas de mejillones al natural, bien escurridos","escalable":true,"modo":"simple"},{"texto":"4-6 anchoas","cantidad":4.0,"cantidad2":6.0,"resto":"anchoas","escalable":true,"modo":"rango"},{"texto":"Pan rojo, zanahorias y endivias (para servir)","cantidad":null,"resto":"Pan rojo, zanahorias y endivias (para servir)","escalable":false}],"elaboracion":["Poner todos los ingredientes en el vaso de la batidora y triturar a golpes cortos, sin pasarse, hasta conseguir una crema espesa pero con textura: que no quede como un puré fino, sino que se noten trocitos. Se sirve bien fría, acompañada de pan, zanahorias y endivias para untar o mojar."]},{"categoria":"ENTRANTES Y ENSALADAS","titulo":"Ensalada de Garbanzos \"Lola\" (mar)","raciones":"4 personas","racionesBase":4,"tiempo":"15 minutos","ingredientes":[{"texto":"Garbanzos cocidos (2 platos) — 1 bote de 400 gr","cantidad":null,"resto":"Garbanzos cocidos (2 platos) — 1 bote de 400 gr","escalable":false},{"texto":"Atún en aceite (1 lata)","cantidad":null,"resto":"Atún en aceite (1 lata)","escalable":false},{"texto":"Tomate crudo (½)","cantidad":null,"resto":"Tomate crudo (½)","escalable":false},{"texto":"Cebolleta (1)","cantidad":null,"resto":"Cebolleta (1)","escalable":false},{"texto":"Zanahoria (1)","cantidad":null,"resto":"Zanahoria (1)","escalable":false},{"texto":"Pepinillo (8)","cantidad":null,"resto":"Pepinillo (8)","escalable":false},{"texto":"Pimiento rojo crudo (¼)","cantidad":null,"resto":"Pimiento rojo crudo (¼)","escalable":false},{"texto":"Aceitunas negras (aprox. 15)","cantidad":null,"resto":"Aceitunas negras (aprox. 15)","escalable":false},{"texto":"Vinagreta: 6 cucharadas aceite, 2 cucharadas vinagre, sal","cantidad":null,"resto":"Vinagreta: 6 cucharadas aceite, 2 cucharadas vinagre, sal","escalable":false}],"elaboracion":["Poner en una fuente los garbanzos cocidos junto con el atún desmigado, el tomate, la cebolleta, la zanahoria, el pepinillo, el pimiento rojo y las aceitunas negras, todo bien troceado. Mezclar con cuidado para que no se deshagan los garbanzos. Aparte, batir el aceite con el vinagre y la sal hasta que ligue la vinagreta, y aliñar la ensalada con ella justo antes de servir."]},{"categoria":"ENTRANTES Y ENSALADAS","titulo":"Ensalada de Hojas de Roble con Frutos del Mar y de la Tierra (mar)","raciones":"4 personas","racionesBase":4,"tiempo":"15 minutos","ingredientes":[{"texto":"1 bolsa de hojas de roble (150 g aprox.)","cantidad":1.0,"resto":"bolsa de hojas de roble (150 g aprox.)","escalable":true,"modo":"simple"},{"texto":"4 tiras de salmón ahumado","cantidad":4.0,"resto":"tiras de salmón ahumado","escalable":true,"modo":"simple"},{"texto":"6 langostinos","cantidad":6.0,"resto":"langostinos","escalable":true,"modo":"simple"},{"texto":"Piñones (poquito) y 100 g de cola de cangrejo (o jamón ibérico)","cantidad":null,"resto":"Piñones (poquito) y 100 g de cola de cangrejo (o jamón ibérico)","escalable":false}],"elaboracion":["En una sartén con un poco de aceite, a fuego medio, rehogar los piñones y la cola de cangrejo (o el jamón ibérico) un par de minutos, removiendo, hasta que los piñones se doren ligeramente sin llegar a quemarse. Repartir las hojas de roble en la ensalada junto con las tiras de salmón ahumado y los langostinos, y colocar por encima los piñones y la cola de cangrejo templados. Aliñar con aceite, vinagre y sal justo antes de servir."]},{"categoria":"ENTRANTES Y ENSALADAS","titulo":"Paté de Latas de Pescado (mar)","raciones":"unas 6 personas (como aperitivo)","racionesBase":6,"tiempo":"10 minutos","ingredientes":[{"texto":"Versión 1: 1 lata sardinas picantona \"alto\" con su aceite, 1 lata caballa, 1 lata mejillones","cantidad":null,"resto":"Versión 1: 1 lata sardinas picantona \"alto\" con su aceite, 1 lata caballa, 1 lata mejillones","escalable":false},{"texto":"Versión 2: 1 lata mejillones aliñada completa, 4 palitos de mar, 2 cucharadas colmadas queso crema, 1 cucharada mayonesa","cantidad":null,"resto":"Versión 2: 1 lata mejillones aliñada completa, 4 palitos de mar, 2 cucharadas colmadas queso crema, 1 cucharada mayonesa","escalable":false}],"elab tirando el limón a los 15 minutos.","Triturar el zumo del limón asado, el tahini, la sal, el ajo y el aceite 20 segundos; rebañar y triturar de nuevo.","Añadir la remolacha asada; triturar 20 segundos.","Añadir la mitad de los garbanzos; triturar 1 minuto. Añadir el resto; triturar 2 minutos más. Decorar con rábanos y sésamo."]},{"categoria":"ENTRANTES Y ENSALADAS","titulo":"Hummus Negro (diegodoal)","raciones":"4 personas (como entrante)","racionesBase":4,"tiempo":"15 minutos","ingredientes":[{"texto":"300 g de garbanzos cocidos","cantidad":300.0,"resto":"g de garbanzos cocidos","escalable":true,"modo":"simple"},{"texto":"60 ml de zumo de limón","cantidad":60.0,"resto":"ml de zumo de limón","escalable":true,"modo":"simple"},{"texto":"60 ml de tahini negro","cantidad":60.0,"resto":"ml de tahini negro","escalable":true,"modo":"simple"},{"texto":"1 diente de ajo","cantidad":1.0,"resto":"diente de ajo","escalable":true,"modo":"simple"},{"texto":"2 cucharadas de aceite de oliva y sal al gusto","cantidad":2.0,"resto":"cucharadas de aceite de oliva y sal al gusto","escalable":true,"modo":"simple"}],"elaboracion":["triturar el zumo de limón, el tahini negro, la sal y el ajo 20 segundos; rebañar y triturar de nuevo.","Añadir la mitad de los garbanzos con el aceite; triturar 1 minuto. Añadir el resto; triturar 2 minutos más. Terminar con garbanzos enteros y sésamo negro."]},{"categoria":"ENTRANTES Y ENSALADAS","titulo":"Falafel Perfecto con Salsa Tahini (diegodoal)","raciones":"unos 20-24 falafel (4-6 personas)","racionesBase":20,"tiempo":"1 h 30 min","ingredientes":[{"texto":"Para el falafel: 400 g de garbanzos secos hidratados (no cocidos)","cantidad":null,"resto":"Para el falafel: 400 g de garbanzos secos hidratados (no cocidos)","escalable":false},{"texto":"1 cebolla","cantidad":1.0,"resto":"cebolla","escalable":true,"modo":"simple"},{"texto":"2 jalapeños","cantidad":2.0,"resto":"jalapeños","escalable":true,"modo":"simple"},{"texto":"2 dientes de ajo","cantidad":2.0,"res ":"Agua (la necesaria hasta la consistencia deseada)","escalable":false},{"texto":"Para la pita: 1 pepino","cantidad":null,"resto":"Para la pita: 1 pepino","escalable":false},{"texto":"2 tomates cherry","cantidad":2.0,"resto":"tomates cherry","escalable":true,"modo":"simple"},{"texto":"Media cebolla roja","cantidad":null,"resto":"Media cebolla roja","escalable":false},{"texto":"4-6 panes de pita","cantidad":4.0,"cantidad2":6.0,"resto":"panes de pita","escalable":true,"modo":"rango"},{"texto":"Pan de pita","cantidad":null,"resto":"Pan de pita","escalable":false},{"texto":"2 falafel por pita","cantidad":2.0,"resto":"falafel por pita","escalable":true,"modo":"simple"},{"texto":"Un puñado de col en juliana","cantidad":null,"resto":"Un puñado de col en juliana","escalable":false}],"elaboracion":["El falafel auténtico se hace con garbanzo crudo hidratado, nunca cocido: cocerlo antes daría una masa demasiado húmeda que absorbería aceite en la fritura y se desharía.","Triturar los 400 g de garbanzos hidratados en un procesador hasta obtener una textura granulada; pasar a un bol.","Picar finamente la cebolla, los jalapeños, el ajo, el cilantro, el perejil y la menta.","Triturar estos aromáticos picados junto con el zumo de limón hasta formar una pasta.","Mezclar esta pasta con los garbanzos triturados.","Añadir la sal, el comino, el cardamomo, la levadura química y la harina de garbanzo; mezclar hasta homogeneizar y refrigerar un mínimo de 30 minutos (esto reposa el gluten y compacta la masa para que no se rompa al freír).","Formar bolitas de 45 g con las manos húmedas.","Freír a 180° durante 3-4 minutos, hasta que estén doradas; escurrir sobre una rejilla.","Salsa tahini: triturar el ajo, el perejil, el cilantro, el comino y la sal 10 segundos. Añadir el tahini y el zumo de limón; triturar hasta que quede liso.","Añadir agua poco a poco hasta la consistencia deseada; refrigerar.","Montaje de la pita: cortar el pepino en láminas finas y dejarlo en vinagre 30 minutos.","Tostar el pan de pita y abrirlo. Rellenar con salsa tahini, col en juliana, más salsa, tomates cherry, dos falafel, cebolla roja, el pepino encurtido y un último toque de salsa."]},{"categoria":"CROQUETAS","titulo":"Croquetas (mar) (Gina)","raciones":"unas 20 croquetas","racionesBase":20,"tiempo":"25 min (+ al menos 2 h de reposo en nevera)","ingredientes":[{"texto":"3 cucharadas soperas de harina","cantidad":3.0,"resto":"cucharadas soperas de harina","escalable":true,"modo":"simple"},{"texto":"½ litro de leche muy caliente","cantidad":0.5,"resto":"litro de leche muy caliente","escalable":true,"modo":"simple"},{"texto":"1 cucharadita de margarina","cantidad":1.0,"resto":"cucharadita de margarina","escalable":true,"modo":"simple"}],"elaboracion":["Se pone un poco de aceite en una sartén a fuego medio y se añade la harina, rehogándola 1-2 minutos sin dejar que se tueste demasiado, removiendo sin parar. Se va añadiendo la leche muy caliente poco a poco, sin dejar de remover con las varillas o una cuchara de madera, para que no se formen grumos.","Cuando la bechamel esté unida y empiece a espesar, se añade la margarina y se sigue removiendo a fuego bajo-medio hasta que se derrita e integre. Por último se añade el pollo (u otro relleno que se quiera usar), ya troceado, y se mezcla bien, cociendo 5-8 minutos más y removiendo sin parar hasta que la masa esté espesa y se despegue de la sartén. Se deja enfriar a temperatura ambiente y luego en la nevera al menos 2 horas (o toda la noche) antes de formar las croquetas."]},{"categoria":"CROQUETAS","titulo":"Croquetas (mar) (Pili / Adrián)","raciones":"unas 20 croquetas","racionesBase":20,"tiempo":"30 min (+ al menos 2 h de reposo en nevera)","ingredientes":[{"texto":"Cebolla grande","cantidad":null,"resto":"Cebolla grande","escalable":false},{"texto":"300 g de carne (rehogar)","cantidad":300.0,"resto":"g de carne (rehogar)","escalable":true,"modo":"simple"},{"texto":"1 vaso (3 cucharadas harina)","cantidad":1.0,"resto":"vaso (3 cucharadas harina)","escalable":true,"modo":"simple"},{"texto":"1 vaso de leche (batir bien batido)","cantidad":1.0,"resto":"vaso de leche (batir bien batido)","escalable":true,"modo":"simple"}],"elaboracion":["Picar la cebolla bien menuda y rehogarla en una sartén con un poco de aceite a fuego medio 8-10 minutos, hasta que quede blanda y transparente. Añadir la carne y rehogarla junto con la cebolla, removiendo, hasta que se haga bien.","Añadir la harina y rehogarla un momento, removiendo, para que pierda el sabor a crudo. Incorporar la leche bien batida, poco a poco, y dar vueltas sin parar a fuego medio-bajo durante 10-12 minutos, hasta conseguir una masa espesa que se vaya despegando de las paredes de la sartén: esa es la textura adecuada para las croquetas. Dejar enfriar a temperatura ambiente y luego en la nevera al menos 2 horas antes de formarlas."]},{"categoria":"CROQUETAS","titulo":"Croquetas Camino (mar)","raciones":"unas 20 croquetas","racionesBase":20,"tiempo":"25 min (+ al menos 2 h de reposo en nevera)","ingredientes":[{"texto":"3 cucharadas de harina","cantidad":3.0,"resto":"cucharadas de harina","escalable":true,"modo":"simple"},{"texto":"2 cucharadas de aceite","cantidad":2.0,"resto":"cucharadas de aceite","escalable":true,"modo":"simple"},{"texto":"½ litro de leche","cantidad":0.5,"resto":"litro de leche","escalable":true,"modo":"simple"},{"texto":"Sal al gusto","cantidad":null,"resto":"Sal al gusto","escalable":false},{"texto":"300 g de carne (la que se quiera)","cantidad":300.0,"resto":"g de carne (la que se quiera)","escalable":true,"modo":"simple"}],"elaboracion":["Echar un chorro de aceite en una sartén y poner a fuego medio. Rehogar la carne (la que se quiera usar) hasta que esté bien hecha. Añadir la harina y la sal, y rehogarla un poco, removiendo, para que se tueste ligeramente y pierda el sabor a crudo.","Añadir la leche poco a poco, sin dejar de dar vueltas, a fuego medio-bajo durante 10-12 minutos, hasta que la masa espese y se despegue d  kétchup","escalable":true,"modo":"simple"},{"texto":"¼ cubilete de brandy","cantidad":0.25,"resto":"cubilete de brandy","escalable":true,"modo":"simple"},{"texto":"Unas gotas de tabasco","cantidad":null,"resto":"Unas gotas de tabasco","escalable":false},{"texto":"Sal al gusto","cantidad":null,"resto":"Sal al gusto","escalable":false},{"texto":"400 ó 500 g (4 ó 5 cubiletes) de aceite","cantidad":400.0,"resto":"ó 500 g (4 ó 5 cubiletes) de aceite","escalable":true,"modo":"simple"}],"elaboracion":["Vierta todos los ingredientes en el vaso, excepto el aceite, y mezcle unos segundos a velocidad 5. Programe 45 segundos a velocidad 5, ponga el cubilete ligeramente inclinado y vierta el aceite sobre la tapadera para que vaya cayendo dentro del vaso. La cantidad de aceite dependerá del tamaño de los huevos.","Una vez que haya echado todo el aceite, compruebe la textura y, si fuera necesario, añada un poco más. Si salpica mucho a la tapadera, ponga el cestillo dentro del vaso."]},{"categoria":"SALSAS Y VINAGRETAS","titulo":"Salsa Rosa de Leche (asun)","raciones":"para 8-10 personas","racionesBase":8,"tiempo":"10 minutos","ingredientes":[{"texto":"200 g de leche","cantidad":200.0,"resto":"g de leche","escalable":true,"modo":"simple"},{"texto":"100 g de kétchup","cantidad":100.0,"resto":"g de kétchup","escalable":true,"modo":"simple"},{"texto":"El zumo de una naranja","cantidad":null,"resto":"El zumo de una naranja","escalable":false},{"texto":"Una cucharada de brandy","cantidad":null,"resto":"Una cucharada de brandy","escalable":false},{"texto":"Unas gotas de tabasco","cantidad":null,"resto":"Unas gotas de tabasco","escalable":false},{"texto":"Sal al gusto","cantidad":null,"resto":"Sal al gusto","escalable":false},{"texto":"800 g de aceite de girasol","cantidad":800.0,"resto":"g de aceite de girasol","escalable":true,"modo":"simple"}],"elaboracion":["Ponga la mariposa en las cuchillas, eche todos los ingredientes, excepto el aceite, en el vaso y bata unos segundos en velocidad 2.","Con la máquina en marcha en velocidad 2 y el cubilete puesto en la tapadera, vaya echando el aceite sobre la misma para que vaya filtrándose poco a poco, hasta completar los 800 g aproximadamente y veamos que ha espesado un poco.","A continuación aumente despacio la velocidad a la 4 y manténgalo así por espacio de unos 10 ó 12 segundos; verá cómo espesa de golpe. Compruebe la sazón. (Así le quedará una salsa espesa, no se manchará la tapadera y, sobre todo, no se le cortará).","Nota: Utilice esta salsa para cubrir el \"Sandwichón\" o para cualquier pudín o ensaladilla."]},{"categoria":"SALSAS Y VINAGRETAS","titulo":"Salsa Tártara (asun)","raciones":"para 4-6 personas","racionesBase":4,"tiempo":"10 minutos","ingredientes":[{"texto":"4-5 pepinillos y unas cebollitas en vinagre","cantidad":4.0,"cantidad2":5.0,"resto":"pepinillos y unas cebollitas en vinagre","escalable":true,"modo":"rango"},{"texto":"10 aceitunas sin hueso","cantidad":10.0,"resto":"aceitunas sin hueso","escalable":true,"modo":"simple"},{"texto":"1 cucharada de alcaparras","cantidad":1.0,"resto":"cucharada de alcaparras","escalable":true,"modo":"simple"},{"texto":"Un poco de perejil y todos los ingredientes de la mayonesa tradicional","cantidad":null,"resto":"Un poco de perejil y todos los ingredientes de la mayonesa tradicional","escalable":false}],"elaboracion":["Vierta todos los encurtidos en el vaso y programe 5 segundos a velocidad 3 y ½. Retire y reserve en un plato. Haga la mayonesa e incorpórele los encurtidos picados, mezclando con la espátula."]},{"categoria":"SALSAS Y VINAGRETAS","titulo":"Salsa Templada para Ensaladas y Verduras (asun)","raciones":"6 personas","racionesBase":6,"tiempo":"10 minutos","ingredientes":[{"texto":"150 g (1 y ½ cub.) de aceite","cantidad":150.0,"resto":"g (1 y ½ cub.) de aceite","escalable":true,"modo":"simple"},{"texto":"50 g de mantequilla","cantidad":50.0,"resto":"g de mantequilla","escalable":true,"modo":"simple"},{"texto":"50 g (½ cub.) de salsa de soja" za de congrio","escalable":true,"modo":"simple"},{"texto":"200 g de gambas (peladas)","cantidad":200.0,"resto":"g de gambas (peladas)","escalable":true,"modo":"simple"},{"texto":"300 g de almejas (de soto)","cantidad":300.0,"resto":"g de almejas (de soto)","escalable":true,"modo":"simple"},{"texto":"2 huevos cocidos","cantidad":2.0,"resto":"huevos cocidos","escalable":true,"modo":"simple"},{"texto":"1 cebolla y 1 puerro, picaditos","cantidad":1.0,"resto":"cebolla y 1 puerro, picaditos","escalable":true,"modo":"simple"},{"texto":"100 g de tomate frito","cantidad":100.0,"resto":"g de tomate frito","escalable":true,"modo":"simple"},{"texto":"1,5 l de caldo de pescado","cantidad":1.5,"resto":"l de caldo de pescado","escalable":true,"modo":"simple"}],"elaboracion":["En una cazuela con aceite a fuego medio, se echa una cáscara de cebolla; cuando esté dorada, se saca y se retira. En ese mismo aceite se echa todo el pescado y se rehoga un par de minutos, removiendo con cuidado. Se añade después el tomate frito y se deja que se integre un poco a fuego suave. A continuación se echa el caldo de pescado, las gambas, las almejas, etc., se sube el fuego hasta que rompa a hervir y se deja cocer a fuego medio 10-12 minutos, hasta que el pescado esté hecho y las almejas se hayan abierto. Al final se añade el huevo duro y un poco de ropa (fideos o similar), dejando que cueza el tiempo que indique el paquete, hasta que esté en su punto."]},{"categoria":"SOPAS","titulo":"Sopa de Arroz con Almejas (mamá) (Arguiñano)","raciones":"4 personas","racionesBase":4,"tiempo":"40 minutos","ingredientes":[{"texto":"2 puerros","cantidad":2.0,"resto":"puerros","escalable":true,"modo":"simple"},{"texto":"2 zanahorias medianas","cantidad":2.0,"resto":"zanahorias medianas","escalable":true,"modo":"simple"},{"texto":"1 cazo de arroz","cantidad":1.0,"resto":"cazo de arroz","escalable":true,"modo":"simple"},{"texto":"Unas hebras de azafrán","cantidad":null,"resto":"Unas hebras de azafrán","escalable":false},{"texto":"20 almejas","cantidad":20.0,"resto":"almejas","escalable":true,"modo":"simple"},{"texto":"1,5 l de caldo de ave (pollo, laurel)","cantidad":1.5,"resto":"l de caldo de ave (pollo, laurel)","escalable":true,"modo":"simple"}],"elaboracion":["Se rehoga el puerro partido muy menudito con la zanahoria en una cazuela con un poco de aceite, a fuego medio, removiendo de vez en cuando. Cuando está blandito (no pochado del todo) se echa el arroz y se rehoga un momento, se añade el azafrán y después el caldo caliente. Se deja al fuego, ya más suave, 30 minutos, removiendo de vez en cuando para que no se pegue. Se incorporan las almejas los últimos 3-4 minutos, hasta que se abran, y listo."]},{"categoria":"SOPAS","titulo":"Sopa de Patatas (mamá) (Alar)","raciones":"4-6 personas","racionesBase":4,"tiempo":"35 minutos","ingredientes":[{"texto":"4 patatas medianas","cantidad":4.0,"resto":"patatas medianas","escalable":true,"modo":"simple"},{"texto":"1 pimiento rojo","cantidad":1.0,"resto":"pimiento rojo","escalable":true,"modo":"simple"},{"texto":"1 cebolla","cantidad":1.0,"resto":"cebolla","escalable":true,"modo":"simple"},{"texto":"1 lata de atún","cantidad":1.0,"resto":"lata de atún","escalable":true,"modo":"simple"},{"texto":"2 huevos duros","cantidad":2.0,"resto":"huevos duros","escalable":true,"modo":"simple"},{"texto":"150 g de gambas congeladas","cantidad":150.0,"resto":"g de gambas congeladas","escalable":true,"modo":"simple"},{"texto":"Aceitunas enteras (no muchas)","cantidad":null,"resto":"Aceitunas enteras (no muchas)","escalable":false}],"elaboracion":["Se rehoga la cebolla con el pimiento picadito en un poco de aceite, a fuego medio, hasta que empiecen a ablandarse. Se echa el agua y, cuando rompa a hervir, se añaden las patatas cortadas en taquitos y los demás ingredientes, todo bien troceadito. Se deja hirviendo a fuego medio 20-25 minutos, hasta que la patata esté hecha. Las gambas se echan al final, dejándolas solo un par de minutos, lo justo para que o":"simple"}],"elaboracion":["Se echa un poquito de aceite en una cazuela, a fuego medio, y una cáscara de cebolla. Se deja la cebolla hasta que se dore y luego se retira.","Se añaden todos los ingredientes para la ropa (congrio, gambas, almejas, mejillones, chipirones...) y se les deja hacer 2-3 minutos, removiendo con cuidado. Luego se añade el tomate frito, el caldo del congrio y el ajo y perejil majado. Se añade Starlux en vez de sal. Se deja cocer a fuego medio 10-12 minutos, hasta que el pescado esté hecho y el marisco se haya abierto, y cuando comienza a hervir de nuevo se añade la ropa, dejando el tiempo que indique el paquete hasta que esté en su punto."]},{"categoria":"SOPAS","titulo":"Alubias Alicantinas (asun)","raciones":"4 personas","racionesBase":4,"tiempo":"30 minutos","ingredientes":[{"texto":"500 g de almejas bien lavadas","cantidad":500.0,"resto":"g de almejas bien lavadas","escalable":true,"modo":"simple"},{"texto":"2 frascos de alubias blancas cocidas","cantidad":2.0,"resto":"frascos de alubias blancas cocidas","escalable":true,"modo":"simple"},{"texto":"1 lata de atún","cantidad":1.0,"resto":"lata de atún","escalable":true,"modo":"simple"},{"texto":"1 cucharada de harina","cantidad":1.0,"resto":"cucharada de harina","escalable":true,"modo":"simple"},{"texto":"1 cubito de caldo de pescado","cantidad":1.0,"resto":"cubito de caldo de pescado","escalable":true,"modo":"simple"},{"texto":"2 dientes de ajo","cantidad":2.0,"resto":"dientes de ajo","escalable":true,"modo":"simple"},{"texto":"50 g de aceite","cantidad":50.0,"resto":"g de aceite","escalable":true,"modo":"simple"},{"texto":"500 g de agua","cantidad":500.0,"resto":"g de agua","escalable":true,"modo":"simple"},{"texto":"Una pizca de pimienta de cayena","cantidad":null,"resto":"Una pizca de pimienta de cayena","escalable":false},{"texto":"Sal y perejil al gusto","cantidad":null,"resto":"Sal y perejil al gusto","escalable":false}],"elaboracion":["1. Con la máquina en marcha a velocidad 6, intr
