ura alta al principio (unos 200°) durante los primeros 10 minutos, para que suba bien, y después bajar a temperatura media (unos 170-180°) el resto de la cocción, unos 30-35 minutos más, hasta que al pinchar con un palillo salga limpio."]},{"categoria":"REPOSTERÍA","titulo":"Bizcocho de Limón (mamá) (para Geografía)","raciones":"8 personas","racionesBase":8,"tiempo":"1 hora","ingredientes":[{"texto":"3 huevos","cantidad":3.0,"resto":"huevos","escalable":true,"modo":"simple"},{"texto":"1 sobre de levadura en polvo (16 gr)","cantidad":1.0,"resto":"sobre de levadura en polvo (16 gr)","escalable":true,"modo":"simple"},{"texto":"1 yogur de limón (125 gr) — se puede sustituir por Maizena","cantidad":1.0,"resto":"yogur de limón (125 gr) — se puede sustituir por Maizena","escalable":true,"modo":"simple"},{"texto":"Harina (3 medidas de yogur) — se puede sustituir por Maizena","cantidad":null,"resto":"Harina (3 medidas de yogur) — se puede sustituir por Maizena","escalable":false},{"texto":"Azúcar (2 medidas de yogur)","cantidad":null,"resto":"Azúcar (2 medidas de yogur)","escalable":false},{"texto":"Aceite de oliva virgen extra (1 medida de yogur)","cantidad":null,"resto":"Aceite de oliva virgen extra (1 medida de yogur)","escalable":false},{"texto":"Ralladura de 1 limón","cantidad":null,"resto":"Ralladura de 1 limón","escalable":false},{"texto":"Un poco de mantequilla y harina para untar el molde","cantidad":null,"resto":"Un poco de mantequilla y harina para untar el molde","escalable":false},{"texto":"Mermelada, azúcar glas y hojas de menta al gusto (para decorar)","cantidad":null,"resto":"Mermelada, azúcar glas y hojas de menta al gusto (para decorar)","escalable":false}],"elaboracion":["Calentar el horno a 180°. Bate los huevos hasta que estén espumosos. Agrega el azúcar, el yogur, el aceite y la ralladura de limón, sin dejar de batir. Mezcla aparte la harina y la levadura y añádelas a la masa poco a poco, batiendo suave, hasta que todos los ingredientes queden perfectamente incorporados y sin grumos.","Unta un molde con mantequilla o aceite y espolvorea con harina. Vierte la mezcla y hornea a 180° durante 40-45 minutos, hasta que al pinchar con un palillo salga limpio y esté dorado por encima.","Deja que se temple dentro del molde unos minutos y desmóldalo sobre una rejilla para que acabe de enfriar. Espolvorea con azúcar glas y adorna con mermelada y hojas de menta.","Consejo: Para que la levadura haga más efecto, deja reposar la masa 15 minutos antes de meterla en el horno. Usa el envase vacío del yogur para medir harina, azúcar y aceite."]},{"categoria":"REPOSTERÍA","titulo":"Bizcocho de Naranja con Cobertura de Chocolate (mar) (Nº190)","raciones":"10 raciones","racionesBase":10,"tiempo":"55 minutos","ingredientes":[{"texto":"250 gr azúcar","cantidad":250.0,"resto":"gr azúcar","escalable":true,"modo":"simple"},{"texto":"1 naranja entera de piel fina (especial para zumo)","cantidad":1.0,"resto":"naranja entera de piel fina (especial para zumo)","escalable":true,"modo":"simple"},{"texto":"2 yemas de huevo","cantidad":2.0,"resto":"yemas de huevo","escalable":true,"modo":"simple"},{"texto":"1 huevo","cantidad":1.0,"resto":"huevo","escalable":true,"modo":"simple"},{"texto":"100 gr aceite o mantequilla","cantidad":100.0,"resto":"gr aceite o mantequilla","escalable":true,"modo":"simple"},{"texto":"1 yogur natural","cantidad":1.0,"resto":"yogur natural","escalable":true,"modo":"simple"},{"texto":"220 gr harina","cantidad":220.0,"resto":"gr harina","escalable":true,"modo":"simple"},{"texto":"1 sobre levadura Royal","cantidad":1.0,"resto":"sobre levadura Royal","escalable":true,"modo":"simple"},{"texto":"Un pellizco de sal","cantidad":null,"resto":"Un pellizco de sal","escalable":false},{"texto":"Cobertura: 30 gr aceite de girasol + 250 gr chocolate Nestlé postres","cantidad":null,"resto":"Cobertura: 30 gr aceite de girasol + 250 gr chocolate Nestlé postres","escalable":false}],"elaboracion":["Poner en el vaso el azúcar, la naranja troceada, las yemas y el huevo. Programar 1 minuto a 50°C, velocidad 4.","Añadir el aceite o la mantequilla y el yogur y mezclar unos segundos a velocidad 4. Incorporar la harina, la levadura y la sal y mezclar 6 segundos a velocidad 2. Terminar de mezclar con la espátula, con movimientos envolventes, hasta que no queden restos de harina sin integrar.","Engrasar un molde de plum-cake con mantequilla y enharinarlo. Verter la mezcla (no más de la mitad del molde, porque sube al hornear). Espolvorear la superficie con azúcar. Hornear a 180°C, calor arriba y abajo, durante 30 minutos. Pinchar con una aguja o palillo en el centro: si sale limpio, está listo; si sale húmedo, dejar unos minutos más.","Cobertura: verter el aceite en el vaso y programar 4 minutos a 80°C velocidad 1. Ir agregando el chocolate en trozos y después programar 30 segundos a velocidad 5-7-9, hasta obtener una crema homogénea y brillante.","Dejar templar el bizcocho unos minutos antes de desmoldar sobre una rejilla, y cubrirlo con la cobertura de chocolate mientras aún esté tibio, para que se reparta bien. Adornar al gusto."]},{"categoria":"REPOSTERÍA","titulo":"Bizcocho Fácil (mar)","raciones":"8 personas","racionesBase":8,"tiempo":"50 minutos","ingredientes":[{"texto":"3 huevos","cantidad":3.0,"resto":"huevos","escalable":true,"modo":"simple"},{"texto":"1 yogur de limón","cantidad":1.0,"resto":"yogur de limón","escalable":true,"modo":"simple"},{"texto":"3 medidas de yogur de harina","cantidad":3.0,"resto":"medidas de yogur de harina","escalable":true,"modo":"simple"},{"texto":"2 medidas de azúcar","cantidad":2.0,"resto":"medidas de azúcar","escalable":true,"modo":"simple"},{"texto":"1 medida de aceite","cantidad":1.0,"resto":"medida de aceite","escalable":true,"modo":"simple"},{"texto":"1 sobre de levadura","cantidad":1.0,"resto":"sobre de levadura","escalable":true,"modo":"simple"},{"texto":"Opcional: ralladura de 1 limón, un puñado de pasas y nueces enharinadas","cantidad":null,"resto":"Opcional: ralladura de 1 limón, un puñado de pasas y nueces enharinadas","escalable":false}],"elaboracion":["En un bol, batir los 3 huevos con el azúcar unos minutos, hasta que blanqueen y doblen un poco su volumen. Añadir la harina mezclada con la levadura y mezclar con movimientos envolventes, para que no se baje la mezcla. Agregar después el yogur y el aceite, batiéndolo muy bien hasta que quede una masa lisa y sin grumos.","Verter la mezcla en un molde untado con mantequilla y harina. Meter al horno, precalentado, a 170° durante 30-35 minutos: al principio con el horno un poco más fuerte para que suba bien, y a los 10 minutos bajar a temperatura media para que se termine de hacer por dentro sin quemarse por fuera. Comprobar que está hecho pinchando con un palillo en el centro: debe salir limpio."]},{"categoria":"REPOSTERÍA","titulo":"Bizcocho de Calabacín (asun)","raciones":"10 raciones","racionesBase":10,"tiempo":"50 minutos","ingredientes":[{"texto":"100 g de nueces","cantidad":100.0,"resto":"g de nueces","escalable":true,"modo":"simple"},{"texto":"150 g de azúcar","cantidad":150.0,"resto":"g de azúcar","escalable":true,"modo":"simple"},{"texto":"La piel de 1 limón (solo parte amarilla)","cantidad":null,"resto":"La piel de 1 limón (solo parte amarilla)","escalable":false},{"texto":"250 g de calabacines troceados, sin pelar","cantidad":250.0,"resto":"g de calabacines troceados, sin pelar","escalable":true,"modo":"simple"},{"texto":"3 huevos","cantidad":3.0,"resto":"huevos","escalable":true,"modo":"simple"},{"texto":"100 g de mantequilla","cantidad":100.0,"resto":"g de mantequilla","escalable":true,"modo":"simple"},{"texto":"1 cucharadita de canela","cantidad":1.0,"resto":"cucharadita de canela","escalable":true,"modo":"simple"},{"texto":"180 g de harina","cantidad":180.0,"resto":"g de harina","escalable":true,"modo":"simple"},{"texto":"1 sobre de levadura Royal","cantidad":1.0,"resto":"sobre de levadura Royal","escalable":true,"modo":"simple"},{"texto":"1 pellizco de sal","cantidad":1.0,"resto":"pellizco de sal","escalable":true,"modo":"simple"},{"texto":"100 g de dátiles sin huesos, cortados en trocitos pequeños","cantidad":100.0,"resto":"g de dátiles sin huesos, cortados en trocitos pequeños","escalable":true,"modo":"simple"},{"texto":"100 g de pasas de corinto maceradas en brandy","cantidad":100.0,"resto":"g de pasas de corinto maceradas en brandy","escalable":true,"modo":"simple"}],"elaboracion":["Trocear las nueces con la máquina unos segundos velocidad 4, no deben quedar muy pequeñas. Poner el azúcar y pulverizar 1 minuto velocidad 9. Con la máquina en marcha añadir la cáscara de limón bien seca por el bocal y pulverizar. Añadir los calabacines y programar 25 segundos velocidad 5, abrir la máquina y bajar con la espátula los residuos de las paredes del vaso. Incorporar los huevos, la mantequilla y la canela, programar 15 segundos velocidad 6. Agregar la harina, la levadura y la sal, programar 4 segundos velocidad 2. Añadir los dátiles troceados, las nueces y las pasas remojadas bien escurridas, mezclar suavemente.","Colocamos en molde de corona o plum-cake, horneamos a 180°C entre 35 ó 40 minutos."]},{"categoria":"REPOSTERÍA","titulo":"Bizcocho de Tres Limones (diegodoal)","raciones":"10 raciones","racionesBase":10,"tiempo":"1 h 15 min (+ 2 semanas de maceración del limón confitado)","ingredientes":[{"texto":"190 g de harina de trigo","cantidad":190.0,"resto":"g de harina de trigo","escalable":true,"modo":"simple"},{"texto":"5 g de bicarbonato","cantidad":5.0,"resto":"g de bicarbonato","escalable":true,"modo":"simple"},{"texto":"½ cucharadita de cúrcuma (para el color)","cantidad":0.5,"resto":"cucharadita de cúrcuma (para el color)","escalable":true,"modo":"simple"},{"texto":"225 g de azúcar","cantidad":225.0,"resto":"g de azúcar","escalable":true,"modo":"simple"},{"texto":"3 huevos","cantidad":3.0,"resto":"huevos","escalable":true,"modo":"simple"},{"texto":"120 ml de aceite de oliva suave","cantidad":120.0,"resto":"ml de aceite de oliva suave","escalable":true,"modo":"simple"},{"texto":"120 g de yogur griego (o nata agria/kéfir)","cantidad":120.0,"resto":"g de yogur griego (o nata agria/kéfir)","escalable":true,"modo":"simple"},{"texto":"55 g de limón confitado (ver receta más abajo), picado","cantidad":55.0,"resto":"g de limón confitado (ver receta más abajo), picado","escalable":true,"modo":"simple"},{"texto":"Ralladura de 1 limón","cantidad":null,"resto":"Ralladura de 1 limón","escalable":false},{"texto":"45 ml de zumo de 1 limón","cantidad":45.0,"resto":"ml de zumo de 1 limón","escalable":true,"modo":"simple"},{"texto":"Para el limón confitado: 6 limones","cantidad":null,"resto":"Para el limón confitado: 6 limones","escalable":false},{"texto":"75 g de sal","cantidad":75.0,"resto":"g de sal","escalable":true,"modo":"simple"},{"texto":"75 g de azúcar","cantidad":75.0,"resto":"g de azúcar","escalable":true,"modo":"simple"},{"texto":"Para el glaseado: 85 g de azúcar glas","cantidad":null,"resto":"Para el glaseado: 85 g de azúcar glas","escalable":false},{"texto":"Una pizca de flor de sal","cantidad":null,"resto":"Una pizca de flor de sal","escalable":false},{"texto":"Flor de sal","cantidad":null,"resto":"Flor de sal","escalable":false}],"elaboracion":["El limón confitado se prepara con antelación: lavar los limones y cortarlos en cuartos. Mezclarlos con la sal y el azúcar en un bol y refrigerar 1 día. Pasar los limones junto con el líquido que hayan soltado a un tarro, presionar con la mano hasta que queden bien cubiertos por el líquido y refrigerar un mínimo de 2 semanas (idealmente entre 1 y 6 meses) antes de usar.","Para el bizcocho, mezclar en un bol pequeño la harina, el bicarbonato y la cúrcuma. En un bol grande, batir los huevos, el azúcar y el aceite de oliva hasta que la mezcla doble su volumen y tome un color amarillo pálido.","Triturar el yogur junto con el limón confitado, la ralladura y el zumo de limón hasta que quede homogéneo, e incorporarlo a la mezcla de huevo. Añadir los ingredientes secos en tres tandas, con movimientos suaves y envolventes.","Engrasar el molde y forrarlo con papel de horno dejando que sobresalga por los bordes (para poder sacar el bizcocho tirando de él). Verter la masa, dar unos golpecitos al molde contra la mesa para asentarla, y hornear a 175°, con calor solo por abajo, durante 40-50 minutos, hasta que al pinchar el centro con un palillo salga limpio.","Dejar templar 5 minutos, desmoldar tirando del papel y dejar enfriar del todo sobre una rejilla (unas 2 horas). Mezclar el azúcar glas con la leche para el glaseado, verterlo sobre el bizcocho ya frío cubriendo toda la superficie, dejar que cuaje 5 minutos y terminar con un poco de flor de sal por encima."]},{"categoria":"REPOSTERÍA","titulo":"Magdalenas con Naranja (mar)","raciones":"unas 12 magdalenas","racionesBase":12,"tiempo":"30 minutos","ingredientes":[{"texto":"1 naranja sin nada blanco","cantidad":1.0,"resto":"naranja sin nada blanco","escalable":true,"modo":"simple"},{"texto":"4 huevos grandes","cantidad":4.0,"resto":"huevos grandes","escalable":true,"modo":"simple"},{"texto":"180 gr azúcar (o 100 gr)","cantidad":180.0,"resto":"gr azúcar (o 100 gr)","escalable":true,"modo":"simple"},{"texto":"100 ml aceite","cantidad":100.0,"resto":"ml aceite","escalable":true,"modo":"simple"},{"texto":"220 gr harina","cantidad":220.0,"resto":"gr harina","escalable":true,"modo":"simple"},{"texto":"1 sobre levadura","cantidad":1.0,"resto":"sobre levadura","escalable":true,"modo":"simple"},{"texto":"Ralladura de 1 naranja","cantidad":null,"resto":"Ralladura de 1 naranja","escalable":false}],"elaboracion":["Se echan los ingredientes en el orden indicado en un bol (la naranja, los huevos, el azúcar, el aceite, la harina con la levadura y la ralladura) y se bate todo con la batidora hasta obtener una masa lisa, sin grumos.","Se reparten los moldes de papel llenándolos ¾ partes (para 20 moldes), sin llegar arriba del todo, porque suben al hornear. Conviene dejar reposar la masa en frío mientras el horno alcanza la temperatura.","Se hornea a ≈200°C (190°C si el horno calienta mucho), con calor arriba y abajo, colocando la bandeja en la altura media del horno, durante 10-15 minutos (unos 13 minutos aproximadamente), hasta que suban bien, se doren por arriba y al pinchar con un palillo salga limpio."]},{"categoria":"REPOSTERÍA","titulo":"Roscón de Reyes Casero (diegodoal)","raciones":"1 roscón (8-10 raciones)","racionesBase":1,"tiempo":"1 h 15 min (+ unas 4 h de reposos y fermentación)","ingredientes":[{"texto":"Para el roscón: 550 g de harina de fuerza","cantidad":null,"resto":"Para el roscón: 550 g de harina de fuerza","escalable":false},{"texto":"85 ml de leche","cantidad":85.0,"resto":"ml de leche","escalable":true,"modo":"simple"},{"texto":"5 g de levadura de panadero instantánea (o 15 g de levadura fresca, o 4 g de levadura seca activa)","cantidad":5.0,"resto":"g de levadura de panadero instantánea (o 15 g de levadura fresca, o 4 g de levadura seca activa)","escalable":true,"modo":"simple"},{"texto":"100 g de azúcar","cantidad":100.0,"resto":"g de azúcar","escalable":true,"modo":"simple"},{"texto":"40 ml de zumo de naranja","cantidad":40.0,"resto":"ml de zumo de naranja","escalable":true,"modo":"simple"},{"texto":"35 ml de zumo de limón","cantidad":35.0,"resto":"ml de zumo de limón","escalable":true,"modo":"simple"},{"texto":"25 ml de ron (o agua)","cantidad":25.0,"resto":"ml de ron (o agua)","escalable":true,"modo":"simple"},{"texto":"5-10 ml de agua de azahar","cantidad":5.0,"cantidad2":10.0,"resto":"ml de agua de azahar","escalable":true,"modo":"rango"},{"texto":"3 huevos","cantidad":3.0,"resto":"huevos","escalable":true,"modo":"simple"},{"texto":"100 g de mantequilla","cantidad":100.0,"resto":"g de mantequilla","escalable":true,"modo":"simple"},{"texto":"Azúcar glas, al gusto, para decorar","cantidad":null,"resto":"Azúcar glas, al gusto, para decorar","escalable":false},{"texto":"50 g de almendra fileteada","cantidad":50.0,"resto":"g de almendra fileteada","escalable":true,"modo":"simple"},{"texto":"2 cucharadas de azúcar humedecido con agua de azahar, para decorar","cantidad":2.0,"resto":"cucharadas de azúcar humedecido con agua de azahar, para decorar","escalable":true,"modo":"simple"},{"texto":"450 ml de nata para montar y 100 g de azúcar, para el relleno","cantidad":450.0,"resto":"ml de nata para montar y 100 g de azúcar, para el relleno","escalable":true,"modo":"simple"},{"texto":"Para la naranja confitada: 1 naranja","cantidad":null,"resto":"Para la naranja confitada: 1 naranja","escalable":false},{"texto":"225 g de azúcar","cantidad":225.0,"resto":"g de azúcar","escalable":true,"modo":"simple"}],"elaboracion":["Mezclar 100 g de harina, 30 g de azúcar, la levadura y la leche templada en un bol pequeño; dejar reposar un mínimo de 1 hora (hasta 24 horas si se quiere más sabor).","En otro bol, mezclar el zumo de naranja, el zumo de limón, el ron y el agua de azahar. En un bol grande, juntar la masa madre anterior con 450 g de harina, 70 g de azúcar, los líquidos y los huevos; mezclar hasta formar una masa.","Incorporar la mantequilla a temperatura ambiente en tres tandas, integrando bien cada una. Amasar sobre superficie enharinada 8 minutos, hasta que quede lisa y elástica.","Pasar a un bol y dejar fermentar 2 horas a temperatura ambiente, tapado con un paño húmedo. Mientras tanto, preparar la naranja confitada (ver más abajo).","Dividir la masa en dos mitades y bolear cada una. Estirar una en un rectángulo de 70x15 cm; enrollarlo a lo largo, dejando la juntura abajo; unir los extremos formando un aro y colocarlo en una bandeja con papel de horno. Repetir con la otra mitad. Dejar fermentar 1 hora tapados.","Pincelar toda la superficie con huevo batido con un chorrito de leche. Mezclar 3 cucharadas de azúcar con 10 gotas de agua de azahar hasta conseguir una textura de arena húmeda. Decorar con la naranja confitada, la almendra fileteada y el azúcar humedecido.","Hornear a 180° sin grill, 15-20 minutos, hasta que quede dorado. Dejar enfriar del todo.","Montar la nata con el azúcar. Cortar cada roscón por la mitad en horizontal, rellenar con la nata montada (esconder la sorpresa y el haba dentro) y cerrar. Terminar con azúcar glas, un poco más de azúcar humedecido y almendras por encima.","Naranja confitada: cortar la naranja en rodajas de medio centímetro y partir cada una por la mitad. Ponerlas en una sartén fría a fuego medio, espolvorear la mitad del azúcar y tapar 10 minutos. Añadir el resto del azúcar y tapar 10 minutos más. Destapar y cocer 30 minutos, hasta que el caramelo reduzca bastante. Pasar a papel de cocina, espolvorear enseguida con azúcar y dejar enfriar sobre un plato."]},{"categoria":"REPOSTERÍA","titulo":"Tarta de Queso (mamá) (Mar)","raciones":"8 raciones","racionesBase":8,"tiempo":"30 min (+ 2 h de refrigeración)","ingredientes":[{"texto":"Nata líquida: 200 cm (D/A)","cantidad":null,"resto":"Nata líquida: 200 cm (D/A)","escalable":false},{"texto":"Queso de untar: 1 tarrina (D/A)","cantidad":null,"resto":"Queso de untar: 1 tarrina (D/A)","escalable":false},{"texto":"Galletas María: 22 unidades — o Digestive (6) + 6 María","cantidad":null,"resto":"Galletas María: 22 unidades — o Digestive (6) + 6 María","escalable":false},{"texto":"Gelatina Royal neutra: 1 sobre","cantidad":null,"resto":"Gelatina Royal neutra: 1 sobre","escalable":false},{"texto":"3 cucharadas de azúcar","cantidad":3.0,"resto":"cucharadas de azúcar","escalable":true,"modo":"simple"},{"texto":"3 cucharadas de mantequilla","cantidad":3.0,"resto":"cucharadas de mantequilla","escalable":true,"modo":"simple"},{"texto":"Un poco de leche","cantidad":null,"resto":"Un poco de leche","escalable":false}],"elaboracion":["Se machacan las galletas hasta dejarlas como arena gruesa (se puede hacer con el robot o metiéndolas en una bolsa y pasando el rodillo). Se derrite la mantequilla en una cazuela a fuego bajo, sin dejar que hierva, y se mezcla con las galletas machacadas; se añade un poco de leche, removiendo, hasta conseguir una masa espesa pero manejable, como de arena mojada.","En un molde redondo se pone film transparente (para poder sacar luego la tarta con facilidad). Se extiende la masa de galletas presionando bien con el dorso de una cuchara o con las manos, para que quede compacta y cubra bien el fondo. Se deja enfriar en el frigorífico unos 20-30 minutos, hasta que esté firme al tacto.","Se prepara la gelatina como indica el sobre, pero usando menos agua (solo un vaso), disolviéndola bien en caliente y dejando que temple un poco antes de usarla. Se monta la nata líquida con las 3 cucharadas de azúcar hasta que espese (sin llegar a nata montada firme); después se añade el queso y se bate a velocidad media hasta que quede una crema lisa y sin grumos. Por último se incorpora la gelatina templada y se bate solo lo justo para que se integre, sin pasarse, para que no pierda cuerpo.","Se vierte esta crema encima de la base de galletas, se alisa la superficie y se lleva al frigorífico al menos 2 horas, hasta que cuaje del todo. Cuanto más tiempo repose, más rica y asentada queda.","Nota: se puede poner por encima mermelada o trozos de fruta (fresa, piña en almíbar). También se puede usar gelatina de piña. Si se quiere más sabrosa, se echa doble cantidad de nata o de queso."]},{"categoria":"REPOSTERÍA","titulo":"Tarta de Queso (mar) (Philadelphia)","raciones":"8 raciones","racionesBase":8,"tiempo":"20 min (+ 2 h en el congelador)","ingredientes":[{"texto":"500 gr nata líquida","cantidad":500.0,"resto":"gr nata líquida","escalable":true,"modo":"simple"},{"texto":"1 tarrina queso Philadelphia","cantidad":1.0,"resto":"tarrina queso Philadelphia","escalable":true,"modo":"simple"},{"texto":"1 sobre gelatina neutra (yo: neutra)","cantidad":1.0,"resto":"sobre gelatina neutra (yo: neutra)","escalable":true,"modo":"simple"},{"texto":"3 cucharadas de azúcar","cantidad":3.0,"resto":"cucharadas de azúcar","escalable":true,"modo":"simple"},{"texto":"200 g de galletas","cantidad":200.0,"resto":"g de galletas","escalable":true,"modo":"simple"}],"elaboracion":["Se prepara una base de galletas trituradas mezcladas con un poco de caramelo líquido (mantequilla derretida y caramelo tipo \"bolsa roja\"), presionando bien en el molde para que quede compacta. Se mete al frigorífico mientras se prepara el relleno.","Se pone en un cazo a hervir un vaso de agua para disolver la gelatina, siguiendo las indicaciones del sobre. Se monta la nata (bien fría) hasta que espese y se le añade el azúcar. Se bate junto con el queso Philadelphia a velocidad media hasta que quede cremoso, y por último se incorpora la gelatina disuelta y templada, batiendo solo lo justo para integrarla sin que pierda cuerpo.","Se vierte la mezcla sobre la base de galletas, se alisa la superficie y se mete al congelador unas 2 horas, hasta que cuaje bien; se puede pasar después al frigorífico para que no quede excesivamente fría al servir."]},{"categoria":"REPOSTERÍA","titulo":"Tarta de Queso (mar)","raciones":"10 raciones","racionesBase":10,"tiempo":"55 minutos","ingredientes":[{"texto":"500 gr queso crema","cantidad":500.0,"resto":"gr queso crema","escalable":true,"modo":"simple"},{"texto":"50 gr queso azul","cantidad":50.0,"resto":"gr queso azul","escalable":true,"modo":"simple"},{"texto":"180 gr queso mascarpone","cantidad":180.0,"resto":"gr queso mascarpone","escalable":true,"modo":"simple"},{"texto":"100 gr azúcar","cantidad":100.0,"resto":"gr azúcar","escalable":true,"modo":"simple"},{"texto":"6 huevos","cantidad":6.0,"resto":"huevos","escalable":true,"modo":"simple"},{"texto":"1 cucharada de maicena","cantidad":1.0,"resto":"cucharada de maicena","escalable":true,"modo":"simple"},{"texto":"250 gr nata para cocinar","cantidad":250.0,"resto":"gr nata para cocinar","escalable":true,"modo":"simple"},{"texto":"100 gr mantequilla","cantidad":100.0,"resto":"gr mantequilla","escalable":true,"modo":"simple"},{"texto":"5 paquetes de galletas dinosaurus","cantidad":5.0,"resto":"paquetes de galletas dinosaurus","escalable":true,"modo":"simple"}],"elaboracion":["Preparar la base con las galletas trituradas y la mantequilla derretida. Forrar el molde.","Mezclar todos los quesos con el azúcar, los huevos, la maicena y la nata hasta obtener una crema homogénea, con movimientos suaves y sin batir en exceso, para no incorporar aire a la mezcla (si se airea, la tarta sube en el horno y luego se baja y se agrieta al enfriar). Si al verterla sobre la base de galletas quedan burbujitas en la superficie, explotarlas con un soplete antes de meterla al horno.","Verter sobre la base de galletas.","Horno con ventilador a 190° durante 30 minutos. Después pasar al grill al máximo 3–4 minutos hasta que llegue a 200° y quede la parte superior dorada. El punto de cocción se comprueba con un termómetro: el centro de la tarta debe estar entre 56 y 60 °C; en ese punto tiene que quedar con un ligero temblor en el centro (como un flan poco cuajado), que terminará de cuajar al enfriar."]},{"categoria":"REPOSTERÍA","titulo":"Tarta de Queso La Viña (diegodoal)","raciones":"10 raciones","racionesBase":10,"tiempo":"1 h 20 min (+ 2 h de enfriado)","ingredientes":[{"texto":"670 g de queso crema","cantidad":670.0,"resto":"g de queso crema","escalable":true,"modo":"simple"},{"texto":"220 g de mascarpone","cantidad":220.0,"resto":"g de mascarpone","escalable":true,"modo":"simple"},{"texto":"320 g de azúcar","cantidad":320.0,"resto":"g de azúcar","escalable":true,"modo":"simple"},{"texto":"6 huevos","cantidad":6.0,"resto":"huevos","escalable":true,"modo":"simple"},{"texto":"1 yema de huevo","cantidad":1.0,"resto":"yema de huevo","escalable":true,"modo":"simple"},{"texto":"4 g de sal","cantidad":4.0,"resto":"g de sal","escalable":true,"modo":"simple"},{"texto":"450 ml de nata para montar (35% de materia grasa o más)","cantidad":450.0,"resto":"ml de nata para montar (35% de materia grasa o más)","escalable":true,"modo":"simple"},{"texto":"8 g de extracto de vainilla","cantidad":8.0,"resto":"g de extracto de vainilla","escalable":true,"modo":"simple"},{"texto":"9 g de agua de azahar (opcional)","cantidad":9.0,"resto":"g de agua de azahar (opcional)","escalable":true,"modo":"simple"},{"texto":"Papel de horno, para forrar el molde","cantidad":null,"resto":"Papel de horno, para forrar el molde","escalable":false},{"texto":"Papel de horno","cantidad":null,"resto":"Papel de horno","escalable":false}],"elaboracion":["Mezclar el queso crema y el mascarpone en un bol con una espátula. Incorporar el azúcar en cuatro tandas, mezclando bien después de cada una hasta que quede cremoso y sin grumos.","Añadir los huevos y la yema de uno en uno, integrando cada uno por completo antes de añadir el siguiente.","Incorporar la sal, la vainilla, el agua de azahar y la nata. Tamizar la harina sobre la mezcla e integrarla con unas varillas.","Engrasar la base de un molde desmontable de 20-23 cm y forrarlo con una hoja de papel de horno arrugada; añadir una segunda hoja con las esquinas hacia el lado contrario de la primera, para que sobresalga bien por todos lados.","Verter la mezcla en el molde, dejando 1 cm libre hasta el borde. Hornear a 200°, sin grill, durante 1 hora, hasta que la superficie se agriete y quede muy tostada, casi negra (así es como se consigue el característico 'quemado' de esta tarta).","Dejar que se deshinche 15 minutos fuera del horno. Enfriar sobre una rejilla, todavía envuelta en el papel, durante 2 horas. Retirar el papel y servir a temperatura ambiente."]},{"categoria":"REPOSTERÍA","titulo":"Quesada (mar) (Lola)","raciones":"6 personas","racionesBase":6,"tiempo":"25 minutos","ingredientes":[{"texto":"Quesitos: 3 unidades (Lola: 4)","cantidad":null,"resto":"Quesitos: 3 unidades (Lola: 4)","escalable":false},{"texto":"Yogur natural: 1 unidad","cantidad":null,"resto":"Yogur natural: 1 unidad","escalable":false},{"texto":"Azúcar: 2 medidas (*) (Lola: 2)","cantidad":null,"resto":"Azúcar: 2 medidas (*) (Lola: 2)","escalable":false},{"texto":"Harina: 1 medida (*) (Lola: 1)","cantidad":null,"resto":"Harina: 1 medida (*) (Lola: 1)","escalable":false},{"texto":"Nata: 1 medida (*) (Lola: 1)","cantidad":null,"resto":"Nata: 1 medida (*) (Lola: 1)","escalable":false},{"texto":"Huevos: 3 unidades (Lola: 3)","cantidad":null,"resto":"Huevos: 3 unidades (Lola: 3)","escalable":false},{"texto":"Leche: 1 medida (*) (Lola: 2)","cantidad":null,"resto":"Leche: 1 medida (*) (Lola: 2)","escalable":false},{"texto":"(*) medida = vaso de yogur","cantidad":null,"resto":"(*) medida = vaso de yogur","escalable":false}],"elaboracion":["Se mezclan todos los ingredientes en la batidora hasta conseguir una crema fina y homogénea, sin grumos de queso. Se unta un molde con aceite o mantequilla y se vierte la mezcla, repartiéndola bien.","Se introduce en el horno, previamente calentado al máximo (unos 250°C, con calor arriba y abajo), y se hornea durante un cuarto de hora aproximadamente (unos 12-15 minutos), vigilando que la superficie se dore sin quemarse; si se dora demasiado rápido, se puede bajar un poco la temperatura. Se comprueba que está cuajada pinchando con un palillo: debe salir prácticamente limpio, con un ligero temblor en el centro. ¡Y listo!"]},{"categoria":"REPOSTERÍA","titulo":"Tarta de Sobaos (mamá) (Alar)","raciones":"8 personas","racionesBase":8,"tiempo":"15 min (+ 1 h en la nevera)","ingredientes":[{"texto":"6 sobaos pasiegos","cantidad":6.0,"resto":"sobaos pasiegos","escalable":true,"modo":"simple"},{"texto":"300 ml de leche con azúcar","cantidad":300.0,"resto":"ml de leche con azúcar","escalable":true,"modo":"simple"},{"texto":"200 g de mermelada (frambuesa, fresa, etc.)","cantidad":200.0,"resto":"g de mermelada (frambuesa, fresa, etc.)","escalable":true,"modo":"simple"},{"texto":"300 ml de nata","cantidad":300.0,"resto":"ml de nata","escalable":true,"modo":"simple"},{"texto":"Confeti de colores o chocolate y almendra fileteada, al gusto, para adornar","cantidad":null,"resto":"Confeti de colores o chocolate y almendra fileteada, al gusto, para adornar","escalable":false}],"elaboracion":["Se calienta un poco la leche (templada, no caliente) y se moja cada sobao por encima, dejando que se empape un poco, sin que llegue a deshacerse. Se colocan en la fuente donde se vaya a servir la tarta.","Encima de los sobaos se extiende una capa fina de mermelada, con cuidado de que quede repartida por igual. A continuación se cubre con la nata ya montada (bien firme, para que aguante), extendiéndola con una espátula o cuchara. Por último se decora con el confeti de colores y las almendras fileteadas por encima. Se guarda en el frigorífico un mínimo de 1 hora, hasta el momento de servir."]},{"categoria":"REPOSTERÍA","titulo":"Tarta Fría (mar)","raciones":"8 raciones","racionesBase":8,"tiempo":"40 min (+ 3-4 h de reposo en la nevera)","ingredientes":[{"texto":"Galletas: medio kilo","cantidad":null,"resto":"Galletas: medio kilo","escalable":false},{"texto":"Mantequilla: 250 gr","cantidad":null,"resto":"Mantequilla: 250 gr","escalable":false},{"texto":"Azúcar: 500 gr","cantidad":null,"resto":"Azúcar: 500 gr","escalable":false},{"texto":"Huevos: 2","cantidad":null,"resto":"Huevos: 2","escalable":false},{"texto":"Coñac: un vaso pequeño","cantidad":null,"resto":"Coñac: un vaso pequeño","escalable":false},{"texto":"Café: tres cucharadas (hecho)","cantidad":null,"resto":"Café: tres cucharadas (hecho)","escalable":false},{"texto":"Leche: 100 gr","cantidad":null,"resto":"Leche: 100 gr","escalable":false},{"texto":"Almendra: 50 gr","cantidad":null,"resto":"Almendra: 50 gr","escalable":false},{"texto":"Chocolate: 4 pastillas","cantidad":null,"resto":"Chocolate: 4 pastillas","escalable":false}],"elaboracion":["Se muele con el rodillo la mitad del azúcar hasta dejarla como azúcar glas casera. Se echa en una cazuela junto con la mantequilla y se bate bien hasta que quede una crema lisa. Cuando está unido, se añade el chocolate rallado y los huevos batidos, la mitad del coñac, algunas almendras en trozos y una cucharada más de coñac. Se mezcla bien todo y, poco a poco, se va añadiendo el café (ya hecho y templado) sin dejar de batir, hasta que quede una crema homogénea.","Aparte, se pone en una cazuela el resto del coñac, 150 gr de azúcar y un vaso de agua, y se calienta un poco hasta que el azúcar se deshaga bien (sin necesidad de que hierva). En este almíbar se van mojando las galletas, una a una y rápido para que no se empapen demasiado, y se van colocando en el molde.","Se hace una capa de galletas mojadas y otra de crema, así sucesivamente hasta terminar los ingredientes, acabando con una capa de crema. Se mete al frigorífico al menos 3-4 horas (mejor toda la noche) para que asiente antes de desmoldar en un plato de cristal. Se cubre por encima con el resto del coñac, el café y la crema que sobre. Se clavan las almendras tostadas y cortadas en forma de uña por toda la superficie para adornarla, y se guarda en el frigorífico hasta servir."]},{"categoria":"REPOSTERÍA","titulo":"Mousse de Limón (mamá)","raciones":"6 personas","racionesBase":6,"tiempo":"10 min (+ 2 h de frío)","ingredientes":[{"texto":"Zumo de 1 limón","cantidad":null,"resto":"Zumo de 1 limón","escalable":false},{"texto":"1 bote pequeño de leche condensada","cantidad":1.0,"resto":"bote pequeño de leche condensada","escalable":true,"modo":"simple"},{"texto":"3 yogures naturales","cantidad":3.0,"resto":"yogures naturales","escalable":true,"modo":"simple"},{"texto":"1 vaso de leche","cantidad":1.0,"resto":"vaso de leche","escalable":true,"modo":"simple"}],"elaboracion":["Se ponen todos los ingredientes en el vaso de la batidora y se baten juntos a velocidad media-alta hasta conseguir una mezcla fina y homogénea, sin grumos. Se reparte en copas o en un bol y se mete al frigorífico al menos 2 horas, hasta que quede bien fría y con una textura de mousse ligera."]},{"categoria":"REPOSTERÍA","titulo":"Mousse de Limón (mar) (versión extendida)","raciones":"6 personas","racionesBase":6,"tiempo":"15 min (+ 2 h de frío)","ingredientes":[{"texto":"4 yogures naturales","cantidad":4.0,"resto":"yogures naturales","escalable":true,"modo":"simple"},{"texto":"1 nata pequeña","cantidad":1.0,"resto":"nata pequeña","escalable":true,"modo":"simple"},{"texto":"2 limones (zumo y ralladura)","cantidad":2.0,"resto":"limones (zumo y ralladura)","escalable":true,"modo":"simple"},{"texto":"1 bote pequeño leche condensada","cantidad":1.0,"resto":"bote pequeño leche condensada","escalable":true,"modo":"simple"},{"texto":"Un puñado de piñones y canela al gusto","cantidad":null,"resto":"Un puñado de piñones y canela al gusto","escalable":false}],"elaboracion":["Montar la nata bien fría a punto de nieve, con varillas eléctricas a velocidad media-alta, hasta que quede firme y con picos suaves (sin pasarse, para que no se corte).","Aparte, mezclar la leche condensada, el zumo de limón y la ralladura, y los yogures, removiendo bien hasta que quede una crema homogénea. Después unir esta mezcla con la nata montada, con movimientos suaves y envolventes con la varilla, de abajo arriba, para que no pierda el aire.","Repartir en copas o en un molde, adornar con los piñones (y canela si se quiere) y dejar enfriar en el frigorífico al menos un par de horas antes de servir."]},{"categoria":"REPOSTERÍA","titulo":"Mousse de Fresas (mar)","raciones":"6 personas","racionesBase":6,"tiempo":"10 min (+ 2 h de frío)","ingredientes":[{"texto":"1 bote pequeño de leche condensada","cantidad":1.0,"resto":"bote pequeño de leche condensada","escalable":true,"modo":"simple"},{"texto":"1 brick de nata (200 gr)","cantidad":1.0,"resto":"brick de nata (200 gr)","escalable":true,"modo":"simple"},{"texto":"¼ kg de fresas","cantidad":0.25,"resto":"kg de fresas","escalable":true,"modo":"simple"},{"texto":"2 limones (zumo de los 2 y ralladura de 1)","cantidad":2.0,"resto":"limones (zumo de los 2 y ralladura de 1)","escalable":true,"modo":"simple"}],"elaboracion":["Lavar y trocear las fresas. Poner todos los ingredientes juntos en un bol o en el vaso de la batidora y batir a velocidad media-alta hasta conseguir una mezcla fina, cremosa y sin trozos de fresa. Repartir en copas y dejar enfriar al menos 2 horas en el frigorífico, hasta que tome cuerpo de mousse."]},{"categoria":"REPOSTERÍA","titulo":"Mousse de Chocolate (mar) (Arguiñano)","raciones":"4 personas","racionesBase":4,"tiempo":"20 min (+ 2 h de frío)","ingredientes":[{"texto":"175 gr chocolate negro","cantidad":175.0,"resto":"gr chocolate negro","escalable":true,"modo":"simple"},{"texto":"30 gr mantequilla","cantidad":30.0,"resto":"gr mantequilla","escalable":true,"modo":"simple"},{"texto":"4 huevos","cantidad":4.0,"resto":"huevos","escalable":true,"modo":"simple"},{"texto":"80 gr azúcar","cantidad":80.0,"resto":"gr azúcar","escalable":true,"modo":"simple"},{"texto":"1 copita de licor","cantidad":1.0,"resto":"copita de licor","escalable":true,"modo":"simple"}],"elaboracion":["Ponemos el chocolate troceado y un trozo de mantequilla a fundir al baño maría (una cazuela con agua al fuego y otro recipiente encima, sin que toque el agua), a fuego bajo, removiendo de vez en cuando hasta que quede una crema lisa. Retiramos del fuego.","Añadimos el azúcar y las 4 yemas, removiendo bien hasta integrarlas con el chocolate templado. Aparte, montamos las 4 claras a punto de nieve bien firme (unos 5 minutos con varillas eléctricas), y las añadimos a la mezcla con movimientos suaves y envolventes, para que no pierdan aire. Por último incorporamos un chorrito de licor (brandy, ron, licor de cerezas...).","Repartimos en copas o en un recipiente y dejamos enfriar en el frigorífico al menos 2 horas, hasta que la mousse tenga cuerpo."]},{"categoria":"REPOSTERÍA","titulo":"Mousse de Chocolate (mar) (versión clásica)","raciones":"4 personas","racionesBase":4,"tiempo":"20 min (+ reposo toda la noche en el congelador)","ingredientes":[{"texto":"4 huevos","cantidad":4.0,"resto":"huevos","escalable":true,"modo":"simple"},{"texto":"200 gr mantequilla","cantidad":200.0,"resto":"gr mantequilla","escalable":true,"modo":"simple"},{"texto":"200 gr chocolate puro (16 pastillas chocolate Valor)","cantidad":200.0,"resto":"gr chocolate puro (16 pastillas chocolate Valor)","escalable":true,"modo":"simple"}],"elaboracion":["Se deshace el chocolate troceado en unas cucharadas de leche, a fuego bajo (al baño maría o directamente en una cazuela pequeña, removiendo sin parar para que no se pegue). Una vez fundido, se retira del fuego y se añade el coñac y la mantequilla, removiendo hasta que se integren. Después se incorporan las yemas y el azúcar, dando vueltas hasta conseguir una crema lisa y brillante.","Se baten las claras a punto de nieve firme y se añaden a la mezcla con movimientos suaves y envolventes, de abajo arriba, para que la mousse quede esponjosa.","Se unta bien de mantequilla un recipiente y se echa toda la mezcla, alisando la superficie. Se mete en el congelador hasta el día siguiente. Antes de servir se deja atemperar unos minutos y se sirve con nata montada."]},{"categoria":"REPOSTERÍA","titulo":"Leche Frita (mamá)","raciones":"6 personas","racionesBase":6,"tiempo":"25 min + freír (+ reposo toda la noche en la nevera)","ingredientes":[{"texto":"½ litro de leche","cantidad":0.5,"resto":"litro de leche","escalable":true,"modo":"simple"},{"texto":"2 yemas","cantidad":2.0,"resto":"yemas","escalable":true,"modo":"simple"},{"texto":"9 cucharas colmadas de harina","cantidad":9.0,"resto":"cucharas colmadas de harina","escalable":true,"modo":"simple"},{"texto":"5 cucharas colmadas de azúcar","cantidad":5.0,"resto":"cucharas colmadas de azúcar","escalable":true,"modo":"simple"},{"texto":"2 trozos de cáscara de limón","cantidad":2.0,"resto":"trozos de cáscara de limón","escalable":true,"modo":"simple"}],"elaboracion":["Se baten las yemas en un bol y se va incorporando el azúcar sin dejar de batir; después se añade la harina poco a poco (para que no se formen grumos) y por último las cáscaras de limón.","Se pone la leche a hervir en una cazuela a fuego medio. Cuando está a punto de romper a hervir, se echa de golpe toda la masa de yemas, harina y azúcar, y se remueve enérgicamente y sin parar con unas varillas o cuchara de madera, a fuego medio-bajo durante unos 8-10 minutos, hasta que espese y quede una crema muy densa, casi como una masa que se despega de las paredes de la cazuela.","Se vierte esta masa en una fuente o bandeja, se alisa la superficie dejando un grosor de un par de centímetros y se deja enfriar tapada una noche entera en el frigorífico, hasta que esté bien cuajada y firme.","Al día siguiente se corta en cuadrados o rectángulos y se reboza en harina y después en huevo batido (aprovechando la clara de los otros huevos y un huevo más), listos para freír en aceite bien caliente (170-180°C) unos 2-3 minutos, hasta que queden dorados por todos los lados.","Si la masa se queda demasiado dura al batir las yemas, se reserva un poco de leche sin hervir y se va añadiendo poco a poco mientras se bate, hasta ajustar la textura."]},{"categoria":"REPOSTERÍA","titulo":"Orejuelas (mamá) (Ana)","raciones":"unas 40 orejuelas","racionesBase":40,"tiempo":"45 min (+ 1 h de reposo)","ingredientes":[{"texto":"1 docena de huevos","cantidad":1.0,"resto":"docena de huevos","escalable":true,"modo":"simple"},{"texto":"Zumo de 2 naranjas","cantidad":null,"resto":"Zumo de 2 naranjas","escalable":false},{"texto":"½ cáscara de huevo de aguardiente","cantidad":0.5,"resto":"cáscara de huevo de aguardiente","escalable":true,"modo":"simple"},{"texto":"2 cáscaras de azúcar","cantidad":2.0,"resto":"cáscaras de azúcar","escalable":true,"modo":"simple"},{"texto":"Harina (la que admita)","cantidad":null,"resto":"Harina (la que admita)","escalable":false}],"elaboracion":["Se baten los huevos bien batidos y se añade el resto de los ingredientes (el zumo de naranja, el aguardiente y el azúcar) sin dejar de batir. Después se va añadiendo la harina poco a poco, sin dejar de batir, hasta que la masa espese y se pueda empezar a trabajar con las manos.","Se amasa sobre la mesa enharinada hasta que quede una masa lisa y elástica, y se deja reposar tapada con un paño una hora, para que sea más fácil de estirar.","Pasado el reposo, se extiende con el rodillo en porciones, dejándola muy fina, y se corta en tiras u orejuelas, listas para freír en abundante aceite caliente (170-180°C) 1-2 minutos por cada lado, hasta que queden doradas."]},{"categoria":"REPOSTERÍA","titulo":"Orejuelas (mar) (Dati)","raciones":"unas 40 orejuelas","racionesBase":40,"tiempo":"45 min (+ 2 h de reposo)","ingredientes":[{"texto":"12 huevos","cantidad":12.0,"resto":"huevos","escalable":true,"modo":"simple"},{"texto":"Zumo de 2 naranjas","cantidad":null,"resto":"Zumo de 2 naranjas","escalable":false},{"texto":"½ cáscara de huevo de vinagre","cantidad":0.5,"resto":"cáscara de huevo de vinagre","escalable":true,"modo":"simple"},{"texto":"2 cucharadas de azúcar","cantidad":2.0,"resto":"cucharadas de azúcar","escalable":true,"modo":"simple"},{"texto":"Harina (hasta que se pueda amasar)","cantidad":null,"resto":"Harina (hasta que se pueda amasar)","escalable":false}],"elaboracion":["Batir bien los huevos junto con el zumo de naranja, el vinagre y el azúcar, hasta que quede todo integrado. Ir añadiendo la harina poco a poco, sin dejar de batir, hasta que la masa espese lo suficiente como para poder amasarla con las manos.","Amasar hasta conseguir una masa lisa, y dejarla reposar 2 horas en un lugar templado, tapada con un paño blanco húmedo para que no se reseque la superficie.","Pasado el reposo, se extiende fina con el rodillo, se corta en tiras u orejuelas y se fríen en abundante aceite caliente (170-180°C) 1-2 minutos por cada lado, hasta que queden doradas."]},{"categoria":"REPOSTERÍA","titulo":"Rosquillas Fritas (mamá) (Camino)","raciones":"unas 30 rosquillas","racionesBase":30,"tiempo":"35 min (+ 30 min de reposo)","ingredientes":[{"texto":"3 huevos","cantidad":3.0,"resto":"huevos","escalable":true,"modo":"simple"},{"texto":"2 vasos de azúcar","cantidad":2.0,"resto":"vasos de azúcar","escalable":true,"modo":"simple"},{"texto":"1 vaso de aceite de girasol","cantidad":1.0,"resto":"vaso de aceite de girasol","escalable":true,"modo":"simple"},{"texto":"1 vaso de anís","cantidad":1.0,"resto":"vaso de anís","escalable":true,"modo":"simple"},{"texto":"1 sobre y medio de Royal","cantidad":1.0,"resto":"sobre y medio de Royal","escalable":true,"modo":"simple"},{"texto":"800 gr de harina (aprox.)","cantidad":800.0,"resto":"gr de harina (aprox.)","escalable":true,"modo":"simple"}],"elaboracion":["Se baten los huevos con el azúcar hasta que blanqueen un poco (se puede hacer con batidora o varillas). Se añade el aceite de girasol y el anís, y se sigue batiendo hasta que quede todo bien integrado.","Se incorpora la harina mezclada con el Royal, poco a poco, y se va amasando hasta conseguir una masa que no se pegue a las manos (se puede seguir batiendo con la batidora al principio y terminar amasando a mano).","Se deja reposar la masa tapada al menos ½ hora. Después se toman porciones, se les da forma de rosquilla y se fríen en abundante aceite de girasol a fuego medio, unos 3-4 minutos en total, dándoles la vuelta a mitad de cocción, hasta que queden doradas por igual."]},{"categoria":"REPOSTERÍA","titulo":"Rosquillas Fritas (mar) (Madre Crucí)","raciones":"unas 35 rosquillas","racionesBase":35,"tiempo":"45 minutos","ingredientes":[{"texto":"3 huevos","cantidad":3.0,"resto":"huevos","escalable":true,"modo":"simple"},{"texto":"250 gr azúcar","cantidad":250.0,"resto":"gr azúcar","escalable":true,"modo":"simple"},{"texto":"1 huevo y ½ de aceite (medida cáscara de huevo)","cantidad":1.0,"resto":"huevo y ½ de aceite (medida cáscara de huevo)","escalable":true,"modo":"simple"},{"texto":"1 huevo y ½ de aguardiente","cantidad":1.0,"resto":"huevo y ½ de aguardiente","escalable":true,"modo":"simple"},{"texto":"0,9 kg de harina","cantidad":0.9,"resto":"kg de harina","escalable":true,"modo":"simple"},{"texto":"1 papeleta de levadura Royal","cantidad":1.0,"resto":"papeleta de levadura Royal","escalable":true,"modo":"simple"}],"elaboracion":["Se baten los huevos y se añade el azúcar, batiendo hasta que se integre. Se añade el aceite y el aguardiente y se bate un poco más. Se va añadiendo la harina poco a poco, sin dejar de batir, hasta que la masa espese.","En un vaso se echa la levadura con un poco de agua templada, se disuelve bien y se añade a la masa. Después se amasa del mismo modo que las orejuelas, hasta que quede lisa y no se pegue a las manos.","Se les da forma: se hacen rectángulos con porciones de masa, se marca en el centro una raja a lo largo y después se les da forma redonda apretando los extremos para cerrar el anillo.","Se fríen a fuego medio en abundante aceite, tanto que quede cubierta la rosquilla, unos 3-4 minutos en total, dándoles la vuelta con cuidado, hasta que se doren por igual por ambos lados. Se sacan y se dejan escurrir sobre papel absorbente."]},{"categoria":"REPOSTERÍA","titulo":"Rosquillos (mamá) (Madre Crucí)","raciones":"unos 35 rosquillos","racionesBase":35,"tiempo":"40 minutos","ingredientes":[{"texto":"3 huevos","cantidad":3.0,"resto":"huevos","escalable":true,"modo":"simple"},{"texto":"250 gr azúcar","cantidad":250.0,"resto":"gr azúcar","escalable":true,"modo":"simple"},{"texto":"½ medida de aceite (medida = huevo)","cantidad":0.5,"resto":"medida de aceite (medida = huevo)","escalable":true,"modo":"simple"},{"texto":"½ medida de aguardiente","cantidad":0.5,"resto":"medida de aguardiente","escalable":true,"modo":"simple"},{"texto":"900 gr de harina","cantidad":900.0,"resto":"gr de harina","escalable":true,"modo":"simple"},{"texto":"1 papeleta de levadura Royal","cantidad":1.0,"resto":"papeleta de levadura Royal","escalable":true,"modo":"simple"}],"elaboracion":["Se baten bien los huevos y se les añade el azúcar, batiendo hasta que se integre. Se añade el aceite y después el aguardiente, y se bate un momento más hasta que ligue todo.","Se va añadiendo la harina poco a poco, sin dejar de batir, hasta que la masa empiece a espesar y cueste ya seguir batiendo con varillas.","En un vaso aparte se disuelve la levadura con un poco de agua templada. Se añade a la masa y se amasa a mano hasta que quede lisa y homogénea, dejándola reposar unos minutos si se nota muy pegajosa.","Para darles forma, se hacen rectángulos con porciones de masa, se les marca un corte en el centro a lo largo, y después se les da forma redonda pasando los extremos por ese corte y apretándolos bien para que no se abran."]},{"categoria":"REPOSTERÍA","titulo":"Torrija Gourmet de Brioche (diegodoal)","raciones":"6 personas","racionesBase":6,"tiempo":"30 min (+ 2 h de remojo)","ingredientes":[{"texto":"media hogaza de brioche","cantidad":null,"resto":"media hogaza de brioche","escalable":false},{"texto":"300 ml de leche entera","cantidad":300.0,"resto":"ml de leche entera","escalable":true,"modo":"simple"},{"texto":"300 ml de nata para montar","cantidad":300.0,"resto":"ml de nata para montar","escalable":true,"modo":"simple"},{"texto":"5 cm de piel de naranja","cantidad":5.0,"resto":"cm de piel de naranja","escalable":true,"modo":"simple"},{"texto":"5 cm de piel de limón","cantidad":5.0,"resto":"cm de piel de limón","escalable":true,"modo":"simple"},{"texto":"Media rama de canela (mejor de Ceilán)","cantidad":null,"resto":"Media rama de canela (mejor de Ceilán)","escalable":false},{"texto":"1 vaina de vainilla","cantidad":1.0,"resto":"vaina de vainilla","escalable":true,"modo":"simple"},{"texto":"150 g de azúcar","cantidad":150.0,"resto":"g de azúcar","escalable":true,"modo":"simple"},{"texto":"2 huevos grandes","cantidad":2.0,"resto":"huevos grandes","escalable":true,"modo":"simple"},{"texto":"Azúcar, al gusto, para caramelizar","cantidad":null,"resto":"Azúcar, al gusto, para caramelizar","escalable":false},{"texto":"Helado de vainilla y dulce de leche, al gusto, para servir","cantidad":null,"resto":"Helado de vainilla y dulce de leche, al gusto, para servir","escalable":false},{"texto":"Helado de vainilla y dulce de leche, para servir","cantidad":null,"resto":"Helado de vainilla y dulce de leche, para servir","escalable":false}],"elaboracion":["poner en un cazo la leche, la nata, las pieles de naranja y limón, la canela y la vaina de vainilla abierta y raspada (añadir también la vaina). Añadir el azúcar y calentar hasta los 75°. Retirar del fuego, tapar e infusionar 15 minutos.","Cortar el brioche en cuatro trozos largos y retirar la corteza. Triturar la corteza hasta hacer migas; tostar la mitad en mantequilla hasta que dore, y escurrir.","Batir los huevos enteros con las yemas. Colar la mezcla de leche ya templada sobre los huevos, batiendo sin parar. Sumergir los trozos de brioche en este líquido un mínimo de 2 horas, o toda la noche.","Marcar las torrijas en una sartén y terminar de hacerlas en el horno a 180° durante 5 minutos. Dejar templar un poco, espolvorear con azúcar y caramelizar con un soplete de cocina. Emplatar con el dulce de leche, las migas de brioche tostadas y una bola de helado de vainilla."]},{"categoria":"REPOSTERÍA","titulo":"Torrija de Croissant con Frambuesas (diegodoal)","raciones":"4 personas","racionesBase":4,"tiempo":"1 hora (+ 2 h de refrigeración)","ingredientes":[{"texto":"4 croissants","cantidad":4.0,"resto":"croissants","escalable":true,"modo":"simple"},{"texto":"3 huevos grandes","cantidad":3.0,"resto":"huevos grandes","escalable":true,"modo":"simple"},{"texto":"3 g de sal","cantidad":3.0,"resto":"g de sal","escalable":true,"modo":"simple"},{"texto":"3 g de canela","cantidad":3.0,"resto":"g de canela","escalable":true,"modo":"simple"},{"texto":"35 g de azúcar","cantidad":35.0,"resto":"g de azúcar","escalable":true,"modo":"simple"},{"texto":"10 g de extracto de vainilla","cantidad":10.0,"resto":"g de extracto de vainilla","escalable":true,"modo":"simple"},{"texto":"240 ml de leche entera","cantidad":240.0,"resto":"ml de leche entera","escalable":true,"modo":"simple"},{"texto":"55 g de mantequilla","cantidad":55.0,"resto":"g de mantequilla","escalable":true,"modo":"simple"},{"texto":"115 g de azúcar moreno","cantidad":115.0,"resto":"g de azúcar moreno","escalable":true,"modo":"simple"},{"texto":"Azúcar glas, nata montada, frambuesas y menta fresca, al gusto, para servir","cantidad":null,"resto":"Azúcar glas, nata montada, frambuesas y menta fresca, al gusto, para servir","escalable":false}],"elaboracion":["batir los huevos con la sal, la canela, el azúcar y la vainilla. Añadir la leche y mezclar bien. Partir los croissants por la mitad.","Calentar la mantequilla con el azúcar moreno hasta que se emulsionen. Untar el fondo de una bandeja de horno con esta mezcla. Colocar las mitades de croissant encima y verter por encima la mezcla de huevo y leche. Refrigerar tapado un mínimo de 2 horas.","Hornear tapado a 175° durante 30 minutos, y después destapado 10 minutos más. Dejar templar 10 minutos y servir con azúcar glas, nata montada, frambuesas descongeladas y unas hojas de menta."]},{"categoria":"REPOSTERÍA","titulo":"Flan (mamá)","raciones":"4 personas","racionesBase":4,"tiempo":"35 minutos","ingredientes":[{"texto":"½ litro de leche","cantidad":0.5,"resto":"litro de leche","escalable":true,"modo":"simple"},{"texto":"3 yemas de huevo y 1 huevo entero","cantidad":3.0,"resto":"yemas de huevo y 1 huevo entero","escalable":true,"modo":"simple"},{"texto":"1 cucharada de azúcar por huevo","cantidad":1.0,"resto":"cucharada de azúcar por huevo","escalable":true,"modo":"simple"}],"elaboracion":["Se coge el molde y se pone directamente al fuego (bajo-medio) con el azúcar, dejando que se derrita poco a poco durante unos 5-8 minutos hasta hacer un caramelo dorado, y se reparte girando el molde para cubrir todo el fondo y algo de las paredes.","Se bate todo el resto de los ingredientes, se echa en el molde caramelizado y se mete en la olla exprés (a fuego medio, con poca agua, unos 20-25 minutos desde que sube la presión) o al baño María en el horno, hasta que al pinchar con un palillo en el centro salga limpio. Si se hace en el horno, se pone el molde dentro de una bandeja con agua caliente, y cuando el agua está a punto de romper a hervir (sin dejar que llegue a hervir con fuerza) se baja el fuego del horno a temperatura media-baja (unos 160-170°C), durante 45-50 minutos, para que el flan cuaje despacio y no queden burbujas."]},{"categoria":"REPOSTERÍA","titulo":"Flan (mar) (Asun)","raciones":"8 personas","racionesBase":8,"tiempo":"1 hora","ingredientes":[{"texto":"5 huevos enteros (para la mitad: 2½ h)","cantidad":5.0,"resto":"huevos enteros (para la mitad: 2½ h)","escalable":true,"modo":"simple"},{"texto":"2 yemas (para la mitad: 1 yema)","cantidad":2.0,"resto":"yemas (para la mitad: 1 yema)","escalable":true,"modo":"simple"},{"texto":"200 gr azúcar (para la mitad: 100 gr)","cantidad":200.0,"resto":"gr azúcar (para la mitad: 100 gr)","escalable":true,"modo":"simple"},{"texto":"1 litro leche (para la mitad: ½ litro)","cantidad":1.0,"resto":"litro leche (para la mitad: ½ litro)","escalable":true,"modo":"simple"}],"elaboracion":["Batir todos los ingredientes (huevos, yemas, azúcar y leche) hasta que queden bien integrados, sin necesidad de que monte espuma. Verter sobre los moldes ya caramelizados.","Colocar los moldes dentro de una bandeja con agua caliente (baño maría) que cubra aproximadamente hasta la mitad de su altura, y meter al horno precalentado a temperatura media (unos 170-180°C). Cuidar de que el agua del baño maría no llegue a hervir en ningún momento, porque haría que el flan quedara con agujeros; si empieza a burbujear, bajar un poco el horno. Hornear hasta que el flan esté cuajado pero tiemble ligeramente en el centro al moverlo (aproximadamente 45-50 minutos para los moldes grandes, algo menos para moldes individuales). Dejar enfriar y desmoldar frío."]},{"categoria":"REPOSTERÍA","titulo":"Pudín de Queso (mar) (Cortés)","raciones":"8 personas","racionesBase":8,"tiempo":"1 h 10 min","ingredientes":[{"texto":"Para 8 personas: 4 quesitos, 200 gr queso nata, 2 sobaos grandes, 4 huevos, 1 litro leche, ½ litro nata, 25 gr mantequilla, 150 gr azúcar","cantidad":null,"resto":"Para 8 personas: 4 quesitos, 200 gr queso nata, 2 sobaos grandes, 4 huevos, 1 litro leche, ½ litro nata, 25 gr mantequilla, 150 gr azúcar","escalable":false},{"texto":"Para 6 personas (Cortés): 2 quesitos, 100 gr queso nata, 1 sobao grande, 2 huevos, ½ litro leche, 250 gr nata, 125 gr mantequilla, 75 gr azúcar","cantidad":null,"resto":"Para 6 personas (Cortés): 2 quesitos, 100 gr queso nata, 1 sobao grande, 2 huevos, ½ litro leche, 250 gr nata, 125 gr mantequilla, 75 gr azúcar","escalable":false}],"elaboracion":["Se pone a hervir la leche junto con la nata y la mantequilla en una cazuela a fuego medio, removiendo de vez en cuando para que la mantequilla se derrita bien y no se pegue.","Mientras tanto, en un recipiente aparte se echan los quesitos, el queso de nata, los sobaos troceados, los huevos y el azúcar. En cuanto la leche rompa a hervir, se retira del fuego y se vierte sobre esta mezcla. Se pasa todo por el turmix o la batidora hasta que quede una crema fina, sin grumos y con los sobaos completamente deshechos.","Se prepara un molde con caramelo cubriendo bien el fondo, se vierte la mezcla y se hornea al baño maría (el molde dentro de una bandeja con agua caliente hasta la mitad de su altura) en horno precalentado a temperatura media (unos 170-180°C), hasta que cuaje y al pincharlo con un palillo salga limpio; conviene ir comprobando pasados 45-50 minutos. Dejar enfriar antes de desmoldar."]},{"categoria":"REPOSTERÍA","titulo":"Membrillo (mar) (Fabi)","raciones":"unos 5 kg de membrillo dulce","racionesBase":5,"tiempo":"1 h 15 min (+ reposo toda la noche)","ingredientes":[{"texto":"3,3 kg membrillo ya troceado","cantidad":3.3,"resto":"kg membrillo ya troceado","escalable":true,"modo":"simple"},{"texto":"2 kg de azúcar","cantidad":2.0,"resto":"kg de azúcar","escalable":true,"modo":"simple"},{"texto":"Zumo de 1 limón","cantidad":null,"resto":"Zumo de 1 limón","escalable":false}],"elaboracion":["La víspera por la noche, limpiar la pelusilla de la piel del membrillo. Se quita el corazón duro con las pepitas y, sin pelar, se parte en trozos.","Se pone todo en una cazuela junto con el azúcar y el zumo de limón, y se deja reposar toda la noche para que suelte jugo. Al día siguiente se pone al fuego medio, removiendo de vez en cuando para que no se pegue al fondo, durante aproximadamente una hora, hasta que el membrillo esté bien cocido y tierno (si al pincharlo todavía está duro, se deja un poco más de tiempo).","Se aparta del fuego y se pasa la batidora hasta que no quede ningún trozo, con una textura fina y homogénea. Se echa caliente en los moldes y se deja enfriar y cuajar."]},{"categoria":"REPOSTERÍA","titulo":"Dulce de Membrillo (mar) (Asun)","raciones":"unos 8-9 kg de dulce de membrillo","racionesBase":8,"tiempo":"1 h 30 min","ingredientes":[{"texto":"4-5 kg de membrillo crudo","cantidad":4.0,"cantidad2":5.0,"resto":"kg de membrillo crudo","escalable":true,"modo":"rango"},{"texto":"Igual cantidad de azúcar que de membrillo cocido (o ½ / ¾ de azúcar)","cantidad":null,"resto":"Igual cantidad de azúcar que de membrillo cocido (o ½ / ¾ de azúcar)","escalable":false},{"texto":"Zumo de 1 limón","cantidad":null,"resto":"Zumo de 1 limón","escalable":false}],"elaboracion":["Lavar los membrillos y quitarles el corazón; dejarlos con piel y partirlos en trozos. Poner a cocer en una cazuela con poca agua, a fuego medio, unos 20-25 minutos, hasta que hiervan un poco y queden blandos al pincharlos.","Escurrir bien, pesar la pulpa cocida y pasarla por la batidora hasta que quede un puré fino, sin grumos.","Poner este puré a cocer de nuevo junto con azúcar (misma cantidad que el peso del membrillo cocido, o bien ½ o ¾ partes de azúcar, al gusto). Aparte, se pone a cocer parte de ese azúcar a fuego bajo hasta que tome un color tostado (caramelo), para dar color al dulce, y se incorpora a la mezcla. Añadir el zumo de un limón.","Cocer todo a fuego lento, removiendo con frecuencia para que no se pegue al fondo, durante el tiempo que haga falta (aproximadamente 45-60 minutos) hasta que espese bien. El punto está en su sitio cuando, al echar una cucharada de membrillo en un vaso de agua fría, la porción se va al fondo y no se deshace."]},{"categoria":"REPOSTERÍA","titulo":"Brownies (Analía) — 16 unidades (mar)","raciones":"16 unidades","racionesBase":16,"tiempo":"45 minutos","ingredientes":[{"texto":"100 gr chocolate con 65% de cacao (negro especial postre)","cantidad":100.0,"resto":"gr chocolate con 65% de cacao (negro especial postre)","escalable":true,"modo":"simple"},{"texto":"2 huevos","cantidad":2.0,"resto":"huevos","escalable":true,"modo":"simple"},{"texto":"150 gr azúcar","cantidad":150.0,"resto":"gr azúcar","escalable":true,"modo":"simple"},{"texto":"100 gr harina","cantidad":100.0,"resto":"gr harina","escalable":true,"modo":"simple"},{"texto":"125 gr mantequilla + 25 gr para untar molde","cantidad":125.0,"resto":"gr mantequilla + 25 gr para untar molde","escalable":true,"modo":"simple"},{"texto":"100 gr nueces peladas","cantidad":100.0,"resto":"gr nueces peladas","escalable":true,"modo":"simple"},{"texto":"Una pizca de sal","cantidad":null,"resto":"Una pizca de sal","escalable":false},{"texto":"Molde de 25×25 cm","cantidad":null,"resto":"Molde de 25×25 cm","escalable":false}],"elaboracion":["En un recipiente, poner al baño maría el chocolate troceado junto con 125 gr de mantequilla, a fuego bajo, removiendo a menudo para que se funda de manera uniforme y no se agarre. Cuando la mezcla esté bien fundida y lisa, retirar del fuego y dejar templar un poco.","En un bol aparte, poner la harina, el azúcar y los huevos, con una pizca de sal, y mezclar con el batidor hasta que quede bien integrado. Añadir las nueces troceadas y el chocolate fundido templado, mezclando con movimientos envolventes para que no baje mucho la masa.","Untar el molde con mantequilla y verter el contenido del bol, repartiéndolo bien hasta los bordes. Meter al horno precalentado a 180°C, calor arriba y abajo. A los 20 minutos comprobar la cocción: la parte superior no debe brillar ni estar dura; al introducir la hoja de un cuchillo en el centro debe salir húmeda, no líquida (el brownie sigue cuajando al enfriar). Sacar del horno y dejar enfriar en el molde antes de cortar en porciones."]},{"categoria":"REPOSTERÍA","titulo":"Tarta de Manzana (mar) (Asun)","raciones":"8 raciones","racionesBase":8,"tiempo":"50 minutos","ingredientes":[{"texto":"4 manzanas reineta o golden (3 para la masa, 1 para adornar)","cantidad":4.0,"resto":"manzanas reineta o golden (3 para la masa, 1 para adornar)","escalable":true,"modo":"simple"},{"texto":"½ sobre levadura (2 cucharadas pequeñas)","cantidad":0.5,"resto":"sobre levadura (2 cucharadas pequeñas)","escalable":true,"modo":"simple"},{"texto":"2 huevos","cantidad":2.0,"resto":"huevos","escalable":true,"modo":"simple"},{"texto":"4 cucharadas de harina","cantidad":4.0,"resto":"cucharadas de harina","escalable":true,"modo":"simple"},{"texto":"6 cucharadas de azúcar","cantidad":6.0,"resto":"cucharadas de azúcar","escalable":true,"modo":"simple"},{"texto":"1 vaso de leche","cantidad":1.0,"resto":"vaso de leche","escalable":true,"modo":"simple"},{"texto":"50 g de margarina (o aceite)","cantidad":50.0,"resto":"g de margarina (o aceite)","escalable":true,"modo":"simple"},{"texto":"2 cucharadas de mermelada (para glasear)","cantidad":2.0,"resto":"cucharadas de mermelada (para glasear)","escalable":true,"modo":"simple"}],"elaboracion":["Trocear 3 manzanas muy menuditas, con la batidora o a cuchillo. La cuarta manzana se reserva para adornar, cortándola en rodajas muy finas.","En un recipiente, batir las manzanas troceadas junto con la levadura, los huevos, las 4 cucharadas de harina, las 6 de azúcar, el vaso de leche y la margarina derretida (templada, no caliente), hasta conseguir una masa homogénea sin grumos.","Verter la pasta en un molde untado de mantequilla. Colocar por encima, en forma de abanico, las rodajas de manzana reservadas. Hornear en horno precalentado a 180°C, calor arriba y abajo, durante unos 30 minutos, hasta que la superficie esté dorada y al pinchar con un palillo salga limpio. Al sacarlo del horno, pincelar con mermelada por encima (se puede calentar un poco para que se extienda mejor) y dejar enfriar antes de desmoldar."]},{"categoria":"REPOSTERÍA ITALIANA Y FRANCESA","titulo":"Palmeritas de Hojaldre Casero (diegodoal)","raciones":"unas 20 palmeritas","racionesBase":20,"tiempo":"1 h 15 min activos (+ reposos en frío: unas 7-8 h en total)","ingredientes":[{"texto":"Para el bloque de mantequilla (beurrage): 400 g de mantequilla sin sal, a temperatura ambiente","cantidad":null,"resto":"Para el bloque de mantequilla (beurrage): 400 g de mantequilla sin sal, a temperatura ambiente","escalable":false},{"texto":"175 g de harina de fuerza","cantidad":175.0,"resto":"g de harina de fuerza","escalable":true,"modo":"simple"},{"texto":"Para la masa: 350 g de harina de fuerza","cantidad":null,"resto":"Para la masa: 350 g de harina de fuerza","escalable":false},{"texto":"15 g de sal","cantidad":15.0,"resto":"g de sal","escalable":true,"modo":"simple"},{"texto":"150 ml de agua","cantidad":150.0,"resto":"ml de agua","escalable":true,"modo":"simple"},{"texto":"10 ml de vinagre blanco","cantidad":10.0,"resto":"ml de vinagre blanco","escalable":true,"modo":"simple"},{"texto":"115 g de mantequilla sin sal, fundida (no caliente)","cantidad":115.0,"resto":"g de mantequilla sin sal, fundida (no caliente)","escalable":true,"modo":"simple"},{"texto":"200 g de azúcar, para el laminado","cantidad":200.0,"resto":"g de azúcar, para el laminado","escalable":true,"modo":"simple"}],"elaboracion":["Este hojaldre casero necesita bastantes horas de reposo entre plegado y plegado, así que conviene organizarse con tiempo (tiempo total, unas 9 horas, aunque el trabajo activo son solo unos 75 minutos).","Para el beurrage: mezclar la mantequilla en pomada con la harina con unas varillas eléctricas hasta que quede totalmente homogénea. Extenderla sobre papel de horno hasta formar un cuadrado de 23x23 cm de grosor uniforme y refrigerar un mínimo de 2 horas.","Para la masa: mezclar la harina con la sal. Hacer un hueco, añadir el agua, el vinagre y la mantequilla fundida, e ir incorporando poco a poco. Amasar a mano 6-7 minutos hasta que quede elástica. Estirarla también en un cuadrado de 23x23 cm sobre papel de horno, envolver en film y refrigerar otras 2 horas.","Sobre una superficie enharinada, estirar el beurrage hasta 23 cm de ancho por 30 cm de largo y refrigerar. Estirar la masa a las mismas medidas. Colocar la masa sobre la mantequilla y estirar ambas juntas hasta unos 55 cm de largo.","Hacer un pliegue sencillo (como una carta, en tres), presionar ligeramente, envolver en film y refrigerar 1 hora. Repetir el proceso de estirar a 55 cm, plegar, envolver y refrigerar 1 hora, dos veces más (en total, tres pliegues sencillos).","Para el último estirado, sustituir la harina por azúcar: espolvorear azúcar sobre la superficie y la masa mientras se estira hasta los 55 cm, usando el azúcar en vez de harina para que no se pegue. Hacer un último pliegue sencillo, envolver y refrigerar 1 hora.","Estirar de nuevo con azúcar hasta unos 65 cm de largo y recortar los extremos con un cuchillo afilado. Doblar cada extremo hacia el centro (doble pliegue) y después doblar la masa por la mitad para dar la forma característica de la palmerita. Envolver en film y dejar reposar 1 hora.","Recortar los extremos y cortar la masa en rodajas de algo más de 1 cm de grosor. Colocarlas en una bandeja con papel de horno, dejando que se abran ligeramente (van a crecer al hornear); espolvorear un poco más de azúcar si se quiere que caramelicen más.","Hornear a 180° durante 20 minutos. Sacar, dar la vuelta a cada palmerita y hornear 10 minutos más, hasta que estén bien caramelizadas por ambos lados. Dejar enfriar del todo antes de servir."]},{"categoria":"REPOSTERÍA ITALIANA Y FRANCESA","titulo":"Paris-Brest (diegodoal)","raciones":"8 raciones","racionesBase":8,"tiempo":"2 h 15 min","ingredientes":[{"texto":"Para la crema pastelera: 360 ml de leche entera","cantidad":null,"resto":"Para la crema pastelera: 360 ml de leche entera","escalable":false},{"texto":"1 vaina de vainilla","cantidad":1.0,"resto":"vaina de vainilla","escalable":true,"modo":"simple"},{"texto":"5 yemas de huevo grandes","cantidad":5.0,"resto":"yemas de huevo grandes","escalable":true,"modo":"simple"},{"texto":"50 g de azúcar","cantidad":50.0,"resto":"g de azúcar","escalable":true,"modo":"simple"},{"texto":"30 g de maicena","cantidad":30.0,"resto":"g de maicena","escalable":true,"modo":"simple"},{"texto":"85 g de mantequilla fría","cantidad":85.0,"resto":"g de mantequilla fría","escalable":true,"modo":"simple"},{"texto":"Para el praliné de avellanas: 160 g de avellanas tostadas","cantidad":null,"resto":"Para el praliné de avellanas: 160 g de avellanas tostadas","escalable":false},{"texto":"220 g de azúcar","cantidad":220.0,"resto":"g de azúcar","escalable":true,"modo":"simple"},{"texto":"65 ml de agua","cantidad":65.0,"resto":"ml de agua","escalable":true,"modo":"simple"},{"texto":"Para la mousseline de avellanas: 180 g de mantequilla en pomada","cantidad":null,"resto":"Para la mousseline de avellanas: 180 g de mantequilla en pomada","escalable":false},{"texto":"2/3 del praliné de avellanas","cantidad":null,"resto":"2/3 del praliné de avellanas","escalable":false},{"texto":"La crema pastelera (de arriba)","cantidad":null,"resto":"La crema pastelera (de arriba)","escalable":false},{"texto":"Para la pasta choux: 90 ml de leche entera","cantidad":null,"resto":"Para la pasta choux: 90 ml de leche entera","escalable":false},{"texto":"90 ml de agua","cantidad":90.0,"resto":"ml de agua","escalable":true,"modo":"simple"},{"texto":"90 g de mantequilla","cantidad":90.0,"resto":"g de mantequilla","escalable":true,"modo":"simple"},{"texto":"90 g de harina de trigo","cantidad":90.0,"resto":"g de harina de trigo","escalable":true,"modo":"simple"},{"texto":"3 huevos","cantidad":3.0,"resto":"huevos","escalable":true,"modo":"simple"},{"texto":"1 huevo batido, para pincelar","cantidad":1.0,"resto":"huevo batido, para pincelar","escalable":true,"modo":"simple"},{"texto":"20 g de avellanas troceadas, para decorar","cantidad":20.0,"resto":"g de avellanas troceadas, para decorar","escalable":true,"modo":"simple"},{"texto":"Azúcar glas, al gusto, para terminar","cantidad":null,"resto":"Azúcar glas, al gusto, para terminar","escalable":false}],"elaboracion":["Crema pastelera: calentar la leche con la vaina de vainilla abierta hasta los 70°, e infusionar 5 minutos. Batir las yemas con el azúcar y la maicena hasta que blanqueen (unos 2 minutos). Añadir la leche caliente poco a poco sin dejar de batir, devolver todo al cazo y cocer 3-4 minutos a fuego medio removiendo sin parar, hasta que espese. Retirar del fuego, añadir la mantequilla fría en dados y remover hasta integrar. Dejar enfriar del todo.","Praliné: poner el azúcar y el agua en un cazo a fuego medio-alto, remover hasta que se disuelva y dejar caramelizar sin remover más hasta que tome un tono ámbar oscuro. Añadir las avellanas, mezclar bien y volcar sobre una bandeja con papel de horno. Dejar enfriar del todo, romper en trozos y triturar en la procesadora unos 8 minutos, hasta conseguir una pasta cremosa y sin grumos.","Mousseline: batir la mantequilla en pomada 2 minutos hasta que quede cremosa. Añadir el praliné y emulsionar con unas varillas. Incorporar la crema pastelera de dos en dos cucharadas, integrando bien cada una antes de añadir la siguiente. Batir 1 minuto más.","Pasta choux: calentar la leche, el agua y la mantequilla a fuego medio hasta que humee y la mantequilla se funda. Añadir la harina de golpe, mezclar bien y cocinar 3 minutos hasta que la masa quede brillante y se despegue de las paredes. Dejar templar 3 minutos e ir añadiendo los huevos de uno en uno, integrando cada uno por completo antes del siguiente.","Pasar la masa a una manga sin boquilla. Dibujar un círculo de 23 cm en un papel de horno, darle la vuelta sobre la bandeja y usar un poco de masa para pegar las esquinas. Escudillar tres círculos concéntricos de choux siguiendo esa guía (uno por fuera, uno por dentro y uno encima, a caballo entre los dos). Marcar surcos con un tenedor sobre toda la superficie, pincelar con huevo batido y repartir las avellanas troceadas por encima.","Hornear a 225° y bajar inmediatamente a 180°, durante unos 30-35 minutos en total. Cuando esté hecho, entreabrir la puerta del horno 5 cm y dejarlo dentro 15 minutos más para que se seque bien por dentro.","Una vez frío, cortar el aro por la mitad con un cuchillo de sierra. Escudillar la mousseline generosamente sobre toda la mitad inferior. Espolvorear azúcar glas sobre la mitad superior y colocarla encima del relleno."]},{"categoria":"REPOSTERÍA ITALIANA Y FRANCESA","titulo":"Tiramisú Auténtico con Bizcochos Caseros (diegodoal)","raciones":"8 personas","racionesBase":8,"tiempo":"45 min (+ 6 h de refrigeración)","ingredientes":[{"texto":"Para los bizcochos de soletilla (15 unidades): 3 huevos","cantidad":null,"resto":"Para los bizcochos de soletilla (15 unidades): 3 huevos","escalable":false},{"texto":"110 g de azúcar","cantidad":110.0,"resto":"g de azúcar","escalable":true,"modo":"simple"},{"texto":"140 g de harina de trigo","cantidad":140.0,"resto":"g de harina de trigo","escalable":true,"modo":"simple"},{"texto":"Azúcar glas, al gusto","cantidad":null,"resto":"Azúcar glas, al gusto","escalable":false},{"texto":"Para el tiramisú: los bizcochos de soletilla","cantidad":null,"resto":"Para el tiramisú: los bizcochos de soletilla","escalable":false},{"texto":"250 ml de café","cantidad":250.0,"resto":"ml de café","escalable":true,"modo":"simple"},{"texto":"110 g de azúcar","cantidad":110.0,"resto":"g de azúcar","escalable":true,"modo":"simple"},{"texto":"Una pizca de nuez moscada","cantidad":null,"resto":"Una pizca de nuez moscada","escalable":false},{"texto":"15 ml de ron (opcional)","cantidad":15.0,"resto":"ml de ron (opcional)","escalable":true,"modo":"simple"},{"texto":"Un chorrito de sirope de arce (opcional)","cantidad":null,"resto":"Un chorrito de sirope de arce (opcional)","escalable":false},{"texto":"3 yemas de huevo","cantidad":3.0,"resto":"yemas de huevo","escalable":true,"modo":"simple"},{"texto":"225 g de mascarpone","cantidad":225.0,"resto":"g de mascarpone","escalable":true,"modo":"simple"},{"texto":"120 ml de nata para montar","cantidad":120.0,"resto":"ml de nata para montar","escalable":true,"modo":"simple"},{"texto":"Cacao en polvo, al gusto, para terminar","cantidad":null,"resto":"Cacao en polvo, al gusto, para terminar","escalable":false},{"texto":"30 g de chocolate, para decorar","cantidad":30.0,"resto":"g de chocolate, para decorar","escalable":true,"modo":"simple"}],"elaboracion":["Bizcochos de soletilla: batir los huevos con el azúcar en un bol. Colocar el bol al baño maría y batir sin parar hasta que la mezcla alcance los 71° (unos 5 minutos). Retirar del fuego y seguir batiendo 6-7 minutos más, hasta que quede muy espesa.","Incorporar la harina tamizada con movimientos envolventes. Pasar a una manga pastelera y escudillar sobre una bandeja con papel de horno. Espolvorear generosamente con azúcar glas y hornear a 180° durante 8-12 minutos, hasta que doren ligeramente. Dejar enfriar sobre una rejilla.","Montaje del tiramisú: preparar el café y mezclarlo con 30 g de azúcar, el ron y el sirope de arce (opcionales) y un poco de nuez moscada rallada; dejar enfriar.","Batir las yemas con 80 g de azúcar al baño maría hasta que doblen su volumen y queden espesas. Batir el mascarpone aparte para ablandarlo e incorporarlo a las yemas. Montar la nata a picos suaves e incorporarla también con movimientos envolventes.","Mojar cada bizcocho de soletilla en el café durante 3 segundos y colocarlos en el molde elegido. Cubrir con la mitad de la crema de mascarpone, extendiéndola bien. Añadir otra capa de bizcochos mojados en café y cubrir con el resto de la crema.","Tapar con film y refrigerar un mínimo de 6 horas. Antes de servir, espolvorear con cacao en polvo y decorar con virutas de chocolate."]},{"categoria":"REPOSTERÍA ITALIANA Y FRANCESA","titulo":"Cannoli Sicilianos (diegodoal)","raciones":"unos 16 cannoli","racionesBase":16,"tiempo":"1 hora","ingredientes":[{"texto":"Para la masa: 250 g de harina de trigo","cantidad":null,"resto":"Para la masa: 250 g de harina de trigo","escalable":false},{"texto":"30 g de cacao en polvo","cantidad":30.0,"resto":"g de cacao en polvo","escalable":true,"modo":"simple"},{"texto":"1 cucharadita de canela en polvo","cantidad":1.0,"resto":"cucharadita de canela en polvo","escalable":true,"modo":"simple"},{"texto":"Media cucharadita de café molido","cantidad":null,"resto":"Media cucharadita de café molido","escalable":false},{"texto":"30 ml de vino blanco seco","cantidad":30.0,"resto":"ml de vino blanco seco","escalable":true,"modo":"simple"},{"texto":"30 ml de vinagre blanco","cantidad":30.0,"resto":"ml de vinagre blanco","escalable":true,"modo":"simple"},{"texto":"1 huevo","cantidad":1.0,"resto":"huevo","escalable":true,"modo":"simple"},{"texto":"40 g de mantequilla sin sal","cantidad":40.0,"resto":"g de mantequilla sin sal","escalable":true,"modo":"simple"},{"texto":"1 clara de huevo, para sellar","cantidad":1.0,"resto":"clara de huevo, para sellar","escalable":true,"modo":"simple"},{"texto":"Para el relleno: 750 g de ricotta","cantidad":null,"resto":"Para el relleno: 750 g de ricotta","escalable":false},{"texto":"125 g de azúcar glas","cantidad":125.0,"resto":"g de azúcar glas","escalable":true,"modo":"simple"},{"texto":"Media cucharadita de canela","cantidad":null,"resto":"Media cucharadita de canela","escalable":false},{"texto":"50 g de pistachos picados","cantidad":50.0,"resto":"g de pistachos picados","escalable":true,"modo":"simple"},{"texto":"50 g de chips de chocolate","cantidad":50.0,"resto":"g de chips de chocolate","escalable":true,"modo":"simple"}],"elaboracion":["Los cannoli sicilianos son esos pastelitos de corteza crujiente frita, rellenos de ricotta dulce con pistachos, chocolate o fruta escarchada. La masa lleva cacao, que le da su color característico, y canela, uno de sus sabores principales. La única forma de darles su típica forma de tubo es con moldes de cannoli metálicos o de caña; con solo 10 moldes basta, ya que se van reutilizando conforme se van friendo.","En el vaso de un procesador de alimentos, añadir la harina, el cacao en polvo, la canela y el café molido. Pulsar hasta que se mezclen.","Añadir el vino blanco, el vinagre, la mantequilla en cubos y el huevo. Procesar hasta obtener una masa homogénea.","Pasar la masa a una superficie y amasar 3-4 minutos, hasta que quede completamente lisa y elástica.","Relleno: tamizar la ricotta en un bol. Añadir el azúcar glas y la canela. Batir con varillas 2 minutos, hasta que haya doblado su volumen. Reservar en la nevera.","Engrasar los moldes de cannoli con aceite de girasol.","Estirar la masa con el rodillo muy fina.","Con un cortapastas de 10 cm, cortar 10 círculos. Volver a amasar los recortes y dejarlos reposar.","Coger uno de los círculos y estirarlo delicadamente con las manos dándole forma ovalada. Colocarlo en un molde y envolverlo hasta que se junten los bordes. Poner un poco de clara de huevo en uno de los extremos y sellar la unión. Repetir con todos los círculos.","Freír los cannoli en aceite de girasol a 180° durante 3 minutos, o hasta que estén dorados, moviéndolos de vez en cuando para que no se quemen las zonas pegadas al fondo.","Mientras se fríen, estirar la masa sobrante y cortar más círculos.","Pasar los cannoli a una rejilla y sacarlos de los moldes de inmediato, ayudándose de papel
