imbap: 60 g de gochujang (o sriracha)","escalable":false},{"texto":"20 ml de mirin","cantidad":20.0,"resto":"ml de mirin","escalable":true,"modo":"simple"},{"texto":"15 g de miel","cantidad":15.0,"resto":"g de miel","escalable":true,"modo":"simple"},{"texto":"10 ml de salsa de soja oscura","cantidad":10.0,"resto":"ml de salsa de soja oscura","escalable":true,"modo":"simple"},{"texto":"1 diente de ajo","cantidad":1.0,"resto":"diente de ajo","escalable":true,"modo":"simple"},{"texto":"2 cm de jengibre fresco","cantidad":2.0,"resto":"cm de jengibre fresco","escalable":true,"modo":"simple"},{"texto":"10 ml de aceite de sésamo","cantidad":10.0,"resto":"ml de aceite de sésamo","escalable":true,"modo":"simple"},{"texto":"Para la ternera marinada: 150 g de solomillo de ternera","cantidad":null,"resto":"Para la ternera marinada: 150 g de solomillo de ternera","escalable":false},{"texto":"2 cucharaditas de salsa de soja","cantidad":2.0,"resto":"cucharaditas de salsa de soja","escalable":true,"modo":"simple"},{"texto":"1 cucharadita de miel","cantidad":1.0,"resto":"cucharadita de miel","escalable":true,"modo":"simple"},{"texto":"1 cucharadita de salsa de soja oscura (opcional)","cantidad":1.0,"resto":"cucharadita de salsa de soja oscura (opcional)","escalable":true,"modo":"simple"},{"texto":"1 cucharadita de vinagre de arroz","cantidad":1.0,"resto":"cucharadita de vinagre de arroz","escalable":true,"modo":"simple"},{"texto":"1 cucharadita de aceite de sésamo","cantidad":1.0,"resto":"cucharadita de aceite de sésamo","escalable":true,"modo":"simple"},{"texto":"Por bol: 150 g de arroz sushi cocido","cantidad":null,"resto":"Por bol: 150 g de arroz sushi cocido","escalable":false},{"texto":"75 g de solomillo crudo cortado en dados","cantidad":75.0,"resto":"g de solomillo crudo cortado en dados","escalable":true,"modo":"simple"},{"texto":"1 huevo","cantidad":1.0,"resto":"huevo","escalable":true,"modo":"simple"},{"texto":"200 ml de aceite de girasol para freír","cantidad":200.0,"resto":"ml de aceite de girasol para freír","escalable":true,"modo":"simple"},{"texto":"Una pizca de gochugaru para decorar (opcional)","cantidad":null,"resto":"Una pizca de gochugaru para decorar (opcional)","escalable":false}],"elaboracion":["El bibimbap se construye a partir de varias guarniciones (namul) preparadas por separado y que luego se combinan sobre el arroz; ninguna es complicada, pero conviene tenerlas todas listas antes de montar los boles.","Zanahoria encurtida: pelar y cortar las zanahorias en juliana fina. Apretarlas con las manos durante 30 segundos sin llegar a romperlas, para ablandarlas ligeramente. Añadir la soja, el vinagre, la sal, el gochugaru y el sésamo, mezclar y dejar marinar un mínimo de 15 minutos (idealmente toda la noche).","Pepino picante: cortar el pepino en rodajas gruesas y después en cuartos. Ponerlo en un bol con sal y dejar reposar 15 minutos para que suelte agua. Escurrir y aclarar. Mezclar con el Laoganma, el zumo de limón y el ajo picado; marinar mínimo 15 minutos, mejor 2 horas.","Brotes de soja: escaldar en agua hirviendo 1 minuto. Pasar a un bol y aliñar con sal y salsa de pescado. Dejar marinar mínimo 15 minutos.","Espinacas: calentar aceite en una sartén a fuego medio-alto, añadir las espinacas y el sésamo y saltear hasta que suelten el agua y reduzcan bien de volumen.","Salsa bibimbap: mezclar el gochujang, el mirin, la soja oscura, la miel y el aceite de sésamo. Picar el ajo y el jengibre e incorporarlos. Reservar.","Ternera marinada: congelar la carne 20 minutos para que sea más fácil de cortar. Cortarla en tiras finas, cubrirlas con film y golpearlas ligeramente con una maza o la base de una sartén para ablandarlas. Mezclar con la soja, la miel, la soja oscura, el vinagre y el aceite de sésamo; marinar mínimo 15 minutos, idealmente toda la noche. Antes de servir, dorar con un soplete de cocina o en una sartén muy caliente.","Montaje: congelar la ternera cruda 20 minutos y cortarla en dados pequeños para el topping crudo. Freír un huevo en una sartén con aceite a fuego medio-alto durante 1-2 minutos, dejando la yema líquida. Colocar el arroz caliente en el fondo del bol, verter dos cucharadas de salsa bibimbap por encima y disponer alrededor todas las guarniciones, la ternera marinada, los dados de ternera cruda y el huevo frito en el centro. Mezclar todo en el momento de comer para que la yema ligue el conjunto."]},{"categoria":"ARROCES","titulo":"Arroz con Bogavante (diegodoal)","raciones":"4 personas","racionesBase":4,"tiempo":"1 h 45 min","ingredientes":[{"texto":"Para el fumet: 750 g de raspas y recortes de pescado","cantidad":null,"resto":"Para el fumet: 750 g de raspas y recortes de pescado","escalable":false},{"texto":"150 g de cáscaras de gambas (de las 250 g totales de gambas)","cantidad":150.0,"resto":"g de cáscaras de gambas (de las 250 g totales de gambas)","escalable":true,"modo":"simple"},{"texto":"1 puerro","cantidad":1.0,"resto":"puerro","escalable":true,"modo":"simple"},{"texto":"1 cebolla","cantidad":1.0,"resto":"cebolla","escalable":true,"modo":"simple"},{"texto":"1 zanahoria","cantidad":1.0,"resto":"zanahoria","escalable":true,"modo":"simple"},{"texto":"50 ml de aceite de oliva virgen extra","cantidad":50.0,"resto":"ml de aceite de oliva virgen extra","escalable":true,"modo":"simple"},{"texto":"1 manojo de perejil","cantidad":1.0,"resto":"manojo de perejil","escalable":true,"modo":"simple"},{"texto":"2 hojas de laurel","cantidad":2.0,"resto":"hojas de laurel","escalable":true,"modo":"simple"},{"texto":"Sal y pimienta negra al gusto","cantidad":null,"resto":"Sal y pimienta negra al gusto","escalable":false},{"texto":"2,5 litros de agua","cantidad":2.5,"resto":"litros de agua","escalable":true,"modo":"simple"},{"texto":"Para el arroz: 1 bogavante vivo o congelado (~500 g)","cantidad":null,"resto":"Para el arroz: 1 bogavante vivo o congelado (~500 g)","escalable":false},{"texto":"12 gambas","cantidad":12.0,"resto":"gambas","escalable":true,"modo":"simple"},{"texto":"400 g de arroz bomba","cantidad":400.0,"resto":"g de arroz bomba","escalable":true,"modo":"simple"},{"texto":"1,6 litros de fumet de pescado","cantidad":1.6,"resto":"litros de fumet de pescado","escalable":true,"modo":"simple"},{"texto":"1 ñora seca","cantidad":1.0,"resto":"ñora seca","escalable":true,"modo":"simple"},{"texto":"2 tomates","cantidad":2.0,"resto":"tomates","escalable":true,"modo":"simple"},{"texto":"1 pimiento rojo","cantidad":1.0,"resto":"pimiento rojo","escalable":true,"modo":"simple"},{"texto":"1 pimiento italiano verde","cantidad":1.0,"resto":"pimiento italiano verde","escalable":true,"modo":"simple"},{"texto":"1 cebolla","cantidad":1.0,"resto":"cebolla","escalable":true,"modo":"simple"},{"texto":"2 dientes de ajo","cantidad":2.0,"resto":"dientes de ajo","escalable":true,"modo":"simple"},{"texto":"1 cucharadita de pimentón dulce","cantidad":1.0,"resto":"cucharadita de pimentón dulce","escalable":true,"modo":"simple"},{"texto":"150 ml de vino blanco","cantidad":150.0,"resto":"ml de vino blanco","escalable":true,"modo":"simple"},{"texto":"50 ml de aceite de oliva virgen extra","cantidad":50.0,"resto":"ml de aceite de oliva virgen extra","escalable":true,"modo":"simple"},{"texto":"Sal y pimienta negra al gusto","cantidad":null,"resto":"Sal y pimienta negra al gusto","escalable":false},{"texto":"1 hoja de laurel","cantidad":1.0,"resto":"hoja de laurel","escalable":true,"modo":"simple"},{"texto":"8 hebras de azafrán","cantidad":8.0,"resto":"hebras de azafrán","escalable":true,"modo":"simple"},{"texto":"Un puñado de perejil fresco para decorar","cantidad":null,"resto":"Un puñado de perejil fresco para decorar","escalable":false}],"elaboracion":["Fumet: picar el puerro, la cebolla y la zanahoria. Pelar las gambas, reservando la carne para el arroz y las cáscaras para el fumet. Calentar abundante aceite en una olla grande y rehogar las verduras con sal durante 10 minutos.","Añadir las cáscaras de gamba y saltear 1 minuto. Incorporar las raspas de pescado, el perejil, el laurel, pimienta y el agua. Llevar a ebullición a fuego medio-alto, desespumando. Cocer sin tapar 35 minutos.","Retirar los trozos grandes y aplastar las cabezas de las gambas contra el colador para extraer todo su sabor. Colar por un colador fino o un paño.","Arroz: hidratar la ñora en agua hirviendo 15 minutos; separar la pulpa y reservar. Despepitar los tomates y triturarlos o rallarlos. Picar finamente el pimiento rojo, el pimiento verde, la cebolla y el ajo. Tostar el azafrán 20 segundos en el microondas.","Colocar el cuchillo 2 cm por detrás de la unión cabeza-cola del bogavante, clavar y partir la cabeza longitudinalmente. Separar la cola y cortarla en tres piezas iguales. Extraer el coral verde (reservarlo) y desechar la parte gomosa de la boca. Separar las pinzas y cascarlas ligeramente con el mango del cuchillo. Salar la carne expuesta y reservar todo.","Calentar el fumet en un cazo pequeño a fuego bajo. Calentar abundante aceite en la paellera o cazuela a fuego medio-alto; justo antes de que humee, añadir las piezas de bogavante con la carne hacia abajo y saltear 3 minutos, hasta que estén bien anaranjadas.","Retirar el bogavante y en el mismo aceite rehogar los pimientos, la cebolla y el ajo con sal y pimienta durante 10 minutos. Añadir el coral y saltear 1 minuto. Incorporar el pimentón y tostarlo 15 segundos sin que se queme.","Añadir el tomate triturado y la pulpa de ñora; sofreír 3 minutos hasta que el líquido se evapore. Mezclar un cazo de fumet caliente con el azafrán tostado.","Añadir el vino blanco a la cazuela y reducir 3 minutos. Añadir el arroz y tostarlo 2 minutos, nacarándolo en el sofrito.","Verter el resto del fumet, el laurel y el fumet con azafrán; llevar a ebullición a fuego fuerte y cocer 5 minutos. Añadir las pinzas de bogavante y cocer 3 minutos más.","Bajar a fuego medio, rectificar de sal y añadir el resto de las piezas de bogavante con la carne hacia arriba; cocer 4 minutos. Dar la vuelta a todas las piezas y cocer 3 minutos más.","Bajar a fuego bajo, añadir las gambas peladas y cocer 1 minuto. Retirar del fuego, tapar con un paño y dejar reposar 5 minutos. Terminar con perejil fresco picado."]},{"categoria":"ARROCES","titulo":"Risotto de Ajo Negro y Entrecot (diegodoal)","raciones":"2 personas","racionesBase":2,"tiempo":"50 min","ingredientes":[{"texto":"Para el risotto: 1 cabeza de ajo negro","cantidad":null,"resto":"Para el risotto: 1 cabeza de ajo negro","escalable":false},{"texto":"1 litro de caldo de verduras","cantidad":1.0,"resto":"litro de caldo de verduras","escalable":true,"modo":"simple"},{"texto":"200 g de arroz carnaroli o arborio","cantidad":200.0,"resto":"g de arroz carnaroli o arborio","escalable":true,"modo":"simple"},{"texto":"½ cebolla","cantidad":0.5,"resto":"cebolla","escalable":true,"modo":"simple"},{"texto":"100 ml de vino blanco","cantidad":100.0,"resto":"ml de vino blanco","escalable":true,"modo":"simple"},{"texto":"100 g de queso parmesano","cantidad":100.0,"resto":"g de queso parmesano","escalable":true,"modo":"simple"},{"texto":"2 nueces de mantequilla","cantidad":2.0,"resto":"nueces de mantequilla","escalable":true,"modo":"simple"},{"texto":"Un chorrito de aceite de oliva virgen extra","cantidad":null,"resto":"Un chorrito de aceite de oliva virgen extra","escalable":false},{"texto":"1 lima","cantidad":1.0,"resto":"lima","escalable":true,"modo":"simple"},{"texto":"Para el entrecot: 300 g de entrecot","cantidad":null,"resto":"Para el entrecot: 300 g de entrecot","escalable":false},{"texto":"Sal y pimienta negra al gusto","cantidad":null,"resto":"Sal y pimienta negra al gusto","escalable":false},{"texto":"2 dientes de ajo","cantidad":2.0,"resto":"dientes de ajo","escalable":true,"modo":"simple"},{"texto":"1 ramita de romero fresco o una pizca de romero seco","cantidad":1.0,"resto":"ramita de romero fresco o una pizca de romero seco","escalable":true,"modo":"simple"},{"texto":"2 nueces de mantequilla","cantidad":2.0,"resto":"nueces de mantequilla","escalable":true,"modo":"simple"},{"texto":"Sal en escamas al gusto","cantidad":null,"resto":"Sal en escamas al gusto","escalable":false}],"elaboracion":["Risotto: separar todos los dientes del ajo negro. Triturar el caldo de verduras con los dientes de ajo negro hasta que quede homogéneo; mantener caliente a fuego bajo.","Rallar el parmesano, reservando un tercio para incorporar al final del risotto. Formar cinco montoncitos con el resto sobre papel de horno y hornear a 180° hasta que estén dorados; dejar enfriar para obtener unas tejas crujientes de parmesano.","Picar la cebolla finamente. En una sartén, derretir mantequilla con un chorrito de aceite y rehogar la cebolla hasta que esté translúcida.","Añadir el arroz y tostarlo 2 minutos, hasta que los bordes de los granos se vuelvan translúcidos.","Añadir el vino blanco y dejar que se evapore durante 1,5 minutos.","Añadir el caldo con ajo negro en tandas de dos cazos, removiendo con frecuencia hasta que se absorba antes de añadir el siguiente; repetir hasta que el arroz esté al dente.","Retirar del fuego y mantecar con la mantequilla y el parmesano reservado, removiendo con energía para que quede cremoso.","Emplatar de inmediato con las tejas de parmesano y ralladura de lima por encima.","Entrecot: retirar la grasa del borde del entrecot y reservarla. Secar la carne con papel y sazonar generosamente con sal y pimienta.","Calentar la grasa reservada en una sartén a fuego fuerte hasta que suelte suficiente grasa líquida.","Retirar los trozos de grasa y colocar el entrecot en la sartén.","Sellar 2 minutos sin mover; dar la vuelta y marcar 1 minuto.","Bajar a fuego medio-bajo; añadir la mantequilla, el ajo y el romero.","Bañar la carne con la mantequilla fundida hasta que el centro alcance 54° (poco hecho) o 57° (al punto).","Pasar a una tabla, cubrir con papel de aluminio y dejar reposar 10 minutos.","Cortar en lonchas, rociar con la mantequilla aromatizada reservada y terminar con sal en escamas."]},{"categoria": o","cantidad":35.0,"resto":"g de parmesano","escalable":true,"modo":"simple"},{"texto":"35 g de pan rallado","cantidad":35.0,"resto":"g de pan rallado","escalable":true,"modo":"simple"},{"texto":"2 huevos","cantidad":2.0,"resto":"huevos","escalable":true,"modo":"simple"},{"texto":"Para el montaje: 25 láminas de pasta","cantidad":null,"resto":"Para el montaje: 25 láminas de pasta","escalable":false},{"texto":"550 g de ricotta","cantidad":550.0,"resto":"g de ricotta","escalable":true,"modo":"simple"},{"texto":"500 g de mozzarella fresca","cantidad":500.0,"resto":"g de mozzarella fresca","escalable":true,"modo":"simple"},{"texto":"30 g de mantequilla","cantidad":30.0,"resto":"g de mantequilla","escalable":true,"modo":"simple"},{"texto":"100 g de parmesano y pecorino romano rallados","cantidad":100.0,"resto":"g de parmesano y pecorino romano rallados","escalable":true,"modo":"simple"},{"texto":"Unas hojas de albahaca fresca","cantidad":null,"resto":"Unas hojas de albahaca fresca","escalable":false}],"elaboracion":["Ragú: cortar las costillas en piezas de 3-4 huesos; sazonar generosamente con sal y pimienta. Picar finamente la cebolla y el ajo.","Calentar una olla grande hasta que esté muy caliente; sellar las costillas 2 minutos por cada lado, en tandas para no llenar la olla; reservar.","Añadir la cebolla con sal, raspando el fondo de la olla para recuperar los jugos dorados; cocinar 5 minutos, añadir el ajo y cocinar 2 minutos más.","Añadir el concentrado de tomate, la guindilla y el orégano; tostar hasta que suelten aroma. Añadir el vino blanco y cocinar 3 minutos.","Añadir el tomate triturado y 300 ml de agua; mezclar bien.","Añadir la corteza de parmesano, la albahaca y el laurel; devolver las costillas a la olla, cubriéndolas con la salsa. Llevar a ebullición.","Tapar parcialmente y hornear a 150° durante 3 horas.","Sacar del horno, sumergir las salchichas en la salsa y devolver al horno 30 minutos más.","Retirar las costillas y las salchichas; descartar la corteza y el laurel; rectificar de sal y dejar enfriar. Deshuesar las costillas (reservando la carne) y cortar las salchichas en rodajas.","Albóndigas: triturar la carne de costilla en un procesador hasta obtener una pasta; pasar a un bol. Triturar el parmesano, el pan rallado y los huevos hasta obtener otra pasta; combinar con la carne hasta homogeneizar.","Con las manos húmedas, formar unas 100 albóndigas pequeñas, del tamaño de un bocado. Dorarlas por ambos lados en abundante aceite de oliva; escurrir sobre papel absorbente y dejar enfriar.","Montaje: cocer las láminas de pasta según el paquete. Mezclar la ricotta con 3 cucharadas de la salsa de tomate. Cortar la mozzarella en dados pequeños.","Untar una fuente de horno con mantequilla y extender una capa fina de salsa en el fondo. Ir montando capas de pasta, mezcla de ricotta, albóndigas, salchichas y mozzarella, cubriendo cada capa con salsa y queso rallado. Repetir el proceso dos veces más.","Terminar con el resto de la ricotta, la mozzarella, albahaca fresca y abundante queso.","Cubrir con papel de aluminio y hornear a 180° durante 30 minutos con calor solo por abajo. Retirar el papel y hornear 20 minutos más; gratinar los últimos 10 minutos.","Dejar reposar 20 minutos antes de cortar y servir."]},{"categoria":"PASTAS","titulo":"Lasaña Mumbai del GoXO de Dabiz Muñoz (diegodoal)","raciones":"6 personas","racionesBase":6,"tiempo":"1 h 30 min (+ 3 h de cocción y horneado)","ingredientes":[{"texto":"Para el estofado de ternera: 1 kg de morcillo de ternera","cantidad":null,"resto":"Para el estofado de ternera: 1 kg de morcillo de ternera","escalable":false},{"texto":"1 cebolla","cantidad":1.0,"resto":"cebolla","escalable":true,"modo":"simple"},{"texto":"2 zanahorias","cantidad":2.0,"resto":"zanahorias","escalable":true,"modo":"simple"},{"texto":"2 tomates","cantidad":2.0,"resto":"tomates","escalable":true,"modo":"simple"},{"texto":"3 ramas de apio","cantidad":3.0,"resto":"ramas de apio","escalable":true,"modo":"simple"} "modo":"simple"},{"texto":"8 vainas de cardamomo","cantidad":8.0,"resto":"vainas de cardamomo","escalable":true,"modo":"simple"},{"texto":"Sal, pimienta negra y nuez moscada, al gusto","cantidad":null,"resto":"Sal, pimienta negra y nuez moscada, al gusto","escalable":false},{"texto":"Para montar: 200 g de queso gouda y 30 g de mantequilla","cantidad":null,"resto":"Para montar: 200 g de queso gouda y 30 g de mantequilla","escalable":false}],"elaboracion":["Esta lasaña de fusión, inspirada en el restaurante GoXO de Dabiz Muñoz, combina un curry indio de ternera con una bechamel de coco y pasta fresca italiana; requiere organizarse en varios frentes, pero cada elaboración es sencilla por separado.","Estofado y butter masala: cortar en dados el apio, la zanahoria, el tomate y la cebolla. Pelar y picar el ajo y el jengibre; reservar.","Mezclar en un bol el cardamomo verde, la canela, las semillas de comino, el cardamomo negro, las semillas de cilantro, el laurel, las guindillas secas y la nuez moscada; reservar.","Calentar una olla grande a fuego fuerte, añadir aceite y sellar la ternera por todos los lados hasta que esté bien dorada; reservar.","Bajar a fuego medio-alto en la misma olla; añadir el ajo, el jengibre y las guindillas; cocinar 20 segundos.","Añadir el apio, la zanahoria, el tomate y la cebolla; sofreír 5 minutos hasta que los bordes de la cebolla se vuelvan translúcidos.","Añadir la mezcla de especias; sofreír 2 minutos. Devolver la carne y añadir el caldo.","Llevar a ebullición a fuego fuerte, bajar a fuego suave y cocer 2,5 horas.","Retirar la carne cuando se deshaga con facilidad. Reducir el líquido restante a fuego medio 15 minutos.","Desmenuzar la carne con dos tenedores; reservar.","Cuando el líquido tenga consistencia espesa, retirar la canela, el laurel y el cardamomo negro. Triturar el resto en un procesador.","Triturar los anacardos con la nata; reservar.","Calentar el ghee en una sartén a fuego medio. Añadir el chile de Cachemira y tostarlo 15 segundos.","Añadir el puré de verduras y mezclar. Añadir el garam masala, mezclar, tapar y cocinar 5 minutos.","Añadir la crema de anacardos, mezclar y cocinar 2 minutos. Rectificar de sal y añadir el azúcar.","Mezclar la carne con el butter masala y el shiitake encurtido. Refrigerar.","Shiitake encurtido: hervir las setas 15 minutos. Retirar y reservar 150 ml del líquido de cocción. Cortar las setas en láminas finas.","Añadir a un cazo el azúcar, la soja, la soja oscura, el vinagre negro, el jengibre y el caldo reservado; mezclar.","Añadir las setas y cocinar a fuego medio 30 minutos sin llegar a hervir. Enfriar y refrigerar.","Pasta fresca: hacer un volcán con la harina, cascar los huevos en el centro, añadir sal y aceite.","Mezclar con un tenedor incorporando la harina hasta formar una masa. Amasar 5-6 minutos hasta que quede lisa y elástica, recuperando la forma al presionar.","Envolver en film y reposar 30 minutos a temperatura ambiente. Dividir en cuatro partes; dar forma ovalada, doblar como una carta y estirar; repetir dos veces más.","Pasar por la máquina de pasta reduciendo el grosor hasta la posición más fina. Cortar láminas del tamaño de la fuente de horno.","Bechamel de coco y cardamomo: calentar la leche de coco en un cazo. Machacar el cardamomo en un mortero.","Fundir la mantequilla en una sartén a fuego medio; cuando burbujee, añadir la harina y cocinar hasta que desaparezca el olor a crudo.","Añadir la leche de coco caliente en dos tandas, integrando bien cada una. Sazonar con cardamomo, nuez moscada, sal y pimienta negra.","Montaje: untar la fuente con mantequilla. Escaldar las láminas de pasta fresca 10 segundos y forrar el fondo (si se usa pasta seca, cocerla según el paquete).","Montar por capas de arriba abajo: pasta, carne y bechamel, pasta, carne, pasta, carne y bechamel, pasta, bechamel.","Cubrir con queso gouda rallado y trocitos de mantequilla. Hornear a 160° con el grill encendido durante 45 minutos.","Reposar 15 minutos. Servir con los pani puri desmenuzados por encima, si se preparan aparte."]},{"categoria":"PASTAS","titulo":"Canelones (asun)","raciones":"8 personas (unos 40 canelones)","racionesBase":8,"tiempo":"1 hora","ingredientes":[{"texto":"Para los canelones: 40 placas de canelones","cantidad":null,"resto":"Para los canelones: 40 placas de canelones","escalable":false},{"texto":"100 g de aceite","cantidad":100.0,"resto":"g de aceite","escalable":true,"modo":"simple"},{"texto":"200 g de cebolla (troceada a gajos)","cantidad":200.0,"resto":"g de cebolla (troceada a gajos)","escalable":true,"modo":"simple"},{"texto":"2 dientes de ajo","cantidad":2.0,"resto":"dientes de ajo","escalable":true,"modo":"simple"},{"texto":"2 tomates cortados a cuartos (o 150 g de tomate triturado)","cantidad":2.0,"resto":"tomates cortados a cuartos (o 150 g de tomate triturado)","escalable":true,"modo":"simple"},{"texto":"300 g de pechuga de pollo, en dados","cantidad":300.0,"resto":"g de pechuga de pollo, en dados","escalable":true,"modo":"simple"},{"texto":"600 g de carne magra de cerdo pulida y cortada a dados","cantidad":600.0,"resto":"g de carne magra de cerdo pulida y cortada a dados","escalable":true,"modo":"simple"},{"texto":"1 hoja de laurel, sal y pimienta","cantidad":1.0,"resto":"hoja de laurel, sal y pimienta","escalable":true,"modo":"simple"},{"texto":"30 g de coñac","cantidad":30.0,"resto":"g de coñac","escalable":true,"modo":"simple"},{"texto":"50 g de harina","cantidad":50.0,"resto":"g de harina","escalable":true,"modo":"simple"},{"texto":"200 g de leche","cantidad":200.0,"resto":"g de leche","escalable":true,"modo":"simple"},{"texto":"Para la bechamel: 800 g de leche","cantidad":null,"resto":"Para la bechamel: 800 g de leche","escalable":false},{"texto":"50 g de mantequilla","cantidad":50.0,"resto":"g de mantequilla","escalable":true,"modo":"simple"},{"texto":"60 g de harina","cantidad":60.0,"resto":"g de harina","escalable":true,"modo":"simple"},{"texto":"10 g de aceite","cantidad":10.0,"resto":"g de aceite","escalable":true,"modo":"simple"},{"texto":"Sal, nuez moscada y pimienta, al gusto","cantidad":null,"resto":"Sal, nuez moscada y pimienta, al gusto","escalable":false}],"elaboracion":["Poner la mariposa en las cuchillas y calentar el aceite 3 minutos, Varoma, velocidad 1. Añadir la cebolla y los ajos y programar 5 minutos, Varoma, velocidad 1. Añadir el tomate y programar 2 minutos, Varoma, velocidad 1.","Añadir la carne (salpimentada), el laurel, el coñac y programar 30 minutos, Varoma, velocidad 1. Cuando falten 2 minutos para acabar el tiempo, añadir la harina. Quitar la mariposa de las cuchillas y trocear 6 segundos, a velocidad 4. Añadir la leche y programar 3 minutos, 100°, velocidad 3. Apartar y dejar enfriar.","Llenar los canelones y ponerlos en la bandeja para el horno. Preparar la bechamel, verter por encima y cubrir con queso rallado. Gratinar en el horno con el grill a 200°C durante 8-10 minutos, hasta que esté dorado, y servir.","(A la hora de preparar la bechamel, poner los ingredientes en el vaso y programar 7 minutos, 90°, velocidad 4)."]},{"categoria":"PASTAS","titulo":"Canelones de Puerro Rellenos de Calamares (asun)","raciones":"3 personas (6 canelones)","racionesBase":3,"tiempo":"40 min","ingredientes":[{"texto":"Para la base: 6 puerros gordos (sólo la parte blanca)","cantidad":null,"resto":"Para la base: 6 puerros gordos (sólo la parte blanca)","escalable":false},{"texto":"Para el relleno: 300 g de calamares congelados Pescanova en aros","cantidad":null,"resto":"Para el relleno: 300 g de calamares congelados Pescanova en aros","escalable":false},{"texto":"50 g de aceite de oliva virgen extra","cantidad":50.0,"resto":"g de aceite de oliva virgen extra","escalable":true,"modo":"simple"},{"texto":"50 g de tomate triturado natural","cantidad":50.0,"resto":"g de tomate triturado natural","escalable":true,"modo":"simple"},{"texto":"100 g de pimiento verde de asar pelado","cantidad":100.0,"resto":"g de pimiento verde de asar pelado","escalable
