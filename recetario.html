 de hojaldre","cantidad":2.0,"resto":"láminas de hojaldre","escalable":true,"modo":"simple"},{"texto":"Duxelles de setas (ver abajo)","cantidad":null,"resto":"Duxelles de setas (ver abajo)","escalable":false},{"texto":"4 crêpes (ver abajo)","cantidad":4.0,"resto":"crêpes (ver abajo)","escalable":true,"modo":"simple"},{"texto":"4-6 lonchas de jamón (serrano, de cebo, ibérico o beicon)","cantidad":4.0,"cantidad2":6.0,"resto":"lonchas de jamón (serrano, de cebo, ibérico o beicon)","escalable":true,"modo":"rango"},{"texto":"2 yemas de huevo mezcladas con 2 cucharaditas de agua","cantidad":2.0,"resto":"yemas de huevo mezcladas con 2 cucharaditas de agua","escalable":true,"modo":"simple"},{"texto":"Sal en escamas al gusto","cantidad":null,"resto":"Sal en escamas al gusto","escalable":false},{"texto":"Para la duxelles: 475 g de setas variadas","cantidad":null,"resto":"Para la duxelles: 475 g de setas variadas","escalable":false},{"texto":"3 chalotas","cantidad":3.0,"resto":"chalotas","escalable":true,"modo":"simple"},{"texto":"2 cucharadas de aceite de oliva o mantequilla","cantidad":2.0,"resto":"cucharadas de aceite de oliva o mantequilla","escalable":true,"modo":"simple"},{"texto":"Un chorrito de Pedro Ximénez, jerez o coñac","cantidad":null,"resto":"Un chorrito de Pedro Ximénez, jerez o coñac","escalable":false},{"texto":"100 ml de nata para montar","cantidad":100.0,"resto":"ml de nata para montar","escalable":true,"modo":"simple"},{"texto":"Para las crêpes: 60 g de harina","cantidad":null,"resto":"Para las crêpes: 60 g de harina","escalable":false},{"texto":"160 ml de leche entera","cantidad":160.0,"resto":"ml de leche entera","escalable":true,"modo":"simple"},{"texto":"1 huevo","cantidad":1.0,"resto":"huevo","escalable":true,"modo":"simple"},{"texto":"Sal al gusto","cantidad":null,"resto":"Sal al gusto","escalable":false}],"elaboracion":["Este es el gran clásico de la alta cocina británica: un solomillo envuelto en duxelles de setas, jamón y hojaldre, pensado para que la carne quede perfectamente rosada mientras la corteza sale crujiente. La clave está en las crêpes, que sellan la humedad de la duxelles e impiden que el hojaldre se empape.","Limpiar el solomillo y sazonarlo generosamente con sal y pimienta; dejar reposar 10 minutos.","Sellarlo en aceite muy caliente, 1 minuto por cada lado, hasta que esté bien dorado por fuera.","Dejar enfriar y untarlo de inmediato con mostaza de Dijon por toda la superficie.","Duxelles: picar finamente las setas; picar también las chalotas. Rehogar las chalotas en aceite a fuego medio-alto hasta que estén translúcidas.","Añadir las setas y sal; remover sin parar 8 minutos, hasta que suelten todo su líquido y se evapore.","Añadir el vino generoso (Pedro Ximénez, jerez o coñac) y cocinar 1 minuto. Añadir la nata, cocinar 1 minuto más y dejar enfriar.","Crêpes: mezclar la harina, la leche, el huevo y la sal; dejar reposar la masa. Cocinar las crêpes 30 segundos por cada lado en una sartén con mantequilla.","Montaje: colocar dos crêpes superpuestas sobre film transparente. Añadir el jamón y encima la duxelles fría.","Colocar el solomillo untado de mostaza en un extremo y enrollar con fuerza, ayudándose del film, para formar un cilindro compacto.","Sellar los extremos con dos crêpes adicionales. Envolver bien en film y refrigerar un mínimo de 1 hora, para que tome forma firme.","Estirar las láminas de hojaldre, superponerlas y sellar el borde con un tenedor.","Pincelar el hojaldre con huevo batido dejando un borde de 2 cm sin pintar.","Sacar el rollo de la nevera, retirar el film y envolverlo con el hojaldre, sellando bien los bordes con un tenedor y pintando con el resto del huevo batido.","Terminar con sal en escamas por encima. Pasar a una bandeja con papel de horno.","Hornear a 200° durante 40 minutos, hasta que el centro alcance 48°.","Dejar reposar 15 minutos sobre una rejilla antes de cortar en rodajas gruesas."]},{"categoria":"TERNERA Y VACUNO","titulo":"Bulgogi (mío)","raciones":"4 personas","racionesBase":4,"tiempo":"15 min (+ marinado mínimo 8 h)","ingredientes":[{"texto":"600 g de aguja de ternera, cortada muy fina (casi congelada para poder laminarla bien)","cantidad":600.0,"resto":"g de aguja de ternera, cortada muy fina (casi congelada para poder laminarla bien)","escalable":true,"modo":"simple"},{"texto":"200 ml de salsa de bulgogi","cantidad":200.0,"resto":"ml de salsa de bulgogi","escalable":true,"modo":"simple"},{"texto":"400 g de arroz cocido","cantidad":400.0,"resto":"g de arroz cocido","escalable":true,"modo":"simple"},{"texto":"1 lechuga, hojas de tamaño mediano","cantidad":1.0,"resto":"lechuga, hojas de tamaño mediano","escalable":true,"modo":"simple"},{"texto":"2 cucharadas de pasta de Samyang","cantidad":2.0,"resto":"cucharadas de pasta de Samyang","escalable":true,"modo":"simple"},{"texto":"1 puerro, en láminas muy finas (opcional, a gusto)","cantidad":1.0,"resto":"puerro, en láminas muy finas (opcional, a gusto)","escalable":true,"modo":"simple"}],"elaboracion":["Lavar bien la lechuga y separar las hojas de tamaño mediano. Cortar el puerro en láminas muy finas y reservar.","Cortar la aguja de ternera muy fina (es más fácil si está casi congelada) y sumergirla en la salsa de bulgogi. Dejar marinar en el frigorífico un mínimo de 8 horas.","Pasadas las 8 horas, calentar una sartén a fuego fuerte y dorar la carne marinada 1-2 minutos por cada lado. Sacar y reservar.","Cocer el arroz.","Para comer, montar cada bocado sobre una hoja de lechuga: una nuez de arroz, un poco de pasta de Samyang (del tamaño de un grano de arroz), la carne encima y, si gusta, dos o tres láminas finas de puerro. Cerrar la hoja y comer de uno o dos bocados."]},{"categoria":"CERDO","titulo":"Carrilleras de Cerdo (mar)","raciones":"4 personas","racionesBase":4,"tiempo":"2 h 30 min","ingredientes":[{"texto":"1 kg carrilleras de cerdo","cantidad":1.0,"resto":"kg carrilleras de cerdo","escalable":true,"modo":"simple"},{"texto":"2 cebollas","cantidad":2.0,"resto":"cebollas","escalable":true,"modo":"simple"},{"texto":"2 zanahorias pequeñas","cantidad":2.0,"resto":"zanahorias pequeñas","escalable":true,"modo":"simple"},{"texto":"1 rama de apio","cantidad":1.0,"resto":"rama de apio","escalable":true,"modo":"simple"},{"texto":"2 tomates sin pulpa","cantidad":2.0,"resto":"tomates sin pulpa","escalable":true,"modo":"simple"},{"texto":"3 dientes de ajo","cantidad":3.0,"resto":"dientes de ajo","escalable":true,"modo":"simple"},{"texto":"100 ml vino tinto dulce (Pedro Ximénez)","cantidad":100.0,"resto":"ml vino tinto dulce (Pedro Ximénez)","escalable":true,"modo":"simple"},{"texto":"500 ml vino blanco seco","cantidad":500.0,"resto":"ml vino blanco seco","escalable":true,"modo":"simple"},{"texto":"1 cucharada de tomate concentrado","cantidad":1.0,"resto":"cucharada de tomate concentrado","escalable":true,"modo":"simple"},{"texto":"500 ml caldo de carne","cantidad":500.0,"resto":"ml caldo de carne","escalable":true,"modo":"simple"},{"texto":"1 hoja de laurel","cantidad":1.0,"resto":"hoja de laurel","escalable":true,"modo":"simple"},{"texto":"Mantequilla (unas nueces)","cantidad":null,"resto":"Mantequilla (unas nueces)","escalable":false},{"texto":"Aceite, sal y pimienta","cantidad":null,"resto":"Aceite, sal y pimienta","escalable":false}],"elaboracion":["Marcar las carrilleras a fuego medio-alto con poco aceite, 3-4 minutos por cada lado. Sacarlas.","Introducir la cebolla, zanahoria y apio cortados en tamaño pequeño. Sofreír 8-10 minutos.","Añadir una cucharada de concentrado de tomate y rehogar 30 segundos. Después el tomate, 4 minutos.","Añadir el vino tinto (Pedro Ximénez) y reducir 2-3 minutos hasta que desaparezca. Después el vino blanco y reducir 3-4 minutos.","Añadir el laurel y los 500 ml de caldo de carne. Introducir las carrilleras.","Dejar evaporar y después cocer a fuego bajo 1h30–2h hasta que estén deshechas.","Sacar la carne. Colar las verduras. Reducir el líquido a fuego medio-alto hasta que al pasar la espátula se vea el fondo.","Añadir unas nueces de mantequilla. Incorporar las carrilleras, mojarlas bien con la salsa y dejar tapadas a fuego bajo 5 minutos."]},{"categoria":"CERDO","titulo":"Costillar de Cerdo a la Barbacoa (diegodoal) (al Horno)","raciones":"4 personas","racionesBase":4,"tiempo":"3 horas de horno (+ 2 h de enfriado)","ingredientes":[{"texto":"Para el costillar: 20 g de sal","cantidad":null,"resto":"Para el costillar: 20 g de sal","escalable":false},{"texto":"12 g de panela o azúcar moreno","cantidad":12.0,"resto":"g de panela o azúcar moreno","escalable":true,"modo":"simple"},{"texto":"9 g de pimentón ahumado","cantidad":9.0,"resto":"g de pimentón ahumado","escalable":true,"modo":"simple"},{"texto":"10 g de ajo granulado","cantidad":10.0,"resto":"g de ajo granulado","escalable":true,"modo":"simple"},{"texto":"10 g de café molido","cantidad":10.0,"resto":"g de café molido","escalable":true,"modo":"simple"},{"texto":"1 costillar de cerdo (aproximadamente 2 kg)","cantidad":1.0,"resto":"costillar de cerdo (aproximadamente 2 kg)","escalable":true,"modo":"simple"},{"texto":"Un chorrito de vinagre de manzana (o vinagre blanco)","cantidad":null,"resto":"Un chorrito de vinagre de manzana (o vinagre blanco)","escalable":false},{"texto":"Para la salsa barbacoa: 285 g de kétchup","cantidad":null,"resto":"Para la salsa barbacoa: 285 g de kétchup","escalable":false},{"texto":"25 g de panela","cantidad":25.0,"resto":"g de panela","escalable":true,"modo":"simple"},{"texto":"25 g de azúcar moreno","cantidad":25.0,"resto":"g de azúcar moreno","escalable":true,"modo":"simple"},{"texto":"7 g de sal","cantidad":7.0,"resto":"g de sal","escalable":true,"modo":"simple"},{"texto":"25 ml de vinagre de manzana","cantidad":25.0,"resto":"ml de vinagre de manzana","escalable":true,"modo":"simple"},{"texto":"25 ml de vinagre de arroz","cantidad":25.0,"resto":"ml de vinagre de arroz","escalable":true,"modo":"simple"},{"texto":"140 g de agua","cantidad":140.0,"resto":"g de agua","escalable":true,"modo":"simple"},{"texto":"10 g de ajo granulado","cantidad":10.0,"resto":"g de ajo granulado","escalable":true,"modo":"simple"},{"texto":"10 g de pimentón ahumado","cantidad":10.0,"resto":"g de pimentón ahumado","escalable":true,"modo":"simple"},{"texto":"El condimento seco sobrante del costillar","cantidad":null,"resto":"El condimento seco sobrante del costillar","escalable":false}],"elaboracion":["Mezclar la sal, la panela, el pimentón y el ajo granulado en un bol. Moler finamente el café con un mortero y añadirlo a la mezcla; combinar bien. Reservar una cucharada para la salsa.","Limpiar el costillar y retirar la membrana que recubre el hueso por la parte trasera (esto es clave para que quede tierno y no correoso).","Masajear bien el condimento seco por toda la superficie del costillar.","Colocar el costillar sobre papel de aluminio suficientemente grande para envolverlo. Rociar con el vinagre de manzana. Sellar completamente con el papel de aluminio.","Pasar a una bandeja de horno y hornear a 150° con calor solo por abajo durante 2,5 a 3 horas.","Sacar del horno, desenvolver y dejar enfriar por completo, aproximadamente 2 horas. Mezclar los jugos acumulados con la salsa barbacoa.","Devolver el costillar a la bandeja sobre el papel de aluminio y pincelar toda la superficie con la salsa. Colocar directamente bajo el grill precalentado a máxima potencia durante 5 minutos, hasta que la salsa empiece a solidificarse.","Retirar, dar la vuelta, pincelar el otro lado y repetir el gratinado con el resto de la salsa hasta agotarla.","Servir de inmediato, preferiblemente acompañado de arroz.","Salsa barbacoa: mezclar el kétchup, la panela, el azúcar moreno, la sal, los vinagres, el agua, el ajo, el pimentón y, opcionalmente, una cucharada del condimento del costillar en un cazo.","Cocinar a fuego medio durante 30 minutos, hasta que espese considerablemente.","Dejar enfriar; opcionalmente ahumar en frío con una pistola de humo (3 pasadas de 20 minutos cada una).","Mezclar la salsa con los jugos que suelta el costillar durante la cocción para intensificar el sabor."]},{"categoria":"CERDO","titulo":"Cerdo Moo Shu (diegodoal)","raciones":"2-3 personas","racionesBase":2,"tiempo":"45 minutos","ingredientes":[{"texto":"250 g de solomillo de cerdo, en tiras finas","cantidad":250.0,"resto":"g de solomillo de cerdo, en tiras finas","escalable":true,"modo":"simple"},{"texto":"Para el adobo: ½ cucharadita de maicena, 1 cucharadita de vino Shaoxing, 1 cucharadita de salsa de soja, una pizca de glutamato (opcional), sal, 1 cucharadita de aceite de girasol","cantidad":null,"resto":"Para el adobo: ½ cucharadita de maicena, 1 cucharadita de vino Shaoxing, 1 cucharadita de salsa de soja, una pizca de glutamato (opcional), sal, 1 cucharadita de aceite de girasol","escalable":false},{"texto":"10 g de oreja de mar deshidratada (hongo kikurage)","cantidad":10.0,"resto":"g de oreja de mar deshidratada (hongo kikurage)","escalable":true,"modo":"simple"},{"texto":"10 g de flor de lirio deshidratada (lily buds)","cantidad":10.0,"resto":"g de flor de lirio deshidratada (lily buds)","escalable":true,"modo":"simple"},{"texto":"4 cebolletas chinas","cantidad":4.0,"resto":"cebolletas chinas","escalable":true,"modo":"simple"},{"texto":"10 g de jengibre fresco","cantidad":10.0,"resto":"g de jengibre fresco","escalable":true,"modo":"simple"},{"texto":"1 cucharadita de maicena","cantidad":1.0,"resto":"cucharadita de maicena","escalable":true,"modo":"simple"},{"texto":"3 huevos","cantidad":3.0,"resto":"huevos","escalable":true,"modo":"simple"},{"texto":"2 cucharadas de aceite de girasol","cantidad":2.0,"resto":"cucharadas de aceite de girasol","escalable":true,"modo":"simple"},{"texto":"1 cucharada de vino Shaoxing","cantidad":1.0,"resto":"cucharada de vino Shaoxing","escalable":true,"modo":"simple"},{"texto":"1 cucharada de salsa de soja","cantidad":1.0,"resto":"cucharada de salsa de soja","escalable":true,"modo":"simple"},{"texto":"1 cucharadita de glutamato (opcional)","cantidad":1.0,"resto":"cucharadita de glutamato (opcional)","escalable":true,"modo":"simple"},{"texto":"1 cucharadita de azúcar","cantidad":1.0,"resto":"cucharadita de azúcar","escalable":true,"modo":"simple"},{"texto":"Una pizca de sal","cantidad":null,"resto":"Una pizca de sal","escalable":false},{"texto":"2 cucharadas de salsa hoisin","cantidad":2.0,"resto":"cucharadas de salsa hoisin","escalable":true,"modo":"simple"},{"texto":"Para las crepes mandarinas: 250 g de harina de trigo","cantidad":null,"resto":"Para las crepes mandarinas: 250 g de harina de trigo","escalable":false},{"texto":"Una pizca de sal","cantidad":null,"resto":"Una pizca de sal","escalable":false},{"texto":"150 ml de agua hirviendo","cantidad":150.0,"resto":"ml de agua hirviendo","escalable":true,"modo":"simple"},{"texto":"1 cucharadita de aceite de sésamo","cantidad":1.0,"resto":"cucharadita de aceite de sésamo","escalable":true,"modo":"simple"}],"elaboracion":["Cortar el solomillo en tiras finas (si cuesta, meterlo 20 minutos en el congelador para que esté más firme) y mezclarlo con los ingredientes del adobo; dejar marinar un mínimo de 15 minutos.","Hidratar por separado la oreja de mar y la flor de lirio en agua hirviendo. Picar finamente la parte blanca de la cebolleta, el jengibre, la oreja de mar y la flor de lirio ya hidratadas. Mezclar un poco del agua de hidratar la flor de lirio con la maicena. Batir los huevos.","En una sartén antiadherente a fuego fuerte, cuajar el huevo batido; romperlo en trozos grandes con la espátula y reservar. En la misma sartén, saltear la carne marinada 30 segundos por cada lado. Añadir la cebolleta y el jengibre (30 segundos), el vino Shaoxing, la oreja de mar (30 segundos) y la flor de lirio (30 segundos más). Sazonar con la soja, el glutamato, el azúcar y la sal. Devolver el huevo a la sartén, añadir la mezcla de maicena y cocinar 10 segundos más para que ligue.","Para las crepes: mezclar la harina con la sal, añadir el agua hirviendo y mezclar; cuando temple, amasar 2 minutos. Dejar reposar 30 minutos. Dividir en dos rulos y cortar cada uno en 10 porciones. Aplanar las porciones por parejas, pincelar con aceite de sésamo entre ellas, apilarlas y estirarlas finas con el rodillo. Cocinar cada pareja unos 10 segundos por cada lado en una sartén antiadherente sin aceite, y separar las dos capas mientras aún están calientes.","Servir el cerdo moo shu envuelto en las crepes calientes, con un poco de salsa hoisin."]},{"categoria":"CORDERO","titulo":"Caldereta Manchega (asun)","raciones":"4 personas","racionesBase":4,"tiempo":"45 minutos","ingredientes":[{"texto":"3/4 kg de espalda de cordero en trozos pequeños","cantidad":null,"resto":"3/4 kg de espalda de cordero en trozos pequeños","escalable":false},{"texto":"3/4 cubilete de aceite","cantidad":null,"resto":"3/4 cubilete de aceite","escalable":false},{"texto":"1 seso de cordero","cantidad":1.0,"resto":"seso de cordero","escalable":true,"modo":"simple"},{"texto":"1 hígado de cordero","cantidad":1.0,"resto":"hígado de cordero","escalable":true,"modo":"simple"},{"texto":"2 dientes de ajo","cantidad":2.0,"resto":"dientes de ajo","escalable":true,"modo":"simple"},{"texto":"1 cebolla","cantidad":1.0,"resto":"cebolla","escalable":true,"modo":"simple"},{"texto":"2 pimientos verdes","cantidad":2.0,"resto":"pimientos verdes","escalable":true,"modo":"simple"},{"texto":"4 tomates muy maduros","cantidad":4.0,"resto":"tomates muy maduros","escalable":true,"modo":"simple"},{"texto":"1 hoja de laurel","cantidad":1.0,"resto":"hoja de laurel","escalable":true,"modo":"simple"},{"texto":"Tomillo y orégano al gusto","cantidad":null,"resto":"Tomillo y orégano al gusto","escalable":false},{"texto":"La cantidad de agua que admita","cantidad":null,"resto":"La cantidad de agua que admita","escalable":false},{"texto":"Sal al gusto","cantidad":null,"resto":"Sal al gusto","escalable":false},{"texto":"Pimienta al gusto","cantidad":null,"resto":"Pimienta al gusto","escalable":false}],"elaboracion":["Poner todos los ingredientes en el vaso menos la carne, el agua y las hierbas aromáticas. Tapar, cerrar y triturar a velocidad 4. Limpiar las paredes del vaso con la espátula, y poner el cestillo con la carne previamente condimentada con sal, pimienta, laurel, tomillo y orégano. Tapar y cerrar y poner el colador, programando velocidad 1, temperatura 100°, durante 15 minutos.","Una vez terminado el tiempo, incorporar 3 cubiletes de agua, y conectar 10 minutos más a velocidad 1 y temperatura de 100°. Si fuera necesario, añadir un poco más de agua.","Comprobar si el cordero está tierno; de no ser así, conectar nuevamente 10-15 minutos más.","Verter todo el contenido en una fuente de servir, rectificar la sazón, mezclar bien y servir muy caliente, junto con patatas fritas cortadas en cuadraditos."]},{"categoria":"CORDERO","titulo":"Moussaka (diegodoal) (Lasaña Griega de Berenjena)","raciones":"6 personas","racionesBase":6,"tiempo":"2 horas","ingredientes":[{"texto":"Para las berenjenas asadas: 3 berenjenas grandes","cantidad":null,"resto":"Para las berenjenas asadas: 3 berenjenas grandes","escalable":false},{"texto":"4 cucharadas de aceite de oliva","cantidad":4.0,"resto":"cucharadas de aceite de oliva","escalable":true,"modo":"simple"},{"texto":"Sal y pimienta negra al gusto","cantidad":null,"resto":"Sal y pimienta negra al gusto","escalable":false},{"texto":"Para el ragú de carne: 750 g de carne picada de ternera","cantidad":null,"resto":"Para el ragú de carne: 750 g de carne picada de ternera","escalable":false},{"texto":"1 cebolla","cantidad":1.0,"resto":"cebolla","escalable":true,"modo":"simple"},{"texto":"3 dientes de ajo","cantidad":3.0,"resto":"dientes de ajo","escalable":true,"modo":"simple"},{"texto":"1 cucharada de concentrado de tomate","cantidad":1.0,"resto":"cucharada de concentrado de tomate","escalable":true,"modo":"simple"},{"texto":"1 rama de canela","cantidad":1.0,"resto":"rama de canela","escalable":true,"modo":"simple"},{"texto":"1 cucharadita de orégano seco","cantidad":1.0,"resto":"cucharadita de orégano seco","escalable":true,"modo":"simple"},{"texto":"1 hoja de laurel","cantidad":1.0,"resto":"hoja de laurel","escalable":true,"modo":"simple"},{"texto":"150 ml de vino blanco","cantidad":150.0,"resto":"ml de vino blanco","escalable":true,"modo":"simple"},{"texto":"1 lata (800 g) de tomate pelado","cantidad":1.0,"resto":"lata (800 g) de tomate pelado","escalable":true,"modo":"simple"},{"texto":"Para la bechamel: 125 g de mantequilla sin sal","cantidad":null,"resto":"Para la bechamel: 125 g de mantequilla sin sal","escalable":false},{"texto":"125 g de harina de trigo","cantidad":125.0,"resto":"g de harina de trigo","escalable":true,"modo":"simple"},{"texto":"1 litro de leche entera","cantidad":1.0,"resto":"litro de leche entera","escalable":true,"modo":"simple"},{"texto":"Sal y nuez moscada al gusto","cantidad":null,"resto":"Sal y nuez moscada al gusto","escalable":false},{"texto":"Queso parmesano al gusto","cantidad":null,"resto":"Queso parmesano al gusto","escalable":false},{"texto":"3 yemas de huevo","cantidad":3.0,"resto":"yemas de huevo","escalable":true,"modo":"simple"}],"elaboracion":["Precalentar el horno a 220°. Cortar las berenjenas en rodajas de menos de 1 cm de grosor. Disponerlas sobre una bandeja con papel de horno, rociar con aceite, sal y pimienta, y asar 35-40 minutos, hasta que se claven fácilmente con un cuchillo.","Mientras se asan las berenjenas, picar finamente la cebolla y el ajo. Dorar la carne picada en una sartén a fuego fuerte, desmenuzándola con una espátula; pasar a un bol.","En la misma sartén, rehogar la cebolla y el ajo en aceite de oliva con sal hasta que empiecen a estar translúcidos en los bordes, unos 4 minutos. Añadir la rama de canela y sofreír 1 minuto.","Apartar las verduras a un lado y tostar el concentrado de tomate en el hueco durante 15 segundos. Desglasar con el vino blanco y dejar reducir 2 minutos, hasta que se evapore el alcohol.","Añadir el tomate pelado, el orégano y el laurel, chafando el tomate con la espátula. Devolver la carne a la sartén y cocer 20 minutos a fuego medio, hasta que el líquido se reduzca considerablemente. Rectificar de sal y reservar el ragú.","Sacar las berenjenas del horno. Sofreírlas brevemente en abundante aceite de oliva, 15 segundos por cada cara, para darles un toque dorado extra; reservar.","Calentar la leche en el microondas o en un cazo. Derretir la mantequilla en otro cazo a fuego medio; cuando burbujee, añadir la harina de golpe y cocinar 1 minuto, hasta que desaparezca el olor a harina cruda.","Incorporar la leche caliente poco a poco sin dejar de remover. Una vez integrada toda la leche, sazonar con sal y nuez moscada.","Añadir el parmesano y las yemas; mezclar bien a fuego muy bajo hasta que se integren sin cuajar. Reservar la bechamel.","Mezclar un cazo de bechamel con el ragú de carne para ligarlo ligeramente.","Montar en capas en una fuente: una capa fina de bechamel, berenjenas, ragú, más berenjenas, y terminar con bechamel y abundante parmesano por encima.","Hornear a 200° durante 30 minutos, hasta que la superficie esté dorada. Dejar reposar 20 minutos antes de servir, para que las capas se asienten y sea más fácil de cortar."]},{"categoria":"CONEJO","titulo":"Conejo con Almendras (mamá) (4 personas)","raciones":"4 personas","racionesBase":4,"tiempo":"1 hora","ingredientes":[{"texto":"1 conejo (1 kg)","cantidad":1.0,"resto":"conejo (1 kg)","escalable":true,"modo":"simple"},{"texto":"1 cebolla","cantidad":1.0,"resto":"cebolla","escalable":true,"modo":"simple"},{"texto":"50 gr de almendras","cantidad":50.0,"resto":"gr de almendras","escalable":true,"modo":"simple"},{"texto":"1 bote de tomate triturado o pelado (se puede echar una cucharadita de tomate frito para dar color)","cantidad":1.0,"resto":"bote de tomate triturado o pelado (se puede echar una cucharadita de tomate frito para dar color)","escalable":true,"modo":"simple"},{"texto":"3 pimientos choriceros","cantidad":3.0,"resto":"pimientos choriceros","escalable":true,"modo":"simple"},{"texto":"1 vaso de vino (blanco, tinto o Jerez)","cantidad":1.0,"resto":"vaso de vino (blanco, tinto o Jerez)","escalable":true,"modo":"simple"}],"elaboracion":["Se dora el conejo en la cazuela con un poco de aceite, a fuego medio-alto, dando vueltas durante 8-10 minutos, hasta que coja color por todos los lados, y se aparta. En el mismo aceite, a fuego medio, se pocha la cebolla picada junto con el tomate, removiendo de vez en cuando, 10-12 minutos, hasta que esté bien pochada. Cuando ya esté, se devuelve el conejo a la cazuela. Se remojan las almendras un poco y se añaden también con el conejo. Si se quiere, se puede mojar igualmente el hígado y añadirlo. A continuación se echa el vino y el pimiento choricero en trozos grandes, se tapa y se deja cocer a fuego bajo unos 35-40 minutos, removiendo de vez en cuando, hasta que el conejo esté tierno y la salsa haya ligado."]},{"categoria":"CONEJO","titulo":"Conejo al Ajillo (mamá)","raciones":"4 personas","racionesBase":4,"tiempo":"25 minutos","ingredientes":[{"texto":"1 conejo (aprox. 1,2 kg), troceado en trozos grandes","cantidad":1.0,"resto":"conejo (aprox. 1,2 kg), troceado en trozos grandes","escalable":true,"modo":"simple"},{"texto":"Perejil picado al gusto","cantidad":null,"resto":"Perejil picado al gusto","escalable":false},{"texto":"Ajo picado (3 o 4 dientes)","cantidad":null,"resto":"Ajo picado (3 o 4 dientes)","escalable":false},{"texto":"1 pastilla de Starlux (pollo) diluida en polvo","cantidad":1.0,"resto":"pastilla de Starlux (pollo) diluida en polvo","escalable":true,"modo":"simple"},{"texto":"Un chorro de vinagre de vino","cantidad":null,"resto":"Un chorro de vinagre de vino","escalable":false},{"texto":"Medio vaso de vino seco","cantidad":null,"resto":"Medio vaso de vino seco","escalable":false}],"elaboracion":["Se salpimenta el conejo y se fríe en abundante aceite de oliva bien caliente, a fuego medio-alto, dando vueltas de vez en cuando, unos 15-20 minutos, hasta que esté bien dorado por todos los lados. Se retira el conejo y se reserva, y se quita bastante aceite de la sartén, dejando solo un fondo fino.","Con el fuego ya a temperatura media, se añaden los ajos picados al aceite y se rehogan 1-2 minutos hasta que empiecen a dorarse, con cuidado de que no se quemen. Se añade el perejil, se le dan unas vueltas y después el chorro de vinagre y el vino, subiendo un momento el fuego para flambear (o dejar que se evapore el alcohol). Cuando el fuego de la flambeada se ha ido y ha reducido un poco el líquido, se devuelve el conejo a la sartén, se añade el Starlux disuelto en un poco de agua, se mueve todo bien para que se junte y se deja un par de minutos a fuego bajo para que ligue."]},{"categoria":"CONEJO","titulo":"Conejo Tradicional (mar)","raciones":"4 personas","racionesBase":4,"tiempo":"1 hora","ingredientes":[{"texto":"1 conejo (aprox. 1,2 kg), troceado","cantidad":1.0,"resto":"conejo (aprox. 1,2 kg), troceado","escalable":true,"modo":"simple"},{"texto":"1 cebolla","cantidad":1.0,"resto":"cebolla","escalable":true,"modo":"simple"},{"texto":"1 pimiento rojo y 1 pimiento verde","cantidad":1.0,"resto":"pimiento rojo y 1 pimiento verde","escalable":true,"modo":"simple"},{"texto":"2 dientes de ajo y perejil al gusto","cantidad":2.0,"resto":"dientes de ajo y perejil al gusto","escalable":true,"modo":"simple"},{"texto":"1 cucharadita de pimentón","cantidad":1.0,"resto":"cucharadita de pimentón","escalable":true,"modo":"simple"},{"texto":"Un chorrito de brandy","cantidad":null,"resto":"Un chorrito de brandy","escalable":false},{"texto":"1 hoja de laurel","cantidad":1.0,"resto":"hoja de laurel","escalable":true,"modo":"simple"},{"texto":"Agua (poca)","cantidad":null,"resto":"Agua (poca)","escalable":false}],"elaboracion":["Freír el conejo en una cazuela con aceite a fuego medio-alto, dando vueltas, 8-10 minutos, hasta que esté bien dorado por todos los lados; retirar y reservar. En ese mismo aceite, a fuego medio, freír un poco de cebolla, pimiento rojo y pimiento verde, removiendo de vez en cuando, 8-10 minutos, hasta que estén pochados.","Mientras tanto, majar el ajo y el perejil en el mortero. Una vez pochado todo el sofrito, bajar el fuego, añadir un poquito de pimentón y remover rápido para que no se queme. Devolver el conejo a la cazuela, añadir un poco de brandy, la hoja de laurel y el majado de ajo y perejil, aprovechando para limpiar el mortero con un poco de agua y añadirla también. Tapar y dejar cocer a fuego bajo unos 35-40 minutos, removiendo de vez en cuando, hasta que el conejo esté tierno.","Cuidado con el agua: si se añade después, en lugar de al principio con el majado, el conejo se queda deslavado, así que mejor quedarse cortos e ir añadiendo poco a poco si hace falta."]},{"categoria":"CAZA Y CHARCUTERÍA","titulo":"Callos \"Estilo Ana\" (asun)","raciones":"6 personas","racionesBase":6,"tiempo":"50 min (+ remojo previo 2 h)","ingredientes":[{"texto":"1,5 kg de estómago de ternera limpio","cantidad":1.5,"resto":"kg de estómago de ternera limpio","escalable":true,"modo":"simple"},{"texto":"2 puñados de harina","cantidad":2.0,"resto":"puñados de harina","escalable":true,"modo":"simple"},{"texto":"1 limón","cantidad":1.0,"resto":"limón","escalable":true,"modo":"simple"},{"texto":"1 hoja de laurel","cantidad":1.0,"resto":"hoja de laurel","escalable":true,"modo":"simple"},{"texto":"Unos granos de pimienta negra","cantidad":null,"resto":"Unos granos de pimienta negra","escalable":false},{"texto":"Setas al gusto (opcional)","cantidad":null,"resto":"Setas al gusto (opcional)","escalable":false},{"texto":"Un puñado de almendras","cantidad":null,"resto":"Un puñado de almendras","escalable":false},{"texto":"Una copita de brandy","cantidad":null,"resto":"Una copita de brandy","escalable":false},{"texto":"Sal al gusto","cantidad":null,"resto":"Sal al gusto","escalable":false},{"texto":"2 cayenitas o a gusto","cantidad":2.0,"resto":"cayenitas o a gusto","escalable":true,"modo":"simple"},{"texto":"Pimienta molida al gusto","cantidad":null,"resto":"Pimienta molida al gusto","escalable":false},{"texto":"1 cucharadita de pimentón","cantidad":1.0,"resto":"cucharadita de pimentón","escalable":true,"modo":"simple"},{"texto":"Hierbas al gusto: tomillo, orégano, romero...","cantidad":null,"resto":"Hierbas al gusto: tomillo, orégano, romero...","escalable":false},{"texto":"Chorizo rojo dulce o picante, a gusto, a rodajitas finas","cantidad":null,"resto":"Chorizo rojo dulce o picante, a gusto, a rodajitas finas","escalable":false},{"texto":"100 g de beicon a tiritas","cantidad":100.0,"resto":"g de beicon a tiritas","escalable":true,"modo":"simple"},{"texto":"Para el sofrito: 1/2 lata de tomate natural","cantidad":null,"resto":"Para el sofrito: 1/2 lata de tomate natural","escalable":false},{"texto":"1/2 pimiento rojo o 1 si es de lata","cantidad":null,"resto":"1/2 pimiento rojo o 1 si es de lata","escalable":false},{"texto":"50 g de aceite","cantidad":50.0,"resto":"g de aceite","escalable":true,"modo":"simple"},{"texto":"1/2 cebolla","cantidad":null,"resto":"1/2 cebolla","escalable":false},{"texto":"1 puerro","cantidad":1.0,"resto":"puerro","escalable":true,"modo":"simple"},{"texto":"2 ó 3 ajos","cantidad":2.0,"resto":"ó 3 ajos","escalable":true,"modo":"simple"}],"elaboracion":["Poner el estómago a remojo, que lo cubra escasamente con agua, un par de puñados de harina y un limón a trocitos durante un par de horas +/-. Aclarar debajo del grifo quitando algún trozo que no haya quedado bien limpio.","Poner a hervir en la olla rápida con agua que lo cubra, unos granos de pimienta, sal, laurel y trocitos de limón, media hora +/- desde que empiece a hervir. Si no está bastante cocida dejarlo 5 minutos más.","Sacar y dejar que se enfríe.","Mientras hacer el sofrito poniendo todos los ingredientes en la Th, 6 minutos, temperatura 100° vel 5.","En una tartera de barro poner un poquito de aceite y el beicon y el chorizo; cuando empiecen a dorarse echar los callos que previamente habremos partido a cuadraditos, el sofrito y un poquito de agua. Dejar unos 10 minutos al fuego, añadiendo más agua si fuera necesario.","Están más ricos si se consumen al día siguiente calentándolos unos minutos y añadiendo medio vasito de agua."]},{"categoria":"CAZA Y CHARCUTERÍA","titulo":"Caracoles con Tomate (mamá) (Chica)","raciones":"4 personas","racionesBase":4,"tiempo":"25 minutos","ingredientes":[{"texto":"2 dientes de ajo","cantidad":2.0,"resto":"dientes de ajo","escalable":true,"modo":"simple"},{"texto":"1 cebolla, 1 pimiento verde y 1 pimiento rojo","cantidad":1.0,"resto":"cebolla, 1 pimiento verde y 1 pimiento rojo","escalable":true,"modo":"simple"},{"texto":"100 g de chorizo","cantidad":100.0,"resto":"g de chorizo","escalable":true,"modo":"simple"},{"texto":"Huevos duros (2)","cantidad":null,"resto":"Huevos duros (2)","escalable":false},{"texto":"50 g de bacon","cantidad":50.0,"resto":"g de bacon","escalable":true,"modo":"simple"},{"texto":"Perejil al gusto","cantidad":null,"resto":"Perejil al gusto","escalable":false},{"texto":"2 rebanadas de pan tostado frito","cantidad":2.0,"resto":"rebanadas de pan tostado frito","escalable":true,"modo":"simple"},{"texto":"1 hoja de laurel","cantidad":1.0,"resto":"hoja de laurel","escalable":true,"modo":"simple"},{"texto":"1 kg de caracoles cocidos","cantidad":1.0,"resto":"kg de caracoles cocidos","escalable":true,"modo":"simple"},{"texto":"Tomate frito (con un bote de tomate natural Cortoisa)","cantidad":null,"resto":"Tomate frito (con un bote de tomate natural Cortoisa)","escalable":false}],"elaboracion":["Se echa aceite en una cazuela a fuego medio y se fríen dos trozos de pan; cuando estén dorados, se retiran y se reservan. En ese mismo aceite se echa un poco de cebolla, pimiento verde y pimiento rojo (no mucho) y se deja pochar 8-10 minutos, removiendo de vez en cuando, hasta que esté blandito.","Después se añaden los caracoles, se les dan unas vueltas para que se impregnen bien y se echa el laurel. Se maja en el mortero el ajo, el perejil y el pan frito reservado, y se añade el majado con un poco de agua, removiendo. Se dan unas vueltas más y a continuación se incorpora el bote de tomate frito. Se deja cocer a fuego bajo, removiendo de vez en cuando, unos 10 minutos, hasta que la salsa esté bien ligada, y ya está."]},{"categoria":"CAZA Y CHARCUTERÍA","titulo":"Callos Amparo (mamá)","raciones":"6 personas","racionesBase":6,"tiempo":"1 h 15 min","ingredientes":[{"texto":"1,5 kg de callos","cantidad":1.5,"resto":"kg de callos","escalable":true,"modo":"simple"},{"texto":"1 cebolla","cantidad":1.0,"resto":"cebolla","escalable":true,"modo":"simple"},{"texto":"2 dientes de ajo, perejil al gusto","cantidad":2.0,"resto":"dientes de ajo, perejil al gusto","escalable":true,"modo":"simple"},{"texto":"1 hoja de laurel","cantidad":1.0,"resto":"hoja de laurel","escalable":true,"modo":"simple"},{"texto":"3 cucharadas de aceite","cantidad":3.0,"resto":"cucharadas de aceite","escalable":true,"modo":"simple"}],"elaboracion":["Cocer los callos en la olla exprés junto con un majado de dos dientes de ajo y perejil, el laurel, dos cáscaras de cebolla y sal, cubiertos de agua. Cerrar la olla, poner a fuego fuerte hasta que suba la presión y contar 1 hora desde ahí, bajando a fuego medio, hasta que los callos estén blandos.","Una vez cocidos, en una sartén aparte echar un poco de aceite a fuego medio y dorar un diente de ajo; cuando esté dorado, retirarlo y, con el aceite ya fuera del fuego, echar la harina y el pimentón, removiendo rápido para que no se queme. Añadir un poco del caldo de cocción de los callos, sin dejar de remover, hasta que quede una salsa sin grumos, e incorporarla a la cazuela de los callos. Dejar cocer a fuego bajo 10-15 minutos, removiendo de vez en cuando, hasta que la salsa espese y ligue bien, y listo."]},{"categoria":"CAZA Y CHARCUTERÍA","titulo":"Manillas (mamá)","raciones":"4 personas","racionesBase":4,"tiempo":"30 min (+ cocción previa de las manillas, varias horas si son frescas)","ingredientes":[{"texto":"1 kg de manillas","cantidad":1.0,"resto":"kg de manillas","escalable":true,"modo":"simple"},{"texto":"1 pimiento verde","cantidad":1.0,"resto":"pimiento verde","escalable":true,"modo":"simple"},{"texto":"1 pimiento rojo","cantidad":1.0,"resto":"pimiento rojo","escalable":true,"modo":"simple"},{"texto":"1 cucharadita de pimentón","cantidad":1.0,"resto":"cucharadita de pimentón","escalable":true,"modo":"simple"},{"texto":"1 cucharada de harina","cantidad":1.0,"resto":"cucharada de harina","escalable":true,"modo":"simple"}],"elaboracion":["Cocer las manillas en agua con sal y laurel, a fuego medio, hasta que estén tiernas (varias horas si son frescas, menos si vienen ya semicocidas). En una sartén, a fuego medio, poner aceite y echar el pimiento verde y el pimiento rojo; dejar pochar 8-10 minutos removiendo de vez en cuando hasta que estén blanditos, y entonces añadir las manillas ya cocidas y escurridas. En otra sartén aparte, con un poco de aceite a fuego suave, dorar ligeramente la harina con el pimentón 1 minuto removiendo sin parar para que no se queme, y añadir un poco de caldo de cocer las manillas, sin dejar de remover, hasta obtener una salsa fina sin grumos. Incorporar esta salsa a la cazuela con las manillas y dejar hacer todo junto a fuego bajo 10-15 minutos, hasta que quede bien ligado."]},{"categoria":"CAZA Y CHARCUTERÍA","titulo":"Chorizos (mamá) (para 70 kg)","raciones":"para 70 kg de carne (chorizos)","racionesBase":70,"tiempo":"15 minutos (+ reposo de la fusión 48 h)","ingredientes":[{"texto":"Ajos: 2 cabezas no muy grandes","cantidad":null,"resto":"Ajos: 2 cabezas no muy grandes","escalable":false},{"texto":"Vino blanco: menos de 1 litro  ← Fusión","cantidad":null,"resto":"Vino blanco: menos de 1 litro  ← Fusión","escalable":false},{"texto":"Pimienta: la mitad de un bote  ← Fusión","cantidad":null,"resto":"Pimienta: la mitad de un bote  ← Fusión","escalable":false},{"texto":"8 gr de pimentón picante por kilo","cantidad":8.0,"resto":"gr de pimentón picante por kilo","escalable":true,"modo":"simple"},{"texto":"18 gr de sal por kilo","cantidad":18.0,"resto":"gr de sal por kilo","escalable":true,"modo":"simple"},{"texto":"28 gr de pimentón de la Vera por kilo","cantidad":28.0,"resto":"gr de pimentón de la Vera por kilo","escalable":true,"modo":"simple"}],"elaboracion":["Se hace la fusión: se pican bien los ajos y se mezclan con la pimienta, mojándolo todo un poco con el vino blanco, hasta que quede una pasta homogénea. Se deja reposar en fusión, tapado, 48 horas antes de hacer la envuelta (el amasado y adobo de la carne), para que los sabores se asienten bien.","Proporciones por kilo de carne: 8 gr de pimentón picante, 18 gr de sal y 28 gr de pimentón de la Vera."]},{"categoria":"CAZA Y CHARCUTERÍA","titulo":"Morcillas (mamá) (Lourdes)","raciones":"unas 30-40 morcillas","racionesBase":30,"tiempo":"45 min (+ reposo toda la noche)","ingredientes":[{"texto":"¾ partes del sancochón de cebolla = ±12 kg","cantidad":0.75,"resto":"partes del sancochón de cebolla = ±12 kg","escalable":true,"modo":"simple"},{"texto":"Manteca picada (1 copa)","cantidad":null,"resto":"Manteca picada (1 copa)","escalable":false},{"texto":"Arroz 1 kg","cantidad":null,"resto":"Arroz 1 kg","escalable":false},{"texto":"Sal: 2 puntos pequeños","cantidad":null,"resto":"Sal: 2 puntos pequeños","escalable":false},{"texto":"Pimentón picante: un punto","cantidad":null,"resto":"Pimentón picante: un punto","escalable":false},{"texto":"Pimentón dulce (opcional): un punto","cantidad":null,"resto":"Pimentón dulce (opcional): un punto","escalable":false},{"texto":"Orégano 1 copa","cantidad":null,"resto":"Orégano 1 copa","escalable":false},{"texto":"Sangre: 2 litros +/- (que quede suave)","cantidad":null,"resto":"Sangre: 2 litros +/- (que quede suave)","escalable":false}],"elaboracion":["Preparación previa: se pica la cebolla bien menuda y se mezcla con el arroz crudo, dejándolo reposar junto con el resto de ingredientes toda la noche, para que el arroz se hidrate un poco y coja sabor.","Se rellenan las tripas (los artes) con la mezcla, sin apretar demasiado para que el arroz tenga sitio para hincharse. Se echan a cocer cuando el agua esté ya hirviendo a fuego fuerte, con un poco de sal y hoja de laurel. Desde que rompe a hervir de nuevo, se cuentan 30 minutos de cocción a fuego medio, pinchando alguna de vez en cuando para que no revienten. Cuando estén hechas, se sacan con cuidado y se dejan escurrir."]},{"categoria":"VERDURAS","titulo":"Setas con Patatas (mamá)","raciones":"4 personas","racionesBase":4,"tiempo":"50 minutos","ingredientes":[{"texto":"750 gr setas frescas","cantidad":750.0,"resto":"gr setas frescas","escalable":true,"modo":"simple"},{"texto":"1 kg patatas","cantidad":1.0,"resto":"kg patatas","escalable":true,"modo":"simple"},{"texto":"50 gr mantequilla","cantidad":50.0,"resto":"gr mantequilla","escalable":true,"modo":"simple"},{"texto":"2 dientes de ajo","cantidad":2.0,"resto":"dientes de ajo","escalable":true,"modo":"simple"},{"texto":"1 limón (zumo)","cantidad":1.0,"resto":"limón (zumo)","escalable":true,"modo":"simple"},{"texto":"1 vaso de vino blanco seco","cantidad":1.0,"resto":"vaso de vino blanco seco","escalable":true,"modo":"simple"},{"texto":"Perejil","cantidad":null,"resto":"Perejil","escalable":false}],"elaboracion":["Cuece las patatas con piel en agua con sal hasta que estén tiernas al pinchar (unos 20-25 minutos), pélalas y córtalas en rodajas finas. Colócalas en una fuente de horno untada de mantequilla, formando una base, y deja un hueco en el centro para el relleno de setas.","Derrite 25 gr de mantequilla en una sartén a fuego medio con un chorrito de aceite. Añade los ajos picados y, antes de que tomen color, agrega las setas lavadas y fileteadas. Salpimienta y rocía con el vino. Deja que se evapore el caldo a fuego medio-alto, salteando de vez en cuando, hasta que las setas estén tiernas y hayan soltado y reabsorbido su jugo.","Vuelca las setas en el hueco que has dejado entre las patatas y reparte por encima la mantequilla restante en trocitos y el zumo de limón. Mete al horno, ya precalentado, a temperatura suave (unos 5-6, aproximadamente 100°), durante 15-20 minutos, hasta que esté todo bien caliente y ligeramente dorado por encima."]},{"categoria":"VERDURAS","titulo":"Huevos Guisados con Espárragos (mar) (Cabón)","raciones":"4 personas","racionesBase":4,"tiempo":"30 minutos","ingredientes":[{"texto":"1 manojo de espárragos (aprox. 500 g)","cantidad":1.0,"resto":"manojo de espárragos (aprox. 500 g)","escalable":true,"modo":"simple"},{"texto":"1 cebolla","cantidad":1.0,"resto":"cebolla","escalable":true,"modo":"simple"},{"texto":"1 cucharada de harina","cantidad":1.0,"resto":"cucharada de harina","escalable":true,"modo":"simple"},{"texto":"500 ml de caldo de los espárragos","cantidad":500.0,"resto":"ml de caldo de los espárragos","escalable":true,"modo":"simple"},{"texto":"4 huevos","cantidad":4.0,"resto":"huevos","escalable":true,"modo":"simple"},{"texto":"8 rodajas de chorizo","cantidad":8.0,"resto":"rodajas de chorizo","escalable":true,"modo":"simple"}],"elaboracion":["En una sartén, a fuego medio, se sofríe un poco de cebolla picada, removiendo de vez en cuando, 8 minutos, hasta que esté blandita. Se echa un poco de harina y se rehoga 1 minuto removiendo sin parar para que no se queme, y se añade el caldo de los espárragos poco a poco, sin dejar de remover, hasta que quede una salsa ligada y sin grumos. Se añaden a continuación los espárragos cortados en trozos y más caldo, el que se necesite para que quede con textura de guiso, y se deja cocer a fuego bajo 10-12 minutos. A continuación se echan los huevos, dejando que cuajen despacio en la salsa, removiendo suavemente, unos 3-4 minutos, y casi al final se añaden unas rodajas de chorizo, dejando un par de minutos más para que suelten su sabor."]},{"categoria":"VERDURAS","titulo":"Alubias con Chipirones (mar)","raciones":"4 personas","racionesBase":4,"tiempo":"30 minutos","ingredientes":[{"texto":"1 puñado de alubias por persona (o de bote)","cantidad":1.0,"resto":"puñado de alubias por persona (o de bote)","escalable":true,"modo":"simple"},{"texto":"1 chipirón por persona","cantidad":1.0,"resto":"chipirón por persona","escalable":true,"modo":"simple"},{"texto":"Cebolla (fonda) ½ cebolla","cantidad":null,"resto":"Cebolla (fonda) ½ cebolla","escalable":false},{"texto":"2 dientes de ajo y perejil al gusto","cantidad":2.0,"resto":"dientes de ajo y perejil al gusto","escalable":true,"modo":"simple"}],"elaboracion":["Con las alubias ya cocidas (o de bote y escurridas), se pone aceite en una cazuela a fuego medio y se rehoga la cebolla picada 8 minutos hasta que esté transparente. Se añaden los chipirones y se rehogan removiendo de vez en cuando 5-6 minutos hasta que suelten la tinta y se pongan bien negros. Se echan entonces las alubias. Se maja el ajo y el perejil en el mortero y se incorpora a la cazuela. Se deja cocer todo junto a fuego bajo 10-15 minutos, removiendo de vez en cuando, hasta que los sabores se junten y quede con una salsa ligera."]},{"categoria":"VERDURAS","titulo":"Cardo con Almendras (mar)","raciones":"4 personas","racionesBase":4,"tiempo":"15 minutos","ingredientes":[{"texto":"1 kg de cardo (cocido y escurrido)","cantidad":1.0,"resto":"kg de cardo (cocido y escurrido)","escalable":true,"modo":"simple"},{"texto":"30 g de mantequilla","cantidad":30.0,"resto":"g de mantequilla","escalable":true,"modo":"simple"},{"texto":"2 cucharadas de aceite","cantidad":2.0,"resto":"cucharadas de aceite","escalable":true,"modo":"simple"},{"texto":"2 dientes de ajo cortados en trocitos","cantidad":2.0,"resto":"dientes de ajo cortados en trocitos","escalable":true,"modo":"simple"},{"texto":"30 g de almendras picadas","cantidad":30.0,"resto":"g de almendras picadas","escalable":true,"modo":"simple"},{"texto":"50 g de trocitos de jamón","cantidad":50.0,"resto":"g de trocitos de jamón","escalable":true,"modo":"simple"},{"texto":"1 cucharada de harina","cantidad":1.0,"resto":"cucharada de harina","escalable":true,"modo":"simple"}],"elaboracion":["Se funde un poco de mantequilla en aceite en una sartén a fuego medio, y se saltean los dos dientes de ajo cortados en trocitos junto con unas almendras picadas, removiendo, 2-3 minutos, hasta que comiencen a dorarse (con cuidado de que no se quemen). Se añaden unos trocitos de jamón y se rehogan 1 minuto; se espolvorea una cucharada de harina y se diluye bien removiendo para que no queden grumos. Se vierte todo sobre el cardo, que previamente habremos calentado y escurrido, y se le da un ligero hervor de 2-3 minutos a fuego medio, removiendo con movimientos rápidos dentro de la cazuela para que la salsa ligue y quede bien repartida por todo el cardo."]},{"categoria":"VERDURAS","titulo":"Abanicos Tricolores de Calabacín en Papillote con Salsa de Carne (asun)","raciones":"6 personas","racionesBase":6,"tiempo":"1 hora","ingredientes":[{"texto":"Para el papillote: 3 calabacines medianos","cantidad":null,"resto":"Para el papillote: 3 calabacines medianos","escalable":false},{"texto":"6 tomates rojos y duros","cantidad":6.0,"resto":"tomates rojos y duros","escalable":true,"modo":"simple"},{"texto":"250 g de queso mozzarella partido en lonchas finas","cantidad":250.0,"resto":"g de queso mozzarella partido en lonchas finas","escalable":true,"modo":"simple"},{"texto":"Sal, pimienta, orégano y aceite de oliva virgen extra","cantidad":null,"resto":"Sal, pimienta, orégano y aceite de oliva virgen extra","escalable":false},{"texto":"Papel de aluminio","cantidad":null,"resto":"Papel de aluminio","escalable":false},{"texto":"Para la salsa: 50 g de aceite de oliva","cantidad":null,"resto":"Para la salsa: 50 g de aceite de oliva","escalable":false},{"texto":"100 g de cebolla","cantidad":100.0,"resto":"g de cebolla","escalable":true,"modo":"simple"},{"texto":"100 g de zanahorias","cantidad":100.0,"resto":"g de zanahorias","escalable":true,"modo":"simple"},{"texto":"150 g de champiñones laminados","cantidad":150.0,"resto":"g de champiñones laminados","escalable":true,"modo":"simple"},{"texto":"250 g de tomate natural triturado","cantidad":250.0,"resto":"g de tomate natural triturado","escalable":true,"modo":"simple"},{"texto":"250 g de carne picada de ternera","cantidad":250.0,"resto":"g de carne picada de ternera","escalable":true,"modo":"simple"},{"texto":"200 g de vino blanco","cantidad":200.0,"resto":"g de vino blanco","escalable":true,"modo":"simple"},{"texto":"100 g de agua","cantidad":100.0,"resto":"g de agua","escalable":true,"modo":"simple"},{"texto":"Pimienta y orégano","cantidad":null,"resto":"Pimienta y orégano","escalable":false}],"elaboracion":["1. Corte los tomates en rodajas finas y reserve.","2. Corte los calabacines en dos trozos de la misma medida. A continuación haga cortes longitudinales en cada trozo sin llegar al final de uno de los extremos, a modo de abanico. Introduzca en cada corte una rodaja de tomate y otra de queso mozzarella; haga lo mismo con las seis mitades. Reserve.","3. Pincele 6 rectángulos de papel de aluminio con aceite, espolvoree los calabacines con orégano y colóquelos en el centro, cierre muy bien los paquetes y coloque en el recipiente Varoma. Reserve.","4. Ponga en el vaso todos los ingredientes de la salsa menos el aceite, los champiñones y la carne. Tritúrelos durante 15 segundos en velocidad 6, baje con la espátula lo que haya quedado en las paredes, eche el aceite y programe 7 minutos 100°, velocidad 1. Terminado el tiempo, añada la carne y los champiñones y programe 7 minutos, temperatura Varoma, velocidad 1.","5. Añada el resto de los ingredientes y programe 35 minutos, temperatura Varoma, velocidad 1, colocando el recipiente Varoma con los calabacines sobre la tapadera.","6. Cuando termine, pruebe la salsa, rectifique la sazón y retire el papel de aluminio.","7. Vierta la salsa en una fuente y sobre ella coloque los abanicos de calabacín, procurando que no se rompan.","Nota: si lo desea puede acompañarlos con arroz."]},{"categoria":"VERDURAS","titulo":"Albóndigas de Avena (asun)","raciones":"unas 20 albóndigas","racionesBase":20,"tiempo":"45 minutos","ingredientes":[{"texto":"2 tazas de avena fina puesta antes a remojo en agua o caldo de verduras","cantidad":2.0,"resto":"tazas de avena fina puesta antes a remojo en agua o caldo de verduras","escalable":true,"modo":"simple"},{"texto":"1/2 taza de pan integral también puesto a remojo y desmenuzado","cantidad":null,"resto":"1/2 taza de pan integral también puesto a remojo y desmenuzado","escalable":false},{"texto":"1 cucharada de setas secas remojadas, exprimidas y picadas","cantidad":1.0,"resto":"cucharada de setas secas remojadas, exprimidas y picadas","escalable":true,"modo":"simple"},{"texto":"2 cucharadas de nueces bien picadas","cantidad":2.0,"resto":"cucharadas de nueces bien picadas","escalable":true,"modo":"simple"},{"texto":"2 dientes de ajo picados","cantidad":2.0,"resto":"dientes de ajo picados","escalable":true,"modo":"simple"},{"texto":"2 cucharadas de perejil picado","cantidad":2.0,"resto":"cucharadas de perejil picado","escalable":true,"modo":"simple"},{"texto":"2 cucharadas de queso rallado","cantidad":2.0,"resto":"cucharadas de queso rallado","escalable":true,"modo":"simple"},{"texto":"3 cebollitas picadas y rehogadas en aceite de oliva","cantidad":3.0,"resto":"cebollitas picadas y rehogadas en aceite de oliva","escalable":true,"modo":"simple"},{"texto":"1 pizca de jengibre en polvo","cantidad":1.0,"resto":"pizca de jengibre en polvo","escalable":true,"modo":"simple"},{"texto":"1 cucharadita de orégano","cantidad":1.0,"resto":"cucharadita de orégano","escalable":true,"modo":"simple"},{"texto":"2 huevos","cantidad":2.0,"resto":"huevos","escalable":true,"modo":"simple"},{"texto":"Pan rallado integral (cantidad necesaria)","cantidad":null,"resto":"Pan rallado integral (cantidad necesaria)","escalable":false}],"elaboracion":["Picar todos los ingredientes secos que lo necesiten, por separado.","Poner las cebollitas con el aceite, picarlas y rehogarlas en velocidad 1, temperatura Varoma, 5 minutos. Reservar la cebolla.","Mezclar todos los ingredientes, el pan rallado el último, para que absorba la humedad sobrante.","Formar las albóndigas y hornearlas a 180° durante 20-25 minutos, hasta que estén doraditas.","Servirlas con salsa de tomate o la que más guste."]},{"categoria":"VERDURAS","titulo":"Albóndigas de Soja con Zanahorias (asun)","raciones":"4 personas","racionesBase":4,"tiempo":"30 minutos","ingredientes":[{"texto":"750 g de zanahorias","cantidad":750.0,"resto":"g de zanahorias","escalable":true,"modo":"simple"},{"texto":"100 g de cebolla o la mitad de una cebolla mediana","cantidad":100.0,"resto":"g de cebolla o la mitad de una cebolla mediana","escalable":true,"modo":"simple"},{"texto":"3 ajos","cantidad":3.0,"resto":"ajos","escalable":true,"modo":"simple"},{"texto":"30 g de aceite virgen de oliva","cantidad":30.0,"resto":"g de aceite virgen de oliva","escalable":true,"modo":"simple"},{"texto":"Perejil al gusto","cantidad":null,"resto":"Perejil al gusto","escalable":false},{"texto":"1 pastilla de caldo vegetal","cantidad":1.0,"resto":"pastilla de caldo vegetal","escalable":true,"modo":"simple"},{"texto":"Albóndigas de soja texturizada al gusto","cantidad":null,"resto":"Albóndigas de soja texturizada al gusto","escalable":false}],"elaboracion":["Antes de nada, poner a hidratar las albóndigas de soja texturizada en caldo vegetal o leche con una pizca de sal.","Trocear la cebolla a velocidad 3 1/2 y reservar. Lo mismo con los ajos (o filetearlos a mano). Trocear las zanahorias en cuadraditos o en tiras no muy gruesas, y reservar.","En el vaso limpio y seco, calentar el aceite 5 minutos, velocidad 1, temperatura Varoma. A mitad del tiempo, echar por el bocal los ajos, y esperar a que acabe (quitar el cubilete para que realmente se frían). Una vez parada la máquina, poner la mariposa, y echar la cebolla y la pastilla de caldo vegetal. Programar 1 minuto, velocidad 1, temperatura 100°. Poner el cubilete.","Seguidamente echar en el vaso las zanahorias troceadas y programar de 12 a 15 minutos (según se gusten las verduras, al dente o más cocidas), echando un pelín de agua, velocidad 1, temperatura 100°. A mitad del tiempo elegido, parar la máquina e incorporar las albóndigas de soja. Sazonar, y si al final queda mucho líquido, programar 1 minuto, temperatura Varoma, velocidad 1, para que se evapore."]},{"categoria":"VERDURAS","titulo":"Alcachofas (asun)","raciones":"4 personas","racionesBase":4,"tiempo":"30 minutos","ingredientes":[{"texto":"600 g de patatas","cantidad":600.0,"resto":"g de patatas","escalable":true,"modo":"simple"},{"texto":"500 g de alcachofas","cantidad":500.0,"resto":"g de alcachofas","escalable":true,"modo":"simple"},{"texto":"30 g de ajos","cantidad":30.0,"resto":"g de ajos","escalable":true,"modo":"simple"},{"texto":"300 g de agua","cantidad":300.0,"resto":"g de agua","escalable":true,"modo":"simple"},{"texto":"50 g de aceite","cantidad":50.0,"resto":"g de aceite","escalable":true,"modo":"simple"},{"texto":"Sal y pimienta al gusto","cantidad":null,"resto":"Sal y pimienta al gusto","escalable":false}],"elaboracion":["Limpie bien las alcachofas y pártalas en 4 o 5 trozos. Reserve.","Coloque la mariposa en las cuchillas y vierta en el vaso todos los ingredientes.","Programe 17 minutos, temperatura Varoma, velocidad 1.","Compruebe que esté cocido; de no ser así, programe 2 minutos más."]},{"categoria":"VERDURAS","titulo":"Alcachofas Salteadas con Jamón (asun)","raciones":"4 personas","racionesBase":4,"tiempo":"25 minutos","ingredientes":[{"texto":"50 g de aceite de oliva","cantidad":50.0,"resto":"g de aceite de oliva","escalable":true,"modo":"simple"},{"texto":"200 g de jamón serrano","cantidad":200.0,"resto":"g de jamón serrano","escalable":true,"modo":"simple"},{"texto":"800 g de alcachofas congeladas","cantidad":800.0,"resto":"g de alcachofas congeladas","escalable":true,"modo":"simple"},{"texto":"Sal y pimienta blanca al gusto","cantidad":null,"resto":"Sal y pimienta blanca al gusto","escalable":false}],"elaboracion":["Descongelar completamente las alcachofas y escurrirlas bien apretándolas entre las manos para que no tengan nada de líquido, secándolas incluso con papel absorbente de cocina. A veces conviene cocerlas primero 10 minutos y luego escurrirlas bien.","Cortar el jamón a daditos.","Calentar el aceite en el vaso en velocidad 1, temperatura Varoma, durante 5 minutos. A continuación colocar la mariposa encajada en las cuchillas y añadir el jamón picado y sofreírlo a velocidad 1, a 100°, 5 minutos.","Añadir las alcachofas, salpimentarlas y programar velocidad 1, 100 grados y entre 8 y 10 minutos, dependiendo de la variedad de alcachofa y del punto que nos guste; si es necesario, programar algún minuto más de cocción hasta que estén al gusto de cada uno.","Una vez que las alcachofas están tiernas, si han soltado mucho jugo, sacar del vaso las 3/4 partes, puesto que ya están cocidas, y con las restantes programar 2 o 3 minutos velocidad 1 y temperatura Varoma; se nos quedarán casi sequitas y el juguito restante estará muy concentrado."]},{"categoria":"VERDURAS","titulo":"Arbeyos con Jamón (asun)","raciones":"4 personas","racionesBase":4,"tiempo":"1 hora","ingredientes":[{"texto":"250 g de jamón","cantidad":250.0,"resto":"g de jamón","escalable":true,"modo":"simple"},{"texto":"1 kg de arbeyos (guisantes)","cantidad":1.0,"resto":"kg de arbeyos (guisantes)","escalable":true,"modo":"simple"},{"texto":"3/4 litro de agua o caldo","cantidad":null,"resto":"3/4 litro de agua o caldo","escalable":false},{"texto":"1 cebolla","cantidad":1.0,"resto":"cebolla","escalable":true,"modo":"simple"},{"texto":"Pimienta al gusto","cantidad":null,"resto":"Pimienta al gusto","escalable":false},{"texto":"50 g de aceite","cantidad":50.0,"resto":"g de aceite","escalable":true,"modo":"simple"},{"texto":"Sal al gusto","cantidad":null,"resto":"Sal al gusto","escalable":false}],"elaboracion":["Se echa el aceite en el vaso y se programa 3 minutos 100° velocidad 1.","Se añade la cebolla y se deja 5 minutos 100° y velocidad 4.","Se pone la mariposa a las cuchillas y se introduce el jamón partido en dados, lo rehogamos 5 minutos 100° velocidad 1.","Por último se añaden los arbeyos, el agua, la sal y la pimienta y se programan 50 minutos 100°, velocidad 1.","Nota: seguidamente se pasan a una fuente y se sirven calientes; se puede acompañar el plato con huevos cocidos y unas tiras de pimiento morrón."]},{"categoria":"VERDURAS","titulo":"Berenjenas a la Crema con Gambas y Jamón (asun)","raciones":"6 personas","racionesBase":6,"tiempo":"1 h 30 min","ingredientes":[{"texto":"750 g de berenjenas de color violeta","cantidad":750.0,"resto":"g de berenjenas de color violeta","escalable":true,"modo":"simple"},{"texto":"500 g de gambas frescas con cabeza y piel","cantidad":500.0,"resto":"g de gambas frescas con cabeza y piel","escalable":true,"modo":"simple"},{"texto":"150 g de queso Emmental","cantidad":150.0,"resto":"g de queso Emmental","escalable":true,"modo":"simple"},{"texto":"200 g de jamón serrano","cantidad":200.0,"resto":"g de jamón serrano","escalable":true,"modo":"simple"},{"texto":"3 o 4 dientes de ajo","cantidad":3.0,"resto":"o 4 dientes de ajo","escalable":true,"modo":"simple"},{"texto":"1/2 decilitro de aceite si \"freímos\" los ajos en el microondas (= 5 cucharadas)","cantidad":null,"resto":"1/2 decilitro de aceite si \"freímos\" los ajos en el microondas (= 5 cucharadas)","escalable":false},{"texto":"Aceite de oliva en abundancia si vamos a freír las berenjenas en la sartén","cantidad":null,"resto":"Aceite de oliva en abundancia si vamos a freír las berenjenas en la sartén","escalable":false},{"texto":"2-3 cucharadas de harina si vamos a freír las berenjenas","cantidad":2.0,"cantidad2":3.0,"resto":"cucharadas de harina si vamos a freír las berenjenas","escalable":true,"modo":"rango"},{"texto":"400 ml de bechamel","cantidad":400.0,"resto":"ml de bechamel","escalable":true,"modo":"simple"}],"elaboracion":["1. Lavar las gambas debajo del grifo de agua fría y nunca sumergidas, escurrirlas en un colador, y pelarlas conservando las cabezas y las patitas y tirando la piel del cuerpo.","Con estas cabezas y patas y 3 decilitros de leche haremos un concentrado de gambas o marisco en el Thermomix o por el método tradicional.","2. Pelar los ajos y dejarlos enteros.","3. Picar muy fino el jamón con la Thermomix en velocidad máxima, pero sólo ir y volver; en el Thermomix conseguimos hebritas finas de jamón que van muy bien para este plato.","4. Cortar las berenjenas en rodajas de 1/2 cm de grosor, espolvorearlas con bastante sal y dejarlas así unos 5 o 10 minutos. Con este procedimiento conseguimos que pierdan el amargor que a veces tienen. Si la pila de la cocina está bien limpia y seca se pueden poner allí las berenjenas. Al cabo de ese tiempo, lavarlas bien para que no resulten saladas, escurrirlas, secarlas un poco con papel absorbente de cocina y cocinarlas.","5. Se pueden freír o cocer en su jugo, como veremos un poco más adelante.","6. Confeccionar la bechamel por cualquiera de los 3 procedimientos que se pueden emplear: el Thermomix si lo tenemos, el microondas o el cacito. Como vamos a utilizar un \"concentrado de gambas\" en lugar de leche, esta bechamel saldrá de color rosa intenso y con un sabor delicioso a gamba.","Elaboración de las berenjenas:","a. Freír las berenjenas en la sartén. Si las vamos a freír, enharinarlas previamente. Poner a calentar aceite de oliva en abundancia, el suficiente para cubrirlas, y cuando el aceite esté ligeramente caliente meter los ajos y dejarlos dorar sin quemarlos. Con este procedimiento aromatizamos un poco el aceite que luego transmitirá el sabor del ajo a las berenjenas.","A continuación retirar los ajos e ir metiendo las rodajas de berenjena enharinadas. A los pocos segundos, cuando se comprenda que ya están doradas por el lado que está sumergido en el aceite, darles la vuelta ayudándonos de un tenedor largo de cocina y de una espumadera de alambre o de unas pinzas de cocina. Sacarlas, ayudándonos de dichos utensilios, y dejarlas encima de papel absorbente de cocina para que éste absorba el exceso de aceite y las gotas que caen de la espumadera.","b. Cocción de las berenjenas en su jugo en el microondas. Si se tiene microondas y se quiere evitar el proceso engorroso de freír las berenjenas, y evitar también las calorías que añadimos al plato al freírlas, se pueden cocer en el microondas. Como además la receta lleva muchos ingredientes, a la hora de comer este plato no se nota para nada si las berenjenas están fritas o cocidas, y resultan así más fáciles de digerir y menos calóricas.","Colocar las berenjenas en un buen recipiente que tenga una tapa que encaje bien. Como las microondas penetran sólo 2 o 3 centímetros de profundidad, las berenjenas se pondrán en una sola capa, y como no nos caben todas de una sola vez, las haremos en dos veces. Se pueden cocer así, sin nada, ni siquiera aceite, puesto que la siguiente preparación, la bechamel, sí va a llevar grasa, la mantequilla.","Si se quisiera, también se podrían \"freír\" los ajos enteros y pelados en el microondas, con 1/2 decilitro de aceite, en el mismo recipiente del que hablábamos anteriormente, pero esta vez con el recipiente destapado. Tener la precaución de remover bien los ajos con el aceite antes de freírlos, para que se queden bien envueltos de grasa. Programar 2 o 3 minutos, al 100 por 100 de potencia (potencia máxima), vigilándolos porque se pueden quemar.","A continuación sacar los ajos, añadir las rodajas de berenjenas y removerlas bien con el aceite de los ajos. Dependiendo de la potencia del microondas, de la variedad de las berenjenas, y de su grosor, se podrá tardar 6 o 7 minutos al 100 por 100 de potencia.","4. Comprobar siempre que están hechas, pinchando con una aguja de cocina, y no pasarse nunca de tiempo para que no se resequen.","5. Si no estuvieran blandas, programar algún minuto más.","6. Si freímos ajos, las berenjenas se pondrán en la parte inferior de la fuente multiuso, en donde hemos frito los ajos, y no usaremos la rejilla.","Elaboración final del plato y presentación:","1. En una fuente refractaria grande, puesto que va a ir al horno, poner las berenjenas en una capa.","2. Encima el jamón muy picado, luego las gambas crudas y cubrir con la bechamel.","3. Espolvorear por encima el queso rallado y meter en el horno caliente y con el gratinador muy fuerte durante unos 5-8 minutos, hasta que el queso se funda y forme una bonita costra dorada.","4. Servir a continuación.","Aquí la presentación va unida al recipiente, y hay fuentes de horno de cerámica muy bonitas.","Mi sugerencia: no olvidar que en el microondas se puede cocinar con muy poca grasa, pero todos los alimentos deben estar bien envueltos en ella."]},{"categoria":"VERDURAS","titulo":"Berenjenas Rellenas de Salmón (asun)","raciones":"6 personas","racionesBase":6,"tiempo":"1 hora","ingredientes":[{"texto":"3 berenjenas grandes","cantidad":3.0,"resto":"berenjenas grandes","escalable":true,"modo":"simple"},{"texto":"3 rodajas gordas de salmón (aproximadamente 350 g)","cantidad":3.0,"resto":"rodajas gordas de salmón (aproximadamente 350 g)","escalable":true,"modo":"simple"},{"texto":"1 huevo","cantidad":1.0,"resto":"huevo","escalable":true,"modo":"simple"},{"texto":"1 hoja de laurel","cantidad":1.0,"resto":"hoja de laurel","escalable":true,"modo":"simple"},{"texto":"2 pimientos del piquillo","cantidad":2.0,"resto":"pimientos del piquillo","escalable":true,"modo":"simple"},{"texto":"60 g de margarina","cantidad":60.0,"resto":"g de margarina","escalable":true,"modo":"simple"},{"texto":"70 g de harina","cantidad":70.0,"resto":"g de harina","escalable":true,"modo":"simple"},{"texto":"2 cucharadas de aceite de oliva","cantidad":2.0,"resto":"cucharadas de aceite de oliva","escalable":true,"modo":"simple"},{"texto":"400 g de leche","cantidad":400.0,"resto":"g de leche","escalable":true,"modo":"simple"},{"texto":"3 lonchas de queso para fundir (puede ser Havarti)","cantidad":3.0,"resto":"lonchas de queso para fundir (puede ser Havarti)","escalable":true,"modo":"simple"},{"texto":"6 cucharadas de tomate frito","cantidad":6.0,"resto":"cucharadas de tomate frito","escalable":true,"modo":"simple"},{"texto":"Ajo en polvo, nuez moscada, pimienta y sal","cantidad":null,"resto":"Ajo en polvo, nuez moscada, pimienta y sal","escalable":false}],"elaboracion":["Previamente se lavan las berenjenas, se secan y se parten a lo largo, por la mitad, se les hacen unos cortes encima, se les echa un poquito de sal y al horno (fuerte, 220°) durante 25 ó 30 minutos. Cuando estén, se sacan y se dejan enfriar para luego sacarles la pulpa con una cuchara y reservar en un bol la pulpa; y las conchas de las berenjenas las colocamos en la bandeja del horno para rellenar.","El salmón lo cocemos unos minutos en agua, con un pellizco de sal y una hoja de laurel, dejamos enfriar y limpiamos bien de piel y espinas, reservamos.","En el vaso de la Thermomix, bien limpio y seco, echamos la margarina, el aceite y la harina y programamos 2 minutos, 100°, velocidad 4.","Agregamos la leche (a temperatura ambiente) y programamos 4 minutos, temperatura 90° velocidad 4.","Añadimos el salmón y la pulpa de las berenjenas que teníamos reservadas, los pimientos del piquillo, el huevo, ajo, nuez moscada, pimienta y sal y le ponemos 6 segundos a velocidad 3 1/2; acto seguido programamos 4 minutos, temperatura 80°, velocidad 1; puede ayudarse con la espátula.","Rellenamos las conchas de las berenjenas con esta mezcla y le ponemos por encima una cucharada de tomate a cada una, y media loncha de queso; lo llevamos al horno y gratinamos unos segundos."]},{"categoria":"VERDURAS","titulo":"Bróccoli Vestido de Fiesta (asun)","raciones":"6 personas","racionesBase":6,"tiempo":"55 minutos","ingredientes":[{"texto":"Para los rollitos: 600 g de brócoli congelado","cantidad":null,"resto":"Para los rollitos: 600 g de brócoli congelado","escalable":false},{"texto":"12 lonchas finas de jamón de York (unos 300 g)","cantidad":12.0,"resto":"lonchas finas de jamón de York (unos 300 g)","escalable":true,"modo":"simple"},{"texto":"12 lonchas finas de queso para sándwich","cantidad":12.0,"resto":"lonchas finas de queso para sándwich","escalable":true,"modo":"simple"},{"texto":"Sal y pimienta para el brócoli","cantidad":null,"resto":"Sal y pimienta para el brócoli","escalable":false},{"texto":"1/2 litro de agua que pondremos en el vaso para cocer el brócoli al vapor","cantidad":null,"resto":"1/2 litro de agua que pondremos en el vaso para cocer el brócoli al vapor","escalable":false},{"texto":"Para cubrir los rollitos: 800 g de leche","cantidad":null,"resto":"Para cubrir los rollitos: 800 g de leche","escalable":false},{"texto":"80 g de harina","cantidad":80.0,"resto":"g de harina","escalable":true,"modo":"simple"},{"texto":"50 g de mantequilla","cantidad":50.0,"resto":"g de mantequilla","escalable":true,"modo":"simple"},{"texto":"30 g de aceite","cantidad":30.0,"resto":"g de aceite","escalable":true,"modo":"simple"},{"texto":"150 g de queso Gruyère, Emmental o parmesano, rallado para gratinar","cantidad":150.0,"resto":"g de queso Gruyère, Emmental o parmesano, rallado para gratinar","escalable":true,"modo":"simple"},{"texto":"Sal, pimienta y nuez moscada","cantidad":null,"resto":"Sal, pimienta y nuez moscada","escalable":false}],"elaboracion":["Ralle el queso, saque del vaso y reserve.","Ponga el agua en el vaso del Thermomix, y programe durante 5 minutos a velocidad 2 y temperatura Varoma.","Ponga el brócoli en el recipiente Varoma (lo puede hacer sin descongelar, en cuyo caso tardará unos minutos más en hacerse). Cuando el agua hierva y salga vapor, quite el cubilete y ponga el recipiente Varoma sobre la tapadera. Programe 15 minutos más a la misma temperatura y velocidad.","Cuando termine, compruebe la cocción de la verdura. Ponga el brócoli sobre papel de cocina, séquelo y salpiméntelo.","Para hacer los rollitos, ponga sobre las lonchas de jamón una de queso y el brócoli y envuélvalo a continuación. Vaya colocando los rollitos en una fuente de horno y resérvelos.","Prepare una bechamel con el resto de los ingredientes, excepto el queso rallado, poniéndolos en el vaso del Thermomix y programando 7 minutos a 90° en velocidad 4.","Cubra los rollitos con esta bechamel y espolvoree con el queso rallado.","Con el horno precalentado a 180°, hornee primero durante 10 minutos y gratine a continuación hasta que el queso tenga un bonito color dorado.","Nota: puede cambiar el brócoli por endibias o puerros cocidos al vapor."]},{"categoria":"VERDURAS","titulo":"Tacos de Pulled Setas (diegodoal)","raciones":"4 personas (unos 8 tacos)","racionesBase":4,"tiempo":"45 minutos","ingredientes":[{"texto":"4 setas de cardo","cantidad":4.0,"resto":"setas de cardo","escalable":true,"modo":"simple"},{"texto":"2 chiles anchos","cantidad":2.0,"resto":"chiles anchos","escalable":true,"modo":"simple"},{"texto":"2 chiles guajillos","cantidad":2.0,"resto":"chiles guajillos","escalable":true,"modo":"simple"},{"texto":"1 cebolla","cantidad":1.0,"resto":"cebolla","escalable":true,"modo":"simple"},{"texto":"2 cucharadas de aceite de girasol","cantidad":2.0,"resto":"cucharadas de aceite de girasol","escalable":true,"modo":"simple"},{"texto":"Media cucharadita de chile en polvo","cantidad":null,"resto":"Media cucharadita de chile en polvo","escalable":false},{"texto":"Media cucharadita de comino molido","cantidad":null,"resto":"Media cucharadita de comino molido","escalable":false},{"texto":"Media cucharadita de orégano","cantidad":null,"resto":"Media cucharadita de orégano","escalable":false},{"texto":"1 cucharada de concentrado de tomate","cantidad":1.0,"resto":"cucharada de concentrado de tomate","escalable":true,"modo":"simple"},{"texto":"200 ml de caldo","cantidad":200.0,"resto":"ml de caldo","escalable":true,"modo":"simple"},{"texto":"Sal, azúcar y vinagre blanco al gusto","cantidad":null,"resto":"Sal, azúcar y vinagre blanco al gusto","escalable":false},{"texto":"8 tortillas de maíz y cebolla morada encurtida, para servir","cantidad":8.0,"resto":"tortillas de maíz y cebolla morada encurtida, para servir","escalable":true,"modo":"simple"}],"elaboracion":["clavar un tenedor justo debajo del sombrero de una de las setas de cardo y, con otro tenedor, deshilachar el tallo, ayudándose de un cuchillo en las zonas más duras (la estructura fibrosa de la seta de cardo es lo que imita la textura de la carne mechada). Picar los sombreros y mezclarlos con los tallos deshilachados; reservar.","Limpiar los chiles anchos y guajillos y sumergirlos en agua hirviendo junto con media cebolla en trozos grandes. Apagar el fuego y dejarlos en remojo 5 minutos más.","Triturar todos los sólidos en un procesador junto con un poco del líquido de cocción, hasta obtener una pasta homogénea.","En una sartén a fuego alto, sofreír la otra media cebolla picada con sal y pimienta negra 5 minutos, buscando que se queme ligeramente en algunos puntos.","Bajar a fuego medio y añadir el chile en polvo, el comino, el orégano, el concentrado de tomate y la pasta de chiles. Mezclar y cocinar 4 minutos, hasta que quede muy espeso y de color profundo.","Añadir el caldo, mezclar, incorporar las setas deshilachadas y cocinar 20 minutos a fuego medio.","Probar, corregir de sal y pimienta, y añadir un chorrito de vinagre blanco. Servir con tortillas de maíz y cebolla morada encurtida."]},{"categoria":"VERDURAS","titulo":"Crema de Shiitake y Portobello (diegodoal)","raciones":"4 personas","racionesBase":4,"tiempo":"1 h 20 min","ingredientes":[{"texto":"media cebolla","cantidad":null,"resto":"media cebolla","escalable":false},{"texto":"30 g de mantequilla","cantidad":30.0,"resto":"g de mantequilla","escalable":true,"modo":"simple"},{"texto":"30 g de harina","cantidad":30.0,"rest s con abundante mantequilla y aceite de oliva hasta que estén doradas.","Triturar el caldo de setas en un procesador hasta que no tenga grumos; tamizarlo y devolverlo a la sartén junto con el agua y las setas salteadas (reservando algunas para el emplatado).","Llevar a ebullición a fuego medio; cuando hierva, bajar el fuego y añadir la nata. Mezclar bien y terminar con sal, pimienta negra y el vinagre.","Emplatar rematando con las setas salteadas reservadas y unas hojas de tomillo."]},{"categoria":"VERDURAS","titulo":"Ragú Boloñesa de Setas (diegodoal)","raciones":"4 personas","racionesBase":4,"tiempo":"40 minutos","ingredientes":[{"texto":"350 g de setas frescas variadas (portobello, shiitake, ostra)","cantidad":350.0,"resto":"g de setas frescas variadas (portobello, shiitake, ostra)","escalable":true,"modo":"simple"},{"texto":"4 dientes de ajo","cantidad":4.0,"resto":"dientes de ajo","escalable":true,"modo":"simple"},{"texto":"1 cebolla","cantidad":1.0,"resto":"cebolla","escalable":true,"modo":"simple"},{"texto":"30 g de mantequilla","cantidad":30.0,"resto":"g de mantequilla","escalable":true,"modo":"simple"},{"texto":"Sal al gusto","cantidad":null,"resto":"Sal al gusto","escalable":false},{"texto":"1 cucharada de concentrado de tomate","cantidad":1.0,"resto":"cucharada de concentrado de tomate","escalable":true,"modo":"simple"},{"texto":"Un chorrito de Pedro Ximénez","cantidad":null,"resto":"Un chorrito de Pedro Ximénez","escalable":false},{"texto":"200 ml de caldo","cantidad":200.0,"resto":"ml de caldo","escalable":true,"modo":"simple"},{"texto":"125 g de pasta por persona","cantidad":125.0,"resto":"g de pasta por persona","escalable":true,"modo":"simple"},{"texto":"50 g de parmesano","cantidad":50.0,"resto":"g de parmesano","escalable":true,"modo":"simple"}],"elaboracion":["picar la cebolla en brunoise, así como las setas muy finas y los dientes de ajo.","En una sartén a fuego medio-alto, añadir abundante aceite de oliva y mantequilla, la cebolla y el ajo; sofr le":true,"modo":"simple"},{"texto":"180 gr de pasas","cantidad":180.0,"resto":"gr de pasas","escalable":true,"modo":"simple"},{"texto":"1 pizca de sal","cantidad":1.0,"resto":"pizca de sal","escalable":true,"modo":"simple"},{"texto":"Canela y vainilla al gusto","cantidad":null,"resto":"Canela y vainilla al gusto","escalable":false}],"elaboracion":["Este bizcocho viene del convento de las Carmelitas Descalzas de Sevilla. Se requieren 10 días para hacerlo y no se usa ni batidora ni frigorífico.","Día 1: Verter el contenido del vaso en un cuenco grande y añadir 1 vaso de azúcar y 1 vaso de harina. Dejar reposar tapado con un paño, sin mezclar, a temperatura ambiente.\nDía 2: Mezclar bien con una cuchara de madera.\nDías 3 y 4: No se toca; se deja reposar tapado.\nDía 5: Añadir 1 vaso de azúcar, 1 vaso de harina y 1 vaso de leche. Dejar reposar sin mezclar.\nDía 6: Mezclar de nuevo con la cuchara.\nDías 7 y 8: No tocar; dejar reposar tapado.\nDía 9: Se apartan 3 vasos y se dan a 3 personas a las que se desea salud y suerte.","Día 10: Añadir el resto de ingredientes: la harina, el aceite, el azúcar, los frutos secos, la leche, la levadura, los huevos, la manzana, las pasas, la sal, la canela y la vainilla. Mezclar todo bien con una cuchara de madera, con movimientos envolventes, hasta que quede una masa homogénea. Verter en un molde untado con mantequilla y enharinado, y meter al horno, ya precalentado, a 180° durante 40-50 minutos, hasta que al pinchar con un palillo salga limpio."]},{"categoria":"REPOSTERÍA","titulo":"Bizcocho de Yogur (mamá)","raciones":"8 personas","racionesBase":8,"tiempo":"50 minutos","ingredientes":[{"texto":"2 yogures naturales","cantidad":2.0,"resto":"yogures naturales","escalable":true,"modo":"simple"},{"texto":"2 medidas de azúcar (medida = vaso de yogur)","cantidad":2.0,"resto":"medidas de azúcar (medida = vaso de yogur)","escalable":true,"modo":"simple"},{"texto":"1 medida de aceite de girasol","cantidad":1.0,"resto":"medida de aceite de girasol","escalable":true,"modo":"simple"},{"texto":"3 huevos (o 4 si son pequeños)","cantidad":3.0,"resto":"huevos (o 4 si son pequeños)","escalable":true,"modo":"simple"},{"texto":"1 sobre de levadura Royal","cantidad":1.0,"resto":"sobre de levadura Royal","escalable":true,"modo":"simple"},{"texto":"Unas gotas de esencia de vainilla (o el sabor que se quiera)","cantidad":null,"resto":"Unas gotas de esencia de vainilla (o el sabor que se quiera)","escalable":false},{"texto":"Harina: lo que admita (aprox. 4 medidas de yogur)","cantidad":null,"resto":"Harina: lo que admita (aprox. 4 medidas de yogur)","escalable":false}],"elaboracion":["Se mezclan todos los ingredientes en un bol, batiendo bien, hasta obtener una masa homogénea y sin grumos. Se vierte en un molde previamente untado de mantequilla y espolvoreado con harina.","Se mete en el horno, previamente calentado a unos 180°, con el calor solo por abajo, durante unos 35-40 minutos. Se comprueba pinchando con un palillo en el centro: cuando sale limpio, el bizcocho está hecho y se saca."]},{"categoria":"REPOSTERÍA","titulo":"Bizcocho (mamá) (Toñi)","raciones":"8 personas","racionesBase":8,"tiempo":"55 minutos","ingredientes":[{"texto":"3 huevos","cantidad":3.0,"resto":"huevos","escalable":true,"modo":"simple"},{"texto":"1 yogur de limón","cantidad":1.0,"resto":"yogur de limón","escalable":true,"modo":"simple"},{"texto":"3 medidas de harina (medida = vaso de yogur)","cantidad":3.0,"resto":"medidas de harina (medida = vaso de yogur)","escalable":true,"modo":"simple"},{"texto":"2 medidas de azúcar","cantidad":2.0,"resto":"medidas de azúcar","escalable":true,"modo":"simple"},{"texto":"1 medida de aceite (levadura incluida)","cantidad":1.0,"resto":"medida de aceite (levadura incluida)","escalable":true,"modo":"simple"}],"elaboracion":["Mezclar todos los ingredientes en un bol, batiendo bien hasta que quede una masa homogénea y sin grumos, y verter en un molde untado de mantequilla y enharinado. Meter al horno con temperat
