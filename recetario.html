 de cocina para no quemarse (así los moldes quedan libres para la siguiente tanda).","Colocar nuevos círculos de masa en los moldes libres y continuar friendo hasta agotar toda la masa.","Machacar los pistachos y mezclar la mitad con la mitad del relleno de ricotta.","Mezclar la otra mitad del relleno con chips de chocolate.","Pasar ambos rellenos a mangas pasteleras y rellenar los cannoli por los dos extremos.","Terminar con pistachos y chips de chocolate asomando en los extremos del relleno, y espolvorear con azúcar glas. Los cannoli deben comerse poco después de rellenarlos, ya que se ablandan con el tiempo; si se necesitan preparar con antelación, es mejor tener listos todos los componentes por separado y montarlos en el último momento, ya que el relleno solo lleva unos 5 minutos."]},{"categoria":"REPOSTERÍA ITALIANA Y FRANCESA","titulo":"Tarta de Chocolate, Mascarpone y Praliné de Avellanas (diegodoal)","raciones":"10 raciones","racionesBase":10,"tiempo":"1 h 45 min (+ 45 min de reposos en frío)","ingredientes":[{"texto":"Para los bizcochos: 75 g de cacao puro en polvo (100%)","cantidad":null,"resto":"Para los bizcochos: 75 g de cacao puro en polvo (100%)","escalable":false},{"texto":"200 g de harina de trigo","cantidad":200.0,"resto":"g de harina de trigo","escalable":true,"modo":"simple"},{"texto":"8 g de bicarbonato","cantidad":8.0,"resto":"g de bicarbonato","escalable":true,"modo":"simple"},{"texto":"8 g de levadura química","cantidad":8.0,"resto":"g de levadura química","escalable":true,"modo":"simple"},{"texto":"8 g de sal","cantidad":8.0,"resto":"g de sal","escalable":true,"modo":"simple"},{"texto":"200 g de azúcar","cantidad":200.0,"resto":"g de azúcar","escalable":true,"modo":"simple"},{"texto":"100 g de azúcar moreno","cantidad":100.0,"resto":"g de azúcar moreno","escalable":true,"modo":"simple"},{"texto":"150 ml de aceite de girasol","cantidad":150.0,"resto":"ml de aceite de girasol","escalable":true,"modo":"simple"},{"texto":"2 huevos grandes","cantidad":2.0,"resto":"huevos grandes","escalable":true,"modo":"simple"},{"texto":"150 ml de kéfir","cantidad":150.0,"resto":"ml de kéfir","escalable":true,"modo":"simple"},{"texto":"220 ml de café, recién hecho","cantidad":220.0,"resto":"ml de café, recién hecho","escalable":true,"modo":"simple"},{"texto":"Para la crema de mascarpone: 300 ml de nata para montar","cantidad":null,"resto":"Para la crema de mascarpone: 300 ml de nata para montar","escalable":false},{"texto":"90 g de mascarpone","cantidad":90.0,"resto":"g de mascarpone","escalable":true,"modo":"simple"},{"texto":"50 g de azúcar glas","cantidad":50.0,"resto":"g de azúcar glas","escalable":true,"modo":"simple"},{"texto":"5 g de extracto de vainilla","cantidad":5.0,"resto":"g de extracto de vainilla","escalable":true,"modo":"simple"},{"texto":"Para el praliné y crumble de avellanas: 200 g de avellanas peladas","cantidad":null,"resto":"Para el praliné y crumble de avellanas: 200 g de avellanas peladas","escalable":false},{"texto":"180 g de azúcar","cantidad":180.0,"resto":"g de azúcar","escalable":true,"modo":"simple"},{"texto":"Una pizca de sal","cantidad":null,"resto":"Una pizca de sal","escalable":false}],"elaboracion":["Bizcochos: engrasar dos moldes de 22 cm y forrar la base con papel de horno. Mezclar el cacao, la harina, el bicarbonato, la levadura, la sal y los dos azúcares en un bol. En otro bol, mezclar el aceite, los huevos y el kéfir hasta que quede homogéneo. Preparar el café.","Tamizar un tercio de los ingredientes secos sobre la mezcla líquida e incorporar con movimientos suaves; repetir dos veces más con el resto. Añadir el café bien caliente poco a poco, mezclando con cuidado hasta que quede uniforme.","Repartir la masa entre los dos moldes (unos 600 g cada uno) y golpearlos contra la mesa para asentar. Hornear a 190° durante 30 minutos, hasta que un palillo salga limpio. Dejar templar 5 minutos, pasar un cuchillo por el borde, desmoldar sobre una rejilla, retirar el papel y dejar enfriar del todo.","Praliné: tostar las avellanas en una bandeja con papel de horno a 180° durante 10-15 minutos, hasta que queden bien doradas; dejar enfriar. En una sartén, hacer un caramelo en seco cubriendo el fondo con azúcar a fuego medio sin remover; a medida que se van haciendo zonas transparentes, ir añadiendo más azúcar hasta usarlo todo, removiendo hacia el final hasta que tome un tono ámbar oscuro. Añadir la sal y las avellanas, mezclar rápido y volcar sobre una bandeja con papel de horno; dejar enfriar 15-20 minutos.","Romper el caramelo con avellanas en trozos y triturarlo en unos golpes cortos de procesadora para conseguir una textura de crumble (reservar 75 g de este crumble). Triturar el resto unos 5 minutos más, hasta conseguir una pasta de praliné líquida y sin grumos. Dejar enfriar a temperatura ambiente.","Crema de mascarpone: batir la nata, el mascarpone y el azúcar glas; cuando empiece a espesar, añadir la vainilla y seguir batiendo hasta que monte con picos firmes. Refrigerar un mínimo de 15 minutos.","Montaje: colocar el primer bizcocho en el plato y cubrir con la mitad de la crema de mascarpone. Repartir 2 cucharadas de praliné y dibujar espirales con él sobre la crema; añadir 2 cucharadas más de praliné sin mezclar. Espolvorear la mitad del crumble reservado. Colocar el segundo bizcocho encima y repetir la misma secuencia de capas. Refrigerar un mínimo de 15 minutos antes de cortar."]},{"categoria":"REPOSTERÍA AMERICANA","titulo":"Brownie de 100 Horas (diegodoal)","raciones":"12 raciones","racionesBase":12,"tiempo":"1 hora (+ reposos de varios días: 3 días en frío + 24 h adicionales)","ingredientes":[{"texto":"225 g de mantequilla","cantidad":225.0,"resto":"g de mantequilla","escalable":true,"modo":"simple"},{"texto":"6 g de café molido","cantidad":6.0,"resto":"g de café molido","escalable":true,"modo":"simple"},{"texto":"1 cubito de hielo","cantidad":1.0,"resto":"cubito de hielo","escalable":true,"modo":"simple"},{"texto":"4 huevos","cantidad":4.0,"resto":"huevos","escalable":true,"modo":"simple"},{"texto":"400 g de azúcar","cantidad":400.0,"resto":"g de azúcar","escalable":true,"modo":"simple"},{"texto":"45 g de cacao en polvo","cantidad":45.0,"resto":"g de cacao en polvo","escalable":true,"modo":"simple"},{"texto":"9 g de sal","cantidad":9.0,"resto":"g de sal","escalable":true,"modo":"simple"},{"texto":"225 g de chocolate (70% o más de pureza), fundido","cantidad":225.0,"resto":"g de chocolate (70% o más de pureza), fundido","escalable":true,"modo":"simple"},{"texto":"215 g de harina de trigo","cantidad":215.0,"resto":"g de harina de trigo","escalable":true,"modo":"simple"},{"texto":"100 g de chocolate con leche, troceado","cantidad":100.0,"resto":"g de chocolate con leche, troceado","escalable":true,"modo":"simple"},{"texto":"200 g de chocolate negro (70% o más de pureza), troceado","cantidad":200.0,"resto":"g de chocolate negro (70% o más de pureza), troceado","escalable":true,"modo":"simple"}],"elaboracion":["Este brownie necesita empezarse con varios días de antelación, porque son precisamente sus largos tiempos de reposo (de ahí el nombre) los que le dan esa textura tan densa y húmeda.","Poner la mantequilla troceada en una sartén fría y calentar a fuego medio hasta que se derrita por completo. Seguir cociendo, removiendo de vez en cuando, hasta que deje de burbujear y aparezca una espuma en la superficie; bajar entonces el fuego a medio-bajo y tostarla aproximadamente 1 minuto, hasta que tome un tono dorado y aroma a avellana (mantequilla noisette). Retirar del fuego, añadir el café molido y remover 30 segundos; incorporar el cubito de hielo y remover hasta que se derrita por completo, lo que además ayuda a enfriar la mantequilla rápidamente.","En un bol grande, cascar los huevos y añadir el azúcar; batir con unas varillas hasta que la mezcla doble su volumen y quede pálida y esponjosa.","En un bol aparte, mezclar el cacao en polvo con la sal y tamizarlos sobre la mezcla de huevo y azúcar, incorporando con movimientos envolventes para no bajar el aire. Añadir la mantequilla tostada (ya templada) y mezclar bien.","Fundir el chocolate (al microondas, en potencia media, en golpes cortos para que no se queme) y añadirlo al bol, mezclando hasta que quede homogéneo. Tamizar la harina encima e incorporarla con movimientos suaves, sin batir en exceso.","Trocear el chocolate con leche y el chocolate negro en trozos irregulares. Añadir ambos a la masa y mezclar bien para repartirlos.","Forrar un molde con papel de horno, verter la masa y extenderla de manera uniforme. Repartir por encima el chocolate negro que se haya reservado, cubrir con film transparente y refrigerar 3 días.","Pasado ese tiempo, llevar el molde directamente de la nevera al horno (sin dejar que se atempere) y hornear a 180°, sin grill, durante 30 minutos.","Envolver el molde en papel de aluminio, sin dejar que se enfríe antes, y meterlo directamente al congelador (esto ayuda a atrapar la humedad dentro del brownie).","Pasar de nuevo a la nevera y dejar reposar 24 horas más antes de tocarlo.","Desmoldar, retirar el papel y recortar los bordes. Cortar en las porciones deseadas y, antes de servir, calentar cada porción en el horno a 150°, sin grill, unos 7 minutos, hasta que quede tierno y calentito por dentro. Servir enseguida."]},{"categoria":"REPOSTERÍA AMERICANA","titulo":"Tarta de Zanahoria (diegodoal) (Carrot Cake)","raciones":"12 raciones","racionesBase":12,"tiempo":"2 h 30 min (+ unas 4 h de enfriados y reposos)","ingredientes":[{"texto":"Para el bizcocho: 500 g de zanahoria, rallada (pelarla es opcional)","cantidad":null,"resto":"Para el bizcocho: 500 g de zanahoria, rallada (pelarla es opcional)","escalable":false},{"texto":"250 ml de leche entera","cantidad":250.0,"resto":"ml de leche entera","escalable":true,"modo":"simple"},{"texto":"1 cucharadita de extracto de vainilla","cantidad":1.0,"resto":"cucharadita de extracto de vainilla","escalable":true,"modo":"simple"},{"texto":"325 g de harina de trigo normal","cantidad":325.0,"resto":"g de harina de trigo normal","escalable":true,"modo":"simple"},{"texto":"5 g de sal","cantidad":5.0,"resto":"g de sal","escalable":true,"modo":"simple"},{"texto":"8 g de bicarbonato","cantidad":8.0,"resto":"g de bicarbonato","escalable":true,"modo":"simple"},{"texto":"15 g de levadura química (polvo de hornear)","cantidad":15.0,"resto":"g de levadura química (polvo de hornear)","escalable":true,"modo":"simple"},{"texto":"4 g de jengibre en polvo","cantidad":4.0,"resto":"g de jengibre en polvo","escalable":true,"modo":"simple"},{"texto":"8 g de canela en polvo","cantidad":8.0,"resto":"g de canela en polvo","escalable":true,"modo":"simple"},{"texto":"3 g de clavo molido","cantidad":3.0,"resto":"g de clavo molido","escalable":true,"modo":"simple"},{"texto":"Pimienta negra recién molida (opcional, un toque)","cantidad":null,"resto":"Pimienta negra recién molida (opcional, un toque)","escalable":false},{"texto":"4 huevos talla L","cantidad":4.0,"resto":"huevos talla L","escalable":true,"modo":"simple"},{"texto":"200 g de azúcar moreno","cantidad":200.0,"resto":"g de azúcar moreno","escalable":true,"modo":"simple"},{"texto":"200 g de azúcar blanco","cantidad":200.0,"resto":"g de azúcar blanco","escalable":true,"modo":"simple"},{"texto":"225 ml de aceite de girasol (o de oliva suave)","cantidad":225.0,"resto":"ml de aceite de girasol (o de oliva suave)","escalable":true,"modo":"simple"},{"texto":"Para el frosting de mantequilla tostada: 225 g de mantequilla","cantidad":null,"resto":"Para el frosting de mantequilla tostada: 225 g de mantequilla","escalable":false},{"texto":"1 cubito de hielo","cantidad":1.0,"resto":"cubito de hielo","escalable":true,"modo":"simple"},{"texto":"450 g de queso crema","cantidad":450.0,"resto":"g de queso crema","escalable":true,"modo":"simple"},{"texto":"250 g de azúcar glas","cantidad":250.0,"resto":"g de azúcar glas","escalable":true,"modo":"simple"},{"texto":"Un chorrito de extracto de vainilla","cantidad":null,"resto":"Un chorrito de extracto de vainilla","escalable":false},{"texto":"3 g de sal","cantidad":3.0,"resto":"g de sal","escalable":true,"modo":"simple"},{"texto":"Para decorar: 200 g de nueces, tostadas y machacadas","cantidad":null,"resto":"Para decorar: 200 g de nueces, tostadas y machacadas","escalable":false},{"texto":"Para la salsa de caramelo (opcional): 225 g de azúcar","cantidad":null,"resto":"Para la salsa de caramelo (opcional): 225 g de azúcar","escalable":false},{"texto":"65 g de agua","cantidad":65.0,"resto":"g de agua","escalable":true,"modo":"simple"},{"texto":"115 g de mantequilla","cantidad":115.0,"resto":"g de mantequilla","escalable":true,"modo":"simple"},{"texto":"120 ml de nata para montar","cantidad":120.0,"resto":"ml de nata para montar","escalable":true,"modo":"simple"},{"texto":"4 g de sal (una pizca generosa)","cantidad":4.0,"resto":"g de sal (una pizca generosa)","escalable":true,"modo":"simple"},{"texto":"Un toque de extracto de vainilla","cantidad":null,"resto":"Un toque de extracto de vainilla","escalable":false}],"elaboracion":["Empezar rallando las zanahorias (peladas o no, a elección) por la parte gruesa del rallador, y picarlas un poco más con un cuchillo para que no queden trozos demasiado grandes. Ponerlas en un bol junto con la leche y la vainilla, mezclar y reservar.","En otro bol, mezclar todos los ingredientes secos: la harina, la sal, el bicarbonato, la levadura química, el jengibre, la canela, el clavo molido y, si se quiere, un toque de pimienta negra recién molida (las especias recuerdan al chai y le dan un toque floral sin que pique).","En un bol grande, cascar los huevos y añadir los dos azúcares (moreno y blanco); batir con varillas hasta que la mezcla doble su volumen y quede pálida y esponjosa. Sin dejar de batir, ir emulsionando el aceite poco a poco, en hilo fino, para que se integre bien (el aceite es lo que da la jugosidad al bizcocho).","Incorporar a esta mezcla, alternando y en dos tandas, la mitad de la zanahoria con la leche y la mitad de los ingredientes secos; mezclar con una espátula y con movimientos envolventes (para no perder el aire batido) y repetir con la segunda mitad de cada uno, hasta que quede todo homogéneo.","Forrar el molde o moldes elegidos con papel de horno. Se puede hornear en un único molde desmontable de 28 cm y dividir después el bizcocho en dos capas, en tres moldes de 24 cm (para tener ya las capas hechas) o en una bandeja para una versión de una sola capa. Hornear a 180°, con calor por abajo (y ventilador si se tiene), durante aproximadamente 1 hora y media para un molde grande y grueso, 35-40 minutos si se reparte en tres moldes de 24 cm, o unos 30 minutos si se hornea en bandeja. El bizcocho está listo cuando, al pinchar el centro con un palillo, sale limpio, o cuando un termómetro marca 97° en el interior.","Mientras se hornea, preparar la mantequilla tostada para el frosting: derretir la mantequilla en un cazo a fuego medio; empezará a burbujear mientras se evapora el agua que contiene (en esta fase todavía no se está tostando). Cuando cesen las burbujas y aparezca espuma, bajar un poco el fuego y remover sin parar: los sólidos lácteos se irán dorando y desprenderán un aroma a avellana tostada. En cuanto tomen un tono marrón claro, retirar del fuego y pasar a un bol; añadir un cubito de hielo y remover hasta que se derrita, lo que enfría la mantequilla rápidamente y le devuelve un poco de humedad para que después se integre mejor en el frosting. Dejar enfriar por completo hasta que solidifique de nuevo (no hace falta que quede dura, basta con que tenga consistencia de pomada).","Batir la mantequilla tostada fría con el queso crema hasta que quede una crema homogénea. Añadir el azúcar glas (tamizado, para que el frosting quede fino), un chorrito de vainilla y la sal, y volver a batir hasta emulsionar. Refrigerar el frosting para que esté bien frío y sea más fácil de trabajar después.","Aprovechando que el horno está encendido, tostar las nueces unos 10 minutos; dejar enfriar y machacarlas un poco (por ejemplo dentro de una bolsa con cierre, aplastándolas).","Preparar la salsa de caramelo: poner el azúcar y el agua en un cazo a fuego medio (el agua ayuda a que el caramelo se haga de forma más controlada, sin que cristalice) y dejar que se vaya caramelizando sin remover en exceso, hasta que tome un tono ámbar. Retirar del fuego y añadir la mantequilla, con cuidado porque puede chisporrotear; integrar bien. Añadir la sal y un toque de vainilla, mezclar y, por último, incorporar la nata (también con cuidado, puede burbujear al añadirla). Colar la salsa para retirar cualquier resto de azúcar cristalizado y dejar enfriar un par de horas, hasta que coja cuerpo.","Una vez el bizcocho esté frío (dejarlo enfriar unos 15 minutos en el molde, retirar el papel de las paredes para que escape el vapor, y dejarlo enfriar del todo a temperatura ambiente antes de desmoldar; después refrigerar al menos 2 horas más para que esté bien firme y sea más fácil de trabajar), cortar la parte superior para que quede plano (reservar los recortes) y dividirlo en dos capas si se ha horneado en un único molde.","Montar la tarta: colocar la primera capa con la cara cortada hacia abajo, cubrir con una capa generosa y uniforme de frosting hasta los bordes, y colocar encima la segunda capa con la base hacia arriba. Aplicar una capa fina de frosting por toda la tarta (la 'recogemigas'), meterla 20 minutos en la nevera para que se endurezca, y después aplicar la capa final de frosting, más generosa, alisando bien con una espátula.","Cubrir todo el lateral de la tarta presionando las nueces machacadas contra el frosting. Terminar con la salsa de caramelo por encima (o servirla aparte para que cada uno se sirva la que quiera) y dejar la tarta media hora en la nevera antes de servir, para que todo asiente."]},{"categoria":"REPOSTERÍA AMERICANA","titulo":"New York Cheesecake (diegodoal)","raciones":"12 raciones","racionesBase":12,"tiempo":"2 h 45 min (+ al menos 4 h de enfriado y refrigeración)","ingredientes":[{"texto":"Para las galletas caseras: 120 g de harina de trigo","cantidad":null,"resto":"Para las galletas caseras: 120 g de harina de trigo","escalable":false},{"texto":"210 g de harina integral","cantidad":210.0,"resto":"g de harina integral","escalable":true,"modo":"simple"},{"texto":"60 g de azúcar moreno","cantidad":60.0,"resto":"g de azúcar moreno","escalable":true,"modo":"simple"},{"texto":"Una pizca de sal","cantidad":null,"resto":"Una pizca de sal","escalable":false},{"texto":"4 g de levadura química","cantidad":4.0,"resto":"g de levadura química","escalable":true,"modo":"simple"},{"texto":"½ cucharadita de canela","cantidad":0.5,"resto":"cucharadita de canela","escalable":true,"modo":"simple"},{"texto":"1 huevo grande","cantidad":1.0,"resto":"huevo grande","escalable":true,"modo":"simple"},{"texto":"50 ml de leche entera","cantidad":50.0,"resto":"ml de leche entera","escalable":true,"modo":"simple"},{"texto":"80 g de miel","cantidad":80.0,"resto":"g de miel","escalable":true,"modo":"simple"},{"texto":"40 ml de aceite de girasol","cantidad":40.0,"resto":"ml de aceite de girasol","escalable":true,"modo":"simple"},{"texto":"Para la base: 170 g de las galletas caseras (o galletas compradas)","cantidad":null,"resto":"Para la base: 170 g de las galletas caseras (o galletas compradas)","escalable":false},{"texto":"30 g de azúcar","cantidad":30.0,"resto":"g de azúcar","escalable":true,"modo":"simple"},{"texto":"Una pizca de sal","cantidad":null,"resto":"Una pizca de sal","escalable":false},{"texto":"Una pizca de nuez moscada","cantidad":null,"resto":"Una pizca de nuez moscada","escalable":false},{"texto":"60 g de mantequilla fundida","cantidad":60.0,"resto":"g de mantequilla fundida","escalable":true,"modo":"simple"},{"texto":"Para el relleno: 900 g de queso crema, a temperatura ambiente","cantidad":null,"resto":"Para el relleno: 900 g de queso crema, a temperatura ambiente","escalable":false},{"texto":"220 g de azúcar","cantidad":220.0,"resto":"g de azúcar","escalable":true,"modo":"simple"},{"texto":"4 huevos grandes","cantidad":4.0,"resto":"huevos grandes","escalable":true,"modo":"simple"},{"texto":"60 ml de nata para montar","cantidad":60.0,"resto":"ml de nata para montar","escalable":true,"modo":"simple"},{"texto":"60 g de crème fraîche (o nata agria)","cantidad":60.0,"resto":"g de crème fraîche (o nata agria)","escalable":true,"modo":"simple"},{"texto":"5 g de extracto de vainilla","cantidad":5.0,"resto":"g de extracto de vainilla","escalable":true,"modo":"simple"},{"texto":"Una pizca de sal","cantidad":null,"resto":"Una pizca de sal","escalable":false},{"texto":"20 g de maicena","cantidad":20.0,"resto":"g de maicena","escalable":true,"modo":"simple"}],"elaboracion":["Galletas: mezclar las harinas, el azúcar moreno, la sal, la levadura y la canela. Hacer un hueco, añadir el huevo, la leche, la miel y el aceite; batir con varillas e ir incorporando la harina. Pasar a la mesa y amasar hasta que quede homogéneo; envolver y dejar reposar 30 minutos.","Estirar sobre superficie enharinada a 2 mm de grosor y cortar en trozos. Colocar en una bandeja con papel de horno y hornear a 170° durante 15-20 minutos, hasta que doren por los bordes. Dejar enfriar sobre una rejilla.","Base: triturar las galletas hasta hacerlas polvo. Mezclar con el azúcar, la sal y la nuez moscada, y añadir la mantequilla fundida hasta que quede todo bien humedecido. Engrasar un molde desmontable de 24 cm, extender la mezcla en la base presionando de manera uniforme y hornear a 160° durante 8 minutos. Dejar enfriar del todo.","Relleno: batir el queso crema (a temperatura ambiente) con el azúcar hasta que doble de volumen y quede cremoso. Añadir los huevos de uno en uno, integrando cada uno antes del siguiente. Añadir la nata, la crème fraîche, la vainilla, la sal y la maicena, y batir hasta que quede homogéneo.","Verter sobre la base ya fría, dentro del molde desmontable, y colocar este dentro de una bandeja de horno más grande. Llenar la bandeja con agua hirviendo hasta unos 2 cm de altura (baño maría) y hornear a 160° durante 1 hora y 15 minutos.","Entreabrir la puerta del horno, apagarlo y dejar la tarta dentro 45 minutos más. Sacar y dejar enfriar del todo (unas 2 horas), después refrigerar un mínimo de 2 horas (hasta 3 días). Desmoldar y cortar con un cuchillo mojado en agua caliente entre corte y corte."]},{"categoria":"REPOSTERÍA AMERICANA","titulo":"Lemon Pie Cremoso (diegodoal)","raciones":"10 raciones","racionesBase":10,"tiempo":"1 h 30 min (+ 2 h de refrigeración)","ingredientes":[{"texto":"Para la base: 300 g de harina de trigo","cantidad":null,"resto":"Para la base: 300 g de harina de trigo","escalable":false},{"texto":"120 g de mantequilla sin sal, fría","cantidad":120.0,"resto":"g de mantequilla sin sal, fría","escalable":true,"modo":"simple"},{"texto":"Una pizca de sal","cantidad":null,"resto":"Una pizca de sal","escalable":false},{"texto":"3-4 cucharadas de agua muy fría","cantidad":3.0,"cantidad2":4.0,"resto":"cucharadas de agua muy fría","escalable":true,"modo":"rango"},{"texto":"Para el relleno de limón: 8 huevos grandes","cantidad":null,"resto":"Para el relleno de limón: 8 huevos grandes","escalable":false},{"texto":"260 ml de zumo de limón (unos 5 limones)","cantidad":260.0,"resto":"ml de zumo de limón (unos 5 limones)","escalable":true,"modo":"simple"},{"texto":"2 cucharadas de ralladura de limón","cantidad":2.0,"resto":"cucharadas de ralladura de limón","escalable":true,"modo":"simple"},{"texto":"375 g de azúcar","cantidad":375.0,"resto":"g de azúcar","escalable":true,"modo":"simple"},{"texto":"Una pizca de sal","cantidad":null,"resto":"Una pizca de sal","escalable":false},{"texto":"90 g de maicena","cantidad":90.0,"resto":"g de maicena","escalable":true,"modo":"simple"},{"texto":"625 ml de agua fría","cantidad":625.0,"resto":"ml de agua fría","escalable":true,"modo":"simple"},{"texto":"100 g de mantequilla sin sal","cantidad":100.0,"resto":"g de mantequilla sin sal","escalable":true,"modo":"simple"},{"texto":"Para el merengue: 8 claras de huevo","cantidad":null,"resto":"Para el merengue: 8 claras de huevo","escalable":false},{"texto":"150 g de azúcar blanco (o azúcar glas)","cantidad":150.0,"resto":"g de azúcar blanco (o azúcar glas)","escalable":true,"modo":"simple"},{"texto":"4 gotas de zumo de limón","cantidad":4.0,"resto":"gotas de zumo de limón","escalable":true,"modo":"simple"}],"elaboracion":["Base: mezclar la harina, la sal y la mantequilla fría en dados en un procesador de alimentos, dando golpes cortos hasta que la mantequilla quede en trocitos del tamaño de un guisante. Pasar a un bol e ir añadiendo agua muy fría poco a poco, mezclando con un tenedor, hasta que la masa se una. Envolver en film y refrigerar un mínimo de 30 minutos.","Estirar la masa en un círculo unos 2 cm más ancho que el molde (22 cm). Doblarla en cuatro, colocar el vértice en el centro del molde, desdoblar y ajustar bien a las paredes. Recortar el sobrante y refrigerar 30 minutos más. Cubrir con papel de horno y peso (legumbres o bolas cerámicas) y hornear a 180° durante 25-30 minutos, hasta que los bordes se vean secos. Retirar el peso y seguir horneando 25-30 minutos más, hasta que coja color. Dejar enfriar en el molde.","Relleno: exprimir los limones y rallar su piel. Separar los huevos, reservando las claras en la nevera. En un cazo, mezclar el azúcar, la maicena, la sal, el zumo de limón y el agua fría. Calentar a fuego medio-alto hasta que aparezca la primera burbuja. Sin dejar de batir las yemas, ir añadiendo la mezcla caliente poco a poco, subiendo el ritmo a medida que las yemas se atemperan (para que no cuajen de golpe).","Devolver todo al cazo y calentar hasta los 76° o hasta la primera burbuja. Retirar del fuego, añadir la mantequilla y la ralladura de limón, y mezclar hasta integrar. Verter sobre la base ya horneada, cubrir la superficie con film a piel y dejar templar 30 minutos a temperatura ambiente; después refrigerar un mínimo de 2 horas (mejor toda la noche).","Merengue (20 minutos antes de servir): añadir la mitad del azúcar a las claras junto con las gotas de limón. Calentar al baño maría batiendo sin parar hasta que la mezcla alcance los 71°. Seguir batiendo 15 segundos más y retirar del fuego. Batir hasta que espume, añadir el resto del azúcar y seguir batiendo hasta que se formen picos suaves, ligeramente curvados.","Retirar el film de la tarta, extender el merengue por encima formando picos con una espátula, y tostar con un soplete de cocina si se desea."]},{"categoria":"REPOSTERÍA AMERICANA","titulo":"Tarta Tres Leches (diegodoal)","raciones":"12 raciones","racionesBase":12,"tiempo":"1 hora (+ 6 h de refrigeración)","ingredientes":[{"texto":"Para el bizcocho: 6 huevos","cantidad":null,"resto":"Para el bizcocho: 6 huevos","escalable":false},{"texto":"120 ml de leche entera","cantidad":120.0,"resto":"ml de leche entera","escalable":true,"modo":"simple"},{"texto":"220 g de azúcar blanco","cantidad":220.0,"resto":"g de azúcar blanco","escalable":true,"modo":"simple"},{"texto":"2 g de extracto de vainilla","cantidad":2.0,"resto":"g de extracto de vainilla","escalable":true,"modo":"simple"},{"texto":"225 g de harina de trigo","cantidad":225.0,"resto":"g de harina de trigo","escalable":true,"modo":"simple"},{"texto":"3 g de sal","cantidad":3.0,"resto":"g de sal","escalable":true,"modo":"simple"},{"texto":"7 g de levadura química","cantidad":7.0,"resto":"g de levadura química","escalable":true,"modo":"simple"},{"texto":"Un poco de mantequilla, para el molde","cantidad":null,"resto":"Un poco de mantequilla, para el molde","escalable":false},{"texto":"Para el montaje tres leches: el bizcocho","cantidad":null,"resto":"Para el montaje tres leches: el bizcocho","escalable":false},{"texto":"820 ml de leche entera (o 350 ml de leche evaporada)","cantidad":820.0,"resto":"ml de leche entera (o 350 ml de leche evaporada)","escalable":true,"modo":"simple"},{"texto":"400 ml de leche condensada","cantidad":400.0,"resto":"ml de leche condensada","escalable":true,"modo":"simple"},{"texto":"120 ml de nata para montar","cantidad":120.0,"resto":"ml de nata para montar","escalable":true,"modo":"simple"},{"texto":"1 vaina de vainilla o 2 g de extracto de vainilla (opcional)","cantidad":1.0,"resto":"vaina de vainilla o 2 g de extracto de vainilla (opcional)","escalable":true,"modo":"simple"},{"texto":"100 g de dulce de leche, para untar","cantidad":100.0,"resto":"g de dulce de leche, para untar","escalable":true,"modo":"simple"},{"texto":"300 ml de nata para montar + 20 g de azúcar, para cubrir","cantidad":300.0,"resto":"ml de nata para montar + 20 g de azúcar, para cubrir","escalable":true,"modo":"simple"},{"texto":"Canela en polvo, al gusto","cantidad":null,"resto":"Canela en polvo, al gusto","escalable":false},{"texto":"Fresas y azúcar, al gusto, para decorar","cantidad":null,"resto":"Fresas y azúcar, al gusto, para decorar","escalable":false}],"elaboracion":["Bizcocho: separar las yemas de las claras en dos boles. Batir las yemas con 165 g de azúcar hasta que queden cremosas y doblen su volumen. Añadir la vainilla y la leche, batiendo hasta que emulsione.","Montar las claras a punto de nieve suave, añadiendo poco a poco los 55 g de azúcar restantes hasta que queden firmes. Incorporar las claras a la mezcla de yemas con movimientos suaves y envolventes.","Mezclar la harina, la sal y la levadura en un bol aparte. Tamizar sobre la mezcla de huevo e incorporar con movimientos suaves.","Engrasar el molde con mantequilla, verter la masa y extenderla de manera uniforme. Hornear a 180°, con calor solo por abajo, durante 25-30 minutos, hasta que un palillo salga limpio. Dejar enfriar del todo.","Reducción de leche: calentar la leche entera hasta que rompa a hervir suavemente y dejar reducir 20 minutos, hasta unos 350 ml. Dejar enfriar. Mezclar con la leche condensada y la nata; si se usa, añadir las semillas de la vaina de vainilla. Remover bien.","Pinchar el bizcocho ya frío por toda la superficie con un tenedor. Verter la mezcla de las tres leches por encima, repartiéndola bien. Cubrir con film y refrigerar un mínimo de 6 horas.","Untar una capa fina de dulce de leche sobre la tarta. Montar la nata con el azúcar hasta que quede firme y extenderla de manera uniforme sobre la tarta. Espolvorear canela por encima.","Macerar las fresas cortadas con un poco de azúcar durante 2 minutos. Cortar la tarta en porciones y decorar con las fresas maceradas."]},{"categoria":"POSTRES JAPONESES","titulo":"Mochis Caseros con Koshi-An (diegodoal)","raciones":"unos 12 mochis","racionesBase":12,"tiempo":"2 h 30 min","ingredientes":[{"texto":"Para el mochi: 150 g de harina de arroz glutinoso","cantidad":null,"resto":"Para el mochi: 150 g de harina de arroz glutinoso","escalable":false},{"texto":"75 g de azúcar blanco","cantidad":75.0,"resto":"g de azúcar blanco","escalable":true,"modo":"simple"},{"texto":"250 ml de agua","cantidad":250.0,"resto":"ml de agua","escalable":true,"modo":"simple"},{"texto":"Azúcar glas, al gusto, para empolvar","cantidad":null,"resto":"Azúcar glas, al gusto, para empolvar","escalable":false},{"texto":"Koshi-an (ver receta abajo)","cantidad":null,"resto":"Koshi-an (ver receta abajo)","escalable":false},{"texto":"Para el koshi-an (pasta de judía roja): 250 g de judías adzuki","cantidad":null,"resto":"Para el koshi-an (pasta de judía roja): 250 g de judías adzuki","escalable":false},{"texto":"150 g de azúcar blanco","cantidad":150.0,"resto":"g de azúcar blanco","escalable":true,"modo":"simple"}],"elaboracion":["Los mochis son uno de esos dulces orientales que hay que probar alguna vez: una textura blandita, chiclosa y tierna, completamente distinta a lo que estamos acostumbrados en Occidente. Aquí se rellenan del típico koshi-an, una pasta dulce de judías rojas que merece mucho la pena hacer casera, ya que mejora con creces a la versión industrial.","Es imprescindible usar harina de arroz glutinoso: ninguna otra harina sirve ni se le aproxima. El arroz glutinoso es una variedad de grano muy pegajoso y no tiene relación con el gluten del trigo. Se encuentra en cualquier supermercado asiático o por internet.","Koshi-an: pesar las judías adzuki y descartar las que estén en mal estado o verdes. Ponerlas en una cazuela, cubrirlas con litro y medio de agua y llevar a ebullición a fuego medio-alto.","Cocer 5 minutos, escurrir y desechar esa primera agua (este primer hervido corto elimina el amargor propio de la judía).","Devolver las judías a la cazuela, cubrir de nuevo con litro y medio de agua y llevar a ebullición a fuego medio-alto.","Cocer durante 1 hora y media, o hasta que las judías se aplasten sin oponer resistencia.","Triturar las judías en un procesador de alimentos junto con un cazo del agua de cocción, hasta obtener una pasta homogénea.","Tamizar la pasta para eliminar cualquier resto de piel y conseguir una textura fina.","Pasar la pasta a una sartén junto con el azúcar blanco; mezclar y cocinar a fuego medio-bajo.","Cocinar 15 minutos, removiendo con frecuencia, hasta que la pasta quede densa y espesa.","Extender la pasta sobre una bandeja para que se enfríe rápidamente de manera uniforme.","Mochi: en un bol, mezclar la harina de arroz glutinoso con el azúcar.","Añadir el agua e incorporar todo con unas varillas hasta que quede homogéneo.","Limpiar los bordes del bol con una espátula, cubrirlo con film dejando una pequeña apertura para que salga el vapor, y meterlo al microondas a máxima potencia durante 1 minuto.","Sacar el bol y deshacer los grumos de la masa con las varillas. Volver a cubrir con film, dejando abertura, y meter otro minuto al microondas.","Remover la masa con la espátula. Si todavía está líquida, cubrirla y darle golpes de 15 segundos en el microondas hasta que quede totalmente espesa y translúcida (esta técnica al microondas sustituye a la cocción tradicional al vapor y es mucho más rápida).","Espolvorear abundante azúcar glas sobre una superficie de trabajo y volcar la masa encima. Espolvorear más azúcar glas por encima.","Empolvarse las manos con azúcar glas y formar una bola de masa del tamaño de una cereza. Aplastarla con la palma de la mano y estirarla un poco con un rodillo.","Colocar una cucharadita de koshi-an en el centro y cerrar la masa a su alrededor, pellizcando para sellarla bien. Repetir con el resto de la masa y el relleno hasta completar los 18 mochis."]},{"categoria":"POSTRES DE ORIENTE MEDIO","titulo":"Baklava con Masa Filo Casera (diegodoal)","raciones":"unas 24 piezas","racionesBase":24,"tiempo":"2 h 30 min (+ unas 4 h de reposos)","ingredientes":[{"texto":"Para la masa filo casera (25 hojas): 290 g de harina de trigo","cantidad":null,"resto":"Para la masa filo casera (25 hojas): 290 g de harina de trigo","escalable":false},{"texto":"180 ml de agua caliente","cantidad":180.0,"resto":"ml de agua caliente","escalable":true,"modo":"simple"},{"texto":"25 ml de aceite de girasol","cantidad":25.0,"resto":"ml de aceite de girasol","escalable":true,"modo":"simple"},{"texto":"10 ml de vinagre blanco","cantidad":10.0,"resto":"ml de vinagre blanco","escalable":true,"modo":"simple"},{"texto":"Una pizca de sal","cantidad":null,"resto":"Una pizca de sal","escalable":false},{"texto":"Para estirar: 125 g de maicena","cantidad":null,"resto":"Para estirar: 125 g de maicena","escalable":false},{"texto":"50 g de harina de trigo","cantidad":50.0,"resto":"g de harina de trigo","escalable":true,"modo":"simple"},{"texto":"Para el baklava: 16 hojas de masa filo","cantidad":null,"resto":"Para el baklava: 16 hojas de masa filo","escalable":false},{"texto":"250 g de nueces","cantidad":250.0,"resto":"g de nueces","escalable":true,"modo":"simple"},{"texto":"125 g de pistachos","cantidad":125.0,"resto":"g de pistachos","escalable":true,"modo":"simple"},{"texto":"Media cucharadita de canela","cantidad":null,"resto":"Media cucharadita de canela","escalable":false},{"texto":"150 g de mantequilla","cantidad":150.0,"resto":"g de mantequilla","escalable":true,"modo":"simple"},{"texto":"Para el sirope: 200 g de azúcar","cantidad":null,"resto":"Para el sirope: 200 g de azúcar","escalable":false},{"texto":"180 ml de agua","cantidad":180.0,"resto":"ml de agua","escalable":true,"modo":"simple"},{"texto":"60 g de miel","cantidad":60.0,"resto":"g de miel","escalable":true,"modo":"simple"},{"texto":"Media cucharadita de extracto de vainilla","cantidad":null,"resto":"Media cucharadita de extracto de vainilla","escalable":false},{"texto":"2 cucharaditas de agua de azahar","cantidad":2.0,"resto":"cucharaditas de agua de azahar","escalable":true,"modo":"simple"},{"texto":"30 g de pistachos rallados, para decorar","cantidad":30.0,"resto":"g de pistachos rallados, para decorar","escalable":true,"modo":"simple"}],"elaboracion":["El baklava es uno de los postres más suculentos que existen: capas de masa filo finísima intercaladas con mantequilla y frutos secos, bañadas al final en un sirope de miel y agua de azahar. Hacer la masa filo casera no es sencillo y puede resultar algo frustrante, pero el truco está en enharinar mucho, trabajar rápido y no presionar demasiado con el rodillo, para que las capas no se fusionen entre sí; también se puede usar masa filo comprada para una versión más rápida.","Masa filo: mezclar la harina y la sal en un bol. Hacer un hueco en el centro y añadir el agua caliente, el aceite de girasol y el vinagre; mezclar hasta hidratar toda la harina.","Pasar la masa a una superficie enharinada y amasar 6-7 minutos, hasta que quede lisa y elástica y no se pegue a la encimera, añadiendo algo más de harina si hace falta.","Envolver en film y dejar reposar un mínimo de 1 hora a temperatura ambiente.","Mezclar la maicena con la harina de trigo para estirar.","Cortar 10 trozos de masa de 20 g y bolearlos. Reservar el resto envuelto en film.","Enharinar abundantemente la mesa con la mezcla de maicena y harina; aplastar una bola con la palma de la mano y estirarla con el rodillo hasta unos 13 cm de diámetro. Reservar a un lado y repetir con 5 bolas más, apilándolas una encima de otra y enharinando abundantemente entre cada una.","Con el rodillo, estirar los 5 discos apilados a la vez hasta unos 25 cm de diámetro, levantándolos de vez en cuando y golpeándolos suavemente contra la encimera.","Separar todas las hojas con cuidado. Repetir con las otras 5 bolas y con el resto de la masa.","Montaje del baklava: triturar las nueces y los pistachos y mezclarlos con la canela. Fundir la mantequilla.","Engrasar un molde redondo de unos 23 cm. Colocar dos capas de masa filo y rociar con mantequilla fundida; repetir con dos capas más de filo y mantequilla, y otras dos capas de filo.","Añadir un tercio de los frutos secos, después una capa de filo, mantequilla, otra capa de filo y mantequilla.","Repetir: un tercio de los frutos secos, una capa de filo, mantequilla, otra capa de filo y mantequilla.","Añadir el último tercio de los frutos secos y terminar con dos capas de filo, mantequilla, dos capas de filo, mantequilla y dos capas de filo más.","Aplicar una última capa generosa de mantequilla.","Envolver el molde en film y refrigerar 1 hora.","Cortar el baklava en la forma deseada y hornear a 170° entre 45 minutos y 1 hora, hasta que esté dorado por encima.","Mientras tanto, mezclar el azúcar, el agua y la miel en un cazo; llevar a ebullición a fuego medio-alto.","Retirar del fuego y añadir el extracto de vainilla y el agua de azahar; reservar.","Sacar el baklava del horno y dejarlo reposar 5 minutos.","Verter todo el sirope por encima —puede parecer demasiado, pero es un componente fundamental y hay que echarlo entero—. Dejar enfriar hasta temperatura ambiente, unas 2 horas.","Servir con pistacho rallado por encima."]},{"categoria":"GALLETAS","titulo":"Cookies para Adultos con Tofe Casero (diegodoal)","raciones":"unas 16 cookies","racionesBase":16,"tiempo":"55 min (+ 1 h de refrigeración)","ingredientes":[{"texto":"Para el tofe: 115 g de mantequilla sin sal","cantidad":null,"resto":"Para el tofe: 115 g de mantequilla sin sal","escalable":false},{"texto":"200 g de azúcar moreno (o panela, o azúcar blanco)","cantidad":200.0,"resto":"g de azúcar moreno (o panela, o azúcar blanco)","escalable":true,"modo":"simple"},{"texto":"Una pizca de sal","cantidad":null,"resto":"Una pizca de sal","escalable":false},{"texto":"Para las cookies: 230 g de mantequilla sin sal","cantidad":null,"resto":"Para las cookies: 230 g de mantequilla sin sal","escalable":false},{"texto":"1 cubito de hielo","cantidad":1.0,"resto":"cubito de hielo","escalable":true,"modo":"simple"},{"texto":"325 g de azúcar moreno","cantidad":325.0,"resto":"g de azúcar moreno","escalable":true,"modo":"simple"},{"texto":"100 g de azúcar blanco","cantidad":100.0,"resto":"g de azúcar blanco","escalable":true,"modo":"simple"},{"texto":"10 g de café molido","cantidad":10.0,"resto":"g de café molido","escalable":true,"modo":"simple"},{"texto":"2 g de bicarbonato","cantidad":2.0,"resto":"g de bicarbonato","escalable":true,"modo":"simple"},{"texto":"Una pizca de sal","cantidad":null,"resto":"Una pizca de sal","escalable":false},{"texto":"2 huevos","cantidad":2.0,"resto":"huevos","escalable":true,"modo":"simple"},{"texto":"5 g de extracto de vainilla","cantidad":5.0,"resto":"g de extracto de vainilla","escalable":true,"modo":"simple"},{"texto":"350 g de harina de trigo","cantidad":350.0,"resto":"g de harina de trigo","escalable":true,"modo":"simple"},{"texto":"160 g de chocolate (70% de cacao o más)","cantidad":160.0,"resto":"g de chocolate (70% de cacao o más)","escalable":true,"modo":"simple"},{"texto":"Una pizca de flor de sal, para terminar","cantidad":null,"resto":"Una pizca de flor de sal, para terminar","escalable":false}],"elaboracion":["Tofe: forrar una bandeja con papel de horno. Poner la mantequilla, el azúcar moreno y la sal en una sartén fría y fundir a fuego medio-alto. Remover sin parar hasta alcanzar los 150° (con un termómetro de lo en un bol junto con la mantequilla al baño maría, removiendo hasta que se funda y emulsione. Dejar enfriar a temperatura ambiente.","Batir el huevo con el azúcar moreno y la sal hasta que doble su volumen. Incorporar el chocolate fundido y mezclar. Añadir la Nutella y la vainilla, mezclando bien.","Tamizar la harina, la levadura y el bicarbonato, e incorporar con movimientos envolventes. Cubrir con film y refrigerar 1 hora.","Masa blanca: batir la mantequilla en pomada hasta que quede cremosa. Añadir el azúcar blanco y batir 2 minutos. Incorporar el huevo batido y la vainilla, mezclando bien. Tamizar la harina floja e incorporarla con movimientos suaves. Refrigerar 1 hora.","Formar bolitas de 7 g con la masa blanca y de 10 g con la masa de Nutella. Aplanar una bolita blanca con el pulgar, colocar encima una bolita oscura y estirar la masa blanca por los bordes hasta cubrirla por completo. Aplanar con la palma de la mano y marcar el centro con el pulgar.","Colocar en una bandeja con papel de horno y hornear a 170° durante 11 minutos, sin que lleguen a dorarse por fuera. Dejar enfriar del todo sobre una rejilla antes de comer."]},{"categoria":"BEBIDAS","titulo":"Orujo de Hojas de Guindas (mar)","raciones":"1 litro de orujo (unas 20 raciones)","racionesBase":1,"tiempo":"10 min (+ maceración 22 días)","ingredientes":[{"texto":"22 hojas de guindal","cantidad":22.0,"resto":"hojas de guindal","escalable":true,"modo":"simple"},{"texto":"1 litro de orujo","cantidad":1.0,"resto":"litro de orujo","escalable":true,"modo":"simple"},{"texto":"¼ kg de azúcar","cantidad":0.25,"resto":"kg de azúcar","escalable":true,"modo":"simple"}],"elaboracion":["Se meten las hojas de guindal en un recipiente de cristal con cierre hermético, se cubren con el orujo y se añade el azúcar. Se remueve un poco para que el azúcar empiece a disolverse y se cierra bien.","Se deja macerar en un lugar oscuro y fresco durante 22 días, agitando el recipiente de vez en cuando para ayudar a que se disuelva el azúcar y se reparta el color. Pasado ese tiempo, se cuela con un colador fino o un paño, se quitan las hojas y se embotella.","Si se quiere un color verdoso más intenso, se pueden poner más hojas y dejarlo macerar algún día más."]}],"colores":{"ENTRANTES Y ENSALADAS":"#6B8E4E","SOPAS":"#DB7C26","ARROCES":"#E07A3E","PESCADOS Y MARISCOS":"#2E8B8B","AVES (POLLO, PAVO Y PICHÓN)":"#C1440E","TERNERA Y VACUNO":"#8B3A2B","CERDO":"#D07A3D","CORDERO":"#A85C32","CONEJO":"#BF7E4A","COMIDA MEXICANA":"#D6336C","CAZA Y CHARCUTERÍA":"#8C2F39","VERDURAS":"#4E9F3D","REPOSTERÍA":"#C6497B","REPOSTERÍA ITALIANA Y FRANCESA":"#9C6644","REPOSTERÍA AMERICANA":"#B5843A","POSTRES JAPONESES":"#B03A5B","POSTRES DE ORIENTE MEDIO":"#A6743C","GALLETAS":"#A0522D","BEBIDAS":"#7B4EA3","CROQUETAS":"#B5651D","SALSAS Y VINAGRETAS":"#D9A404","CREMAS":"#E1654D","GAZPACHOS Y CREMAS FRÍAS":"#3E9C8C","PURÉS":"#8A9A3B","PASTAS":"#D4A017","NOODLES":"#1F6F78","PANES Y BOLLERÍA":"#B8860B","BOCADILLOS":"#C9971E","SÁNDWICHES":"#DDAA33","CALZONES":"#CC8400","EMPANADAS Y AREPAS":"#E09A2E","DUMPLINGS":"#A66A1E","BAOS Y OKONOMIYAKI":"#BF8330"}};
</script>
<script>
let DATA = null;
let categoriaActiva = null;
let recetaActual = null;
let racionesActuales = null;

function lighten(hex, factor){
  hex = hex.replace('#','');
  const r = parseInt(hex.substr(0,2),16), g = parseInt(hex.substr(2,2),16), b = parseInt(hex.substr(4,2),16);
  const nr = Math.round(r + (255-r)*factor);
  const ng = Math.round(g + (255-g)*factor);
  const nb = Math.round(b + (255-b)*factor);
  return `rgb(${nr},${ng},${nb})`;
}

async function init(){
  DATA = DATA_EMBEBIDA;
  renderCats();
  renderLista();
  document.getElementById('buscador').addEventListener('input', renderLista);
  document.getElementById('volver').addEventListener('click', ()=>{
    categoriaActiva = null;
    document.getElementById('buscador').value = '';
    renderCats();
    renderLista();
  });
  document.getElementById('cerrar').addEventListener('click', cerrarDetalle);
  document.getElementById('detalle').addEventListener('click', (e)=>{
    if(e.target.id === 'detalle') cerrarDetalle();
  });
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape') cerrarDetalle();
  });
}

function renderCats(){
  const cont = document.getElementById('cats');
  cont.innerHTML = '';
  DATA.categorias.forEach(cat=>{
    const color = DATA.colores[cat] || '#B8863B';
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = tituloCat(cat);
    chip.style.borderColor = color;
    chip.addEventListener('click', ()=>{
      categoriaActiva = (categoriaActiva === cat) ? null : cat;
      renderCats();
      renderLista();
    });
    if(categoriaActiva === cat){
      chip.classList.add('active');
      chip.style.background = color;
    }
    cont.appendChild(chip);
  });
}

function tituloCat(cat){
  return cat.charAt(0) + cat.slice(1).toLowerCase();
}

function renderLista(){
  const q = document.getElementById('buscador').value.trim().toLowerCase();
  const lista = document.getElementById('lista');
  const vacio = document.getElementById('vacio');
  const cats = document.getElementById('cats');
  const volver = document.getElementById('volver');
  const catActivaEl = document.getElementById('cat-activa');
  lista.innerHTML = '';

  // modo: 'list' si hay texto buscado, 'grid' si solo hay categoría elegida, 'none' si nada
  const modo = q ? 'list' : (categoriaActiva ? 'grid' : 'none');

  cats.style.display = (modo === 'none') ? 'flex' : 'none';
  volver.style.display = (modo === 'none') ? 'none' : 'inline-block';
  lista.className = (modo === 'list') ? 'list-view' : (modo === 'grid') ? 'grid-view' : '';

  if(modo === 'grid' && categoriaActiva){
    const color = DATA.colores[categoriaActiva] || '#B8863B';
    catActivaEl.textContent = tituloCat(categoriaActiva);
    catActivaEl.style.display = 'inline-block';
    catActivaEl.style.background = color;
    catActivaEl.style.color = '#141F2B';
  } else {
    catActivaEl.style.display = 'none';
  }

  if(modo === 'none'){
    document.getElementById('contador').textContent = '';
    vacio.style.display = 'block';
    vacio.textContent = 'Busca un título o elige una categoría para ver las recetas.';
    return;
  }

  let recetas = DATA.recetas;
  if(categoriaActiva) recetas = recetas.filter(r=>r.categoria === categoriaActiva);
  if(q) recetas = recetas.filter(r=>
    r.titulo.toLowerCase().includes(q) || r.categoria.toLowerCase().includes(q)
  );

  document.getElementById('contador').textContent =
    recetas.length + (recetas.length === 1 ? ' receta' : ' recetas');

  vacio.textContent = 'No se ha encontrado ninguna receta.';
  vacio.style.display = recetas.length ? 'none' : 'block';

  recetas.forEach(r=>{
    const color = DATA.colores[r.categoria] || '#B8863B';
    const {base, tags} = splitTags(r.titulo);
    const tagHtml = tags.length ? ' <span class="tag">'+tags.join(' ')+'</span>' : '';
    const meta = metaTexto(r);

    if(modo === 'list'){
      const row = document.createElement('div');
      row.className = 'list-row';
      row.style.borderLeftColor = color;
      row.innerHTML = `
        <div>
          <div class="lr-cat" style="color:${color}">${tituloCat(r.categoria)}</div>
          <div class="lr-title">${base}${tagHtml}</div>
        </div>
        <div class="lr-rac">${meta}</div>
      `;
      row.addEventListener('click', ()=>abrirDetalle(r));
      lista.appendChild(row);
    } else {
      const card = document.createElement('div');
      card.className = 'card';
      card.style.borderLeft = `3px solid ${color}`;
      card.innerHTML = `
        <div class="eyebrow" style="color:${color}">${tituloCat(r.categoria)}</div>
        <h3>${base}${tagHtml}</h3>
        <div class="rac">${meta}</div>
      `;
      card.addEventListener('click', ()=>abrirDetalle(r));
      lista.appendChild(card);
    }
  });
}

function splitTags(titulo){
  let base = titulo;
  const tags = [];
  const re = /^(.*)\s(\([^()]+\))$/;
  while(true){
    const m = base.match(re);
    if(!m) break;
    base = m[1];
    tags.unshift(m[2]);
  }
  return {base, tags};
}

function metaTexto(r){
  return [r.raciones, r.tiempo].filter(Boolean).join('  ·  ');
}

function abrirDetalle(r){
  recetaActual = r;
  racionesActuales = r.racionesBase;
  const color = DATA.colores[r.categoria] || '#B8863B';
  document.getElementById('d-cat').textContent = tituloCat(r.categoria);
  document.getElementById('d-cat').style.color = color;

  const {base, tags} = splitTags(r.titulo);
  document.getElementById('d-titulo').innerHTML =
    base + (tags.length ? ' <span class="tag">'+tags.join(' ')+'</span>' : '');

  renderRaciones(r);
  renderIngredientes(r, color);

  document.getElementById('d-elab').innerHTML =
    r.elaboracion.map(p=>`<p>${p}</p>`).join('');

  document.getElementById('detalle').classList.add('open');
  document.getElementById('detalle').scrollTop = 0;
}

function renderRaciones(r){
  const cont = document.getElementById('raciones-box');
  const tiempoHtml = r.tiempo ? `<span class="lbl tiempo-lbl">⏱ ${r.tiempo.toUpperCase()}</span>` : '';
  if(!r.racionesBase){
    const racHtml = r.raciones ? `<span class="lbl">${r.raciones.toUpperCase()}</span>` : '';
    cont.innerHTML = racHtml + tiempoHtml;
    return;
  }
  cont.innerHTML = `
    <span class="lbl">RACIONES</span>
    <div class="stepper">
      <button id="menos">−</button>
      <input id="rac-input" type="text" value="${racionesActuales}" inputmode="numeric">
      <button id="mas">+</button>
    </div>
    <button class="reset-link" id="reset-rac">restablecer</button>
    ${tiempoHtml}
  `;
  document.getElementById('menos').addEventListener('click', ()=>cambiarRaciones(-1));
  document.getElementById('mas').addEventListener('click', ()=>cambiarRaciones(1));
  document.getElementById('reset-rac').addEventListener('click', ()=>{
    racionesActuales = recetaActual.racionesBase;
    renderRaciones(recetaActual);
    renderIngredientes(recetaActual, DATA.colores[recetaActual.categoria] || '#B8863B');
  });
  document.getElementById('rac-input').addEventListener('change', (e)=>{
    const v = parseFloat(e.target.value.replace(',','.'));
    if(!isNaN(v) && v > 0){
      racionesActuales = v;
      renderIngredientes(recetaActual, DATA.colores[recetaActual.categoria] || '#B8863B');
    }
  });
}

function cambiarRaciones(delta){
  racionesActuales = Math.max(1, racionesActuales + delta);
  renderRaciones(recetaActual);
  document.getElementById('rac-input').value = racionesActuales;
  renderIngredientes(recetaActual, DATA.colores[recetaActual.categoria] || '#B8863B');
}

function formatoNum(n){
  const r = Math.round(n * 100) / 100;
  if(Number.isInteger(r)) return String(r);
  return r.toFixed(2).replace(/0+$/,'').replace(/\.$/,'');
}

function renderIngredientes(r, color){
  const box = document.getElementById('d-ing');
  const factor = (r.racionesBase && racionesActuales) ? (racionesActuales / r.racionesBase) : 1;
  box.innerHTML = r.ingredientes.map(ing=>{
    if(ing.escalable && ing.cantidad !== null){
      const c1 = formatoNum(ing.cantidad * factor);
      if(ing.modo === 'rango' && ing.cantidad2 !== undefined){
        const c2 = formatoNum(ing.cantidad2 * factor);
        return `<div>— <span class="num">${c1}-${c2}</span> ${ing.resto}</div>`;
      }
      return `<div>— <span class="num">${c1}</span> ${ing.resto}</div>`;
    }
    return `<div>— ${ing.texto}</div>`;
  }).join('');
}

function cerrarDetalle(){
  document.getElementById('detalle').classList.remove('open');
}

init();
</script>
</body>
</html>
