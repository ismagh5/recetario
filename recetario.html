guientes con el resto de la elaboración del relleno, el montaje de los canelones de puerro y la preparación final de la salsa. Añadir cuando se localicen las páginas siguientes.]"]},{"categoria":"PASTAS","titulo":"Canelones de Gambas, Jamón y Shiitake (diegodoal)","raciones":"6 personas","racionesBase":6,"tiempo":"50 min (+ 30 min de reposo de la masa)","ingredientes":[{"texto":"Para el relleno: 800 g de langostinos crudos (o gambas, o gambones)","cantidad":null,"resto":"Para el relleno: 800 g de langostinos crudos (o gambas, o gambones)","escalable":false},{"texto":"1 cucharadita de bicarbonato","cantidad":1.0,"resto":"cucharadita de bicarbonato","escalable":true,"modo":"simple"},{"texto":"10 setas shiitake","cantidad":10.0,"resto":"setas shiitake","escalable":true,"modo":"simple"},{"texto":"3 filetes gruesos de jamón ibérico","cantidad":3.0,"resto":"filetes gruesos de jamón ibérico","escalable":true,"modo":"simple"},{"texto":"1 puerro","cantidad":1.0,"resto":"puerro","escalable":true,"modo":"simple"},{"texto":"1 cebolla mediana","cantidad":1.0,"resto":"cebolla mediana","escalable":true,"modo":"simple"},{"texto":"Sal y pimienta negra al gusto","cantidad":null,"resto":"Sal y pimienta negra al gusto","escalable":false},{"texto":"Un chorrito de aceite de oliva virgen extra","cantidad":null,"resto":"Un chorrito de aceite de oliva virgen extra","escalable":false},{"texto":"1 nuez de mantequilla","cantidad":1.0,"resto":"nuez de mantequilla","escalable":true,"modo":"simple"},{"texto":"Un chorro de vino blanco","cantidad":null,"resto":"Un chorro de vino blanco","escalable":false},{"texto":"100 g de queso gruyère para gratinar","cantidad":100.0,"resto":"g de queso gruyère para gratinar","escalable":true,"modo":"simple"},{"texto":"Un puñado de perejil fresco para terminar","cantidad":null,"resto":"Un puñado de perejil fresco para terminar","escalable":false},{"texto":"Para la pasta fresca de sémola: 60 g de harina de fuerza","cantidad":null,"resto":"Para la pasta fresca de sémola: 60 g de harina de fuerza","escalable":false},{"texto":"60 g de sémola de trigo (sustituible por harina de fuerza)","cantidad":60.0,"resto":"g de sémola de trigo (sustituible por harina de fuerza)","escalable":true,"modo":"simple"},{"texto":"1 huevo grande","cantidad":1.0,"resto":"huevo grande","escalable":true,"modo":"simple"},{"texto":"1 yema","cantidad":1.0,"resto":"yema","escalable":true,"modo":"simple"},{"texto":"Para la bechamel rosa: 40 g de harina de trigo","cantidad":null,"resto":"Para la bechamel rosa: 40 g de harina de trigo","escalable":false},{"texto":"40 g de mantequilla","cantidad":40.0,"resto":"g de mantequilla","escalable":true,"modo":"simple"},{"texto":"800 ml de leche caliente infusionada con las cabezas de las gambas","cantidad":800.0,"resto":"ml de leche caliente infusionada con las cabezas de las gambas","escalable":true,"modo":"simple"},{"texto":"10 granos de pimienta negra","cantidad":10.0,"resto":"granos de pimienta negra","escalable":true,"modo":"simple"},{"texto":"2 hojas de laurel","cantidad":2.0,"resto":"hojas de laurel","escalable":true,"modo":"simple"},{"texto":"Una pizca de nuez moscada","cantidad":null,"resto":"Una pizca de nuez moscada","escalable":false},{"texto":"Sal al gusto","cantidad":null,"resto":"Sal al gusto","escalable":false}],"elaboracion":["Los canelones son uno de los platos de pasta más queridos de España, plato navideño por excelencia en muchas casas catalanas y habitual el resto del año en el resto del país. Se pueden rellenar de mil cosas, pero esta combinación de gambas con jamón, shiitake y un sofrito de puerro y cebolla bien caramelizados es de las mejores que existen. Se pueden hacer con placas de pasta fresca casera o con unas compradas, y montados así, sin gratinar, se congelan de maravilla: para una comida rápida basta con meterlos directamente del congelador al horno a 180° durante 20-25 minutos.","Pasta fresca: dar forma de volcán a la harina de fuerza y la sémola sobre la encimera. Cascar el huevo y añadir la yema en el cráter central. Batir con un tenedor, incorporando la harina poco a poco. Cuando la masa empiece a desmoronarse, continuar amasando con las manos hasta que, al presionarla con un dedo, recupere la forma, unos 4 minutos.","Envolver la masa en film y dejar reposar 30 minutos a temperatura ambiente.","Estirar la masa dándole forma ovalada. Doblarla en tres, como una carta, girarla y volver a estirarla a lo largo. Repetir el proceso dos veces más.","Pasar la placa por la máquina de pasta, reduciendo el grosor un número cada vez, hasta llegar al ajuste más fino.","Cortar la pasta en rectángulos de unos 10x14 cm y reservar.","Relleno: pelar los langostinos, reservando las cabezas y las carcasas para la leche infusionada. Dejar 12 colas enteras aparte, que se usarán para terminar el plato.","En un cazo, poner la leche de la bechamel junto con las cabezas y carcasas de los langostinos, la pimienta negra y el laurel. Calentar a fuego medio-alto y, cuando humee, retirar del fuego, tapar e infusionar un mínimo de 15 minutos.","Lavar el resto de los langostinos bajo agua fría durante al menos 1 minuto, hasta que dejen de estar pegajosos por fuera y adquieran un color más blanquecino.","Picar los langostinos en trozos medianos sobre una tabla, sin llegar a convertirlos en una pasta.","Pasarlos a un bol junto con el bicarbonato y dejar marinar 15 minutos (el bicarbonato ayuda a que la gamba quede más jugosa y firme al cocinarla).","Mientras tanto, picar las setas shiitake (descartando los tallos), el jamón, el puerro y la cebolla.","En una sartén fría, añadir abundante aceite de oliva y el jamón. Encender a fuego medio-alto y sofreír hasta que el jamón esté muy aromático.","Añadir el puerro y la cebolla con una pizca de sal y pimienta negra; sofreír 10 minutos, hasta que estén bien pochados y ligeramente caramelizados.","Añadir las shiitake y la nuez de mantequilla; sofreír 5 minutos más.","Añadir el vino blanco y sofreír 2 minutos.","Añadir los langostinos e incorporar todo; cocinar 1 minuto más, hasta que cojan color.","Pasar el relleno a un bol para que se enfríe.","Bechamel: machacar las cabezas de langostinos directamente en la leche infusionada y tamizarla.","En una sartén a fuego medio, fundir la mantequilla. Cuando burbujee, añadir la harina y cocinarla hasta que deje de oler a harina cruda, aproximadamente 1 minuto.","Añadir la leche poco a poco, incorporándola con unas varillas sin parar de remover.","Cuando toda la leche esté incorporada, sazonar con sal y nuez moscada.","Añadir unas cucharadas de esta bechamel al relleno de gambas, hasta que quede cremoso y bien ligado.","Montaje: cocer las placas de pasta elegidas, rellenar cada una con la mezcla de gambas y enrollarlas.","Cubrir el fondo de una fuente apta para horno con un poco de bechamel. Colocar los canelones encima y cubrirlos con el resto de la bechamel. Rallar el queso gruyère por encima.","Gratinar con el grill al máximo durante unos 5 minutos, hasta que la superficie esté dorada.","Mientras tanto, freír las gambas reservadas con cola en mantequilla.","Dejar reposar los canelones un par de minutos antes de servir. Terminar con perejil fresco picado y las gambas fritas por encima."]},{"categoria":"PASTAS","titulo":"Agnolotti al Tartufo (diegodoal)","raciones":"4 personas","racionesBase":4,"tiempo":"1 hora","ingredientes":[{"texto":"200 g de harina de fuerza","cantidad":200.0,"resto":"g de harina de fuerza","escalable":true,"modo":"simple"},{"texto":"1 huevo","cantidad":1.0,"resto":"huevo","escalable":true,"modo":"simple"},{"texto":"4 yemas","cantidad":4.0,"resto":"yemas","escalable":true,"modo":"simple"},{"texto":"2 g de sal","cantidad":2.0,"resto":"g de sal","escalable":true,"modo":"simple"},{"texto":"Un chorrito de aceite de oliva virgen extra","cantidad":null,"resto":"Un chorrito de aceite de oliva virgen extra","escalable":false},{"texto":"250 g de calabaza","cantidad":250.0,"resto":"g de calabaza","escalable":true,"modo":"simple"},{"texto":"2 cucharadas de kéfir o yogur","cantidad":2.0,"resto":"cucharadas de kéfir o yogur","escalable":true,"modo":"simple"},{"texto":"30 g de queso parmesano","cantidad":30.0,"resto":"g de queso parmesano","escalable":true,"modo":"simple"},{"texto":"Nuez moscada, un chorrito de aceite de oliva, ralladura de limón, sal y pimienta, al gusto","cantidad":null,"resto":"Nuez moscada, un chorrito de aceite de oliva, ralladura de limón, sal y pimienta, al gusto","escalable":false}],"elaboracion":["Para la pasta fresca al huevo, base de esta receta: hacer un volcán con la harina, cascar el huevo y las yemas en el centro, añadir la sal y el aceite. Mezclar con un tenedor incorporando la harina poco a poco. Amasar 3-4 minutos hasta que quede elástica. Envolver y dejar reposar 30 minutos.","Estirar la masa en forma ovalada, plegarla en tres, girarla, aplanarla y volver a plegar; repetir una vez más. Después pasarla por la máquina de pasta, reduciendo el grosor progresivamente hasta dejarla fina.","Cocer la calabaza (hervida o asada a 200°C) hasta que esté tierna, unos 20-25 minutos, y triturarla (unos 300 g de puré). Mezclar con el kéfir, el parmesano, la nuez moscada, el aceite, la ralladura de limón, sal y pimienta; pasar a una manga pastelera. Escudillar el relleno en un cordón a lo largo de la lámina de pasta, doblar y sellar bien apretado. Con los dedos pulgar e índice, marcar y separar cada agnolotto, y terminar de cortarlos con un cortapastas.","Cocer los agnolotti en agua hirviendo con sal hasta que floten (unos 2-4 minutos) y servir con la salsa o el aliño que se prefiera."]},{"categoria":"PASTAS","titulo":"Tortellini di Maiale e Pecorino (diegodoal)","raciones":"4 personas","racionesBase":4,"tiempo":"1 hora","ingredientes":[{"texto":"200 g de harina de fuerza","cantidad":200.0,"resto":"g de harina de fuerza","escalable":true,"modo":"simple"},{"texto":"1 huevo","cantidad":1.0,"resto":"huevo","escalable":true,"modo":"simple"},{"texto":"4 yemas","cantidad":4.0,"resto":"yemas","escalable":true,"modo":"simple"},{"texto":"2 g de sal","cantidad":2.0,"resto":"g de sal","escalable":true,"modo":"simple"},{"texto":"Un chorrito de aceite de oliva virgen extra","cantidad":null,"resto":"Un chorrito de aceite de oliva virgen extra","escalable":false},{"texto":"50 g de lomo de cerdo","cantidad":50.0,"resto":"g de lomo de cerdo","escalable":true,"modo":"simple"},{"texto":"50 g de guanciale o jamón ibérico","cantidad":50.0,"resto":"g de guanciale o jamón ibérico","escalable":true,"modo":"simple"},{"texto":"50 g de mortadela italiana","cantidad":50.0,"resto":"g de mortadela italiana","escalable":true,"modo":"simple"},{"texto":"30 g de queso pecorino romano","cantidad":30.0,"resto":"g de queso pecorino romano","escalable":true,"modo":"simple"},{"texto":"Un chorrito de aceite de oliva, pimienta negra, medio huevo y sal, al gusto","cantidad":null,"resto":"Un chorrito de aceite de oliva, pimienta negra, medio huevo y sal, al gusto","escalable":false}],"elaboracion":["Para la pasta fresca al huevo, base de esta receta: hacer un volcán con la harina, cascar el huevo y las yemas en el centro, añadir la sal y el aceite. Mezclar con un tenedor incorporando la harina poco a poco. Amasar 3-4 minutos hasta que quede elástica. Envolver y dejar reposar 30 minutos.","Estirar la masa en forma ovalada, plegarla en tres, girarla, aplanarla y volver a plegar; repetir una vez más. Después pasarla por la máquina de pasta, reduciendo el grosor progresivamente hasta dejarla fina.","Dorar el guanciale en una sartén fría a fuego medio-alto hasta que suelte la grasa y quede crujiente, unos 5-6 minutos; añadir el lomo de cerdo y cocinar unos 5 minutos más, hasta que esté hecho. Pasar a la procesadora junto con la mortadela, el pecorino, el aceite, la pimienta, medio huevo y sal; triturar hasta que quede homogéneo. Cortar la pasta en cuadrados de 4x4 cm, poner una bolita de relleno en el centro de cada uno y darles forma de tortellini doblando y uniendo las puntas.","Cocer los tortellini en agua hirviendo con sal hasta que floten (unos 2-4 minutos) y servir con la salsa o el aliño que se prefiera."]},{"categoria":"PASTAS","titulo":"Uovo in Raviolo (diegodoal)","raciones":"4 personas (8 raviolos)","racionesBase":4,"tiempo":"50 min","ingredientes":[{"texto":"200 g de harina de fuerza","cantidad":200.0,"resto":"g de harina de fuerza","escalable":true,"modo":"simple"},{"texto":"1 huevo","cantidad":1.0,"resto":"huevo","escalable":true,"modo":"simple"},{"texto":"4 yemas","cantidad":4.0,"resto":"yemas","escalable":true,"modo":"simple"},{"texto":"2 g de sal","cantidad":2.0,"resto":"g de sal","escalable":true,"modo":"simple"},{"texto":"Un chorrito de aceite de oliva virgen extra","cantidad":null,"resto":"Un chorrito de aceite de oliva virgen extra","escalable":false},{"texto":"250 g de ricotta","cantidad":250.0,"resto":"g de ricotta","escalable":true,"modo":"simple"},{"texto":"20 g de queso pecorino","cantidad":20.0,"resto":"g de queso pecorino","escalable":true,"modo":"simple"},{"texto":"Zumo de limón, sal, pimienta y glutamato (opcional), al gusto","cantidad":null,"resto":"Zumo de limón, sal, pimienta y glutamato (opcional), al gusto","escalable":false},{"texto":"8 yemas de huevo","cantidad":8.0,"resto":"yemas de huevo","escalable":true,"modo":"simple"}],"elaboracion":["Para la pasta fresca al huevo, base de esta receta: hacer un volcán con la harina, cascar el huevo y las yemas en el centro, añadir la sal y el aceite. Mezclar con un tenedor incorporando la harina poco a poco. Amasar 3-4 minutos hasta que quede elástica. Envolver y dejar reposar 30 minutos.","Estirar la masa en forma ovalada, plegarla en tres, girarla, aplanarla y volver a plegar; repetir una vez más. Después pasarla por la máquina de pasta, reduciendo el grosor progresivamente hasta dejarla fina.","Escurrir la ricotta prensándola en un paño para quitarle el agua. Mezclarla con el pecorino, el zumo de limón, sal, pimienta y glutamato (opcional); pasar a una manga. Cortar 16 círculos de 9 cm de la lámina de pasta. Escudillar un círculo de relleno de ricotta sobre 8 de ellos, y repetir para dejar dos capas de borde. Colocar con cuidado una yema de huevo en el centro de cada uno. Humedecer los bordes de la pasta, tapar con el segundo círculo y sellar con cuidado de no romper la yema.","Cocer los raviolos en agua hirviendo con sal hasta que floten (unos 2-4 minutos) y servir con la salsa o el aliño que se prefiera."]},{"categoria":"PASTAS","titulo":"Gnocchi de Ricotta Casera (diegodoal)","raciones":"6 personas","racionesBase":6,"tiempo":"1 h (+ 20-60 min de reposo/colado de la ricotta)","ingredientes":[{"texto":"Para la ricotta: 3 litros de leche pasteurizada (no UHT)","cantidad":null,"resto":"Para la ricotta: 3 litros de leche pasteurizada (no UHT)","escalable":false},{"texto":"270 ml de nata para montar","cantidad":270.0,"resto":"ml de nata para montar","escalable":true,"modo":"simple"},{"texto":"12 g de sal","cantidad":12.0,"resto":"g de sal","escalable":true,"modo":"simple"},{"texto":"55 ml de vinagre blanco","cantidad":55.0,"resto":"ml de vinagre blanco","escalable":true,"modo":"simple"},{"texto":"Para los gnocchi: 420 g de la ricotta casera (escurrida hasta unos 375 g)","cantidad":null,"resto":"Para los gnocchi: 420 g de la ricotta casera (escurrida hasta unos 375 g)","escalable":false},{"texto":"30 g de parmesano","cantidad":30.0,"resto":"g de parmesano","escalable":true,"modo":"simple"},{"texto":"120 g de harina de trigo (y algo más para espolvorear)","cantidad":120.0,"resto":"g de harina de trigo (y algo más para espolvorear)","escalable":true,"modo":"simple"},{"texto":"1 huevo","cantidad":1.0,"resto":"huevo","escalable":true,"modo":"simple"},{"texto":"1 yema de huevo","cantidad":1.0,"resto":"yema de huevo","escalable":true,"modo":"simple"},{"texto":"Una pizca de sal","cantidad":null,"resto":"Una pizca de sal","escalable":false},{"texto":"Pimienta negra al gusto","cantidad":null,"resto":"Pimienta negra al gusto","escalable":false},{"texto":"Para servir: 550 g de ricotta","cantidad":null,"resto":"Para servir: 550 g de ricotta","escalable":false},{"texto":"500 g de mozzarella fresca","cantidad":500.0,"resto":"g de mozzarella fresca","escalable":true,"modo":"simple"},{"texto":"30 g de mantequilla","cantidad":30.0,"resto":"g de mantequilla","escalable":true,"modo":"simple"},{"texto":"100 g de parmesano y pecorino romano","cantidad":100.0,"resto":"g de parmesano y pecorino romano","escalable":true,"modo":"simple"},{"texto":"Unas hojas de albahaca fresca","cantidad":null,"resto":"Unas hojas de albahaca fresca","escalable":false}],"elaboracion":["Ricotta casera: calentar la leche, la nata y la sal en una olla grande removiendo con frecuencia hasta alcanzar 93°.","Añadir el vinagre poco a poco mientras se remueve; retirar del fuego en cuanto se aprecie que la leche empieza a cortarse.","Dejar reposar sin tocar 20 minutos, para que el cuajo se asiente.","Colar a través de una estameña o gasa fina durante 15 minutos a 1 hora, según la textura deseada (menos tiempo para una ricotta más cremosa, más para una más seca y firme, ideal para los gnocchi). Se puede guardar en la nevera hasta una semana.","Gnocchi: escurrir el exceso de suero de la ricotta apretándola con las manos. Mezclar con el parmesano, la harina, el huevo, la yema, la sal y la pimienta con una espátula hasta homogeneizar.","Añadir harina poco a poco hasta que la masa sea manejable sin quedar excesivamente pegajosa.","Formar un disco con la masa y cortarlo en cuatro cuartos. Enrollar cada cuarto en forma de cilindro fino sobre la mesa enharinada y cortar en trozos individuales; espolvorear con harina para que no se peguen.","Cocer en agua salada hirviendo hasta que floten más 30 segundos adicionales, unos 3 minutos en total. Escurrir y mezclar de inmediato con la salsa elegida."]},{"categoria":"PASTAS","titulo":"Gnocchi de Patata Caseros, Totalmente a Mano (diegodoal)","raciones":"4 personas","racionesBase":4,"tiempo":"50 min","ingredientes":[{"texto":"Para los gnocchi: 4 patatas medianas (1 kg)","cantidad":null,"resto":"Para los gnocchi: 4 patatas medianas (1 kg)","escalable":false},{"texto":"300 g de harina de trigo (aproximadamente)","cantidad":300.0,"resto":"g de harina de trigo (aproximadamente)","escalable":true,"modo":"simple"},{"texto":"1 huevo","cantidad":1.0,"resto":"huevo","escalable":true,"modo":"simple"},{"texto":"Sal al gusto","cantidad":null,"resto":"Sal al gusto","escalable":false},{"texto":"Para el pesto emulsionado: 55 g de piñones","cantidad":null,"resto":"Para el pesto emulsionado: 55 g de piñones","escalable":false},{"texto":"90 g de parmesano","cantidad":90.0,"resto":"g de parmesano","escalable":true,"modo":"simple"},{"texto":"7 ramilletes de albahaca (40 g)","cantidad":7.0,"resto":"ramilletes de albahaca (40 g)","escalable":true,"modo":"simple"},{"texto":"2 dientes de ajo","cantidad":2.0,"resto":"dientes de ajo","escalable":true,"modo":"simple"},{"texto":"120 ml de aceite de oliva virgen extra","cantidad":120.0,"resto":"ml de aceite de oliva virgen extra","escalable":true,"modo":"simple"},{"texto":"Un chorro de agua","cantidad":null,"resto":"Un chorro de agua","escalable":false},{"texto":"Un puñado de parmesano y pimienta negra para terminar","cantidad":null,"resto":"Un puñado de parmesano y pimienta negra para terminar","escalable":false},{"texto":"Para la versión con mantequilla y salvia: 50 g de mantequilla","cantidad":null,"resto":"Para la versión con mantequilla y salvia: 50 g de mantequilla","escalable":false},{"texto":"2 cucharaditas de salvia seca o 6 hojas de salvia fresca","cantidad":2.0,"resto":"cucharaditas de salvia seca o 6 hojas de salvia fresca","escalable":true,"modo":"simple"},{"texto":"30 g de parmesano","cantidad":30.0,"resto":"g de parmesano","escalable":true,"modo":"simple"}],"elaboracion":["Cocer las patatas con piel en agua salada durante 30 minutos, hasta que estén tiernas.","Pelarlas en caliente y triturarlas en un puré liso; dejar enfriar por completo (usar patata caliente da una masa pegajosa que necesita demasiada harina).","Añadir sal y el huevo; mezclar bien.","Incorporar la harina poco a poco hasta formar una masa elástica que no se pegue en exceso a las manos.","Dividir en 4 porciones. Formar cilindros de 1,5 cm de grosor con cada una.","Cortar en trozos del tamaño de un bocado. Dar forma a cada uno presionando el centro con el dedo (esto ayuda a que la salsa se adhiera mejor).","Versión con pesto emulsionado: tostar los piñones hasta que estén aromáticos. Triturarlos con el parmesano, el ajo, la albahaca y un poco de agua. Añadir el aceite poco a poco mientras se sigue triturando, para conseguir una emulsión ligera.","Hervir los gnocchi hasta que floten, aproximadamente 1 minuto. Mezclar con un poco de agua de cocción y el pesto, emulsionando bien. Servir con más pesto, parmesano y pimienta negra.","Versión con mantequilla y salvia: fundir la mantequilla a fuego medio-alto. Hervir los gnocchi hasta que floten.","Añadir la salvia seca a la mantequilla burbujeante durante 10 segundos. Añadir los gnocchi cocidos y saltear en la mantequilla 30 segundos.","Dorar cada lado 2 minutos. Servir con la mantequilla de salvia, virutas de parmesano y pimienta."]},{"categoria":"PASTAS","titulo":"Pasta alla Amatriciana (diegodoal)","raciones":"2 personas","racionesBase":2,"tiempo":"25 min","ingredientes":[{"texto":"250 g de tomate","cantidad":250.0,"resto":"g de tomate","escalable":true,"modo":"simple"},{"texto":"75 g de guanciale","cantidad":75.0,"resto":"g de guanciale","escalable":true,"modo":"simple"},{"texto":"Vino blanco (un chorrito)","cantidad":null,"resto":"Vino blanco (un chorrito)","escalable":false},{"texto":"Una pizca de guindilla seca","cantidad":null,"resto":"Una pizca de guindilla seca","escalable":false},{"texto":"250 g de pasta","cantidad":250.0,"resto":"g de pasta","escalable":true,"modo":"simple"},{"texto":"30 g de queso pecorino romano","cantidad":30.0,"resto":"g de queso pecorino romano","escalable":true,"modo":"simple"}],"elaboracion":["Retirar la corteza del guanciale, cortarlo en tiras y ponerlo en una sartén fría a fuego medio, dejando que suelte la grasa poco a poco, unos 5-6 minutos.","Cuando esté dorado, retirar los trozos y dejar la grasa en la sartén. Añadir el vino blanco y reducir 30 segundos.","Añadir la guindilla, mezclar y añadir el tomate triturado. Reducir 7 minutos.","Mientras tanto, cocer la pasta en agua salada hirviendo. Cortar el guanciale reservado en trozos más pequeños.","Pasar la pasta a la sartén 2 minutos antes del punto al dente; añadir agua de cocción y mezclar bien, añadiendo más agua según haga falta.","Añadir el guanciale y un puñado de pecorino rallado; mezclar y servir con más queso y guanciale por encima."]},{"categoria":"PASTAS","titulo":"Pasta alle Vongole (diegodoal)","raciones":"2 personas","racionesBase":2,"tiempo":"20 min (+ 2 h de reposo de las almejas)","ingredientes":[{"texto":"10 almejas","cantidad":10.0,"resto":"almejas","escalable":true,"modo":"simple"},{"texto":"1 ramita de perejil","cantidad":1.0,"resto":"ramita de perejil","escalable":true,"modo":"simple"},{"texto":"2 dientes de ajo","cantidad":2.0,"resto":"dientes de ajo","escalable":true,"modo":"simple"},{"texto":"10 tomates cherry","cantidad":10.0,"resto":"tomates cherry","escalable":true,"modo":"simple"},{"texto":"250 g de pasta","cantidad":250.0,"resto":"g de pasta","escalable":true,"modo":"simple"},{"texto":"Vino blanco (un chorrito)","cantidad":null,"resto":"Vino blanco (un chorrito)","escalable":false},{"texto":"Un chorrito de aceite de oliva virgen extra","cantidad":null,"resto":"Un chorrito de aceite de oliva virgen extra","escalable":false},{"texto":"Una pizca de guindilla seca","cantidad":null,"resto":"Una pizca de guindilla seca","escalable":false}],"elaboracion":["Cubrir las almejas con agua salada y dejar reposar 2 horas, para que suelten la arena.","Partir los tomates cherry por la mitad; separar las hojas de perejil de los tallos y picar las hojas.","Cubrir el fondo de una sartén con aceite de oliva; añadir gotas de agua junto con los dientes de ajo sin pelar y la guindilla seca. Colocar los tallos de perejil directamente en el aceite. Calentar a fuego medio.","Cuando el agua se evapore, añadir los tomates cherry y sofreír 3 minutos.","Mientras tanto, cocer la pasta en agua salada hirviendo.","Añadir las almejas escurridas junto con un chorrito de vino blanco. Tapar 60 segundos hasta que se abran.","Destapar, retirar y desechar el ajo y el perejil; reservar las almejas. Pasar la pasta a la sartén 2 minutos antes del punto al dente, añadir agua de cocción y mezclar bien, añadiendo más si hace falta.","Cuando la pasta esté en su punto, añadir las almejas y el perejil picado; mezclar y servir con las almejas, los tomates, hojas de perejil y un hilo de aceite de oliva."]},{"categoria":"PASTAS","titulo":"Pasta alla Gricia (diegodoal)","raciones":"2 personas","racionesBase":2,"tiempo":"20 min","ingredientes":[{"texto":"75 g de guanciale","cantidad":75.0,"resto":"g de guanciale","escalable":true,"modo":"simple"},{"texto":"250 g de pasta","cantidad":250.0,"resto":"g de pasta","escalable":true,"modo":"simple"},{"texto":"80 g de queso pecorino romano","cantidad":80.0,"resto":"g de queso pecorino romano","escalable":true,"modo":"simple"},{"texto":"Pimienta negra al gusto","cantidad":null,"resto":"Pimienta negra al gusto","escalable":false}],"elaboracion":["Retirar la corteza del guanciale y cortarlo en tiras. Cocinarlo en una sartén fría a fuego medio para que suelte la grasa, unos 6-8 minutos.","Cuando el guanciale empiece a soltar grasa, poner a cocer la pasta en agua salada hirviendo.","Cuando el guanciale esté tostado, retirarlo y reservarlo, dejando la grasa en la sartén. Apagar el fuego, dejar templar 1 minuto y añadir pimienta negra recién molida. Volver a encender el fuego y tostar la pimienta hasta que esté aromática.","Pasar la pasta a la sartén 2 minutos antes del punto al dente, añadir agua de cocción y mezclar bien, añadiendo más agua según haga falta.","Cuando la pasta esté en su punto, apagar el fuego y añadir el pecorino. Remover con energía para crear una emulsión cremosa, añadiendo agua si queda demasiado espesa.","Cuando quede lisa y sin grumos, añadir dos tercios del guanciale reservado y mezclar.","Servir de inmediato con más pecorino, pimienta y el resto del guanciale."]},{"categoria":"PASTAS","titulo":"Cacio e Pepe (diegodoal)","raciones":"1 persona","racionesBase":1,"tiempo":"15 min","ingredientes":[{"texto":"130 g de pasta","cantidad":130.0,"resto":"g de pasta","escalable":true,"modo":"simple"},{"texto":"60 g de parmesano o pecorino romano","cantidad":60.0,"resto":"g de parmesano o pecorino romano","escalable":true,"modo":"simple"},{"texto":"10 granos de pimienta negra","cantidad":10.0,"resto":"granos de pimienta negra","escalable":true,"modo":"simple"}],"elaboracion":["Cocer la pasta en agua salada hirviendo. Rallar el queso y reservar.","Tostar los granos de pimienta negra en una sartén a fuego medio 1-2 minutos, hasta que suelten aroma.","Moler la pimienta en un mortero y devolverla a la sartén a fuego medio-alto.","Añadir un cazo de agua de cocción de la pasta.","Pasar la pasta a la sartén un minuto antes del tiempo indicado en el paquete; mezclar.","Añadir agua de cocción hasta la consistencia deseada.","Retirar del fuego, añadir el queso y remover con energía para crear la emulsión. Emplatar de inmediato con más queso y pimienta."]},{"categoria":"PASTAS","titulo":"Aglio e Olio (diegodoal)","raciones":"1 persona","racionesBase":1,"tiempo":"15 min","ingredientes":[{"texto":"130 g de pasta","cantidad":130.0,"resto":"g de pasta","escalable":true,"modo":"simple"},{"texto":"Un puñado de perejil fresco picado","cantidad":null,"resto":"Un puñado de perejil fresco picado","escalable":false},{"texto":"3 dientes de ajo","cantidad":3.0,"resto":"dientes de ajo","escalable":true,"modo":"simple"},{"texto":"40 ml de aceite de oliva virgen extra","cantidad":40.0,"resto":"ml de aceite de oliva virgen extra","escalable":true,"modo":"simple"},{"texto":"Peperoncino (guindilla) al gusto","cantidad":null,"resto":"Peperoncino (guindilla) al gusto","escalable":false}],"elaboracion":["Pelar y laminar finamente el ajo; reservar. Picar el perejil finamente; reservar.","Cocer la pasta en agua salada hirviendo.","En sartén fría, añadir el aceite y el ajo; calentar a fuego medio hasta que burbujee, cocinar 2 minutos.","Añadir el peperoncino; cocinar 15 segundos más.","Pasar la pasta a la sartén un minuto antes de tiempo; mezclar.","Añadir agua de cocción hasta la consistencia deseada, emulsionando con el aceite.","Añadir el perejil, mezclar y emplatar de inmediato."]},{"categoria":"PASTAS","titulo":"Pasta al Pesto (diegodoal)","raciones":"1 persona","racionesBase":1,"tiempo":"15 min","ingredientes":[{"texto":"130 g de pasta","cantidad":130.0,"resto":"g de pasta","escalable":true,"modo":"simple"},{"texto":"3 ramilletes de albahaca","cantidad":3.0,"resto":"ramilletes de albahaca","escalable":true,"modo":"simple"},{"texto":"1 diente de ajo","cantidad":1.0,"resto":"diente de ajo","escalable":true,"modo":"simple"},{"texto":"Sal marina (una pizca)","cantidad":null,"resto":"Sal marina (una pizca)","escalable":false},{"texto":"2 cucharadas de aceite de oliva virgen extra","cantidad":2.0,"resto":"cucharadas de aceite de oliva virgen extra","escalable":true,"modo":"simple"},{"texto":"20 g de parmesano","cantidad":20.0,"resto":"g de parmesano","escalable":true,"modo":"simple"},{"texto":"20 g de piñones","cantidad":20.0,"resto":"g de piñones","escalable":true,"modo":"simple"}],"elaboracion":["Cocer la pasta en agua salada hirviendo.","En un mortero, machacar el ajo pelado con la sal marina hasta formar una pasta.","Añadir los piñones y machacar ligeramente.","Añadir el parmesano rallado y mezclar.","Trocear groseramente la albahaca; añadirla al mortero con 2 cucharadas de aceite y machacar hasta formar una pasta.","Añadir más aceite hasta la consistencia deseada.","Escurrir la pasta y pasarla a un plato. Cubrir con el pesto, mezclar y servir."]},{"categoria":"PASTAS","titulo":"Pasta alla Puttanesca, la Auténtica (diegodoal)","raciones":"2 personas","racionesBase":2,"tiempo":"20 min","ingredientes":[{"texto":"2 filetes de anchoa","cantidad":2.0,"resto":"filetes de anchoa","escalable":true,"modo":"simple"},{"texto":"5 aceitunas negras","cantidad":5.0,"resto":"aceitunas negras","escalable":true,"modo":"simple"},{"texto":"2 dientes de ajo","cantidad":2.0,"resto":"dientes de ajo","escalable":true,"modo":"simple"},{"texto":"½ cucharadita de guindilla roja","cantidad":0.5,"resto":"cucharadita de guindilla roja","escalable":true,"modo":"simple"},{"texto":"6 alcaparras","cantidad":6.0,"resto":"alcaparras","escalable":true,"modo":"simple"},{"texto":"250 g de tomate triturado","cantidad":250.0,"resto":"g de tomate triturado","escalable":true,"modo":"simple"},{"texto":"250 g de pasta","cantidad":250.0,"resto":"g de pasta","escalable":true,"modo":"simple"},{"texto":"Para decorar: 2 anchoas, 5 alcaparras y 5 aceitunas","cantidad":null,"resto":"Para decorar: 2 anchoas, 5 alcaparras y 5 aceitunas","escalable":false}],"elaboracion":["Pelar y laminar el ajo. Picar las anchoas en trozos pequeños. Deshuesar y trocear las aceitunas negras.","Calentar abundante aceite de oliva en una sartén a fuego medio con el ajo y la guindilla; sofreír 30 segundos.","Añadir las anchoas, las aceitunas y las alcaparras; cocinar 1 minuto, deshaciendo las anchoas con la espátula hasta que se disuelvan en el aceite.","Añadir el tomate triturado, remover bien y reducir a fuego medio-alto durante 10 minutos, hasta que quede muy espeso.","Mientras tanto, cocer la pasta en agua salada hirviendo un minuto menos de lo que indique el paquete.","Reservar tres cucharadas de la salsa en un bol aparte para decorar.","Pasar la pasta escurrida directamente a la salsa con dos cucharadas de agua de cocción. Mezclar con energía para emulsionar, añadiendo más agua poco a poco hasta la consistencia deseada.","Servir de inmediato, decorado con la salsa reservada, anchoas, alcaparras y aceitunas extra."]},{"categoria":"PASTAS","titulo":"Tallarines a la Puttanesca (mío)","raciones":"2 personas","racionesBase":2,"tiempo":"25 min","ingredientes":[{"texto":"200 g de tallarines","cantidad":200.0,"resto":"g de tallarines","escalable":true,"modo":"simple"},{"texto":"2 dientes de ajo, picados finos","cantidad":2.0,"resto":"dientes de ajo, picados finos","escalable":true,"modo":"simple"},{"texto":"5 filetes de anchoa en aceite","cantidad":5.0,"resto":"filetes de anchoa en aceite","escalable":true,"modo":"simple"},{"texto":"1 guindilla roja (fresca o seca), sin semillas y picada","cantidad":1.0,"resto":"guindilla roja (fresca o seca), sin semillas y picada","escalable":true,"modo":"simple"},{"texto":"40 g de alcaparras, escurridas","cantidad":40.0,"resto":"g de alcaparras, escurridas","escalable":true,"modo":"simple"},{"texto":"60 g de aceitunas negras, deshuesadas y troceadas","cantidad":60.0,"resto":"g de aceitunas negras, deshuesadas y troceadas","escalable":true,"modo":"simple"},{"texto":"250 g de tomate natural triturado (en conserva)","cantidad":250.0,"resto":"g de tomate natural triturado (en conserva)","escalable":true,"modo":"simple"},{"texto":"Un chorrito de aceite de oliva virgen extra","cantidad":null,"resto":"Un chorrito de aceite de oliva virgen extra","escalable":false},{"texto":"Pimienta negra recién molida, al gusto","cantidad":null,"resto":"Pimienta negra recién molida, al gusto","escalable":false},{"texto":"1 cucharadita de orégano seco","cantidad":1.0,"resto":"cucharadita de orégano seco","escalable":true,"modo":"simple"},{"texto":"Un puñado de perejil fresco picado","cantidad":null,"resto":"Un puñado de perejil fresco picado","escalable":false},{"texto":"Sal al gusto","cantidad":null,"resto":"Sal al gusto","escalable":false}],"elaboracion":["Empezar dejando todo listo antes de encender el fuego, porque esta salsa se hace en el mismo tiempo que tarda la pasta en cocerse: picar el ajo y la guindilla bien finos, deshuesar y trocear las aceitunas negras, y escurrir las alcaparras. Escurrir también las anchoas del aceite de su lata.","Poner una olla grande con agua abundante y sal a hervir. Cuando rompa el hervor, echar los tallarines y cocerlos al dente según el tiempo que indique el paquete (normalmente un par de minutos menos del máximo indicado, porque terminarán de hacerse en la sartén).","Mientras la pasta cuece, calentar un buen chorro de aceite de oliva en una sartén amplia a fuego medio-suave. Añadir el ajo y la guindilla y, en cuanto empiecen a soltar aroma (sin que lleguen a dorarse, o amargarán), incorporar las anchoas y deshacerlas con el dorso de una cuchara de madera hasta que se disuelvan casi por completo en el aceite; este paso es la base de sabor de toda la salsa.","Añadir las alcaparras y las aceitunas negras, dar unas vueltas para que se impregnen del aceite aromatizado y, a continuación, incorporar el tomate triturado. Subir un poco el fuego y dejar cocer 6-8 minutos, removiendo de vez en cuando, hasta que la salsa pierda el agua del tomate y quede espesa y brillante, no acuosa. Sazonar con pimienta y orégano; probar antes de añadir sal, porque las anchoas, las alcaparras y las aceitunas ya aportan bastante salazón.","Con la ayuda de unas pinzas o un colador, pasar los tallarines directamente de la olla a la sartén (un poco del agua de cocción que arrastren ayuda a ligar la salsa), y añadir además un cacillo de esa agua de cocción. Saltear a fuego vivo un par de minutos, moviendo la sartén con la muñeca para que la pasta se impregne bien y la salsa quede envolvente y brillante, nunca separada.","Servir enseguida, bien caliente, espolvoreado con perejil fresco picado y, si se quiere, un último chorrito de aceite de oliva en crudo."]},{"categoria":"PASTAS","titulo":"Pasta a la Carbonara (mío)","raciones":"2 personas","racionesBase":2,"tiempo":"20 min","ingredientes":[{"texto":"170 g de espaguetis","cantidad":170.0,"resto":"g de espaguetis","escalable":true,"modo":"simple"},{"texto":"100 g de panceta (o guanciale), en tiras o daditos","cantidad":100.0,"resto":"g de panceta (o guanciale), en tiras o daditos","escalable":true,"modo":"simple"},{"texto":"2 yemas de huevo (a temperatura ambiente)","cantidad":2.0,"resto":"yemas de huevo (a temperatura ambiente)","escalable":true,"modo":"simple"},{"texto":"50 g de queso parmesano rallado, y un poco más para servir","cantidad":50.0,"resto":"g de queso parmesano rallado, y un poco más para servir","escalable":true,"modo":"simple"},{"texto":"Pimienta negra recién molida, abundante","cantidad":null,"resto":"Pimienta negra recién molida, abundante","escalable":false},{"texto":"Sal al gusto","cantidad":null,"resto":"Sal al gusto","escalable":false}],"elaboracion":["Poner una olla grande con agua abundante y sal a hervir; la carbonara auténtica no lleva nata, así que toda la cremosidad sale del huevo, el queso y el propio almidón de la pasta, de modo que conviene no salar el agua en exceso.","Mientras el agua rompe a hervir, cortar la panceta (o el guanciale) en tiras o daditos y dorarla en una sartén amplia y fría, sin añadir ningún tipo de grasa: al ir calentándose despacio suelta su propia grasa, que es la que después ligará la salsa. Cocinar a fuego medio hasta que quede dorada y crujiente, unos 6-8 minutos, y retirar del fuego dejando la grasa fundida en la sartén.","En un bol amplio, batir las yemas de huevo con unas varillas e incorporar el queso parmesano rallado poco a poco, sin dejar de mezclar, hasta conseguir una crema espesa y homogénea, casi como una pasta. Añadir una pizca de sal y bastante pimienta negra recién molida.","Cocer los espaguetis al dente según las indicaciones del paquete. Antes de escurrirlos, reservar un cacillo del agua de cocción (su almidón será clave para que la salsa ligue sin cuajarse).","Escurrir la pasta y, sin dejar que se enfríe, añadirla directamente a la sartén con la grasa de la panceta, fuera del fuego, y darle unas vueltas para que se impregne bien.","Retirar la sartén del calor directo (o esperar unos segundos a que la pasta pierda algo de temperatura) y verter la crema de huevo y queso, mezclando rápida y enérgicamente con la ayuda de un poco del agua de cocción reservada. El calor residual de la pasta debe ser suficiente para cuajar suavemente la mezcla y darle esa textura sedosa y ese color amarillo característico, sin que llegue a cuajar en grumos como un revuelto: si se nota que espesa demasiado rápido, añadir un poco más de agua de cocción.","Incorporar la panceta crujiente, remover una última vez y servir de inmediato con más queso rallado y abundante pimienta negra recién molida por encima."]},{"categoria":"PASTAS","titulo":"Carbonara Básica (diegodoal)","raciones":"2 personas","racionesBase":2,"tiempo":"20 min","ingredientes":[{"texto":"1 loncha gruesa de guanciale","cantidad":1.0,"resto":"loncha gruesa de guanciale","escalable":true,"modo":"simple"},{"texto":"50 g de queso pecorino romano (o parmesano)","cantidad":50.0,"resto":"g de queso pecorino romano (o parmesano)","escalable":true,"modo":"simple"},{"texto":"1 huevo grande","cantidad":1.0,"resto":"huevo grande","escalable":true,"modo":"simple"},{"texto":"3 yemas de huevo grandes","cantidad":3.0,"resto":"yemas de huevo grandes","escalable":true,"modo":"simple"},{"texto":"Pimienta negra recién molida al gusto","cantidad":null,"resto":"Pimienta negra recién molida al gusto","escalable":false},{"texto":"Sal al gusto","cantidad":null,"resto":"Sal al gusto","escalable":false},{"texto":"150 g de espaguetis","cantidad":150.0,"resto":"g de espaguetis","escalable":true,"modo":"simple"}],"elaboracion":["Cortar el guanciale en trozos pequeños y ponerlo en una sartén fría; encender a fuego fuerte. Cocer la pasta en agua abundante con sal según el tiempo del paquete.","Separar las yemas en un bol, añadir el huevo entero y batir hasta que quede homogéneo. Incorporar el pecorino rallado y abundante pimienta negra, mezclando bien.","Cuando el guanciale esté dorado y haya soltado su grasa, unos 5-6 minutos, retirarlo y reservar (dejando la grasa en la sartén). Dos minutos antes de que la pasta esté al dente, pasarla a la sartén junto con un poco de agua de cocción. Mezclar con energía, emulsionando la grasa con el agua, añadiendo más agua si hace falta hasta la consistencia deseada.","Retirar la sartén del fuego y esperar a que deje de chisporrotear. Añadir el guanciale y la mezcla de huevo y queso, mezclando con energía fuera del fuego para que se forme una salsa cremosa sin cuajarse. Servir de inmediato con más pecorino rallado y pimienta."]},{"categoria":"PASTAS","titulo":"Carbonara del Chef, receta de Luciano Monosilio (diegodoal)","raciones":"2 personas","racionesBase":2,"tiempo":"20 min","ingredientes":[{"texto":"1 loncha de guanciale de 1,5 cm de grosor","cantidad":1.0,"resto":"loncha de guanciale de 1,5 cm de grosor","escalable":true,"modo":"simple"},{"texto":"4 yemas de huevo grandes","cantidad":4.0,"resto":"yemas de huevo grandes","escalable":true,"modo":"simple"},{"texto":"30 g de queso grana padano","cantidad":30.0,"resto":"g de queso grana padano","escalable":true,"modo":"simple"},{"texto":"20 g de queso pecorino romano","cantidad":20.0,"resto":"g de queso pecorino romano","escalable":true,"modo":"simple"},{"texto":"150 g de espaguetis","cantidad":150.0,"resto":"g de espaguetis","escalable":true,"modo":"simple"},{"texto":"Pimienta negra recién molida, al gusto","cantidad":null,"resto":"Pimienta negra recién molida, al gusto","escalable":false},{"texto":"Sal al gusto","cantidad":null,"resto":"Sal al gusto","escalable":false}],"elaboracion":["Cortar el guanciale en dados grandes y ponerlo en una sartén fría a fuego fuerte. Cocer la pasta en agua abundante con sal según el tiempo del paquete.","Poner las yemas en un bol e incorporar el grana padano y el pecorino rallados, y la pimienta. Cuando el guanciale esté dorado, unos 5 minutos, bajar a fuego medio y cocinar 1 minuto más; reservar el guanciale junto con su grasa, y añadir esa grasa a la mezcla de yemas y queso, integrando bien.","Cuando a la pasta le falte 1 minuto, reservar 200 ml del agua de cocción y escurrir. Devolver esa agua a la olla a fuego medio-alto. Colocar el bol de yemas al baño maría sobre la olla y batir sin parar, añadiendo agua de cocción poco a poco, hasta que la mezcla doble su volumen, pierda color y quede cremosa.","Añadir la pasta a esta crema y seguir mezclando ('mantecando'), incorporando agua si hace falta, hasta que quede bien ligada y al dente. Incorporar el guanciale reservado. Servir de inmediato con más grana padano rallado y pimienta negra recién molida."]},{"categoria":"PASTAS","titulo":"Carbonara Rápida (diegodoal)","raciones":"2 personas","racionesBase":2,"tiempo":"20 min","ingredientes":[{"texto":"3 yemas de huevo","cantidad":3.0,"resto":"yemas de huevo","escalable":true,"modo":"simple"},{"texto":"1 huevo entero","cantidad":1.0,"resto":"huevo entero","escalable":true,"modo":"simple"},{"texto":"250 g de pasta","cantidad":250.0,"resto":"g de pasta","escalable":true,"modo":"simple"},{"texto":"40 g de queso parmesano","cantidad":40.0,"resto":"g de queso parmesano","escalable":true,"modo":"simple"},{"texto":"3 lonchas de panceta","cantidad":3.0,"resto":"lonchas de panceta","escalable":true,"modo":"simple"},{"texto":"Pimienta negra al gusto","cantidad":null,"resto":"Pimienta negra al gusto","escalable":false}],"elaboracion":["Picar la panceta y ponerla en una sartén fría a fuego medio.","Cocer la pasta en agua salada según el paquete.","Separar las yemas y batirlas con el huevo entero hasta homogeneizar.","Añadir el parmesano rallado y abundante pimienta negra; mezclar.","Cuando la panceta esté dorada, unos 5-6 minutos, añadir un cazo de agua de cocción; pasar la pasta a la sartén un minuto antes del punto al dente.","Mezclar con energía, emulsionando la grasa con el agua, añadiendo más según se necesite.","Retirar del fuego y esperar a que deje de \"sonar\" (que no siga hirviendo, para que el huevo no cuaje de golpe).","Añadir la mezcla de huevo y remover con energía para crear la salsa. Servir de inmediato con más parmesano y pimienta."]},{"categoria":"PASTAS","titulo":"Boloñesa de Marcella Hazan con Pappardelle Frescos (diegodoal)","raciones":"6 personas","racionesBase":6,"tiempo":"1 h (+ 2 h de cocción de la salsa)","ingredientes":[{"texto":"Para la boloñesa: 500 g de carne picada de ternera","cantidad":null,"resto":"Para la boloñesa: 500 g de carne picada de ternera","escalable":false},{"texto":"250 g de carne picada de cerdo","cantidad":250.0,"resto":"g de carne picada de cerdo","escalable":true,"modo":"simple"},{"texto":"150 g de panceta","cantidad":150.0,"resto":"g de panceta","escalable":true,"modo":"simple"},{"texto":"1 cebolla","cantidad":1.0,"resto":"cebolla","escalable":true,"modo":"simple"},{"texto":"2 zanahorias","cantidad":2.0,"resto":"zanahorias","escalable":true,"modo":"simple"},{"texto":"2 ramas de apio","cantidad":2.0,"resto":"ramas de apio","escalable":true,"modo":"simple"},{"texto":"Un chorrito de aceite de oliva virgen extra","cantidad":null,"resto":"Un chorrito de aceite de oliva virgen extra","escalable":false},{"texto":"Pimienta negra al gusto","cantidad":null,"resto":"Pimienta negra al gusto","escalable":false},{"texto":"70 g de concentrado de tomate","cantidad":70.0,"resto":"g de concentrado de tomate","escalable":true,"modo":"simple"},{"texto":"400 ml de tomate triturado","cantidad":400.0,"resto":"ml de tomate triturado","escalable":true,"modo":"simple"},{"texto":"350 ml de leche entera","cantidad":350.0,"resto":"ml de leche entera","escalable":true,"modo":"simple"},{"texto":"350 ml de vino blanco seco","cantidad":350.0,"resto":"ml de vino blanco seco","escalable":true,"modo":"simple"},{"texto":"500 ml de caldo de ternera (o de pollo)","cantidad":500.0,"resto":"ml de caldo de ternera (o de pollo)","escalable":true,"modo":"simple"},{"texto":"1 hoja de laurel","cantidad":1.0,"resto":"hoja de laurel","escalable":true,"modo":"simple"},{"texto":"Sal al gusto","cantidad":null,"resto":"Sal al gusto","escalable":false},{"texto":"Para la pasta fresca (pappardelle): 250 g de harina de trigo","cantidad":null,"resto":"Para la pasta fresca (pappardelle): 250 g de harina de trigo","escalable":false},{"texto":"2 huevos y 1 yema","cantidad":2.0,"resto":"huevos y 1 yema","escalable":true,"modo":"simple"},{"texto":"Sal al gusto","cantidad":null,"resto":"Sal al gusto","escalable":false},{"texto":"Un chorrito de aceite de oliva","cantidad":null,"resto":"Un chorrito de aceite de oliva","escalable":false},{"texto":"Para servir: 30 g de mantequilla y 50 g de queso parmesano rallado","cantidad":null,"resto":"Para servir: 30 g de mantequilla y 50 g de queso parmesano rallado","escalable":false}],"elaboracion":["Esta es la receta clásica de Marcella Hazan, célebre por su cocción larguísima y por llevar leche antes que vino, un orden poco habitual que suaviza la acidez de la carne y deja una salsa aterciopelada.","Picar finamente la cebolla, las zanahorias y el apio; reservar. Cortar la panceta en trozos pequeños.","En una olla fría, añadir la panceta, un buen chorro de aceite de oliva y un poco de agua; poner a fuego medio-alto hasta que la panceta suelte su grasa.","Añadir las verduras picadas, sal y pimienta; cocinar 5 minutos hasta que empiecen a estar translúcidas.","Añadir la carne picada, desmenuzándola con la espátula mientras se mezcla con las verduras.","Hacer un hueco en el centro, añadir el concentrado de tomate y tostarlo 20 segundos antes de integrarlo por completo.","Añadir la leche y dejar que reduzca casi por completo, unos 3 minutos (este paso, poco habitual, suaviza la acidez del tomate y da a la carne una textura muy tierna).","Añadir el vino y reducir hasta que se evapore el alcohol, unos 3 minutos más.","Añadir el tomate triturado, rellenar la lata con agua y añadirla también, junto con el caldo de ternera y el laurel.","Cocer a fuego medio-bajo durante 2 horas, removiendo de vez en cuando. Retirar del fuego cuando esté espesa y rectificar de sal.","Pasta fresca: hacer un volcán con la harina sobre la mesa y cascar los huevos y la yema en el centro, junto con sal y aceite de oliva.","Batir con un tenedor, incorporando la harina poco a poco. Amasar 5-6 minutos hasta que quede lisa; envolver en film y dejar reposar 30 minutos.","Dividir la masa por la mitad y trabajar una porción cada vez. Dar forma ovalada, doblar en tres como una carta, girar 90 grados y repetir dos veces más (esto da elasticidad y una textura más fina).","Pasar por la máquina de pasta, reduciendo el grosor progresivamente hasta el punto deseado. Cortar en tramos, doblar y cortar en tiras anchas (pappardelle); enharinar. Repetir con el resto de la masa.","Calentar la salsa en una sartén a fuego medio-alto. Cocer la pasta fresca en agua hirviendo solo 30 segundos y pasarla directamente a la sartén, reservando algo de agua de cocción.","Mezclar con energía, añadiendo agua de cocción poco a poco hasta conseguir una emulsión cremosa. Añadir una nuez de mantequilla, emulsionar y servir de inmediato con salsa extra y parmesano."]},{"categoria":"PASTAS","titulo":"Fettuccine al Vodka (diegodoal)","raciones":"4 personas","racionesBase":4,"tiempo":"1 h (+ 30 min de reposo de la masa)","ingredientes":[{"texto":"Para la salsa: 3 lonchas de jamón cocido","cantidad":null,"resto":"Para la salsa: 3 lonchas de jamón cocido","escalable":false},{"texto":"3 dientes de ajo","cantidad":3.0,"resto":"dientes de ajo","escalable":true,"modo":"simple"},{"texto":"4 cucharadas de vodka","cantidad":4.0,"resto":"cucharadas de vodka","escalable":true,"modo":"simple"},{"texto":"Un chorrito de aceite de oliva virgen extra","cantidad":null,"resto":"Un chorrito de aceite de oliva virgen extra","escalable":false},{"texto":"100 ml de nata para montar","cantidad":100.0,"resto":"ml de nata para montar","escalable":true,"modo":"simple"},{"texto":"1 lata (800 g) de tomate entero pelado","cantidad":1.0,"resto":"lata (800 g) de tomate entero pelado","escalable":true,"modo":"simple"},{"texto":"Una pizca de guindillas secas troceadas","cantidad":null,"resto":"Una pizca de guindillas secas troceadas","escalable":false},{"texto":"1 ramita de albahaca","cantidad":1.0,"resto":"ramita de albahaca","escalable":true,"modo":"simple"},{"texto":"Una nuez de mantequilla","cantidad":null,"resto":"Una nuez de mantequilla","escalable":false},{"texto":"Perejil picado y 50 g de queso parmesano para servir","cantidad":null,"resto":"Perejil picado y 50 g de queso parmesano para servir","escalable":false},{"texto":"Para la pasta fresca: 250 g de harina de trigo","cantidad":null,"resto":"Para la pasta fresca: 250 g de harina de trigo","escalable":false},{"texto":"2 huevos y 1 yema","cantidad":2.0,"resto":"huevos y 1 yema","escalable":true,"modo":"simple"},{"texto":"Sal al gusto","cantidad":null,"resto":"Sal al gusto","escalable":false},{"texto":"Un chorrito de aceite de oliva virgen extra","cantidad":null,"resto":"Un chorrito de aceite de oliva virgen extra","escalable":false}],"elaboracion":["Cortar el jamón en dados y picar el ajo. Calentar aceite con el jamón en una sartén a fuego medio-alto durante 3 minutos.","Añadir el ajo y la albahaca; cocinar 1 minuto.","Añadir el vodka, sal, pimienta y las guindillas secas; cocinar 1 minuto (el vodka disuelve compuestos del tomate solubles en alcohol, aportando más profundidad de sabor que solo usando aceite o agua).","Añadir el tomate y un poco de agua, chafándolo con la espátula; sazonar con orégano.","Reducir 30 minutos, hasta que espese considerablemente.","Incorporar la nata y cocinar 20 segundos; pasar a un bol.","Pasta fresca: hacer un volcán con la harina y añadir los huevos, la yema, la sal y el aceite en el centro.","Batir con un tenedor incorporando la harina poco a poco. Amasar 5-6 minutos hasta que quede lisa; reposar 30 minutos envuelta en film.","Dividir en dos porciones. Estirar y doblar en tres, girar 90 grados, repetir tres veces.","Pasar por la máquina de pasta reduciendo el grosor progresivamente. Cortar en fettuccine con la máquina o a cuchillo. Reservar en nidos enharinados.","Calentar la salsa para una ración. Cocer la pasta fresca en agua salada hirviendo 60 segundos.","Pasar la pasta directamente a la salsa con agua de cocción. Mezclar con energía, añadiendo agua poco a poco hasta conseguir una emulsión cremosa.","Añadir la mantequilla e integrar. Servir de inmediato con perejil y parmesano."]},{"categoria":"NOODLES","titulo":"Yakisoba (diegodoal)","raciones":"2 personas","racionesBase":2,"tiempo":"30 min","ingredientes":[{"texto":"3 lonchas de panceta","cantidad":3.0,"resto":"lonchas de panceta","escalable":true,"modo":"simple"},{"texto":"6 ramilletes de brócoli","cantidad":6.0,"resto":"ramilletes de brócoli","escalable":true,"modo":"simple"},{"texto":"¼ de col","cantidad":0.25,"resto":"de col","escalable":true,"modo":"simple"},{"texto":"1 zanahoria","cantidad":1.0,"resto":"zanahoria","escalable":true,"modo":"simple"},{"texto":"5 setas shiitake","cantidad":5.0,"resto":"setas shiitake","escalable":true,"modo":"simple"},{"texto":"5 cebolletas","cantidad":5.0,"resto":"cebolletas","escalable":true,"modo":"simple"},{"texto":"2 dientes de ajo","cantidad":2.0,"resto":"dientes de ajo","escalable":true,"modo":"simple"},{"texto":"1 guindilla","cantidad":1.0,"resto":"guindilla","escalable":true,"modo":"simple"},{"texto":"2 cucharadas de salsa de soja","cantidad":2.0,"resto":"cucharadas de salsa de soja","escalable":true,"modo":"simple"},{"texto":"1 cucharada de kétchup","cantidad":1.0,"resto":"cucharada de kétchup","escalable":true,"modo":"simple"},{"texto":"1 cucharada de salsa Worcestershire","cantidad":1.0,"resto":"cucharada de salsa Worcestershire","escalable":true,"modo":"simple"},{"texto":"1 cucharada de salsa de ostras","cantidad":1.0,"resto":"cucharada de salsa de ostras","escalable":true,"modo":"simple"},{"texto":"150 g de fideos yakisoba","cantidad":150.0,"resto":"g de fideos yakisoba","escalable":true,"modo":"simple"}],"elaboracion":["Cortar la zanahoria en juliana, picar la col finamente, laminar las setas, picar las cebolletas, picar el ajo y la guindilla, y cortar la panceta en dados.","Calentar aceite de girasol en un wok a fuego fuerte; dorar la panceta hasta que esté crujiente; reservar en un bol.","Añadir más aceite; sofreír el ajo y la guindilla 10 segundos.","Añadir el resto de las verduras (excepto setas y cebolleta); saltear 2 minutos.","Cocer los fideos en agua hirviendo según las indicaciones del paquete, normalmente 3-4 minutos.","Añadir las setas y la cebolleta al wok; saltear 30 segundos.","Devolver la panceta; mezclar.","Añadir la soja, el Worcestershire, el kétchup y la salsa de ostras; mezclar.","Añadir los fideos escurridos; integrar todo. Servir de inmediato con un toque de aceite picante."]},{"categoria":"NOODLES","titulo":"Ramen Tonkotsu Casero (diegodoal)","raciones":"6 personas","racionesBase":6,"tiempo":"1 h activa (+ aprox. 24 h entre remojo, caldo y reposos)","ingredientes":[{"texto":"Para el caldo tonkotsu: 2 manitas de cerdo, troceadas (aprox. 1 kg)","cantidad":null,"resto":"Para el caldo tonkotsu: 2 manitas de cerdo, troceadas (aprox. 1 kg)","escalable":false},{"texto":"1,5 kg de huesos de espinazo de cerdo","cantidad":1.5,"resto":"kg de huesos de espinazo de cerdo","escalable":true,"modo":"simple"},{"texto":"5 litros de agua","cantidad":5.0,"resto":"litros de agua","escalable":true,"modo":"simple"},{"texto":"5 cebolletas chinas","cantidad":5.0,"resto":"cebolletas chinas","escalable":true,"modo":"simple"},{"texto":"5 cm de jengibre fresco","cantidad":5.0,"resto":"cm de jengibre fresco","escalable":true,"modo":"simple"},{"texto":"10 dientes de ajo","cantidad":10.0,"resto":"dientes de ajo","escalable":true,"modo":"simple"},{"texto":"½ cebolla","cantidad":0.5,"resto":"cebolla","escalable":true,"modo":"simple"},{"texto":"Para el shio tare (sazonador): 600 ml de caldo dashi (600 ml de agua fría, 15 g de alga kombu, 20 g de niboshi limpio, 15 g de katsuobushi)","cantidad":null,"resto":"Para el shio tare (sazonador): 600 ml de caldo dashi (600 ml de agua fría, 15 g de alga kombu, 20 g de niboshi limpio, 15 g de katsuobushi)","escalable":false},{"texto":"120 g de sal","cantidad":120.0,"resto":"g de sal","escalable":true,"modo":"simple"},{"texto":"5 ml de vinagre de arroz","cantidad":5.0,"resto":"ml de vinagre de arroz","escalable":true,"modo":"simple"},{"texto":"Para el aceite aromático de cerdo ibérico: 350 g de panceta ibérica","cantidad":null,"resto":"Para el aceite aromático de cerdo ibérico: 350 g de panceta ibérica","escalable":false},{"texto":"100 ml de aceite de girasol","cantidad":100.0,"resto":"ml de aceite de girasol","escalable":true,"modo":"simple"},{"texto":"3 cebolletas chinas","cantidad":3.0,"resto":"cebolletas chinas","escalable":true,"modo":"simple"},{"texto":"3 dientes de ajo","cantidad":3.0,"resto":"dientes de ajo","escalable":true,"modo":"simple"},{"texto":"1 cucharadita de katsuobushi en polvo","cantidad":1.0,"resto":"cucharadita de katsuobushi en polvo","escalable":true,"modo":"simple"},{"texto":"Para el chashu (cerdo braseado): 500 g de panceta de cerdo deshuesada","cantidad":null,"resto":"Para el chashu (cerdo braseado): 500 g de panceta de cerdo deshuesada","escalable":false},{"texto":"4 cebolletas chinas","cantidad":4.0,"resto":"cebolletas chinas","escalable":true,"modo":"simple"},{"texto":"6 dientes de ajo","cantidad":6.0,"resto":"dientes de ajo","escalable":true,"modo":"simple"},{"texto":"4 cm de jengibre fresco","cantidad":4.0,"resto":"cm de jengibre fresco","escalable":true,"modo":"simple"},{"texto":"250 ml de salsa de soja","cantidad":250.0,"resto":"ml de salsa de soja","escalable":true,"modo":"simple"},{"texto":"250 ml de mirin","cantidad":250.0,"resto":"ml de mirin","escalable":true,"modo":"simple"},{"texto":"250 ml de sake","cantidad":250.0,"resto":"ml de sake","escalable":true,"modo":"simple"},{"texto":"100 g de azúcar","cantidad":100.0,"resto":"g de azúcar","escalable":true,"modo":"simple"},{"texto":"250 ml de agua","cantidad":250.0,"resto":"ml de agua","escalable":true,"modo":"simple"},{"texto":"5 shiitakes deshidratados","cantidad":5.0,"resto":"shiitakes deshidratados","escalable":true,"modo":"simple"},{"texto":"Para cada bol: 500 ml de caldo tonkotsu, 50 ml de shio tare, 25 ml de aceite aromático, fideos de ramen, huevo cocido, jengibre encurtido (beni shoga), oreja de mar (hongo kikurage), cebolleta","cantidad":null,"resto":"Para cada bol: 500 ml de caldo tonkotsu, 50 ml de shio tare, 25 ml de aceite aromático, fideos de ramen, huevo cocido, jengibre encurtido (beni shoga), oreja de mar (hongo kikurage), cebolleta","escalable":false}],"elaboracion":["Este ramen se prepara en varias fases, la mayoría con mucho tiempo de cocción pero poco trabajo activo.","Caldo tonkotsu: sumergir los huesos en agua fría y refrigerar un mínimo de 12 horas, cambiando el agua un par de veces para desangrarlos. Escurrir, cubrir con los 5 litros de agua y llevar a hervor fuerte. Bajar a fuego medio-alto y mantener un hervor vigoroso, desespumando la primera hora hasta que aparezca una espuma blanca. Tapar y cocer 8 horas más, reponiendo agua según se evapore. Hacia la hora 8, añadir la cebolleta troceada, el jengibre en láminas, el ajo y la cebolla; tapar y cocer 1 hora final (10 en total). Colar desechando los sólidos.","Shio tare: limpiar el niboshi quitando cabezas y tripas. Juntar con el resto de ingredientes del dashi en un recipiente y refrigerar 12 horas. Calentar muy suavemente hasta los 50° (aguantando el dedo dentro solo 2 segundos), colar, pesar el líquido y añadir sal en proporción de 1 g de sal por cada 5 g de líquido. Calentar a fuego medio removiendo hasta disolver la sal, retirar del fuego y añadir el vinagre de arroz.","Aceite aromático: cortar la panceta en dados pequeños y confitarla a fuego medio 30 minutos para que suelte la grasa. Colar esa grasa, mezclarla con el aceite de girasol y los aromáticos picados (cebolleta, ajo, katsuobushi en polvo), calentar hasta que hierva y colar de nuevo.","Chashu: enrollar la panceta y atarla bien prieta con hilo de cocina. Poner en una olla los aromáticos (cebolleta, ajo, jengibre, shiitakes), la soja, el mirin, el sake, el azúcar y el agua; llevar a hervor a fuego medio-alto, añadir la panceta atada, tapar y cocer a fuego lento 3,5 horas, dándole la vuelta cada 30 minutos. Dejar enfriar todo junto y refrigerar de un día para otro antes de cortarlo en lonchas.","Para montar cada bol: calentar el caldo, precalentar el bol con agua caliente, cocer los fideos 30 segundos menos de lo que indique el paquete y escurrir bien. Marcar 1-2 lonchas de chashu con soplete o en una sartén muy caliente. Poner en el bol el tare, el aceite aromático y el caldo caliente; añadir los fideos, y terminar con el chashu, el jengibre encurtido, el huevo cortado por la mitad, el kikurage y la cebolleta. Servir de inmediato."]},{"categoria":"NOODLES","titulo":"Tori Miso Ramen (diegodoal) (con Katsu de Pollo Casero)","raciones":"4 personas","racionesBase":4,"tiempo":"1 h activa (+ 3-5 h de caldo)","ingredientes":[{"texto":"Para el caldo: 1 pollo entero (2 kg)","cantidad":null,"resto":"Para el caldo: 1 pollo entero (2 kg)","escalable":false},{"texto":"4 litros de agua","cantidad":4.0,"resto":"litros de agua","escalable":true,"modo":"simple"},{"texto":"½ cebolla","cantidad":0.5,"resto":"cebolla","escalable":true,"modo":"simple"},{"texto":"½ zanahoria","cantidad":0.5,"resto":"zanahoria","escalable":true,"modo":"simple"},{"texto":"3 cebolletas","cantidad":3.0,"resto":"cebolletas","escalable":true,"modo":"simple"},{"texto":"4 dientes de ajo","cantidad":4.0,"resto":"dientes de ajo","escalable":true,"modo":"simple"},{"texto":"3 cm de jengibre fresco","cantidad":3.0,"resto":"cm de jengibre fresco","escalable":true,"modo":"simple"},{"texto":"Para el katsu de pollo: 2 muslos/contramuslos d tidad":30.0,"resto":"g de sal","escalable":true,"modo":"simple"},{"texto":"100 g de miso","cantidad":100.0,"resto":"g de miso","escalable":true,"modo":"simple"},{"texto":"10 ml de vinagre de arroz o vinagre blanco","cantidad":10.0,"resto":"ml de vinagre de arroz o vinagre blanco","escalable":true,"modo":"simple"},{"texto":"Para montar cada bol: 400 ml de caldo de pollo","cantidad":null,"resto":"Para montar cada bol: 400 ml de caldo de pollo","escalable":false},{"texto":"50 g de tare de miso","cantidad":50.0,"resto":"g de tare de miso","escalable":true,"modo":"simple"},{"texto":"15 g de aceite aromático","cantidad":15.0,"resto":"g de aceite aromático","escalable":true,"modo":"simple"},{"texto":"100 g de noodles alcalinos (de ramen)","cantidad":100.0,"resto":"g de noodles alcalinos (de ramen)","escalable":true,"modo":"simple"},{"texto":"1 huevo mollet","cantidad":1.0,"resto":"huevo mollet","escalable":true,"modo":"simple"},{"texto":"Una pizca de furikake (opcional)","cantidad":null,"resto":"Una pizca de furikake (opcional)","escalable":false},{"texto":"Un puñado de setas enoki","cantidad":null,"resto":"Un puñado de setas enoki","escalable":false},{"texto":"1 katsu de pollo","cantidad":1.0,"resto":"katsu de pollo","escalable":true,"modo":"simple"},{"texto":"1 lámina de alga nori","cantidad":1.0,"resto":"lámina de alga nori","escalable":true,"modo":"simple"},{"texto":"1 cebolleta (parte verde, picada)","cantidad":1.0,"resto":"cebolleta (parte verde, picada)","escalable":true,"modo":"simple"}],"elaboracion":["Este ramen tiene cuatro componentes —caldo, katsu, aceite aromático y tare de miso— que se pueden preparar con antelación y guardar en la nevera hasta el momento de montar los boles.","Caldo de pollo: trocear el pollo, reservando los contramuslos para el katsu y usando el resto (huesos, piel y carcasa) para el caldo. Cubrir con el agua en una olla grande y llevar a ebullición fuerte, desespumando bien y reservando la grasa que suba a la superficie.","Reducir a fuego suave y cocer 2 horas. Retirar la grasa acumulada y reservarla para el aceite aromático. Continuar la cocción entre 2 y 4 horas más.","Una hora antes de terminar, añadir la cebolleta troceada, la cebolla, la zanahoria, el jengibre y el ajo. Cocer 1 hora más. Colar el caldo, opcionalmente por un paño para dejarlo más limpio, y refrigerar hasta necesitarlo.","Katsu de pollo: mezclar la carne de los contramuslos con el ajo y el jengibre prensados, la soja y el bicarbonato; marinar un mínimo de 30 minutos (hasta 24 horas) en la nevera. Rebozar siguiendo la secuencia harina-huevo-panko-huevo-panko, para conseguir una corteza doble muy crujiente. Freír a 150° durante 3 minutos por cada lado, hasta que esté dorado y bien cocinado por dentro.","Aceite aromático: calentar la grasa de pollo reservada junto con el aceite de girasol en un cazo pequeño hasta que deje de burbujear. Bajar a fuego medio, añadir el ajo entero sin pelar y la cebolleta troceada, e infusionar 10 minutos sin que llegue a dorarse en exceso. Colar y reservar.","Tare de miso: calentar el caldo, el sake, el mirin, el azúcar y la sal en un cazo a fuego medio-alto, removiendo con frecuencia hasta que hierva. Mantener la ebullición hasta que el azúcar y la sal se disuelvan y desaparezca el olor a alcohol, unos 3 minutos. Retirar del fuego, añadir el miso y el vinagre y remover hasta disolver por completo.","Montaje del bol: escaldar las setas enoki 30 segundos en agua hirviendo. Calentar el caldo de pollo. Cocer los noodles según el paquete y escurrir bien. En un bol grande, mezclar el tare, el aceite aromático y el caldo caliente. Añadir los noodles y el huevo mollet partido por la mitad; sazonar con furikake. Coronar con las setas enoki, el katsu cortado en lonchas, el nori y la cebolleta picada."]},{"categoria":"NOODLES","titulo":"Pad Thai 100% Auténtico (diegodoal)","raciones":"2 personas","racionesBase":2,"tiempo":"45 min","ingredientes":[{"texto":"Para la salsa pad thai: 80 g de pulpa de tamarindo","can
