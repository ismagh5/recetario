 levadura química","escalable":true,"modo":"simple"},{"texto":"7 g de sal","cantidad":7.0,"resto":"g de sal","escalable":true,"modo":"simple"},{"texto":"100 g de manteca de cerdo (o aceite de girasol)","cantidad":100.0,"resto":"g de manteca de cerdo (o aceite de girasol)","escalable":true,"modo":"simple"},{"texto":"160 ml de agua caliente","cantidad":160.0,"resto":"ml de agua caliente","escalable":true,"modo":"simple"}],"elaboracion":["Abrir las pechugas de pollo en mariposa, cubrirlas con film y golpearlas con una maza hasta que tengan un grosor uniforme.","Pasar a un bol y mezclar con el aceite de girasol, el ajo picado, el orégano, el comino, el pimentón, el azúcar, el zumo de lima, el aceite de oliva, sal, pimienta y salsa picante.","Masajear bien la marinada en la carne, cubrir con film pegado a la superficie y refrigerar un mínimo de 20 minutos, idealmente toda la noche.","Tortillas de trigo: mezclar la harina, la levadura química y la sal en un bol.","Añadir la manteca y trabajarla con las manos hasta que la textura recuerde a arena mojada.","Añadir el agua caliente y mezclar con una espátula. Pasar a la mesa y amasar 5 minutos hasta que quede lisa y elástica.","Envolver en film y dejar reposar 30 minutos a temperatura ambiente.","Dividir en 6 porciones y bolear. Aplastar con la palma y estirar con el rodillo lo más fino posible; recortar con un plato para conseguir círculos perfectos. Repetir con las 6.","Justo antes de montar las quesadillas, cocinar cada tortilla en una sartén caliente 1 minuto por cada lado. Reservar envueltas en un paño limpio.","Rallar los quesos y reservar. Cortar la cebolla roja y el pimiento verde en dados.","En una sartén caliente con aceite de girasol a fuego medio-alto, cocinar el pollo hasta que esté hecho por completo.","Retirar el pollo, bajar a fuego medio, añadir aceite, la cebolla y el pimiento; sofreír 5 minutos. Reservar en un bol.","Cortar el pollo en trozos pequeños.","Sobre una tortilla, colocar el pollo, la verdura salteada y abundante queso. Cubrir con otra tortilla y presionar.","Freír la quesadilla en una sartén con abundante aceite de girasol a fuego medio-alto, 3 minutos por cada lado, hasta que las tortillas estén doradas y el queso fundido.","Cortar y servir de inmediato."]},{"categoria":"PESCADOS Y MARISCOS","titulo":"Salmón Teriyaki (diegodoal)","raciones":"2 personas","racionesBase":2,"tiempo":"20 minutos","ingredientes":[{"texto":"200 ml de sake","cantidad":200.0,"resto":"ml de sake","escalable":true,"modo":"simple"},{"texto":"200 ml de mirin","cantidad":200.0,"resto":"ml de mirin","escalable":true,"modo":"simple"},{"texto":"260 ml de salsa de soja","cantidad":260.0,"resto":"ml de salsa de soja","escalable":true,"modo":"simple"},{"texto":"60 g de azúcar","cantidad":60.0,"resto":"g de azúcar","escalable":true,"modo":"simple"},{"texto":"1 lomo de salmón","cantidad":1.0,"resto":"lomo de salmón","escalable":true,"modo":"simple"},{"texto":"1 diente de ajo","cantidad":1.0,"resto":"diente de ajo","escalable":true,"modo":"simple"},{"texto":"2 cm de jengibre fresco","cantidad":2.0,"resto":"cm de jengibre fresco","escalable":true,"modo":"simple"},{"texto":"Arroz jazmín cocido y sésamo para servir","cantidad":null,"resto":"Arroz jazmín cocido y sésamo para servir","escalable":false}],"elaboracion":["calentar el sake, el mirin, la soja y el azúcar en un cazo a fuego medio, removiendo hasta que el azúcar se disuelva. Reservar esta salsa base.","Precalentar una sartén a fuego medio-alto y cortar el lomo de salmón por la mitad a lo largo. Añadir aceite y colocar el salmón con la piel hacia abajo, dejándolo sin mover 1,5 minutos.","Marcar el resto de caras 30 segundos cada una. Retirar el salmón y limpiar el exceso de grasa de la sartén con papel de cocina.","Añadir 150 ml de la salsa teriyaki a la sartén y reducir hasta que espese, aproximadamente 1,5 minutos. Devolver el salmón y bañarlo con la salsa mientras se glasea. Cuando tenga consistencia de jarabe, servir sobre arroz, con el ajo picado, el jengibre y sésamo por encima."]},{"categoria":"PESCADOS Y MARISCOS","titulo":"Salmón Sandefjord (diegodoal)","raciones":"2 personas","racionesBase":2,"tiempo":"30 minutos","ingredientes":[{"texto":"3 patatas","cantidad":3.0,"resto":"patatas","escalable":true,"modo":"simple"},{"texto":"1 pepino","cantidad":1.0,"resto":"pepino","escalable":true,"modo":"simple"},{"texto":"100 ml de vinagre de vino blanco","cantidad":100.0,"resto":"ml de vinagre de vino blanco","escalable":true,"modo":"simple"},{"texto":"1 lomo de salmón","cantidad":1.0,"resto":"lomo de salmón","escalable":true,"modo":"simple"},{"texto":"30 g de mantequilla sin sal","cantidad":30.0,"resto":"g de mantequilla sin sal","escalable":true,"modo":"simple"},{"texto":"Para la salsa: 60 g de nata para montar","cantidad":null,"resto":"Para la salsa: 60 g de nata para montar","escalable":false},{"texto":"35 g de mantequilla sin sal","cantidad":35.0,"resto":"g de mantequilla sin sal","escalable":true,"modo":"simple"},{"texto":"Zumo de ½ limón","cantidad":null,"resto":"Zumo de ½ limón","escalable":false},{"texto":"Sal, pimienta blanca o cayena, perejil fresco y eneldo fresco, al gusto","cantidad":null,"resto":"Sal, pimienta blanca o cayena, perejil fresco y eneldo fresco, al gusto","escalable":false}],"elaboracion":["cocer las patatas en agua fría llevada a ebullición a fuego medio-alto durante 10 minutos, hasta que estén tiernas. Pelar el pepino, cortarlo al gusto y sumergirlo en el vinagre; reservar. Picar el perejil y el eneldo.","En una sartén a fuego medio, reducir la nata a la mitad de su volumen. Incorporar la mantequilla fría poco a poco en dos tandas, montando la salsa. Añadir el zumo de limón, sal y cayena, y terminar con las hierbas picadas. Mantener caliente a fuego muy bajo o en un termo.","En una sartén precalentada a fuego medio-alto, añadir una nuez de mantequilla. Colocar el salmón con la piel hacia abajo y sellar 1,5 minutos; marcar el resto de caras 30 segundos cada una. Volver a apoyarlo sobre la piel y bañarlo con la mantequilla fundida hasta el punto deseado.","Servir las patatas partidas por la mitad y aliñadas con aceite y sal en escamas, el pepino escurrido y el salmón; napar con la salsa de mantequilla."]},{"categoria":"PESCADOS Y MARISCOS","titulo":"Salmón a Baja Temperatura (diegodoal)","raciones":"2 personas","racionesBase":2,"tiempo":"15 min (+ 35-45 min de cocción a baja temperatura)","ingredientes":[{"texto":"10 espárragos trigueros","cantidad":10.0,"resto":"espárragos trigueros","escalable":true,"modo":"simple"},{"texto":"1 lomo de salmón","cantidad":1.0,"resto":"lomo de salmón","escalable":true,"modo":"simple"},{"texto":"Sal, aceite de oliva virgen extra y 1 ramita de tomillo","cantidad":null,"resto":"Sal, aceite de oliva virgen extra y 1 ramita de tomillo","escalable":false},{"texto":"Para el mac and cheese: 125 g de pasta","cantidad":null,"resto":"Para el mac and cheese: 125 g de pasta","escalable":false},{"texto":"125 ml de leche evaporada","cantidad":125.0,"resto":"ml de leche evaporada","escalable":true,"modo":"simple"},{"texto":"100 g de queso (cheddar, emmental o gruyère)","cantidad":100.0,"resto":"g de queso (cheddar, emmental o gruyère)","escalable":true,"modo":"simple"},{"texto":"Una pizca de cayena y otra de mostaza de Dijon","cantidad":null,"resto":"Una pizca de cayena y otra de mostaza de Dijon","escalable":false}],"elaboracion":["precalentar el roner a 80°. Pelar la parte baja de los espárragos y envasarlos al vacío. Sumergirlos en el agua del roner 5 minutos.","Salar el salmón y envasarlo al vacío con aceite de oliva y tomillo. Bajar la temperatura del roner a 43° (poco hecho), 47° (al punto) o 52° (muy hecho) y cocinar el salmón entre 35 y 45 minutos, según el grosor.","Cuando falten 15 minutos, preparar el mac and cheese: cocer la pasta directamente en una sartén con agua fría a fuego medio-alto hasta que esté tierna y el agua casi evaporada, unos 6 minutos. Añadir la leche evaporada y llevar a ebullición. Incorporar el queso y remover hasta fundir; añadir cayena y mostaza al gusto. Mantener caliente a fuego bajo.","Precalentar una sartén a fuego medio-alto, sacar el salmón de la bolsa, secarlo con cuidado y sellarlo con la piel hacia abajo 1,5 minutos; marcar la cara superior 15 segundos.","Servir con el mac and cheese, y saltear brevemente los espárragos en la sartén (15 segundos) para recalentarlos antes de emplatar."]},{"categoria":"PESCADOS Y MARISCOS","titulo":"Bonito con Tomate (mamá)","raciones":"4 personas","racionesBase":4,"tiempo":"35 minutos","ingredientes":[{"texto":"800 g de bonito en rodajas (a trozos grandes)","cantidad":800.0,"resto":"g de bonito en rodajas (a trozos grandes)","escalable":true,"modo":"simple"},{"texto":"1 pimiento rojo","cantidad":1.0,"resto":"pimiento rojo","escalable":true,"modo":"simple"},{"texto":"2 cebollas","cantidad":2.0,"resto":"cebollas","escalable":true,"modo":"simple"},{"texto":"500 g de tomate casero (frito)","cantidad":500.0,"resto":"g de tomate casero (frito)","escalable":true,"modo":"simple"},{"texto":"50 g de harina, para rebozar","cantidad":50.0,"resto":"g de harina, para rebozar","escalable":true,"modo":"simple"},{"texto":"1 hoja de laurel","cantidad":1.0,"resto":"hoja de laurel","escalable":true,"modo":"simple"},{"texto":"1 pastilla de Starlux","cantidad":1.0,"resto":"pastilla de Starlux","escalable":true,"modo":"simple"}],"elaboracion":["Se pasa el bonito por harina y se fríe en aceite caliente, a fuego medio-alto, vuelta y vuelta (unos 2-3 minutos por cada lado), hasta que esté dorado; se reserva. En ese aceite se pocha la cebolla picada con el pimiento muy picadito, a fuego medio, removiendo de vez en cuando, hasta que esté blandito (unos 8-10 minutos); se echa el tomate y se deja que se integre unos 10 minutos a fuego suave, y después se añade el bonito, dejando que se termine de hacer en la salsa unos 5 minutos más. Si la salsa se puede espesar, se puede mejorar con ajo y perejil majados y un poco de agua. Si está raro, se sala con Starlux."]},{"categoria":"PESCADOS Y MARISCOS","titulo":"Bonito (mamá) (con vinagre)","raciones":"4-6 personas","racionesBase":4,"tiempo":"1 h 30 min","ingredientes":[{"texto":"1 kg de bonito","cantidad":1.0,"resto":"kg de bonito","escalable":true,"modo":"simple"},{"texto":"1 vaso de aceite de girasol","cantidad":1.0,"resto":"vaso de aceite de girasol","escalable":true,"modo":"simple"},{"texto":"1 vaso de vino blanco","cantidad":1.0,"resto":"vaso de vino blanco","escalable":true,"modo":"simple"},{"texto":"½ vaso de vinagre","cantidad":0.5,"resto":"vaso de vinagre","escalable":true,"modo":"simple"},{"texto":"10 pimientas en grano","cantidad":10.0,"resto":"pimientas en grano","escalable":true,"modo":"simple"},{"texto":"1 hoja de laurel","cantidad":1.0,"resto":"hoja de laurel","escalable":true,"modo":"simple"},{"texto":"2 cabezas de ajo","cantidad":2.0,"resto":"cabezas de ajo","escalable":true,"modo":"simple"}],"elaboracion":["1.º Se pela el bonito con agua caliente y sal (se maneja ya pelado y en caliente).","2.º Se parte en rodajas grandes y se pone a hervir, a fuego medio, en el caldo de aceite, vino blanco, vinagre, pimienta, laurel y ajo, durante 30 minutos, hasta que el bonito chupe parte del caldo y esté bien hecho.","3.º Cuando esté frío, se mete en los botes de cristal. Se reparte la salsa y se pone a hervir al baño María: los botes pequeños durante 30 minutos y los grandes 60, contando desde que rompe a hervir el agua del baño."]},{"categoria":"PESCADOS Y MARISCOS","titulo":"Bonito (mamá) (con aceite)","raciones":"6-8 personas (conserva)","racionesBase":6,"tiempo":"1 h 40 min","ingredientes":[{"texto":"1 kg de bonito","cantidad":1.0,"resto":"kg de bonito","escalable":true,"modo":"simple"},{"texto":"Sal gorda al gusto","cantidad":null,"resto":"Sal gorda al gusto","escalable":false},{"texto":"Aceite de oliva, el necesario para cubrir","cantidad":null,"resto":"Aceite de oliva, el necesario para cubrir","escalable":false}],"elaboracion":["Se pone el bonito a hervir en agua con Starlux y sal, a fuego medio, media hora, hasta que esté bien hecho. Se deja enfriar y se escurre bien. Se va llenando el bote con el bonito y se termina de llenar con aceite, hasta cubrirlo bien. Se pone al baño María, a fuego medio, 1 hora, contando desde que rompe a hervir el agua del baño."]},{"categoria":"PESCADOS Y MARISCOS","titulo":"Mejillones Marinera (mamá) (Olila)","raciones":"6 personas","racionesBase":6,"tiempo":"25 minutos","ingredientes":[{"texto":"3 kg mejillones","cantidad":3.0,"resto":"kg mejillones","escalable":true,"modo":"simple"},{"texto":"1 cebolla grande (picada un poco grande)","cantidad":1.0,"resto":"cebolla grande (picada un poco grande)","escalable":true,"modo":"simple"},{"texto":"1 manojo y medio de apio, solo la hoja (picado un poco grande)","cantidad":1.0,"resto":"manojo y medio de apio, solo la hoja (picado un poco grande)","escalable":true,"modo":"simple"},{"texto":"Mantequilla ½ nuez","cantidad":null,"resto":"Mantequilla ½ nuez","escalable":false},{"texto":"Pimienta molida (1 punta de cuchillo colmado)","cantidad":null,"resto":"Pimienta molida (1 punta de cuchillo colmado)","escalable":false},{"texto":"Perejil picado (al final)","cantidad":null,"resto":"Perejil picado (al final)","escalable":false},{"texto":"1 litro de vino blanco","cantidad":1.0,"resto":"litro de vino blanco","escalable":true,"modo":"simple"},{"texto":"2 zanahorias","cantidad":2.0,"resto":"zanahorias","escalable":true,"modo":"simple"},{"texto":"500 ml de agua","cantidad":500.0,"resto":"ml de agua","escalable":true,"modo":"simple"}],"elaboracion":["En una cazuela grande se rehogan los vegetales con el aceite y la mantequilla, a fuego medio, removiendo de vez en cuando, hasta que se pochen y estén blanditos (unos 8-10 minutos); se añade la pimienta molida. Después se echan los mejillones y la sal gorda. Se echa el vino y agua hasta que se cubran, se sube el fuego y se cuece hasta que se abran (5-8 minutos), removiendo un poco de vez en cuando. Al final, fuera del fuego, el perejil picado.","Como guarnición, se prepara una salsa mezclando mayonesa (de bote) con un poco del agua de cocer los mejillones, hasta que quede fluida."]},{"categoria":"PESCADOS Y MARISCOS","titulo":"Mejillones Escabechados (mar)","raciones":"6 personas (conserva)","racionesBase":6,"tiempo":"30 minutos","ingredientes":[{"texto":"3 kg mejillones (con concha)","cantidad":3.0,"resto":"kg mejillones (con concha)","escalable":true,"modo":"simple"},{"texto":"1 puerro (blanco y verde)","cantidad":1.0,"resto":"puerro (blanco y verde)","escalable":true,"modo":"simple"},{"texto":"3 dientes de ajo","cantidad":3.0,"resto":"dientes de ajo","escalable":true,"modo":"simple"},{"texto":"2 zanahorias","cantidad":2.0,"resto":"zanahorias","escalable":true,"modo":"simple"},{"texto":"2 hojas de laurel","cantidad":2.0,"resto":"hojas de laurel","escalable":true,"modo":"simple"},{"texto":"Pimentón (½ cucharadita)","cantidad":null,"resto":"Pimentón (½ cucharadita)","escalable":false},{"texto":"6-8 granos pimienta negra","cantidad":6.0,"cantidad2":8.0,"resto":"granos pimienta negra","escalable":true,"modo":"rango"},{"texto":"Aceite de oliva","cantidad":null,"resto":"Aceite de oliva","escalable":false},{"texto":"Vinagre (½ vaso)","cantidad":null,"resto":"Vinagre (½ vaso)","escalable":false},{"texto":"Vino blanco (½ vaso)","cantidad":null,"resto":"Vino blanco (½ vaso)","escalable":false},{"texto":"Caldo de los mejillones (½ vaso)","cantidad":null,"resto":"Caldo de los mejillones (½ vaso)","escalable":false}],"elaboracion":["1. Se cuecen los mejillones a fuego fuerte hasta que se abran, y se reservan, colando y guardando el caldo de cocción.","2. Se cortan el puerro y las zanahorias en tiras y el ajo en láminas.","3. Se echa el aceite en una cazuela a fuego medio; cuando esté caliente, se echa la verdura (puerro, zanahorias y ajo), las hojas de laurel y la pimienta negra. Se sofríe un poco, removiendo, hasta que empiece a ablandarse. Se aparta del fuego y se echa el pimentón, removiendo enseguida para que no se queme. Se echan los líquidos (vinagre, vino y caldo de los mejillones).","4. Se pone de nuevo al fuego y se deja que hierva un par de minutos.","5. Se echan los mejillones, dejando que hierva todo 3-4 minutos.","6. Se comprueba el sazonado y se rectifica si es necesario. Se deja enfriar y reposar antes de servir."]},{"categoria":"PESCADOS Y MARISCOS","titulo":"Mejillones \"Belgas\" (mar)","raciones":"2-3 personas","racionesBase":2,"tiempo":"25 minutos","ingredientes":[{"texto":"1 kg mejillones","cantidad":1.0,"resto":"kg mejillones","escalable":true,"modo":"simple"},{"texto":"2 ramitas apio","cantidad":2.0,"resto":"ramitas apio","escalable":true,"modo":"simple"},{"texto":"2 dientes de ajo con piel","cantidad":2.0,"resto":"dientes de ajo con piel","escalable":true,"modo":"simple"},{"texto":"½ cebolla","cantidad":0.5,"resto":"cebolla","escalable":true,"modo":"simple"},{"texto":"1 zanahoria","cantidad":1.0,"resto":"zanahoria","escalable":true,"modo":"simple"},{"texto":"Un poco de mantequilla","cantidad":null,"resto":"Un poco de mantequilla","escalable":false},{"texto":"Sal al gusto","cantidad":null,"resto":"Sal al gusto","escalable":false},{"texto":"½ vaso vino blanco","cantidad":0.5,"resto":"vaso vino blanco","escalable":true,"modo":"simple"},{"texto":"Pimienta al gusto","cantidad":null,"resto":"Pimienta al gusto","escalable":false}],"elaboracion":["Se parte todo y se echa en una cazuela con aceite y la mantequilla, a fuego medio. Se rehoga, removiendo de vez en cuando, hasta que quede bien pochado (unos 8-10 minutos). Cuando esté pochado, se añaden los mejillones, se añade el vino blanco, se sube el fuego, se tapa y se espera a que se abran, por lo general 5-7 minutos (no dejarles mucho tiempo, retirándolos en cuanto se abren para que no queden secos).","Para acompañar, se puede diluir mahonesa con un poco del caldo de los mejillones y pimienta, hasta conseguir una salsa fina."]},{"categoria":"PESCADOS Y MARISCOS","titulo":"Almejas a la Marinera (mamá) (Isabel)","raciones":"4 personas","racionesBase":4,"tiempo":"20 minutos","ingredientes":[{"texto":"1 kg de almejas","cantidad":1.0,"resto":"kg de almejas","escalable":true,"modo":"simple"},{"texto":"2 dientes de ajo picadito","cantidad":2.0,"resto":"dientes de ajo picadito","escalable":true,"modo":"simple"},{"texto":"1 cucharada de pan rallado","cantidad":1.0,"resto":"cucharada de pan rallado","escalable":true,"modo":"simple"},{"texto":"Un chorrito de zumo de limón","cantidad":null,"resto":"Un chorrito de zumo de limón","escalable":false},{"texto":"Vino blanco (del bueno), medio vaso","cantidad":null,"resto":"Vino blanco (del bueno), medio vaso","escalable":false},{"texto":"Perejil picado, al gusto","cantidad":null,"resto":"Perejil picado, al gusto","escalable":false}],"elaboracion":["Se lavan bien las almejas bajo el grifo para quitarles la arena. En una sartén con un poco de aceite, a fuego medio, se echa el ajo picadito y se deja dorar 1 minuto aproximadamente, sin que se queme; en ese punto, cuando todavía no está del todo hecho, se echan las almejas. Se tapa la sartén y se deja a fuego medio-alto hasta que se vayan abriendo (3-5 minutos). Una vez que se van abriendo, se echa un poco de pan rallado, zumo de limón y vino blanco, y se deja un par de minutos más a fuego vivo para que la salsa reduzca. Se espolvorea con perejil y se sirve inmediatamente, bien caliente."]},{"categoria":"PESCADOS Y MARISCOS","titulo":"Langostinos en Salsa (mamá)","raciones":"4 personas","racionesBase":4,"tiempo":"15 minutos","ingredientes":[{"texto":"2 dientes de ajo","cantidad":2.0,"resto":"dientes de ajo","escalable":true,"modo":"simple"},{"texto":"500 g de langostinos","cantidad":500.0,"resto":"g de langostinos","escalable":true,"modo":"simple"},{"texto":"Un chorrito de coñac","cantidad":null,"resto":"Un chorrito de coñac","escalable":false},{"texto":"1 cucharada de pan rallado","cantidad":1.0,"resto":"cucharada de pan rallado","escalable":true,"modo":"simple"}],"elaboracion":["Se echa el aceite en una sartén y se pone a fuego medio, después el ajo picadito. Cuando está un poco doradito, se echan los langostinos, se deja que se vayan haciendo, removiendo, y que suelten el jugo (unos 3-4 minutos). Después el coñac, un poquito, dejando que reduzca unos segundos, y más o menos pan rallado para que espese, removiendo 1-2 minutos hasta que ligue. Si la salsa se queda muy roja, se puede echar un poco de tomate, pero muy poco, dejando que se integre un momento a fuego suave."]},{"categoria":"PESCADOS Y MARISCOS","titulo":"Anchoas en Aceite (mamá)","raciones":"Conserva para varias raciones","racionesBase":null,"tiempo":"45 min (+ 8 h de salazón y reposo)","ingredientes":[{"texto":"1 kg de anchoas frescas","cantidad":1.0,"resto":"kg de anchoas frescas","escalable":true,"modo":"simple"},{"texto":"Sal gorda, la necesaria","cantidad":null,"resto":"Sal gorda, la necesaria","escalable":false},{"texto":"Aceite de oliva, el necesario para cubrir","cantidad":null,"resto":"Aceite de oliva, el necesario para cubrir","escalable":false}],"elaboracion":["Poner las anchoas en sal gorda durante una hora, antes de colocarlas en los botes, para que suelten parte del agua.","Después colocar las anchoas en el bote, un lado al día siguiente, sin lavarlas ni quitarles la tripa, solo la cabeza, sin darles la vuelta. Poner una capa y luego la sal, así sucesivamente. Se deja 7 horas con un peso encima. Si sueltan líquido, se va rellenando de sal para que sigan bien cubiertas.","Pasado el tiempo, se secan, se lavan con agua del chorro del grifo, se les quita la piel, la tripa y la espina, con cuidado de no romper los lomos. En una fuente limpia se colocan en líneas y se van enrollando. Cuando estén completas se dan golpecitos para que suelten todo el agua. Se colocan en un bote y se echa aceite de girasol o de oliva al gusto de cada uno, hasta cubrirlas bien."]},{"categoria":"PESCADOS Y MARISCOS","titulo":"Patatas con Congrio (mamá)","raciones":"4 personas","racionesBase":4,"tiempo":"45 minutos","ingredientes":[{"texto":"800 g de congrio","cantidad":800.0,"resto":"g de congrio","escalable":true,"modo":"simple"},{"texto":"1 cebolla","cantidad":1.0,"resto":"cebolla","escalable":true,"modo":"simple"},{"texto":"2 dientes de ajo","cantidad":2.0,"resto":"dientes de ajo","escalable":true,"modo":"simple"},{"texto":"Perejil picado, al gusto","cantidad":null,"resto":"Perejil picado, al gusto","escalable":false},{"texto":"1 hoja de laurel","cantidad":1.0,"resto":"hoja de laurel","escalable":true,"modo":"simple"},{"texto":"50 g de harina, para rebozar","cantidad":50.0,"resto":"g de harina, para rebozar","escalable":true,"modo":"simple"},{"texto":"4 patatas medianas","cantidad":4.0,"resto":"patatas medianas","escalable":true,"modo":"simple"}],"elaboracion":["Se pasa el congrio por harina y se fríe en aceite caliente, a fuego medio-alto, vuelta y vuelta (2-3 minutos por cada lado), hasta que esté dorado; se reserva. En el mismo aceite se echa la cebolla (no mucha), picadita, a fuego medio, y se deja pochar, removiendo de vez en cuando, hasta que esté blandita (unos 8-10 minutos). Se echan las patatas chascadas. Después se maja el ajo y el perejil, se echa todo en las patatas con agua hasta que las cubra, y se deja cocer a fuego medio unos 20-25 minutos. Cuando las patatas estén casi hechas, se pone el congrio encima y se deja 5-8 minutos más, hasta que se vaya ligando con las patatas."]},{"categoria":"PESCADOS Y MARISCOS","titulo":"Negrito Escabechado (mar)","raciones":"4 personas","racionesBase":4,"tiempo":"25 min (+ varias horas de reposo en la nevera)","ingredientes":[{"texto":"1 cebolla en juliana","cantidad":1.0,"resto":"cebolla en juliana","escalable":true,"modo":"simple"},{"texto":"1 bote pequeño pimiento asado","cantidad":1.0,"resto":"bote pequeño pimiento asado","escalable":true,"modo":"simple"},{"texto":"1-2 dientes de ajo","cantidad":1.0,"cantidad2":2.0,"resto":"dientes de ajo","escalable":true,"modo":"rango"},{"texto":"1 hoja de laurel","cantidad":1.0,"resto":"hoja de laurel","escalable":true,"modo":"simple"},{"texto":"200 ml de aceite de oliva","cantidad":200.0,"resto":"ml de aceite de oliva","escalable":true,"modo":"simple"},{"texto":"Vinagre (un chorro grande)","cantidad":null,"resto":"Vinagre (un chorro grande)","escalable":false},{"texto":"800 g de negrito (pescado enharinado)","cantidad":800.0,"resto":"g de negrito (pescado enharinado)","escalable":true,"modo":"simple"}],"elaboracion":["Se fríe el pescado enharinado en aceite caliente, a fuego medio-alto, unos 3-4 minutos por cada lado, hasta que esté dorado; se reserva. Se rehoga todo lo demás (la cebolla, el pimiento asado, el ajo y el laurel) a fuego medio, removiendo de vez en cuando, hasta que la cebolla esté blandita (unos 10 minutos). Se aparta del fuego y, fuera de él, se echa el vinagre. Luego se pone el pescado, se vuelve a poner al fuego, se deja que hierva un par de minutos y se deja reposar antes de servir, idealmente varias horas en la nevera, para que el escabeche coja bien el sabor."]},{"categoria":"PESCADOS Y MARISCOS","titulo":"Pudín de Pescado (merluza, cabracho...) o de Queso (mar)","raciones":"6 personas","racionesBase":6,"tiempo":"1 h 15 min","ingredientes":[{"texto":"2 filetes de merluza medianos","cantidad":2.0,"resto":"filetes de merluza medianos","escalable":true,"modo":"simple"},{"texto":"1 tarrina nata líquida de cocinar","cantidad":1.0,"resto":"tarrina nata líquida de cocinar","escalable":true,"modo":"simple"},{"texto":"5 huevos","cantidad":5.0,"resto":"huevos","escalable":true,"modo":"simple"},{"texto":"10 gambas (aprox.)","cantidad":10.0,"resto":"gambas (aprox.)","escalable":true,"modo":"simple"},{"texto":"Un chorrito de vino blanco","cantidad":null,"resto":"Un chorrito de vino blanco","escalable":false},{"texto":"1 tomate","cantidad":1.0,"resto":"tomate","escalable":true,"modo":"simple"},{"texto":"Sal y pimienta, al gusto","cantidad":null,"resto":"Sal y pimienta, al gusto","escalable":false}],"elaboracion":["Se pone a cocer el pescado a fuego medio en agua con laurel, cebolla, sal y vino blanco, junto con las gambas, unos 8-10 minutos, hasta que estén hechos. Se escurre bien.","Se baten la merluza y las gambas (con la batidora o el robot) junto con los huevos hasta obtener una masa fina. Se va añadiendo la sal, la nata y el tomate al final, sin dejar de batir, hasta que quede todo bien integrado.","Se unta un molde con mantequilla y se vierte la mezcla. Se mete al horno, ya precalentado, a 160°-170° con calor solo por abajo, dentro de una cazuela al baño maría (con agua caliente hasta la mitad del molde), durante una hora aproximadamente, hasta que al pinchar con un palillo salga limpio y tome la textura firme de un pudín. Se añaden cáscaras de huevo al agua del baño maría para que no salte ni burbujee con fuerza."]},{"categoria":"PESCADOS Y MARISCOS","titulo":"Pulpo a Feira (mar)","raciones":"4-6 personas","racionesBase":4,"tiempo":"45 minutos","ingredientes":[{"texto":"Pulpo (3 kg fresco → 1 kg cocido)","cantidad":null,"resto":"Pulpo (3 kg fresco → 1 kg cocido)","escalable":false},{"texto":"Cebolla, sal, limón (poco), ajo, un corcho","cantidad":null,"resto":"Cebolla, sal, limón (poco), ajo, un corcho","escalable":false},{"texto":"Sal gorda al gusto","cantidad":null,"resto":"Sal gorda al gusto","escalable":false},{"texto":"Pimentón dulce y picante, al gusto","cantidad":null,"resto":"Pimentón dulce y picante, al gusto","escalable":false},{"texto":"Un chorrito de aceite de oliva virgen extra","cantidad":null,"resto":"Un chorrito de aceite de oliva virgen extra","escalable":false}],"elaboracion":["Se pone a hervir el agua a fuego fuerte, con la cebolla, la sal, un poco de limón, el ajo y un corcho. Cuando rompe a hervir, se asusta el pulpo (se mete y se saca del agua) dos veces, para que la piel no se rompa. Después se vuelve a meter y se deja cocer a fuego medio, tapado, unos 35-45 minutos según el tamaño, pinchando de vez en cuando con una aguja. Cuando pincha y sale agua, no está cocido todavía; tiene que entrar y salir bien, sin resistencia.","Cuando esté cocido, se saca y se deja reposar un par de minutos. Se corta en rodajas, se sala con sal gorda, se espolvorea con pimentón y un buen chorro de aceite de oliva. ¡Y a comer!"]},{"categoria":"PESCADOS Y MARISCOS","titulo":"Patatas con Bacalao (mar) (Portugués)","raciones":"3-4 personas","racionesBase":3,"tiempo":"20 minutos","ingredientes":[{"texto":"4 patatas en rodajas (como 'a la importancia')","cantidad":4.0,"resto":"patatas en rodajas (como 'a la importancia')","escalable":true,"modo":"simple"},{"texto":"Bacalao desalado 350 gr (para 3-4 personas)","cantidad":null,"resto":"Bacalao desalado 350 gr (para 3-4 personas)","escalable":false},{"texto":"1 cebolla en juliana","cantidad":1.0,"resto":"cebolla en juliana","escalable":true,"modo":"simple"},{"texto":"400 g de tomate natural o triturado","cantidad":400.0,"resto":"g de tomate natural o triturado","escalable":true,"modo":"simple"},{"texto":"50 ml de aceite de oliva","cantidad":50.0,"resto":"ml de aceite de oliva","escalable":true,"modo":"simple"},{"texto":"Sal (si se necesita)","cantidad":null,"resto":"Sal (si se necesita)","escalable":false},{"texto":"1 vaso de agua","cantidad":1.0,"resto":"vaso de agua","escalable":true,"modo":"simple"}],"elaboracion":["En la olla exprés se van poniendo capas, por este orden: primero patatas, después el bacalao, luego la cebolla y por encima el tomate triturado; y se repite la misma secuencia una segunda vez: patatas, bacalao, cebolla, tomate.","Se añade un buen chorretón de aceite de oliva por encima, sal si hace falta (el bacalao ya aporta algo de sal) y un vaso de agua. Se cierra la olla y se pone a fuego fuerte hasta que suba la válvula; en ese momento se baja a fuego medio y se cuenta 5 minutos de cocción. Se retira del fuego y se deja reposar otros 5 minutos con la olla tapada y despresurizando, hasta que las patatas estén tiernas al pincharlas."]},{"categoria":"PESCADOS Y MARISCOS","titulo":"Revuelto de Bacalao (mar)","raciones":"4 personas","racionesBase":4,"tiempo":"15 minutos","ingredientes":[{"texto":"300 g de bacalao desmenuzado y desalado","cantidad":300.0,"resto":"g de bacalao desmenuzado y desalado","escalable":true,"modo":"simple"},{"texto":"6 huevos","cantidad":6.0,"resto":"huevos","escalable":true,"modo":"simple"},{"texto":"Un puñado de patatas fritas de bolsa machacadas","cantidad":null,"resto":"Un puñado de patatas fritas de bolsa machacadas","escalable":false},{"texto":"Un chorrito de aceite","cantidad":null,"resto":"Un chorrito de aceite","escalable":false}],"elaboracion":["Se pone un poco de aceite en una sartén a fuego medio y, cuando esté caliente, se añade el bacalao desmenuzado y desalado. Se saltea removiendo de vez en cuando durante 3-4 minutos, hasta que esté bien hecho.","Se baja un poco el fuego y se añaden los huevos batidos, removiendo suavemente con una cuchara de madera para que cuajen despacio y queden jugosos, sin dejar que se sequen. Justo al final, fuera ya del fuego, se incorporan las patatas fritas de bolsa machacadas y se mezcla todo con cuidado."]},{"categoria":"PESCADOS Y MARISCOS","titulo":"Mahonesa Casera (mar)","raciones":"1 tarro (para 4-6 personas)","racionesBase":1,"tiempo":"5 minutos","ingredientes":[{"texto":"1 huevo entero","cantidad":1.0,"resto":"huevo entero","escalable":true,"modo":"simple"},{"texto":"Un chorrito de vinagre","cantidad":null,"resto":"Un chorrito de vinagre","escalable":false},{"texto":"¼ litro de aceite","cantidad":0.25,"resto":"litro de aceite","escalable":true,"modo":"simple"},{"texto":"Sal al gusto","cantidad":null,"resto":"Sal al gusto","escalable":false}],"elaboracion":["Se echan todos los ingredientes en un vaso alto y estrecho, en el orden en que aparecen en la lista (el huevo primero, abajo del todo). Se introduce la batidora hasta el fondo, tocando el huevo, y se empieza a batir sin moverla, a velocidad fuerte, hasta que se vea que empieza a ligar y emulsionar en la base. Solo entonces se va subiendo y bajando la batidora muy despacio, en movimientos suaves, hasta que toda la mezcla quede montada, blanca y espesa."]},{"categoria":"PESCADOS Y MARISCOS","titulo":"Empanada de Calamares (mar) (Nuria)","raciones":"1 empanada grande (8 raciones)","racionesBase":1,"tiempo":"1 h 15 min","ingredientes":[{"texto":"MASA: 1 vaso leche, 1 vaso aceite, 1 cubito levadura pan Mercadona, unos 600 gr harina, 1 cucharadita de sal","cantidad":null,"resto":"MASA: 1 vaso leche, 1 vaso aceite, 1 cubito levadura pan Mercadona, unos 600 gr harina, 1 cucharadita de sal","escalable":false},{"texto":"RELLENO: 1 kg calamares en su tinta, ½ calabacín, 2-3 manzanas, 1 kg calamares, ½ cebolla","cantidad":null,"resto":"RELLENO: 1 kg calamares en su tinta, ½ calabacín, 2-3 manzanas, 1 kg calamares, ½ cebolla","escalable":false}],"elaboracion":["Masa: Templar la leche y disolver en ella la levadura. Mezclar con el aceite, la harina y la sal, y amasar bien, a mano o con amasadora, unos 10 minutos, hasta obtener una masa lisa y elástica que no se pegue en las manos. Dejar reposar tapada con un paño un rato antes de extenderla.","Relleno: A fuego medio, pochar la cebolla picada en un poco de aceite hasta que esté transparente. Añadir el calabacín en dados y las manzanas troceadas, y rehogar unos minutos. Incorporar los calamares limpios y troceados junto con su tinta, y cocinar a fuego medio-bajo, removiendo de vez en cuando, hasta que los calamares estén tiernos y la salsa haya espesado un poco.","Extender la mitad de la masa sobre una bandeja de horno forrada con papel, repartir el relleno ya templado y cubrir con la otra mitad de la masa, sellando bien los bordes. Hornear a 200° durante 30-35 minutos, hasta que la empanada esté dorada por encima."]},{"categoria":"PESCADOS Y MARISCOS","titulo":"El Auténtico Ceviche Peruano (diegodoal)","raciones":"2 personas","racionesBase":2,"tiempo":"45 minutos","ingredientes":[{"texto":"Para la leche de tigre: 250 ml de caldo de pescado (o agua)","cantidad":null,"resto":"Para la leche de tigre: 250 ml de caldo de pescado (o agua)","escalable":false},{"texto":"3 cm de jengibre fresco","cantidad":3.0,"resto":"cm de jengibre fresco","escalable":true,"modo":"simple"},{"texto":"1 rama de apio","cantidad":1.0,"resto":"rama de apio","escalable":true,"modo":"simple"},{"texto":"¼ de cebolla roja","cantidad":0.25,"resto":"de cebolla roja","escalable":true,"modo":"simple"},{"texto":"1 cucharadita de ají picante","cantidad":1.0,"resto":"cucharadita de ají picante","escalable":true,"modo":"simple"},{"texto":"4 granos de pimienta de Sichuán (opcional)","cantidad":4.0,"resto":"granos de pimienta de Sichuán (opcional)","escalable":true,"modo":"simple"},{"texto":"4 tallos de cilantro","cantidad":4.0,"resto":"tallos de cilantro","escalable":true,"modo":"simple"},{"texto":"2 limas","cantidad":2.0,"resto":"limas","escalable":true,"modo":"simple"},{"texto":"Para el ceviche: 8 langostinos","cantidad":null,"resto":"Para el ceviche: 8 langostinos","escalable":false},{"texto":"1 lomo de merluza","cantidad":1.0,"resto":"lomo de merluza","escalable":true,"modo":"simple"},{"texto":"Unas hojas de cilantro","cantidad":null,"resto":"Unas hojas de cilantro","escalable":false},{"texto":"Ají picante al gusto","cantidad":null,"resto":"Ají picante al gusto","escalable":false},{"texto":"Leche de tigre","cantidad":null,"resto":"Leche de tigre","escalable":false},{"texto":"1 lima","cantidad":1.0,"resto":"lima","escalable":true,"modo":"simple"},{"texto":"Sal al gusto","cantidad":null,"resto":"Sal al gusto","escalable":false},{"texto":"¼ de cebolla roja, en juliana","cantidad":0.25,"resto":"de cebolla roja, en juliana","escalable":true,"modo":"simple"}],"elaboracion":["Separar las hojas de cilantro de los tallos; refrigerar las hojas.","Triturar el apio, los tallos de cilantro, el jengibre, la cebolla roja, el zumo de lima, el ají y la pimienta de Sichuán junto con el caldo de pescado hasta que quede completamente líquido. Esta es la leche de tigre: reservar en el congelador si se va a usar de inmediato, o en la nevera si es para más tarde.","Pelar y limpiar los langostinos; pasarlos a un bol. Cortar la merluza en dados y añadirla al mismo bol.","Sazonar con sal, cilantro picado y ají; dejar reposar en la nevera 15 minutos, para que el pescado empiece a \"cocinarse\" ligeramente con la sal.","Mientras tanto, cortar la cebolla roja en medias lunas finas y sumergirla en agua con hielo 10 minutos, para que pierda fuerza y quede crujiente.","Añadir el zumo de lima al pescado y remover.","Cubrir parcialmente con la leche de tigre y mezclar bien.","Añadir la cebolla roja escurrida y combinar.","Terminar con hojas de cilantro por encima y servir de inmediato, antes de que el pescado siga \"cociéndose\" en exceso con el ácido."]},{"categoria":"PESCADOS Y MARISCOS","titulo":"Rodaballo al Horno con Gambas al Ajillo, Patates Lemonates y Judías al Estilo Sichuán (diegodoal)","raciones":"4 personas","racionesBase":4,"tiempo":"45 min (+ 1 h de marinado del rodaballo)","ingredientes":[{"texto":"Para el rodaballo: 1 rodaballo de 1,65 kg aproximadamente","cantidad":null,"resto":"Para el rodaballo: 1 rodaballo de 1,65 kg aproximadamente","escalable":false},{"texto":"Sal y pimienta negra, al gusto","cantidad":null,"resto":"Sal y pimienta negra, al gusto","escalable":false},{"texto":"2 cucharadas de miso","cantidad":2.0,"resto":"cucharadas de miso","escalable":true,"modo":"simple"},{"texto":"Un chorrito de vinagre de arroz o blanco","cantidad":null,"resto":"Un chorrito de vinagre de arroz o blanco","escalable":false},{"texto":"250 g de gambas arroceras","cantidad":250.0,"resto":"g de gambas arroceras","escalable":true,"modo":"simple"},{"texto":"50 ml de aceite de oliva","cantidad":50.0,"resto":"ml de aceite de oliva","escalable":true,"modo":"simple"},{"texto":"3 dientes de ajo","cantidad":3.0,"resto":"dientes de ajo","escalable":true,"modo":"simple"},{"texto":"2 guindillas secas","cantidad":2.0,"resto":"guindillas secas","escalable":true,"modo":"simple"},{"texto":"1 cebolla","cantidad":1.0,"resto":"cebolla","escalable":true,"modo":"simple"},{"texto":"1 vaso de vino blanco","cantidad":1.0,"resto":"vaso de vino blanco","escalable":true,"modo":"simple"},{"texto":"Medio limón","cantidad":null,"resto":"Medio limón","escalable":false},{"texto":"Para las patates lemonates: 4 patatas medianas","cantidad":null,"resto":"Para las patates lemonates: 4 patatas medianas","escalable":false},{"texto":"50 ml de aceite de oliva","cantidad":50.0,"resto":"ml de aceite de oliva","escalable":true,"modo":"simple"},{"texto":"100 ml de caldo de pollo","cantidad":100.0,"resto":"ml de caldo de pollo","escalable":true,"modo":"simple"},{"texto":"65 ml de zumo de limón","cantidad":65.0,"resto":"ml de zumo de limón","escalable":true,"modo":"simple"},{"texto":"1 cucharadita de orégano","cantidad":1.0,"resto":"cucharadita de orégano","escalable":true,"modo":"simple"},{"texto":"Sal en escamas, al gusto","cantidad":null,"resto":"Sal en escamas, al gusto","escalable":false},{"texto":"Para las judías estilo Sichuán: 350 g de judías verdes","cantidad":null,"resto":"Para las judías estilo Sichuán: 350 g de judías verdes","escalable":false},{"texto":"30 ml de aceite de girasol","cantidad":30.0,"resto":"ml de aceite de girasol","escalable":true,"modo":"simple"},{"texto":"3 dientes de ajo","cantidad":3.0,"resto":"dientes de ajo","escalable":true,"modo":"simple"},{"texto":"3 cm de jengibre fresco","cantidad":3.0,"resto":"cm de jengibre fresco","escalable":true,"modo":"simple"},{"texto":"1 cucharadita de pimienta de Sichuán","cantidad":1.0,"resto":"cucharadita de pimienta de Sichuán","escalable":true,"modo":"simple"},{"texto":"125 g de carne picada de cerdo","cantidad":125.0,"resto":"g de carne picada de cerdo","escalable":true,"modo":"simple"},{"texto":"2 cucharaditas de vino de Shaoxing","cantidad":2.0,"resto":"cucharaditas de vino de Shaoxing","escalable":true,"modo":"simple"},{"texto":"1 cucharadita de salsa de soja normal","cantidad":1.0,"resto":"cucharadita de salsa de soja normal","escalable":true,"modo":"simple"},{"texto":"Media cucharadita de salsa de soja oscura","cantidad":null,"resto":"Media cucharadita de salsa de soja oscura","escalable":false},{"texto":"1 cucharadita de vinagre negro chino","cantidad":1.0,"resto":"cucharadita de vinagre negro chino","escalable":true,"modo":"simple"}],"elaboracion":["Los pescados al horno tienen una relación calidad-esfuerzo difícil de superar, y dentro de ellos el rodaballo destaca por su carne melosa y jugosa. Esta versión, inspirada en la de Dani García, lo marina en miso, lo hornea sobre una cama de cebolla y lo remata con unas gambas al ajillo por encima, acompañado de dos guarniciones muy distintas entre sí.","Separar los lomos del rodaballo cortando por la espina dorsal y después pasando el cuchillo pegado a las espinas, tanto por arriba como por abajo.","Salpimentar todos los lomos por dentro y extender media cucharada de miso sobre cada uno. Dejar marinar un mínimo de 1 hora.","Cortar la cebolla en discos y repartirlos por una bandeja de horno. Aliñar con aceite, sal y el zumo de medio limón, y añadir el vino blanco.","Colocar el rodaballo encima de la cebolla y barnizarlo con vinagre de arroz. Hornear a 200° durante 25 minutos, volviendo a barnizar con vinagre a los 10 minutos y de nuevo a los 15.","Mientras se hornea, pelar todas las gambas.","En un cazo, añadir el aceite de oliva, los ajos laminados y las guindillas. Calentar a fuego medio hasta que hierva ligeramente, y entonces añadir el pimentón; freír 5 segundos y añadir las gambas, mezclando bien.","Al sacar el rodaballo del horno, verter las gambas al ajillo por encima y servir de inmediato.","Patates lemonates: pelar las patatas y cortarlas en trozos medianos con dos caras lisas.","En una sartén a fuego medio-alto, añadir aceite de oliva y colocar las patatas; dejar que se doren unos 5 minutos sin tocarlas, y repetir por la otra cara lisa.","Añadir el caldo de pollo, 50 ml de zumo de limón y el orégano. Meter la sartén al horno junto al rodaballo, a 200°, con calor solo por abajo, durante 25 minutos.","Al sacarlas, terminar con el resto del zumo de limón y sal en escamas.","Judías estilo Sichuán: limpiar y cortar las judías verdes; pelar y picar el ajo y el jengibre.","En una sartén a fuego medio-alto, calentar abundante aceite de girasol y freír las judías 3-4 minutos, hasta que empiecen a coger color y se arruguen ligeramente. Escurrir en un colador.","Retirar todo el aceite de la sartén menos tres cucharaditas. Añadir el ajo, el jengibre, las guindillas y la pimienta de Sichuán; saltear 20 segundos, hasta que esté muy fragante.","Añadir el cerdo picado y cocinar 1 minuto.","Devolver las judías a la sartén y añadir el vino de Shaoxing, la salsa de soja normal, la salsa de soja oscura y el vinagre negro chino; mezclar bien y servir."]},{"categoria":"AVES (POLLO, PAVO Y PICHÓN)","titulo":"Pollo con Pimientos del Piquillo (mamá)","raciones":"4 personas","racionesBase":4,"tiempo":"55 minutos","ingredientes":[{"texto":"1 pollo troceado (aprox. 1,5 kg)","cantidad":1.0,"resto":"pollo troceado (aprox. 1,5 kg)","escalable":true,"modo":"simple"},{"texto":"2 cebollas","cantidad":2.0,"resto":"cebollas","escalable":true,"modo":"simple"},{"texto":"4 dientes de ajo","cantidad":4.0,"resto":"dientes de ajo","escalable":true,"modo":"simple"},{"texto":"Perejil picado, al gusto","cantidad":null,"resto":"Perejil picado, al gusto","escalable":false},{"texto":"1 hoja de laurel","cantidad":1.0,"resto":"hoja de laurel","escalable":true,"modo":"simple"},{"texto":"1 bote de pimientos del piquillo","cantidad":1.0,"resto":"bote de pimientos del piquillo","escalable":true,"modo":"simple"}],"elaboracion":["En una cazuela con un chorro de aceite, a fuego medio, se echa la cebolla picada, el ajo, el perejil y la hoja de laurel, y se deja pochar unos 8-10 minutos removiendo de vez en cuando. Se salpimenta el pollo y se añade a la cazuela; se dan unas vueltas para que se dore un poco por todos los lados (unos 5-6 minutos). Después se colocan los pimientos del piquillo por encima, se baja el fuego a medio-bajo, se tapa y se deja que se vaya haciendo despacio, removiendo de vez en cuando, durante unos 35-40 minutos, hasta que el pollo esté bien tierno y la salsa haya ligado."]},{"categoria":"AVES (POLLO, PAVO Y PICHÓN)","titulo":"Pollo de Canal (mamá) (Yolanda)","raciones":"4 personas","racionesBase":4,"tiempo":"1 h 10 min","ingredientes":[{"texto":"1 pollo troceado (aprox. 1,5 kg)","cantidad":1.0,"resto":"pollo troceado (aprox. 1,5 kg)","escalable":true,"modo":"simple"},{"texto":"Cebolla (1 grande)","cantidad":null,"resto":"Cebolla (1 grande)","escalable":false},{"texto":"100 g de bacon","cantidad":100.0,"resto":"g de bacon","escalable":true,"modo":"simple"},{"texto":"2 huevos duros","cantidad":2.0,"resto":"huevos duros","escalable":true,"modo":"simple"},{"texto":"50 g de almendras","cantidad":50.0,"resto":"g de almendras","escalable":true,"modo":"simple"},{"texto":"1 vaso de vino blanco (200 ml)","cantidad":1.0,"resto":"vaso de vino blanco (200 ml)","escalable":true,"modo":"simple"},{"texto":"2 tomates maduros","cantidad":2.0,"resto":"tomates maduros","escalable":true,"modo":"simple"}],"elaboracion":["Rehogar el pollo junto con el bacon en una cazuela a fuego medio-alto, dando vueltas, durante 8-10 minutos, hasta que se dore bien por todos los lados. Bajar el fuego a medio, añadir la cebolla picada y dejar que se poche 8-10 minutos removiendo de vez en cuando. Incorporar el tomate y el vino blanco, tapar y dejar cocer a fuego bajo unos 35-40 minutos, removiendo de vez en cuando, hasta que el pollo esté tierno y la salsa haya reducido un poco.","Cuando ya esté hecho, picar muy menudo el huevo duro y las almendras y añadirlos a la cazuela. Dar unas vueltas 2-3 minutos a fuego suave para que se integren y ya está."]},{"categoria":"AVES (POLLO, PAVO Y PICHÓN)","titulo":"Pollo al Kimchi (mar)","raciones":"4-5 personas","racionesBase":4,"tiempo":"2 horas","ingredientes":[{"texto":"1 cucharada de aceite","cantidad":1.0,"resto":"cucharada de aceite","escalable":true,"modo":"simple"},{"texto":"2 lonchas de bacon finas","cantidad":2.0,"resto":"lonchas de bacon finas","escalable":true,"modo":"simple"},{"texto":"Aprox. 1,5 kg de pollo entre muslos y contramuslos (más de uno por persona)","cantidad":null,"resto":"Aprox. 1,5 kg de pollo entre muslos y contramuslos (más de uno por persona)","escalable":false},{"texto":"Sal y pimienta al gusto","cantidad":null,"resto":"Sal y pimienta al gusto","escalable":false},{"texto":"8 dientes de ajo, ligeramente machacados","cantidad":8.0,"resto":"dientes de ajo, ligeramente machacados","escalable":true,"modo":"simple"},{"texto":"450 gr de tomates cherry","cantidad":450.0,"resto":"gr de tomates cherry","escalable":true,"modo":"simple"},{"texto":"230 ml de vino blanco seco","cantidad":230.0,"resto":"ml de vino blanco seco","escalable":true,"modo":"simple"},{"texto":"450 gr de kimchi con salsa (divididos en dos mitades)","cantidad":450.0,"resto":"gr de kimchi con salsa (divididos en dos mitades)","escalable":true,"modo":"simple"},{"texto":"175 gr de tallarines (fideos de huevo anchos)","cantidad":175.0,"resto":"gr de tallarines (fideos de huevo anchos)","escalable":true,"modo":"simple"},{"texto":"30 ml (2 cucharadas) de mantequilla sin sal","cantidad":30.0,"resto":"ml (2 cucharadas) de mantequilla sin sal","escalable":true,"modo":"simple"}],"elaboracion":["Calentar el aceite en una cazuela grande a fuego medio y cocinar el bacon, revolviéndolo ocasionalmente, hasta que esté dorado y ligeramente crujiente (5–8 min). Pasar a un plato y dejar en el horno.","Sazonar el pollo generosamente con sal y pimienta. Cocinar con la piel hacia abajo en la grasa del bacon hasta que la piel esté muy dorada (12–15 min). Pasar a un plato.","Agregar el ajo y los tomates a la misma olla y cocinar, revolviendo ocasionalmente, hasta que el ajo esté ligeramente dorado y los tomates hayan reventado (aprox. 10 min).","Añadir el vino desglosando. Llevar a ebullición y cocinar hasta que se reduzca en tres cuartos.","Agregar el pollo y la mitad del kimchi. Cocinar a fuego lento hasta que el pollo esté tierno y cocido (45–60 min).","Sacar el pollo, llevar el líquido de cocción a fuego lento y reducir hasta que espese un poco (8–10 min importantes). Al mismo tiempo, desmigar la carne del pollo y calentar el bacon en el horno (estar atento para que no se pase).","Opcional: Cocer los tallarines en agua con sal hasta al dente. Escurrir reservando ½ taza del agua de cocción. Devolver los fideos a la olla vacía, añadir mantequilla y ¼ taza del agua de cocción. Mezclar bien.","Revolver el kimchi restante en el líquido de estofado del pollo. Salpimentar. Dejar a fuego lento para que se mezcle todo.","Emplatar primero los fideos, sobre ellos el pollo con el kimchi y por último el bacon crujiente machacado con los dedos en trozos pequeños."]},{"categoria":"AVES (POLLO, PAVO Y PICHÓN)","titulo":"Pollo al Curry (Benji influencer)","raciones":"4 personas","racionesBase":4,"tiempo":"55 minutos","ingredientes":[{"texto":"500 g de pechuga o contramuslo de pollo, en trozos","cantidad":500.0,"resto":"g de pechuga o contramuslo de pollo, en trozos","escalable":true,"modo":"simple"},{"texto":"Sal y pimienta al gusto","cantidad":null,"resto":"Sal y pimienta al gusto","escalable":false},{"texto":"2 cucharadas de aceite de oliva","cantidad":2.0,"resto":"cucharadas de aceite de oliva","escalable":true,"modo":"simple"},{"texto":"1 cebolla grande o 2 medianas, en daditos","cantidad":1.0,"resto":"cebolla grande o 2 medianas, en daditos","escalable":true,"modo":"simple"},{"texto":"3 dientes de ajo, picados","cantidad":3.0,"resto":"dientes de ajo, picados","escalable":true,"modo":"simple"},{"texto":"½ cucharada de comino","cantidad":0.5,"resto":"cucharada de comino","escalable":true,"modo":"simple"},{"texto":"½ cucharada de cúrcuma","cantidad":0.5,"resto":"cucharada de cúrcuma","escalable":true,"modo":"simple"},{"texto":"1 cucharada de curry","cantidad":1.0,"resto":"cucharada de curry","escalable":true,"modo":"simple"},{"texto":"Jengibre en polvo al gusto","cantidad":null,"resto":"Jengibre en polvo al gusto","escalable":false},{"texto":"4 cucharadas de tomate triturado natural","cantidad":4.0,"resto":"cucharadas de tomate triturado natural","escalable":true,"modo":"simple"},{"texto":"1 bote de leche de coco","cantidad":1.0,"resto":"bote de leche de coco","escalable":true,"modo":"simple"},{"texto":"300 g de arroz, para acompañar","cantidad":300.0,"resto":"g de arroz, para acompañar","escalable":true,"modo":"simple"}],"elaboracion":["Cortar el pollo (contramuslo, que queda más jugoso, o pechuga) en trozos no muy pequeños y salpimentarlo bien por todos los lados. Calentar un chorro de aceite en una cazuela a fuego fuerte y dorar el pollo por tandas, sin amontonarlo (si se pone todo de golpe suelta agua y se cuece en vez de dorarse), hasta que quede bien marcado y dorado por fuera. Sacar y reservar; no hace falta que esté hecho por dentro, terminará de cocinarse después con la salsa.","Bajar el fuego a medio y, en esa misma cazuela (aprovechando los jugos que ha dejado el pollo), incorporar la cebolla cortada en daditos con una pizca de sal, para que sude y no se pegue, y rehogar unos 6-8 minutos, removiendo de vez en cuando, hasta que quede blanda y transparente. Añadir entonces el ajo picado y dar unas vueltas un minuto más, con cuidado de que no se queme.","Añadir el comino, la cúrcuma y el curry directamente sobre el sofrito y remover bien durante unos 30-60 segundos: tostar así las especias en la grasa, antes de añadir ningún líquido, es lo que hace que desarrollen todo su aroma en vez de quedar con sabor a crudo. Incorporar a continuación el tomate triturado y sofreír 2-3 minutos más, hasta que pierda el sabor ácido y la mezcla quede bien integrada.","Devolver el pollo dorado a la cazuela, junto con los jugos que haya soltado en el plato, y añadir la leche de coco, removiendo para que se disuelva bien con el sofrito de especias. Dejar cocer a fuego medio-alto, sin tapar, unos 15 minutos, removiendo de vez en cuando para que no se agarre al fondo y comprobando que el pollo queda bien cocinado y la salsa espesa y untuosa. Añadir el jengibre en polvo al gusto un par de minutos antes de que se cumpla ese tiempo, para que aromatice sin perder fuerza. Probar y rectificar de sal si hace falta.","Mientras tanto, cocer el arroz aparte (blanco, basmati o el que se prefiera) y emplatar el pollo al curry bien caliente sobre él, con un poco de la salsa por encima."]},{"categoria":"AVES (POLLO, PAVO Y PICHÓN)","titulo":"Adobo de Pollo Filipino con Sinangag (diegodoal)","raciones":"4 personas","racionesBase":4,"tiempo":"1 h 10 min (+ marinado mínimo 30 min, idealmente toda la noche)","ingredientes":[{"texto":"Para el adobo: 4 muslos de pollo","cantidad":null,"resto":"Para el adobo: 4 muslos de pollo","escalable":false},{"texto":"4 contramuslos/jamoncitos de pollo","cantidad":4.0,"resto":"contramuslos/jamoncitos de pollo","escalable":true,"modo":"simple"},{"texto":"2 cabezas de ajo (20 dientes)","cantidad":2.0,"resto":"cabezas de ajo (20 dientes)","escalable":true,"modo":"simple"},{"texto":"280 ml de vinagre de caña (o de arroz/manzana)","cantidad":280.0,"resto":"ml de vinagre de caña (o de arroz/manzana)","escalable":true,"modo":"simple"},{"texto":"180 ml de salsa de soja filipina (o 150 ml de soja normal + 30 ml de soja oscura)","cantidad":180.0,"resto":"ml de salsa de soja filipina (o 150 ml de soja normal + 30 ml de soja oscura)","escalable":true,"modo":"simple"},{"texto":"40 granos de pimienta negra entera (8 g)","cantidad":40.0,"resto":"granos de pimienta negra entera (8 g)","escalable":true,"modo":"simple"},{"texto":"70 g de azúcar de palma (o azúcar moreno)","cantidad":70.0,"resto":"g de azúcar de palma (o azúcar moreno)","escalable":true,"modo":"simple"},{"texto":"4 hojas de laurel","cantidad":4.0,"resto":"hojas de laurel","escalable":true,"modo":"simple"},{"texto":"120 ml de agua","cantidad":120.0,"resto":"ml de agua","escalable":true,"modo":"simple"},{"texto":"2 cucharadas de aceite de girasol","cantidad":2.0,"resto":"cucharadas de aceite de girasol","escalable":true,"modo":"simple"},{"texto":"Pimienta negra molida al gusto","cantidad":null,"resto":"Pimienta negra molida al gusto","escalable":false},{"texto":"1-2 cebolletas para decorar","cantidad":1.0,"cantidad2":2.0,"resto":"cebolletas para decorar","escalable":true,"modo":"rango"},{"texto":"Para el sinangag (arroz frito con ajo): 250 g de arroz jazmín cocido (idealmente del día anterior)","cantidad":null,"resto":"Para el sinangag (arroz frito con ajo): 250 g de arroz jazmín cocido (idealmente del día anterior)","escalable":false},{"texto":"1 cabeza de ajo (10 dientes)","cantidad":1.0,"resto":"cabeza de ajo (10 dientes)","escalable":true,"modo":"simple"},{"texto":"2 cucharadas de aceite de girasol","cantidad":2.0,"resto":"cucharadas de aceite de girasol","escalable":true,"modo":"simple"}],"elaboracion":["Separar los cuartos de pollo en muslos y contramuslos. Pelar los dientes de ajo en un bol grande.","Añadir la salsa de soja, el vinagre y los granos de pimienta enteros al bol. Rallar el azúcar de palma, incorporarlo, mezclar bien, añadir el pollo, tapar y marinar un mínimo de 30 minutos (idealmente toda la noche).","Calentar aceite en una sartén grande a fuego fuerte. Añadir el pollo con la piel hacia abajo, sazonar con pimienta y sellar 1 minuto por cada cara.","Añadir la marinada completa y llevar a ebullición. Bajar a fuego medio, tapar y cocer 30 minutos.","Dar la vuelta a las piezas de pollo y cocer 30 minutos más.","Mientras tanto, preparar el sinangag: pelar y picar finamente el ajo. Cubrir el fondo de una sartén fría con aceite, añadir el ajo y cocinar a fuego medio-bajo 5-6 minutos, hasta que esté dorado, removiendo con frecuencia. Colar el aceite y reservar el ajo crujiente.","Devolver el aceite a la sartén y calentar a fuego medio-alto. Añadir el arroz, mezclar bien con el aceite y extenderlo por toda la sartén. Dejar sin remover 45 segundos, hasta que empiece a crepitar. Remover, añadir el ajo crujiente, mezclar, retirar del fuego y tapar.","Picar la cebolleta. Subir el fuego bajo el pollo y reducir la salsa hasta la consistencia deseada. Devolver el pollo a la sartén y bañarlo bien con la salsa.","Servir el pollo sobre el arroz de ajo, acompañado de ajo crujiente, salsa, los granos de pimienta y cebolleta picada."]},{"categoria":"AVES (POLLO, PAVO Y PICHÓN)","titulo":"Nashville Hot Chicken (diegodoal)","raciones":"4 personas","racionesBase":4,"tiempo":"40 min (+ reposo en sal mínimo 1 h, idealmente toda la noche)","ingredientes":[{"texto":"1 pollo entero troceado","cantidad":1.0,"resto":"pollo entero troceado","escalable":true,"modo":"simple"},{"texto":"Sal y pimienta negra al gusto","cantidad":null,"resto":"Sal y pimienta negra al gusto","escalable":false},{"texto":"Para el rebozado líquido: 300 ml de kéfir","cantidad":null,"resto":"Para el rebozado líquido: 300 ml de kéfir","escalable":false},{"texto":"Un chorrito de salsa picante (opcional)","cantidad":null,"resto":"Un chorrito de salsa picante (opcional)","escalable":false},{"texto":"2 huevos grandes","cantidad":2.0,"resto":"huevos grandes","escalable":true,"modo":"simple"},{"texto":"10 ml de líquido de pepinillos (opcional)","cantidad":10.0,"resto":"ml de líquido de pepinillos (opcional)","escalable":true,"modo":"simple"},{"texto":"Para el rebozado seco: 300 g de harina de trigo","cantidad":null,"resto":"Para el rebozado seco: 300 g de harina de trigo","escalable":false},{"texto":"Una pizca de sal","cantidad":null,"resto":"Una pizca de sal","escalable":false},{"texto":"1 cucharadita de pimentón ahumado picante","cantidad":1.0,"resto":"cucharadita de pimentón ahumado picante","escalable":true,"modo":"simple"},{"texto":"1 cucharadita de glutamato monosódico  en el rebozado seco, la célebre \"receta secreta\" que aquí se reproduce casera.","Combinar la pimienta blanca, el pimentón picante, el cilantro molido, la sal y el glutamato en un bol grande. Mezclar bien con el kéfir.","Añadir todas las piezas de pollo, masajeando para que queden totalmente cubiertas. Tapar con film y refrigerar un mínimo de 6 horas.","En otro recipiente, mezclar todos los ingredientes secos del rebozado (desde el pimentón hasta el ajo en polvo).","Añadir la harina y la maicena; mezclar hasta que quede homogéneo.","Sacar el pollo marinado; verter un poco de la marinada directamente sobre la mezcla seca y remover con las manos para crear grumos irregulares (esto es lo que da la textura rugosa y extra crujiente).","Pasar todas las piezas de pollo por este rebozado, presionando bien para que quede totalmente cubierto; dejar reposar 15 minutos.","Calentar aceite de girasol a 180°.","Freír por tandas: 7 minutos las piezas grandes, 4 minutos las alitas.","Escurrir sobre una rejilla y servir de inmediato, bien caliente y crujiente."]},{"categoria":"AVES (POLLO, PAVO Y PICHÓN)","titulo":"Pollo Frito Coreano con Salsa de Miel y Mantequilla (diegodoal)","raciones":"4 personas","racionesBase":4,"tiempo":"45 min (+ salmuera mínimo 6 h)","ingredientes":[{"texto":"Para el pollo: 1 kg de contramuslos de pollo","cantidad":null,"resto":"Para el pollo: 1 kg de contramuslos de pollo","escalable":false},{"texto":"460 ml de agua","cantidad":460.0,"resto":"ml de agua","escalable":true,"modo":"simple"},{"texto":"6 cm de jengibre fresco","cantidad":6.0,"resto":"cm de jengibre fresco","escalable":true,"modo":"simple"},{"texto":"3 dientes de ajo","cantidad":3.0,"resto":"dientes de ajo","escalable":true,"modo":"simple"},{"texto":"50 g de azúcar","cantidad":50.0,"resto":"g de azúcar","escalable":true,"modo":"simple"},{"texto":"35 g de sal","cantidad":35.0,"resto":"g de sal","escalable":true,"modo":"simple"},{"texto":"2 ramas de romero","cantidad":2.0,"resto":"ramas de romer  ajo, el jengibre y el romero de la salmuera. Escurrir el pollo del líquido y reservarlo.","En una fuente, mezclar la harina, la maicena y el bicarbonato.","Enfriar el agua con hielo y añadirla a la mezcla seca, removiendo hasta que quede homogénea.","Añadir esta pasta al bol con el pollo y mezclar bien, asegurándose de que cada trozo quede totalmente recubierto.","Calentar aceite de girasol a 130°.","Freír el pollo en tandas hasta que empiece a dorarse, unos 3 minutos. Sacar a una rejilla para que escurra.","Calentar el mismo aceite hasta 190°.","Freír el pollo por segunda vez, hasta que quede profundamente dorado. Sacar de nuevo a la rejilla y dejar escurrir.","En una sartén a fuego medio-alto, fundir la mantequilla.","Añadir la salsa de soja, el azúcar y la miel; mezclar y cocinar 3 minutos, removiendo con frecuencia, hasta que empiece a formarse espuma en la superficie.","Apagar el fuego, añadir el pollo frito y remover bien para que quede bañado en la salsa por todos lados.","Servir de inmediato, terminado con perejil seco."]},{"categoria":"AVES (POLLO, PAVO Y PICHÓN)","titulo":"Pollo Tikka Masala Definitivo (diegodoal)","raciones":"4 personas","racionesBase":4,"tiempo":"1 hora (+ marinado mínimo 20 min, idealmente toda la noche)","ingredientes":[{"texto":"Para la pasta tikka masala: 4 g de semillas de cilantro","cantidad":null,"resto":"Para la pasta tikka masala: 4 g de semillas de cilantro","escalable":false},{"texto":"2 g de semillas de comino","cantidad":2.0,"resto":"g de semillas de comino","escalable":true,"modo":"simple"},{"texto":"5 dientes de ajo","cantidad":5.0,"resto":"dientes de ajo","escalable":true,"modo":"simple"},{"texto":"4 cm de jengibre fresco","cantidad":4.0,"resto":"cm de jengibre fresco","escalable":true,"modo":"simple"},{"texto":"7 g de garam masala","cantidad":7.0,"resto":"g de garam masala","escalable":true,"modo":"simple"},{"texto":"3 g de cúrcuma","cantidad":3.0,"resto":"g de cúrcuma","escalable":true,"modo":"simple"},{"texto":"2 guin salada de repollo: 3 yemas de huevo","cantidad":null,"resto":"Para la ensalada de repollo: 3 yemas de huevo","escalable":false},{"texto":"Una pizca de sal","cantidad":null,"resto":"Una pizca de sal","escalable":false},{"texto":"Un chorrito de vinagre de arroz","cantidad":null,"resto":"Un chorrito de vinagre de arroz","escalable":false},{"texto":"1 cucharadita de mostaza de Dijon","cantidad":1.0,"resto":"cucharadita de mostaza de Dijon","escalable":true,"modo":"simple"},{"texto":"120 ml de aceite de girasol","cantidad":120.0,"resto":"ml de aceite de girasol","escalable":true,"modo":"simple"},{"texto":"¼ de repollo","cantidad":0.25,"resto":"de repollo","escalable":true,"modo":"simple"},{"texto":"12 pepinillos","cantidad":12.0,"resto":"pepinillos","escalable":true,"modo":"simple"},{"texto":"3 ajetes","cantidad":3.0,"resto":"ajetes","escalable":true,"modo":"simple"}],"elaboracion":["Estas alitas llevan doble fritura, la técnica que garantiza una corteza tremendamente crujiente: la primera fritura a temperatura más baja cocina la carne por dentro, y la segunda, más caliente, deshidrata y dora la corteza de maicena sin que la carne se reseque.","Mezclar en un bol las alitas con la sal, la pimienta negra y el jengibre fresco muy picado (o rallado). Dejar marinar un mínimo de 1 hora.","Colocar las alitas entre papel de cocina y secarlas muy bien por ambos lados.","Añadir la maicena al bol de las alitas y rebozarlas bien. Sacudir cada una individualmente para retirar el exceso y reservar.","Calentar aceite de girasol a 165° y freír las alitas durante 3 minutos y medio; sacarlas a una rejilla.","Calentar el mismo aceite hasta 195° y freír de nuevo durante 3 minutos; sacar a la rejilla.","Salsa: picar el ajo muy fino. Añadir a un cazo el gochujang, el kétchup, el mirin, la salsa de soja oscura, la miel y la panela. Mezclar y llevar a ebullición a fuego medio.","Cuando rompa a hervir, cocinar 4 minutos, hasta que espese.","Retirar del fuego y añadir el ajo picado y el vinagre de arroz. Mezclar hasta que quede homogéneo y dejar enfriar por completo.","Calentar ligeramente la salsa antes de usarla. Pasar las alitas fritas a un bol junto con la salsa y mezclar bien hasta que queden totalmente cubiertas.","Ensalada de repollo: separar las yemas de las claras y ponerlas en un bol junto con la sal, el vinagre de arroz y la mostaza de Dijon. Batir bien e incorporar el aceite de girasol poco a poco sin dejar de batir, hasta emulsionar por completo (esta es la base de una mayonesa japonesa casera).","Picar los ajetes y los pepinillos y añadirlos a la mayonesa; mezclar.","Cortar el repollo en juliana y mezclarlo con la mayonesa justo antes de servir, para que no pierda la textura crujiente.","Servir las alitas de inmediato, decoradas con sésamo y ajetes, junto con la ensalada de repollo."]},{"categoria":"AVES (POLLO, PAVO Y PICHÓN)","titulo":"Pichones (mamá) (Mila)","raciones":"4 personas","racionesBase":4,"tiempo":"45 minutos","ingredientes":[{"texto":"4 pichones","cantidad":4.0,"resto":"pichones","escalable":true,"modo":"simple"},{"texto":"1 cebolla","cantidad":1.0,"resto":"cebolla","escalable":true,"modo":"simple"},{"texto":"1 pimiento verde y 1 pimiento rojo","cantidad":1.0,"resto":"pimiento verde y 1 pimiento rojo","escalable":true,"modo":"simple"},{"texto":"2 dientes de ajo y perejil al gusto","cantidad":2.0,"resto":"dientes de ajo y perejil al gusto","escalable":true,"modo":"simple"},{"texto":"1 guindilla","cantidad":1.0,"resto":"guindilla","escalable":true,"modo":"simple"},{"texto":"1 vaso de vino tinto (200 ml)","cantidad":1.0,"resto":"vaso de vino tinto (200 ml)","escalable":true,"modo":"simple"}],"elaboracion":["En la olla, a fuego medio, se echa un poco de cebolla, pimiento verde y pimiento rojo (no mucho), y se deja dorar un poquito 5 minutos, removiendo de vez en cuando. Se añaden los pichones (previamente dorados en una sartén aparte a fuego fuerte, 3-4 minutos por lado) y se rehoga todo junto un par de minutos.","Después se maja el ajo y el perejil en el mortero y se echa junto con el vino. Se cierra la olla, se sube el fuego hasta que suba la presión y se cuentan 20 minutos desde ahí, bajando entonces a fuego medio. Cuando esté hecho y haya bajado la presión, se pasa la salsa por el pasapurés y se añade la guindilla. Se devuelve todo a la olla y se deja a fuego bajo, sin tapar, unos 5-10 minutos, hasta que la salsa quede bien ligada y con la textura deseada."]},{"categoria":"AVES (POLLO, PAVO Y PICHÓN)","titulo":"Pichones (mamá) (Casa)","raciones":"4 personas","racionesBase":4,"tiempo":"40 min (en olla exprés) o unas 3 horas (en cazuela a fuego lento)","ingredientes":[{"texto":"Pichones (4)","cantidad":null,"resto":"Pichones (4)","escalable":false},{"texto":"Cebolla (1½)","cantidad":null,"resto":"Cebolla (1½)","escalable":false},{"texto":"2 dientes de ajo, perejil y 1 hoja de laurel","cantidad":2.0,"resto":"dientes de ajo, perejil y 1 hoja de laurel","escalable":true,"modo":"simple"}],"elaboracion":["Se echa todo en crudo en la cazuela: la cebolla, los pichones y el laurel, con un chorro de aceite, y se pone a fuego medio-alto para que vayan dorándose y soltando jugo durante 10-15 minutos, dando vueltas de vez en cuando. Cuando estén un poco hechos (que hayan cogido color, sin pasarse) se maja el ajo y el perejil en el mortero y se añade junto con agua que los cubra.","Se puede terminar en la olla exprés, pero hay que tenerlos poco tiempo, unos 15-20 minutos desde que sube la presión, porque se hacen antes. Si se hace en la cazuela a fuego bajo y tapada, tarda 2 o 3 horas, hasta que la carne esté muy tierna y se separe fácilmente del hueso."]},{"categoria":"AVES (POLLO, PAVO Y PICHÓN)","titulo":"Pavo Escabechado (mar) (o cualquier ave)","raciones":"4 personas","racionesBase":4,"tiempo":"40 minutos (+ enfriado en el líquido)","ingredientes":[{"texto":"½ kg pechuga","cantidad":0.5,"resto":"kg pechuga","escalable":true,"modo":"simple"},{"texto":"2 ajos tiernos","cantidad":2.0,"resto":"ajos tiernos","escalable":true,"modo":"simple"},{"texto":"1 cabeza ajo entera","cantidad":1.0,"resto":"cabeza ajo entera","escalable":true,"modo":"simple"},{"texto":"3 cebolletas enteras","cantidad":3.0,"resto":"cebolletas enteras","escalable":true,"modo":"simple"},{"texto":"1 puerro entero","cantidad":1.0,"resto":"puerro entero","escalable":true,"modo":"simple"},{"texto":"3 zanahorias pequeñas enteras","cantidad":3.0,"resto":"zanahorias pequeñas enteras","escalable":true,"modo":"simple"},{"texto":"2 hojas de laurel","cantidad":2.0,"resto":"hojas de laurel","escalable":true,"modo":"simple"},{"texto":"1 ramita tomillo","cantidad":1.0,"resto":"ramita tomillo","escalable":true,"modo":"simple"},{"texto":"10 granos pimienta negra","cantidad":10.0,"resto":"granos pimienta negra","escalable":true,"modo":"simple"},{"texto":"Aceite, vinagre y sal (3 veces más de aceite que vinagre)","cantidad":null,"resto":"Aceite, vinagre y sal (3 veces más de aceite que vinagre)","escalable":false}],"elaboracion":["Se colocan todos los ingredientes en ese orden dentro de una cazuela y se cubre bien la superficie con papel de aluminio, para que no se evapore el vinagre durante la cocción. Encima del papel se pone la tapadera.","Se pone a fuego lento, sin que llegue a hervir con fuerza, y se deja así media hora, hasta que la pechuga esté cocida y tierna. Se deja enfriar dentro del propio líquido antes de guardarlo. Se sirve fileteado, acompañado de las mismas verduras del escabeche. Se conserva en el frigorífico, bien cubierto de líquido, entre 15 y 20 días."]},{"categoria":"TERNERA Y VACUNO","titulo":"Bœuf Bourguignon (diegodoal)","raciones":"6 personas","racionesBase":6,"tiempo":"5 horas de cocción (+ reposo de un día para otro en la nevera)","ingredientes":[{"texto":"1,5 kg de aguja de ternera, en trozos grandes","cantidad":1.5,"resto":"kg de aguja de ternera, en trozos grandes","escalable":true,"modo":"simple"},{"texto":"Sal y pimienta negra al gusto","cantidad":null,"resto":"Sal y pimienta negra al gusto","escalable":false},{"texto":"Aceite de oliva","cantidad":null,"resto":"Aceite de oliva","escalable":false},{"texto":"1 botella de vino tinto","cantidad":1.0,"resto":"botella de vino tinto","escalable":true,"modo":"simple"},{"texto":"1 cebolla grande","cantidad":1.0,"resto":"cebolla grande","escalable":true,"modo":"simple"},{"texto":"2 zanahorias","cantidad":2.0,"resto":"zanahorias","escalable":true,"modo":"simple"},{"texto":"1 cabeza de ajo","cantidad":1.0,"resto":"cabeza de ajo","escalable":true,"modo":"simple"},{"texto":"2 ramas de apio","cantidad":2.0,"resto":"ramas de apio","escalable":true,"modo":"simple"},{"texto":"1 manojo de tomillo","cantidad":1.0,"resto":"manojo de tomillo","escalable":true,"modo":"simple"},{"texto":"3 hojas de laurel","cantidad":3.0,"resto":"hojas de laurel","escalable":true,"modo":"simple"},{"texto":"2 cucharaditas de concentrado de carne (tipo Bovril)","cantidad":2.0,"resto":"cucharaditas de concentrado de carne (tipo Bovril)","escalable":true,"modo":"simple"},{"texto":"2 cucharadas de concentrado o pasta de tomate","cantidad":2.0,"resto":"cucharadas de concentrado o pasta de tomate","escalable":true,"modo":"simple"},{"texto":"1,5 litros de caldo de ternera","cantidad":1.5,"resto":"litros de caldo de ternera","escalable":true,"modo":"simple"},{"texto":"20 g de gelatina neutra en polvo (2 sobres)","cantidad":20.0,"resto":"g de gelatina neutra en polvo (2 sobres)","escalable":true,"modo":"simple"},{"texto":"Para el puré de patata: 1 kg de patatas","cantidad":null,"resto":"Para el puré de patata: 1 kg de patatas","escalable":false},{"texto":"150 g de mantequilla sin sal","cantidad":150.0,"resto":"g de mantequilla sin sal","escalable":true,"modo":"simple"},{"texto":"Un chorrito de leche entera","cantidad":null,"resto":"Un chorrito de leche entera","escalable":false},{"texto":"Para la guarnición: 3 zanahorias grandes","cantidad":null,"resto":"Para la guarnición: 3 zanahorias grandes","escalable":false},{"texto":"8 champiñones portobello","cantidad":8.0,"resto":"champiñones portobello","escalable":true,"modo":"simple"},{"texto":"2 nueces de mantequilla","cantidad":2.0,"resto":"nueces de mantequilla","escalable":true,"modo":"simple"}],"elaboracion":["Cortar la ternera en trozos grandes, untarla con aceite de oliva y salpimentarla generosamente. Colocarla en una bandeja de horno y gratinar al máximo 15 minutos, hasta que quede bien dorada. Mientras tanto, trocear la cebolla, las zanahorias y el apio; partir la cabeza de ajo por la mitad; atar el tomillo en un manojo.","Verter toda la botella de vino en una olla junto con los aromáticos. Llevar a hervor a fuego fuerte y bajar a fuego medio-alto 15 minutos. Añadir el concentrado de carne, el tomate concentrado y el caldo de ternera. Pasar la carne ya dorada a la olla. Desglasar la bandeja del horno con un poco de agua caliente y añadir ese líquido también.","Llevar a hervor y meter la olla (tapada) al horno a 150° durante 2 horas.","Destapar y seguir cociendo 1 hora más. Comprobar que la carne se deshace fácilmente con dos tenedores; si no, seguir cociendo en tramos de 10 minutos. Dejar enfriar a temperatura ambiente y refrigerar de un día para otro. Retirar la capa de grasa solidificada de la superficie con una cuchara.","Al día siguiente, calentar el guiso en el fuego hasta que se suelte. Reservar los trozos de carne aparte. Colar el caldo desechando los aromáticos y devolverlo a la olla a fuego medio-alto. Hidratar la gelatina en agua 5 minutos y añadirla al caldo. Dejar reducir la salsa 45 minutos.","Mientras tanto, pelar las patatas, cortarlas de tamaño uniforme y cubrirlas con agua fría. Llevar a hervor a fuego medio-alto y cocer 15 minutos, hasta que estén tiernas al pinchar con un cuchillo. Escurrir y mantener tapadas. Pelar las zanahorias de la guarnición y cortarlas en trozos uniformes.","Cuando la salsa lleve 45 minutos reduciendo, añadir las zanahorias y cocer 12 minutos. Quitar el tallo a los champiñones y cuartearlos; saltearlos en mantequilla 6-7 minutos hasta que doren, y añadirlos a la salsa. Cocer 10 minutos más. Devolver la carne a la olla, cocer 10 minutos, bañándola constantemente con la salsa. Retirar del fuego y dejar reposar tapado 5 minutos.","Para el puré, añadir la mantequilla y la leche a las patatas y machacar hasta la consistencia deseada; rectificar de sal. Servir el puré como base y el guiso de carne por encima."]},{"categoria":"TERNERA Y VACUNO","titulo":"Galbi-jjim (diegodoal) (Costillas de Ternera Coreanas Estofadas)","raciones":"4 personas","racionesBase":4,"tiempo":"2 horas","ingredientes":[{"texto":"1 kg de costillas de ternera","cantidad":1.0,"resto":"kg de costillas de ternera","escalable":true,"modo":"simple"},{"texto":"8 setas shiitake secas (rehidratadas en 300 ml de agua hirviendo durante 2 horas)","cantidad":8.0,"resto":"setas shiitake secas (rehidratadas en 300 ml de agua hirviendo durante 2 horas)","escalable":true,"modo":"simple"},{"texto":"3 zanahorias medianas","cantidad":3.0,"resto":"zanahorias medianas","escalable":true,"modo":"simple"},{"texto":"½ nabo coreano (nabo daikon)","cantidad":0.5,"resto":"nabo coreano (nabo daikon)","escalable":true,"modo":"simple"},{"texto":"10 castañas peladas crudas","cantidad":10.0,"resto":"castañas peladas crudas","escalable":true,"modo":"simple"},{"texto":"10 azufaifas o 5 dátiles normales (opcional)","cantidad":10.0,"resto":"azufaifas o 5 dátiles normales (opcional)","escalable":true,"modo":"simple"},{"texto":"Para la salsa: 100 ml de salsa de soja","cantidad":null,"resto":"Para la salsa: 100 ml de salsa de soja","escalable":false},{"texto":"150 ml de mirin","cantidad":150.0,"resto":"ml de mirin","escalable":true,"modo":"simple"},{"texto":"60 g de azúcar","cantidad":60.0,"resto":"g de azúcar","escalable":true,"modo":"simple"},{"texto":"1 cucharada de gochugaru (opcional)","cantidad":1.0,"resto":"cucharada de gochugaru (opcional)","escalable":true,"modo":"simple"},{"texto":"300 ml de caldo de las setas (o caldo de pollo)","cantidad":300.0,"resto":"ml de caldo de las setas (o caldo de pollo)","escalable":true,"modo":"simple"},{"texto":"8 dientes de ajo","cantidad":8.0,"resto":"dientes de ajo","escalable":true,"modo":"simple"},{"texto":"3 cm de jengibre fresco","cantidad":3.0,"resto":"cm de jengibre fresco","escalable":true,"modo":"simple"}],"elaboracion":["Escaldar las costillas en agua hirviendo durante 5 minutos; escurrir y enjuagar con agua fría para eliminar impurezas y que el caldo quede limpio. Si se quiere una presentación más pulcra, atarlas con hilo de cocina.","Mezclar en un bol los ingredientes de la salsa: la soja, el mirin, el azúcar, el gochugaru, el caldo de setas, el ajo picado y el jengibre rallado.","Calentar aceite en una olla grande a fuego medio-alto y dorar las costillas por todos los lados, aproximadamente 1 minuto por cara.","Añadir la salsa y agua suficiente para cubrir parcialmente las costillas. Llevar a ebullición, bajar el fuego al mínimo, tapar y cocer entre 30 minutos y 1 hora.","Mientras tanto, pelar y cortar las zanahorias, el nabo y las setas rehidratadas en trozos medianos.","Pasado el primer tiempo de cocción, añadir las verduras y las castañas. Tapar y cocer 1 hora más, hasta que la carne esté muy tierna.","Deshuesar (si se usaron dátiles) las azufaifas o dátiles y añadirlos al guiso; cocer 15 minutos más, tapado si se quiere reducir la salsa o destapado si la consistencia ya es la adecuada.","Dejar reposar tapado 5 minutos antes de servir, para que los sabores se asienten."]},{"categoria":"TERNERA Y VACUNO","titulo":"Chuletón Reverse Sear (diegodoal) (Método Definitivo)","raciones":"2-3 personas","racionesBase":2,"tiempo":"45 min horno (+ reposo en nevera mínimo 40 min, idealmente varias horas)","ingredientes":[{"texto":"1 chuletón de más de 2 cm de grosor (aproximadamente 1,2 kg)","cantidad":1.0,"resto":"chuletón de más de 2 cm de grosor (aproximadamente 1,2 kg)","escalable":true,"modo":"simple"},{"texto":"Sal al gusto","cantidad":null,"resto":"Sal al gusto","escalable":false},{"texto":"Pimienta negra al gusto","cantidad":null,"resto":"Pimienta negra al gusto","escalable":false},{"texto":"1 cucharada de aceite de girasol","cantidad":1.0,"resto":"cucharada de aceite de girasol","escalable":true,"modo":"simple"}],"elaboracion":["El reverse sear consiste en cocinar la carne lentamente en el horno hasta casi el punto deseado y terminarla con un sellado final en sartén muy caliente, al contrario que el método tradicional. El resultado es una cocción mucho más uniforme de borde a borde, sin el habitual anillo gris bajo la costra.","Sazonar el chuletón generosamente por ambos lados con sal y pimienta, presionando las especias con las manos para que se adhieran bien. Dejarlo reposar destapado en la nevera un mínimo de 40 minutos, idealmente hasta 3 días, sobre una rejilla que permita que circule el aire por debajo (esto seca la superficie y favorece un sellado más crujiente).","Colocar la carne sobre una rejilla dentro de un horno precalentado a 125°, y cocinar hasta que el centro alcance la temperatura interna deseada, controlando con un termómetro de cocina: 38° para poco hecho, 44° para al punto y 52° para hecho.","Precalentar una sartén o plancha de hierro hasta que esté muy caliente. Añadir el aceite de girasol, colocar el chuletón y sellarlo 1 minuto por cada cara, marcando también los bordes de grasa apoyándolo de lado.","Dejar reposar 5 minutos antes de trinchar y servir, para que los jugos se redistribuyan por toda la pieza."]},{"categoria":"TERNERA Y VACUNO","titulo":"Solomillo Wellington (diegodoal)","raciones":"6 personas","racionesBase":6,"tiempo":"1 h 30 min (+ refrigeración mínimo 1 h)","ingredientes":[{"texto":"900-1300 g de solomillo de ternera","cantidad":900.0,"cantidad2":1300.0,"resto":"g de solomillo de ternera","escalable":true,"modo":"rango"},{"texto":"2 cucharadas de mostaza de Dijon","cantidad":2.0,"resto":"cucharadas de mostaza de Dijon","escalable":true,"modo":"simple"},{"texto":"2 láminas
