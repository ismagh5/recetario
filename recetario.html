tidad":200.0,"resto":"g de agua para el final","escalable":true,"modo":"simple"}],"elaboracion":["1. Ponga en el vaso el litro de agua junto con la parte dura de los espárragos (lo que solemos tirar). Trituramos en velocidad 6-8 durante 20 segundos.","2. A continuación programamos 10 minutos velocidad 1. Cuando termine, colamos y tiramos los restos.","3. Volvemos a introducir el líquido en el vaso, añadiendo las patatas, los calditos y los ajos. Programamos 20 minutos temperatura 100° y velocidad 1. Mientras tanto, colocamos los espárragos en el recipiente Varoma.","4. Cuando acabe el tiempo, programamos 10 minutos más, temperatura Varoma velocidad 1, y colocamos el Varoma sobre la tapadera.","5. Por último, y con la máquina parada, incorporamos el aceite y los 200 g de agua, o al gusto, y lo mezclamos con la espátula.","Nota: servir los espárragos con aceite y sal, mahonesa, salsa holandesa, con huevo duro picadito, etc."]},{"categoria":"SOPAS","titulo":"Sopa de Verduras (asun) (con Jamón)","raciones":"4 personas","racionesBase":4,"tiempo":"35 minutos","ingredientes":[{"texto":"2 nabos tamaño normal","cantidad":2.0,"resto":"nabos tamaño normal","escalable":true,"modo":"simple"},{"texto":"1 patata","cantidad":1.0,"resto":"patata","escalable":true,"modo":"simple"},{"texto":"3 puerros","cantidad":3.0,"resto":"puerros","escalable":true,"modo":"simple"},{"texto":"3 zanahorias","cantidad":3.0,"resto":"zanahorias","escalable":true,"modo":"simple"},{"texto":"100 g de jamón serrano a trocitos pequeños","cantidad":100.0,"resto":"g de jamón serrano a trocitos pequeños","escalable":true,"modo":"simple"},{"texto":"1 cacito de granulado de pollo, o avecrén","cantidad":1.0,"resto":"cacito de granulado de pollo, o avecrén","escalable":true,"modo":"simple"}],"elaboracion":["Poner las verduras a trocear 6 segundos velocidad 3 y medio, según se quieran más grandes o más pequeñas aumentar el tiempo.","Añadir 700 g de agua, el jamón y el avecrén.","Programar 20 minutos, 100°, velocidad 1.","Cuando acabe, rectificar de sal. Añadir más líquido si se quiere y las verduras que se tengan, como acelgas o espinacas.","Acompañar la sopa con huevo duro troceado."]},{"categoria":"SOPAS","titulo":"Sopa de Pescado (asun) (con Sofrito)","raciones":"6 personas","racionesBase":6,"tiempo":"45 minutos","ingredientes":[{"texto":"1/2 kg de mejillones bien limpios","cantidad":null,"resto":"1/2 kg de mejillones bien limpios","escalable":false},{"texto":"4 filetes de pescado (puede ser congelado)","cantidad":4.0,"resto":"filetes de pescado (puede ser congelado)","escalable":true,"modo":"simple"},{"texto":"200 g de gambas","cantidad":200.0,"resto":"g de gambas","escalable":true,"modo":"simple"},{"texto":"1 hoja de laurel","cantidad":1.0,"resto":"hoja de laurel","escalable":true,"modo":"simple"},{"texto":"100 g (1 cubilete) de vino blanco","cantidad":100.0,"resto":"g (1 cubilete) de vino blanco","escalable":true,"modo":"simple"},{"texto":"2 pastillas de caldo de pescado","cantidad":2.0,"resto":"pastillas de caldo de pescado","escalable":true,"modo":"simple"},{"texto":"2 huevos duros","cantidad":2.0,"resto":"huevos duros","escalable":true,"modo":"simple"},{"texto":"1/2 cubilete de hojas de perejil","cantidad":null,"resto":"1/2 cubilete de hojas de perejil","escalable":false},{"texto":"Pimienta al gusto (opcional)","cantidad":null,"resto":"Pimienta al gusto (opcional)","escalable":false},{"texto":"Para el sofrito: 100 g (1 cubilete) de aceite","cantidad":null,"resto":"Para el sofrito: 100 g (1 cubilete) de aceite","escalable":false},{"texto":"2 dientes de ajo","cantidad":2.0,"resto":"dientes de ajo","escalable":true,"modo":"simple"},{"texto":"3 tomates maduros","cantidad":3.0,"resto":"tomates maduros","escalable":true,"modo":"simple"},{"texto":"1 cebolla mediana","cantidad":1.0,"resto":"cebolla mediana","escalable":true,"modo":"simple"},{"texto":"1 pimiento verde de freír","cantidad":1.0,"resto":"pimiento verde de freír","escalable":true,"modo":"simple"},{"texto":"1/2 pimiento rojo","cantidad":null,"resto":"1/2 pimiento rojo","escalable":false}],"elaboracion":["Ponga en una cazuela 1/2 litro de agua y los mejillones, y déjelos hervir a fuego medio-alto durante 3-5 minutos, hasta que se abran. Retire del fuego, deseche las conchas y reserve el líquido de cocción y los mejillones. Trocee los huevos.","A continuación, pele las gambas y ponga las cáscaras y cabezas en el vaso. Añada 3 cubiletes de agua y programe 5 minutos, temperatura 100°, velocidad 4. Cuando termine, pase este caldo por un colador muy fino y resérvelo junto con el líquido de los mejillones.","Seguidamente, lave bien el vaso y la tapadera y haga el sofrito. Vierta todos los ingredientes en el vaso y programe 6 segundos a velocidad 3 1/2 para que todo quede troceado. Después, programe 5 minutos, temperatura 100°, velocidad 5.","Cuando termine, agregue los caldos reservados, los filetes de pescado en trozos, el laurel, el vino blanco, las pastillas de caldo y pimienta. Programe 12 minutos, temperatura 100° velocidad 1.","Poco antes de que termine la cocción, incorpore los mejillones, las gambas, los huevos duros en rodajas o cortados en trocitos y el perejil picado. Rectifique la sazón e incorpore más agua si fuera necesario. Vierta en una sopera y sirva.","Nota: si desea que todo quede muy bien picadito, al final de la cocción programe 6 segundos a velocidad 3 1/2. Si añade más agua, programe unos minutos más."]},{"categoria":"SOPAS","titulo":"Sopa de Berberechos (asun)","raciones":"4 personas","racionesBase":4,"tiempo":"45 minutos","ingredientes":[{"texto":"400 g de berberechos o chirlas","cantidad":400.0,"resto":"g de berberechos o chirlas","escalable":true,"modo":"simple"},{"texto":"100 g de gambas o 2 pastillas de caldo de pescado","cantidad":100.0,"resto":"g de gambas o 2 pastillas de caldo de pescado","escalable":true,"modo":"simple"},{"texto":"Unas hebras de azafrán o colorante","cantidad":null,"resto":"Unas hebras de azafrán o colorante","escalable":false},{"texto":"1 cayena (opcional)","cantidad":1.0,"resto":"cayena (opcional)","escalable":true,"modo":"simple"},{"texto":"Pimienta al gusto","cantidad":null,"resto":"Pimienta al gusto","escalable":false},{"texto":"1 hoja de laurel","cantidad":1.0,"resto":"hoja de laurel","escalable":true,"modo":"simple"},{"texto":"1/2 cubilete de hojas de perejil picado","cantidad":null,"resto":"1/2 cubilete de hojas de perejil picado","escalable":false},{"texto":"700 g (7 cubiletes) de agua","cantidad":700.0,"resto":"g (7 cubiletes) de agua","escalable":true,"modo":"simple"},{"texto":"Para el sofrito: 70 g (3/4 cubilete) de aceite","cantidad":null,"resto":"Para el sofrito: 70 g (3/4 cubilete) de aceite","escalable":false},{"texto":"1 pimiento choricero","cantidad":1.0,"resto":"pimiento choricero","escalable":true,"modo":"simple"},{"texto":"100 g de pimiento rojo","cantidad":100.0,"resto":"g de pimiento rojo","escalable":true,"modo":"simple"},{"texto":"100 g de pimiento verde","cantidad":100.0,"resto":"g de pimiento verde","escalable":true,"modo":"simple"},{"texto":"150 g de cebolla","cantidad":150.0,"resto":"g de cebolla","escalable":true,"modo":"simple"},{"texto":"2 dientes de ajo","cantidad":2.0,"resto":"dientes de ajo","escalable":true,"modo":"simple"},{"texto":"2 tomates rojos maduros o 200 g (2 cubiletes) de tomate triturado","cantidad":2.0,"resto":"tomates rojos maduros o 200 g (2 cubiletes) de tomate triturado","escalable":true,"modo":"simple"}],"elaboracion":["Lave los berberechos con agua y sal, póngalos en el cestillo y reserve. Haga un fumet con las cabezas y las pieles de las gambas y tres cubiletes del agua estipulada (reservar los cuerpos) y programe 4 minutos, temperatura 100°, velocidad 4. Cuele y reserve (lave muy bien el vaso y la tapa).","Vierta en el vaso todos los ingredientes del sofrito y trocee 7 segundos a velocidad 3 1/2. A continuación, programe 10 minutos, temperatura 100°, velocidad 5. Baje con la espátula los residuos que hayan quedado en las paredes y añada el caldo que teníamos reservado y el resto del agua, hasta completar los 7 cubiletes.","Triture durante 20 segundos a velocidad 8-9 comprobando que queda todo homogéneo. Añada las pastillas, el azafrán y la cayena y sazone. A continuación, introduzca el cestillo con los berberechos en el vaso y la hoja de laurel. Programe 12 minutos, temperatura 100°, velocidad 4 (tienen que abrirse las conchas). Pasado el tiempo, ponga en el cestillo las gambas peladas y deje en reposo, ya sin calor, unos segundos.","Retire el cestillo del vaso y agregue el perejil. Si desea añadir fideos o arroz, agregue más agua si es necesario, y ponga a cocer a velocidad 1 (el tiempo dependerá de la dureza del ingrediente). Vierta la sopa en una sopera, añada los berberechos y las gambas del cestillo, mezcle y sirva.","Se puede tomar frío o caliente."]},{"categoria":"SOPAS","titulo":"Sopa de Verduras Enriquecida con Jamón y Queso (asun)","raciones":"6 personas","racionesBase":6,"tiempo":"55 minutos","ingredientes":[{"texto":"2 huevos duros","cantidad":2.0,"resto":"huevos duros","escalable":true,"modo":"simple"},{"texto":"1 trozo de jamón","cantidad":1.0,"resto":"trozo de jamón","escalable":true,"modo":"simple"},{"texto":"1 trozo de queso","cantidad":1.0,"resto":"trozo de queso","escalable":true,"modo":"simple"},{"texto":"Verduras al gusto (calabaza, calabacín, patata, acelgas, judías verdes, lo que se tenga en la nevera)","cantidad":null,"resto":"Verduras al gusto (calabaza, calabacín, patata, acelgas, judías verdes, lo que se tenga en la nevera)","escalable":false},{"texto":"1 trozo de cebolla","cantidad":1.0,"resto":"trozo de cebolla","escalable":true,"modo":"simple"},{"texto":"1 puerro","cantidad":1.0,"resto":"puerro","escalable":true,"modo":"simple"},{"texto":"50 g de aceite","cantidad":50.0,"resto":"g de aceite","escalable":true,"modo":"simple"},{"texto":"Hasta 1,5 litros de agua","cantidad":null,"resto":"Hasta 1,5 litros de agua","escalable":false},{"texto":"Sal o pastillas de caldo de verduras al gusto","cantidad":null,"resto":"Sal o pastillas de caldo de verduras al gusto","escalable":false}],"elaboracion":["Picar los huevos duros unos segundos añadiéndolos por el bocal, velocidad 3 1/2. Picar también el jamón y el queso por separado. Reservar todo.","Picar las verduras al 3 1/2 (queda muy bien picado con un poco de agua). Escurrir las verduras en el colador y reservar.","Poner en el vaso el aceite y calentar a velocidad 1, 100°, 5 minutos.","Añadir la cebolla picada al 3 1/2, el jamón a trozos y el puerro a rodajitas, y rehogar todo 6 minutos, velocidad 1, 100°.","Poner la mariposa, añadir las verduras y hasta litro y medio de agua, la sal o pastillas de caldo al gusto, y programar 30 minutos a velocidad 1.","Cuando termine, añadir el huevo picado y el queso rallado y dar dos minutos más de tiempo para que se deshaga el queso."]},{"categoria":"CREMAS","titulo":"Yurumú de Calabaza (asun) (receta cubana)","raciones":"4 personas","racionesBase":4,"tiempo":"35 minutos","ingredientes":[{"texto":"800 g de calabaza pelada y cortada en trocitos","cantidad":800.0,"resto":"g de calabaza pelada y cortada en trocitos","escalable":true,"modo":"simple"},{"texto":"50 g de aceite de oliva","cantidad":50.0,"resto":"g de aceite de oliva","escalable":true,"modo":"simple"},{"texto":"1 y ½ cebolla cortada en cuartos","cantidad":1.5,"resto":"cebolla cortada en cuartos","escalable":true,"modo":"simple"},{"texto":"3 chorritos de leche (5 cucharadas aproximadamente)","cantidad":3.0,"resto":"chorritos de leche (5 cucharadas aproximadamente)","escalable":true,"modo":"simple"},{"texto":"Sal a gusto","cantidad":null,"resto":"Sal a gusto","escalable":false}],"elaboracion":["Poner el aceite a calentar 1 min, 100°, velocidad 1. Cuando termine, echar la cebolla y trocear 6 seg., velocidad 3.","Programar 5 min, 100°, velocidad 1. A continuación poner la mariposa en las cuchillas y echar la calabaza, la sal y un chorrito de leche, programar 20 minutos 100° velocidad 1; durante ese tiempo añadir por el bocal dos chorritos más de leche.","Al terminar el tiempo, programar 2 minutos temperatura Varoma, velocidad 1 (para que reduzca un poco del líquido).","Quitar la mariposa y dejar enfriar un poquito. Programar 6 segundos velocidad 6, para que quede como un puré gordo y con algunos grumitos.","Esto es una guarnición perfecta para acompañar carnes y pescados a la plancha, queda delicioso."]},{"categoria":"CREMAS","titulo":"Bisque de Langostinos (asun)","raciones":"8 personas","racionesBase":8,"tiempo":"2 horas","ingredientes":[{"texto":"Las cabezas de 2 kilos de langostinos","cantidad":null,"resto":"Las cabezas de 2 kilos de langostinos","escalable":false},{"texto":"300 cc de vino blanco seco","cantidad":300.0,"resto":"cc de vino blanco seco","escalable":true,"modo":"simple"},{"texto":"100 cc de coñac","cantidad":100.0,"resto":"cc de coñac","escalable":true,"modo":"simple"},{"texto":"2 litros de caldo de pescado","cantidad":2.0,"resto":"litros de caldo de pescado","escalable":true,"modo":"simple"},{"texto":"75 g de mantequilla","cantidad":75.0,"resto":"g de mantequilla","escalable":true,"modo":"simple"},{"texto":"150 cc de aceite de maíz","cantidad":150.0,"resto":"cc de aceite de maíz","escalable":true,"modo":"simple"},{"texto":"150 g de puré de tomates","cantidad":150.0,"resto":"g de puré de tomates","escalable":true,"modo":"simple"},{"texto":"250 cc de nata líquida","cantidad":250.0,"resto":"cc de nata líquida","escalable":true,"modo":"simple"},{"texto":"300 g de zanahorias","cantidad":300.0,"resto":"g de zanahorias","escalable":true,"modo":"simple"},{"texto":"300 g de cebollas","cantidad":300.0,"resto":"g de cebollas","escalable":true,"modo":"simple"},{"texto":"150 g de apio","cantidad":150.0,"resto":"g de apio","escalable":true,"modo":"simple"},{"texto":"2 ramitas de tomillo","cantidad":2.0,"resto":"ramitas de tomillo","escalable":true,"modo":"simple"},{"texto":"1 hoja de laurel","cantidad":1.0,"resto":"hoja de laurel","escalable":true,"modo":"simple"},{"texto":"Sal y pimienta al gusto","cantidad":null,"resto":"Sal y pimienta al gusto","escalable":false},{"texto":"1 diente de ajo pelado","cantidad":1.0,"resto":"diente de ajo pelado","escalable":true,"modo":"simple"},{"texto":"75 g de harina","cantidad":75.0,"resto":"g de harina","escalable":true,"modo":"simple"}],"elaboracion":["Cortar las zanahorias, cebollas y apio en trozos pequeños.","En un bol dejar ablandar la mantequilla y mezclarla con la harina, esto se llama \"beurre manié\".","En una cacerola grande poner el aceite a calentar a fuego vivo. Cuando el aceite esté bien caliente introducir las cabezas de los langostinos y dejarlas freír durante 5 ó 6 minutos. Remover de vez en cuando.","Añadir entonces las legumbres, así como el tomillo, laurel y diente de ajo. Mezclar bien. Dejar freír durante dos minutos, añadir el puré de tomate, mezclar.","Añadir el coñac y flamearlo e introducir entonces el vino y el caldo de pescado. Añadir un poco de sal y pimienta; llevar a ebullición.","Reducir el fuego y cocer suavemente durante hora y media con la cacerola tapada.","Pasar este bisque por el chino o pasapurés haciendo presión sobre las carcasas de las cabezas de los langostinos para extraerles todo su jugo.","Volver a introducir el bisque en la cacerola y ponerlo de nuevo a hervir. Mezclar a conciencia con un batidor de mano la mantequilla manejada, dejar cocer por espacio de diez minutos y pasarlo entonces de nuevo por el pasapurés, pero utilizando el filtro más fino posible.","Justo antes de ir a servir introducir la nata líquida sin que llegue a hervir y rectificar, caso de que sea necesario, de sal y pimienta."]},{"categoria":"CREMAS","titulo":"Crema de Ahumados (asun)","raciones":"4 personas","racionesBase":4,"tiempo":"30 minutos","ingredientes":[{"texto":"100 g de salmón ahumado, cortado en 4 trozos","cantidad":100.0,"resto":"g de salmón ahumado, cortado en 4 trozos","escalable":true,"modo":"simple"},{"texto":"2 cucharadas colmadas de mantequilla","cantidad":2.0,"resto":"cucharadas colmadas de mantequilla","escalable":true,"modo":"simple"},{"texto":"50 g (½ cubilete) de aceite","cantidad":50.0,"resto":"g (½ cubilete) de aceite","escalable":true,"modo":"simple"},{"texto":"2 zanahorias grandes","cantidad":2.0,"resto":"zanahorias grandes","escalable":true,"modo":"simple"},{"texto":"3 puerros, sólo la parte blanca","cantidad":3.0,"resto":"puerros, sólo la parte blanca","escalable":true,"modo":"simple"},{"texto":"1 diente de ajo","cantidad":1.0,"resto":"diente de ajo","escalable":true,"modo":"simple"},{"texto":"6 setas","cantidad":6.0,"resto":"setas","escalable":true,"modo":"simple"},{"texto":"500 g (5 cubiletes) de fumet de pescado","cantidad":500.0,"resto":"g (5 cubiletes) de fumet de pescado","escalable":true,"modo":"simple"},{"texto":"1 pastilla de caldo de pescado","cantidad":1.0,"resto":"pastilla de caldo de pescado","escalable":true,"modo":"simple"},{"texto":"Cayena molida al gusto","cantidad":null,"resto":"Cayena molida al gusto","escalable":false},{"texto":"2 latitas (4 cubiletes) de nata esterilizada \"la lechera\"","cantidad":2.0,"resto":"latitas (4 cubiletes) de nata esterilizada \"la lechera\"","escalable":true,"modo":"simple"}],"elaboracion":["Vierta en el vaso la mantequilla y el aceite. Añada todas las verduras y programe 8 minutos, temperatura 100°c, velocidad 4. A continuación, agregue el fumet reservado, la pastilla y la cayena y programe 12 minutos, temperatura 100°c, velocidad 5. En los últimos 5 minutos, incorpore la nata. Seguidamente, añada el salmón y programe 6 segundos a velocidad 4, hasta que quede picadito. Rectifique la sazón si fuera necesario y sirva.","Nota: si lo desea, puede servirlo con hojaldre. Con la crema fría, ponga un disco de hojaldre en cada cuenco o en la sopera, pegándolo a los bordes con huevo batido. Pinte la superficie con huevo e introduzca en el horno, precalentado a 200°c, durante unos 10-12 minutos, hasta que el hojaldre esté dorado y se haya abombado."]},{"categoria":"CREMAS","titulo":"Crema de Ave al Jerez (asun)","raciones":"4 personas","racionesBase":4,"tiempo":"30 minutos","ingredientes":[{"texto":"2 filetes de pechuga de pollo o de pavo, unos 350 g","cantidad":2.0,"resto":"filetes de pechuga de pollo o de pavo, unos 350 g","escalable":true,"modo":"simple"},{"texto":"1 cucharada de mantequilla","cantidad":1.0,"resto":"cucharada de mantequilla","escalable":true,"modo":"simple"},{"texto":"1 chalota","cantidad":1.0,"resto":"chalota","escalable":true,"modo":"simple"},{"texto":"¾ de decilitro de harina (unos 45 g)","cantidad":0.75,"resto":"de decilitro de harina (unos 45 g)","escalable":true,"modo":"simple"},{"texto":"1 latita de trufa con su caldo","cantidad":1.0,"resto":"latita de trufa con su caldo","escalable":true,"modo":"simple"},{"texto":"1 pastilla de caldo concentrado y agua, o un caldo bueno de pollo","cantidad":1.0,"resto":"pastilla de caldo concentrado y agua, o un caldo bueno de pollo","escalable":true,"modo":"simple"},{"texto":"1 yema","cantidad":1.0,"resto":"yema","escalable":true,"modo":"simple"},{"texto":"1 decilitro de jerez seco","cantidad":1.0,"resto":"decilitro de jerez seco","escalable":true,"modo":"simple"},{"texto":"1 ó 2 decilitros de nata líquida","cantidad":1.0,"resto":"ó 2 decilitros de nata líquida","escalable":true,"modo":"simple"},{"texto":"Sal, pimienta blanca y nuez moscada al gusto","cantidad":null,"resto":"Sal, pimienta blanca y nuez moscada al gusto","escalable":false}],"elaboracion":["Colocar los filetes de pechuga en el cestillo metálico, tapizando las paredes del mismo, sin tapar los orificios del fondo por donde nos tiene que subir el vapor. En el vaso añadir la chalota y la mantequilla, y sofreír durante 3 minutos a 100 grados y velocidad 1, introduciendo ya el cestillo con las pechugas. A continuación añadir la harina y sofreírla durante 2 ó 3 minutos, siempre con el cestillo dentro del vaso. Agregar ahora los 3 decilitros de agua, la pastilla de caldo y el caldo de la trufa, o 3 decilitros de caldo bueno de pollo y programar de nuevo 100 grados y velocidad 1 como unos 8 ó 10 minutos, hasta que el pollo esté cocido. Volcar entonces el pollo en el vaso y triturarlo en velocidad 1. Añadir más agua o caldo bueno, la yema y la nata y volver a programar 100 grados y velocidad 1 hasta que vuelva a cocer. Picar la trufa finita y espolvorearla en cada taza de consomé al servir."]},{"categoria":"CREMAS","titulo":"Crema de Brécol (asun)","raciones":"4 personas","racionesBase":4,"tiempo":"25 minutos","ingredientes":[{"texto":"150 g de Brécol","cantidad":150.0,"resto":"g de Brécol","escalable":true,"modo":"simple"},{"texto":"1 cebolla pequeña","cantidad":1.0,"resto":"cebolla pequeña","escalable":true,"modo":"simple"},{"texto":"½ cubilete de Aceite de Oliva","cantidad":0.5,"resto":"cubilete de Aceite de Oliva","escalable":true,"modo":"simple"},{"texto":"1 Pastilla de concentrado de caldo de verduras","cantidad":1.0,"resto":"Pastilla de concentrado de caldo de verduras","escalable":true,"modo":"simple"},{"texto":"5 cubiletes de agua","cantidad":5.0,"resto":"cubiletes de agua","escalable":true,"modo":"simple"},{"texto":"5 cubiletes de leche","cantidad":5.0,"resto":"cubiletes de leche","escalable":true,"modo":"simple"},{"texto":"½ cubilete raso de Tapioca","cantidad":0.5,"resto":"cubilete raso de Tapioca","escalable":true,"modo":"simple"},{"texto":"Sal y pimienta blanca a gusto","cantidad":null,"resto":"Sal y pimienta blanca a gusto","escalable":false}],"elaboracion":["Poner en el vaso el brécol troceado, la cebolla y el aceite. Programar 7 minutos, 100°, velocidad 4.","Cuando pare el reloj, añadir el agua y la leche con la pastilla de concentrado. Programar 10 minutos, 90°, velocidad 6.","Cuando falten 5 minutos para terminar, añadir la tapioca y la sal.","Finalizado el programa, servir caliente.","Por cierto, la tapioca es como una sémola blanca y granillosa, la venden en cualquier supermercado y se usa para sopa."]},{"categoria":"CREMAS","titulo":"Crema de Calabacín (asun)","raciones":"4 personas","racionesBase":4,"tiempo":"35 minutos","ingredientes":[{"texto":"50 ml de aceite","cantidad":50.0,"resto":"ml de aceite","escalable":true,"modo":"simple"},{"texto":"2 cucharadas de mantequilla","cantidad":2.0,"resto":"cucharadas de mantequilla","escalable":true,"modo":"simple"},{"texto":"3 puerros, sólo la parte blanca, o una cebolla","cantidad":3.0,"resto":"puerros, sólo la parte blanca, o una cebolla","escalable":true,"modo":"simple"},{"texto":"2 dientes de ajo","cantidad":2.0,"resto":"dientes de ajo","escalable":true,"modo":"simple"},{"texto":"700 g de calabacines pelados y troceados","cantidad":700.0,"resto":"g de calabacines pelados y troceados","escalable":true,"modo":"simple"},{"texto":"700 ml de leche o agua","cantidad":700.0,"resto":"ml de leche o agua","escalable":true,"modo":"simple"},{"texto":"2 pastillas de caldo de ave o sal","cantidad":2.0,"resto":"pastillas de caldo de ave o sal","escalable":true,"modo":"simple"},{"texto":"7 quesitos en porciones","cantidad":7.0,"resto":"quesitos en porciones","escalable":true,"modo":"simple"},{"texto":"Pimienta al gusto","cantidad":null,"resto":"Pimienta al gusto","escalable":false}],"elaboracion":["1. Vierta en el vaso el aceite, la mantequilla, los puerros cortados en rodajas y los ajos, y programe 5 minutos, 100°, velocidad 5.","Pare la máquina, agregue todos los ingredientes restantes, excepto los quesitos, y programe 20 minutos, 100°, velocidad 5. Cuando termine el tiempo, si no ha quedado todo bien triturado, programe 20 segundos en velocidad 6.","2. Agregue los quesitos y programe 5 minutos más a 90°, velocidad 5.","Incorpore más agua o leche si lo desea, rectifique la sazón si fuera necesario y sirva espolvoreada con perejil picado o cebollino.","Advertencia: si ve que hierve mucho, baje la temperatura a 85°."]},{"categoria":"CREMAS","titulo":"Crema de Calabacín y Arroz (asun)","raciones":"6 personas","racionesBase":6,"tiempo":"40 minutos","ingredientes":[{"texto":"700 g de calabacines","cantidad":700.0,"resto":"g de calabacines","escalable":true,"modo":"simple"},{"texto":"½ cebolla y 2 dientes de ajo","cantidad":0.5,"resto":"cebolla y 2 dientes de ajo","escalable":true,"modo":"simple"},{"texto":"2 patatas medianas","cantidad":2.0,"resto":"patatas medianas","escalable":true,"modo":"simple"},{"texto":"120 g de arroz","cantidad":120.0,"resto":"g de arroz","escalable":true,"modo":"simple"},{"texto":"50 g de aceite","cantidad":50.0,"resto":"g de aceite","escalable":true,"modo":"simple"},{"texto":"800 g de agua","cantidad":800.0,"resto":"g de agua","escalable":true,"modo":"simple"},{"texto":"Especias al gusto y sal (yo hecho pimienta, una pizca de nuez moscada y una pizca de comino molido)","cantidad":null,"resto":"Especias al gusto y sal (yo hecho pimienta, una pizca de nuez moscada y una pizca de comino molido)","escalable":false}],"elaboracion":["Echar en el vaso ajos, cebolla y aceite, 2 minutos 100° velocidad 4.","Añadir las patatas peladas y troceadas y el calabacín troceado (yo los pelo todos menos un trozo), el agua, la sal y especias.","Cocer 15 minutos a 100°, velocidad 1. Triturar 1 minuto a velocidad 8. Incorporar el arroz y cocer 15 minutos velocidad 1.","Triturar de nuevo 5-7-9."]},{"categoria":"CREMAS","titulo":"Crema de Calabaza (asun)","raciones":"6 personas","racionesBase":6,"tiempo":"50 minutos","ingredientes":[{"texto":"Para el sofrito: 150 g de cebolla, 100 g de puerro (sólo parte blanca), 70 g de mantequilla, 30 g de aceite, 2 dientes de ajo","cantidad":null,"resto":"Para el sofrito: 150 g de cebolla, 100 g de puerro (sólo parte blanca), 70 g de mantequilla, 30 g de aceite, 2 dientes de ajo","escalable":false},{"texto":"Para el resto: 600 g de calabaza, 800 g de agua, 100 g de hojas verdes de lechuga, 2 pastillas de caldo, 1 cucharadita de comino, pimienta blanca","cantidad":null,"resto":"Para el resto: 600 g de calabaza, 800 g de agua, 100 g de hojas verdes de lechuga, 2 pastillas de caldo, 1 cucharadita de comino, pimienta blanca","escalable":false}],"elaboracion":["Ponga en el vaso los ingredientes del sofrito y programe 10 minutos a 100° en velocidad 4. Abra y baje con la ayuda de la espátula lo que haya quedado en las paredes.","Añada la calabaza, las pastillas, la lechuga y la mitad del agua. Triture unos segundos. Agregue el resto del agua y vuelva a triturar durante 1 minuto. A continuación, programe 30 minutos a 100° en velocidad 5. Pasados unos minutos, baje a velocidad 4.","Añada agua al gusto y programe 5 minutos a 90° en velocidad 4.","Sírvala en tazas de consomé con taquitos de jamón serrano.","Nota: si lo desea, puede montar nata con queso Philadelphia y poner un montoncito sobre la crema. Para ello, ponga la mariposa en las cuchillas y eche en el vaso 250 g de nata líquida, 100 g de queso Philadelphia y un poquito de pimienta blanca. Móntelo en velocidad 3."]},{"categoria":"CREMAS","titulo":"Crema de Cangrejo (asun)","raciones":"4 personas","racionesBase":4,"tiempo":"50 minutos","ingredientes":[{"texto":"½ Kg de cangrejos","cantidad":0.5,"resto":"Kg de cangrejos","escalable":true,"modo":"simple"},{"texto":"6 gambas","cantidad":6.0,"resto":"gambas","escalable":true,"modo":"simple"},{"texto":"½ cebolla","cantidad":0.5,"resto":"cebolla","escalable":true,"modo":"simple"},{"texto":"2 zanahorias","cantidad":2.0,"resto":"zanahorias","escalable":true,"modo":"simple"},{"texto":"1 cubilete de nata","cantidad":1.0,"resto":"cubilete de nata","escalable":true,"modo":"simple"},{"texto":"1 puerro grande","cantidad":1.0,"resto":"puerro grande","escalable":true,"modo":"simple"},{"texto":"2 tomates maduros","cantidad":2.0,"resto":"tomates maduros","escalable":true,"modo":"simple"},{"texto":"1 L o 1 y ½ L de agua","cantidad":1.0,"resto":"L o 1 y ½ L de agua","escalable":true,"modo":"simple"},{"texto":"½ cubilete de aceite","cantidad":0.5,"resto":"cubilete de aceite","escalable":true,"modo":"simple"},{"texto":"1 copa de Brandy (coñac), jerez o vino blanco","cantidad":1.0,"resto":"copa de Brandy (coñac), jerez o vino blanco","escalable":true,"modo":"simple"},{"texto":"1 pastilla de caldo de pescado (unas gotas de tabasco si gusta)","cantidad":1.0,"resto":"pastilla de caldo de pescado (unas gotas de tabasco si gusta)","escalable":true,"modo":"simple"}],"elaboracion":["Pelar las gambas y poner las pieles y las cabezas junto con los cangrejos y 250 g de agua en el vaso del Thermomix, triturar 3 segundos en velocidad 6 y programar 8 minutos 100° y velocidad 1 (no debe quedar totalmente triturado). Cuando pare, colarlo en un recipiente con un colador muy fino.","Enjuagar el vaso, poner aceite, poner la máquina en velocidad 6 y por el bocal ir echando el puerro, la cebolla y la zanahoria, cuando esté muy picadito programar 8 minutos 100° y velocidad 1. Cuando pare, añadir los tomates, triturar 15 segundos en velocidad 7 y programar 5 minutos 100°, y velocidad 1.","Después, añadir el caldo de los cangrejos, pieles y cabezas de gambas y triturar 1 minuto y velocidad 8 hasta que esté muy fino. Añadir el agua restante hasta el nivel de 2 l. del vaso, añadir el coñac, (si gusta picante unas gotas de tabasco) y una pastilla de caldo de pescado y programar 20 minutos 100°, velocidad 2. En el momento de servirla, añadir la nata por encima y los cuerpos de las gambas (si se quiere se rehogan primero en la sartén con agua caliente durante 2-3 minutos)."]},{"categoria":"CREMAS","titulo":"Crema de Cangrejo II (asun)","raciones":"6 personas","racionesBase":6,"tiempo":"30 minutos","ingredientes":[{"texto":"600 g de cangrejo","cantidad":600.0,"resto":"g de cangrejo","escalable":true,"modo":"simple"},{"texto":"900 g de caldo de cocer los cangrejos","cantidad":900.0,"resto":"g de caldo de cocer los cangrejos","escalable":true,"modo":"simple"},{"texto":"200 g de nata líquida","cantidad":200.0,"resto":"g de nata líquida","escalable":true,"modo":"simple"},{"texto":"200 g de vino blanco","cantidad":200.0,"resto":"g de vino blanco","escalable":true,"modo":"simple"},{"texto":"60 g de brandy","cantidad":60.0,"resto":"g de brandy","escalable":true,"modo":"simple"},{"texto":"1 pastilla de caldo de pescado o sal","cantidad":1.0,"resto":"pastilla de caldo de pescado o sal","escalable":true,"modo":"simple"},{"texto":"Unas gotas de tabasco","cantidad":null,"resto":"Unas gotas de tabasco","escalable":false},{"texto":"Sofrito: 200 g de cebolla, 200 g de tomate natural triturado o 2 tomates, 60 g de mantequilla, 50 g de maicena, 1 diente de ajo, 1 rama de perejil","cantidad":null,"resto":"Sofrito: 200 g de cebolla, 200 g de tomate natural triturado o 2 tomates, 60 g de mantequilla, 50 g de maicena, 1 diente de ajo, 1 rama de perejil","escalable":false}],"elaboracion":["Ponga a cocer en una cazuela 1 litro de agua con una hoja de laurel, sal y 200 g de vino blanco. Cuando rompa a hervir incorpore los cangrejos y deje cocer entre 4 y 7 minutos (dependiendo del tamaño de los cangrejos).","Ponga en el vaso todos los ingredientes del sofrito y trocee 6 segundos a velocidad 3 y ½. A continuación, programe 7 minutos temperatura 100 y velocidad 3. Incorpore los cangrejos (sin pelar) y triture 4 minutos a velocidad 9. Cuando termine incorpore el agua de la cocción de los cangrejos, el caldo de pescado o sal, programe 5 minutos, 100° velocidad 6 y baje la velocidad de forma progresiva hasta 3. Añada la nata, el brandy y el tabasco. Triture a velocidad 8. Rectifique la sal a su gusto. Cuele la crema y sirva caliente.","Para que quede a su gusto de cremosidad, puedes añadir un poco de agua y remover a velocidad 3. También puedes añadir unas varitas de cangrejo troceadas."]},{"categoria":"CREMAS","titulo":"Crema de Coliflor y Brécol (asun)","raciones":"4 personas","racionesBase":4,"tiempo":"40 minutos","ingredientes":[{"texto":"Sofrito: 50 g de aceite de oliva virgen extra, 200 g de puerro (sólo la parte blanca) en rodajas, 2 dientes de ajo","cantidad":null,"resto":"Sofrito: 50 g de aceite de oliva virgen extra, 200 g de puerro (sólo la parte blanca) en rodajas, 2 dientes de ajo","escalable":false},{"texto":"Resto: 700 g de agua, 400 g de coliflor en ramitos pequeños (quitando la parte dura), 200 g de brécol en ramitos pequeños (quitando la parte dura), 2 pastillas de caldo o sal, pimienta","cantidad":null,"resto":"Resto: 700 g de agua, 400 g de coliflor en ramitos pequeños (quitando la parte dura), 200 g de brécol en ramitos pequeños (quitando la parte dura), 2 pastillas de caldo o sal, pimienta","escalable":false}],"elaboracion":["Eche los puerros y los ajos en el vaso y trocéelos 8 segundos en velocidad 3 y ½. Añada el aceite y programe 7 minutos, 100°, velocidad 1. Incorpore el agua y triture 1 minuto en velocidad máxima. Agregue la coliflor, el brécol y los condimentos y programe 25 minutos, temperatura Varoma, velocidad 1.","Por último, cuando acabe el tiempo añada 2 cubos más de agua y triture durante 1 minuto en velocidad máxima. Rectifique la sazón (puede añadir más agua si lo desea y si no está perfectamente triturado, triturar de nuevo).","Sirva la crema muy caliente o fría poniéndole una rodaja de huevo duro de adorno.","Sugerencia: si lo desea, a la vez que se hace la crema en temperatura Varoma, puede poner ramitos de coliflor y brécol en el recipiente Varoma para que se hagan al tiempo y después ponerlos en cada plato como adorno."]},{"categoria":"CREMAS","titulo":"Crema de Espárragos (asun)","raciones":"6 personas","racionesBase":6,"tiempo":"50 minutos","ingredientes":[{"texto":"1 manojo de espárragos verdes","cantidad":1.0,"resto":"manojo de espárragos verdes","escalable":true,"modo":"simple"},{"texto":"250 g de patatas en trozos pequeños","cantidad":250.0,"resto":"g de patatas en trozos pequeños","escalable":true,"modo":"simple"},{"texto":"50 g de aceite de oliva virgen extra","cantidad":50.0,"resto":"g de aceite de oliva virgen extra","escalable":true,"modo":"simple"},{"texto":"200 g de puerros cortados en rodajas (sólo la parte blanca)","cantidad":200.0,"resto":"g de puerros cortados en rodajas (sólo la parte blanca)","escalable":true,"modo":"simple"},{"texto":"2 dientes de ajo","cantidad":2.0,"resto":"dientes de ajo","escalable":true,"modo":"simple"},{"texto":"2 pastillas de caldo o sal","cantidad":2.0,"resto":"pastillas de caldo o sal","escalable":true,"modo":"simple"},{"texto":"1 bote de leche evaporada ideal de nestlé, de 410 g","cantidad":1.0,"resto":"bote de leche evaporada ideal de nestlé, de 410 g","escalable":true,"modo":"simple"},{"texto":"1 l de agua, aproximadamente","cantidad":1.0,"resto":"l de agua, aproximadamente","escalable":true,"modo":"simple"},{"texto":"Pimienta al gusto","cantidad":null,"resto":"Pimienta al gusto","escalable":false}],"elaboracion":["Arquee los espárragos para que se partan por la parte blanda. Eche la parte dura de los espárragos y el agua en el vaso del Thermomix y tritúrelos primero en velocidad 6 y luego en velocidad máxima. A continuación programe 10 minutos, 100°, velocidad 4. Cuele a través de un colador fino. Reserve el agua y tire los restos que hayan quedado en el colador.","A continuación ponga en el vaso los puerros partidos en rodajas y los ajos, trocéelos 10 segundos en velocidad 3 y ½. Incorpore el aceite, baje con la espátula los restos que hayan quedado en las paredes del vaso, cierre y programe 7 minutos, 100°, velocidad 1.","Añada la leche y programe 30 segundos en velocidad 6 y otros 30 segundos en velocidad 9 para que se triture todo bien.","Por último, agregue el agua reservada, las patatas troceadas, los calditos o sal y la parte blanda de los espárragos cortados en rodajas pequeñas (incluidas las puntas). Ponga pimienta y programe 25 minutos, 100°, velocidad 1.","Rectifique la sazón y añada más agua si es necesario.","Sugerencia: si lo desea, puede reservar la crema en el frigorífico y servirla fría. También puede utilizar espárragos blancos."]},{"categoria":"CREMAS","titulo":"Crema de Fiesta (asun)","raciones":"6 personas","racionesBase":6,"tiempo":"40 minutos","ingredientes":[{"texto":"70 g de aceite de oliva","cantidad":70.0,"resto":"g de aceite de oliva","escalable":true,"modo":"simple"},{"texto":"3 dientes de ajo grandes (unos 20 gr.)","cantidad":3.0,"resto":"dientes de ajo grandes (unos 20 gr.)","escalable":true,"modo":"simple"},{"texto":"1 litro de agua","cantidad":1.0,"resto":"litro de agua","escalable":true,"modo":"simple"},{"texto":"1 kg de patatas peladas y troceadas","cantidad":1.0,"resto":"kg de patatas peladas y troceadas","escalable":true,"modo":"simple"},{"texto":"2 y ½ pastillas de caldo de pescado o sal","cantidad":2.5,"resto":"pastillas de caldo de pescado o sal","escalable":true,"modo":"simple"},{"texto":"Pimienta recién molida al gusto","cantidad":null,"resto":"Pimienta recién molida al gusto","escalable":false},{"texto":"1 latita de nata para cocinar \"La Lechera\" de Nestlé o 200 g de nata líquida (opcional). En su defecto puede poner 200 g de agua","cantidad":1.0,"resto":"latita de nata para cocinar \"La Lechera\" de Nestlé o 200 g de nata líquida (opcional). En su defecto puede poner 200 g de agua","escalable":true,"modo":"simple"},{"texto":"100 g de anguila ahumada (preferiblemente), u otro ahumado","cantidad":100.0,"resto":"g de anguila ahumada (preferiblemente), u otro ahumado","escalable":true,"modo":"simple"},{"texto":"50 g de caviar de mújol","cantidad":50.0,"resto":"g de caviar de mújol","escalable":true,"modo":"simple"}],"elaboracion":["Vierta el aceite en el vaso y programe 3 minutos, temperatura Varoma, velocidad 1. Añada los ajos y programe 3 minutos, temperatura Varoma, velocidad 4. Incorpore el agua, las patatas, las pastillas de caldo o la sal y la pimienta. Programe 30 minutos, temperatura Varoma, velocidad 1. (Ponga el cestillo invertido sobre la tapadera, en lugar del cubilete, para evitar salpicaduras). Cuando termine, triture durante 30 segundos en velocidad 3. Si lo desea puede añadirle la nata o 200 g más de agua.","Salpimiente y ponga por encima la anguila troceándola previamente con unas tijeras, mezclando bien con la espátula. Sirva en taza de consomé, bien caliente, y ponga encima una cucharadita de caviar de mújol.","Nota: para que el puré le quede perfecto, triture en velocidad 3, tal y como le indicamos, pues de lo contrario le quedará chicloso."]},{"categoria":"CREMAS","titulo":"Crema de Foie (asun)","raciones":"6 personas","racionesBase":6,"tiempo":"20 minutos","ingredientes":[{"texto":"50 ó 60 g de copos de patata deshidratada","cantidad":50.0,"resto":"ó 60 g de copos de patata deshidratada","escalable":true,"modo":"simple"},{"texto":"1 litro y medio de leche","cantidad":1.0,"resto":"litro y medio de leche","escalable":true,"modo":"simple"},{"texto":"1 cucharadita de Bovril","cantidad":1.0,"resto":"cucharadita de Bovril","escalable":true,"modo":"simple"},{"texto":"100 g de foie de pato o de oca","cantidad":100.0,"resto":"g de foie de pato o de oca","escalable":true,"modo":"simple"},{"texto":"1 decilitro de nata líquida","cantidad":1.0,"resto":"decilitro de nata líquida","escalable":true,"modo":"simple"},{"texto":"1 lata de trufas (optativo)","cantidad":1.0,"resto":"lata de trufas (optativo)","escalable":true,"modo":"simple"},{"texto":"Sal, pimienta blanca y nuez moscada al gusto","cantidad":null,"resto":"Sal, pimienta blanca y nuez moscada al gusto","escalable":false}],"elaboracion":["Poner todos los ingredientes de la receta en el vaso del Thermomix, pero con muy pequeña cantidad de leche, unos 3 decilitros nada más, para que ésta al cocer no se salga.","Programar 100° y velocidad 1 durante unos 8-10 minutos, hasta que salga vapor por el cubilete.","Añadir el resto de la leche y volver a calentar a 80 ó 90° para que no llegue a cocer y evitar que no se salga.","Se puede variar la consistencia y la textura según el gusto de cada uno. Suprimiendo la nata y haciéndola sólo con leche, no sale tan cremosa.","Presentación: en unas bonitas tazas de consomé, espolvoreado con las trufas muy picaditas, y utilizar el caldo de estas en la elaboración de la crema.","Si se quiere abaratar la receta se puede sustituir el foie por un buen paté o por foie gras, aunque no sale tan exquisito."]},{"categoria":"CREMAS","titulo":"Crema de Gambas y Calabacín (asun)","raciones":"4 personas","racionesBase":4,"tiempo":"40 minutos","ingredientes":[{"texto":"Para la crema: 200 g de gambas pequeñas, 1 cucharada de mantequilla, 1 cucharada de aceite, 2 puerros (sólo la parte blanca), ¼ de cebolla, 1 calabacín, medio cubilete de nata, 2 cubiletes de agua, sal y pimienta al gusto","cantidad":null,"resto":"Para la crema: 200 g de gambas pequeñas, 1 cucharada de mantequilla, 1 cucharada de aceite, 2 puerros (sólo la parte blanca), ¼ de cebolla, 1 calabacín, medio cubilete de nata, 2 cubiletes de agua, sal y pimienta al gusto","escalable":false},{"texto":"Para el fumet: las cabezas y pieles de las gambas, ½ cubilete de coñac, 2 cubiletes de agua","cantidad":null,"resto":"Para el fumet: las cabezas y pieles de las gambas, ½ cubilete de coñac, 2 cubiletes de agua","escalable":false}],"elaboracion":["Separa las pieles y las cabezas de las gambas. Reserva los cuerpos.","Pon en el vaso todos los ingredientes del fumet menos el agua, programa a velocidad 5, 100°, 5 minutos. Cuando falte 1 minuto para finalizar el tiempo se añade el agua por el bocal. Cuela y reserva. A continuación se enjuaga el vaso y se echa el aceite, la mantequilla, los puerros y la cebolla, se programa velocidad 5, 100°, 7 minutos. Se añade el calabacín troceado, la sal y dos cubiletes de agua, se programa velocidad 5, 100°, 10 minutos.","Pasado el tiempo se añade el concentrado del fumet y la nata, se pone velocidad 1, 100° durante 5 minutos.","Por último se añade por el bocal los cuerpos de las gambas y se pone 3 minutos todo a 100° y velocidad 1."]},{"categoria":"CREMAS","titulo":"Crema de Garbanzos (asun)","raciones":"4 personas","racionesBase":4,"tiempo":"15 minutos","ingredientes":[{"texto":"¼ de garbanzos cocidos","cantidad":0.25,"resto":"de garbanzos cocidos","escalable":true,"modo":"simple"},{"texto":"100 gr de beicon","cantidad":100.0,"resto":"gr de beicon","escalable":true,"modo":"simple"},{"texto":"1 diente de ajo","cantidad":1.0,"resto":"diente de ajo","escalable":true,"modo":"simple"},{"texto":"½ cubilete de aceite","cantidad":0.5,"resto":"cubilete de aceite","escalable":true,"modo":"simple"},{"texto":"1 cebolla pequeña","cantidad":1.0,"resto":"cebolla pequeña","escalable":true,"modo":"simple"},{"texto":"2 cubiletes de agua","cantidad":2.0,"resto":"cubiletes de agua","escalable":true,"modo":"simple"},{"texto":"1 pastilla de caldo de carne","cantidad":1.0,"resto":"pastilla de caldo de carne","escalable":true,"modo":"simple"}],"elaboracion":["Poner en el vaso el aceite, el beicon y la cebolla. Programar velocidad 8, 3 minutos a 100°. Añadir los demás ingredientes junto con el agua y programar velocidad 8 a 100° 5 minutos."]},{"categoria":"CREMAS","titulo":"Crema de Mejillones (asun)","raciones":"6 personas","racionesBase":6,"tiempo":"50 minutos","ingredientes":[{"texto":"Para el recipiente Varoma: 1 kg y cuarto de mejillones frescos, ½ l. de agua","cantidad":null,"resto":"Para el recipiente Varoma: 1 kg y cuarto de mejillones frescos, ½ l. de agua","escalable":false},{"texto":"Sofrito: 150 g de puerro (sólo la parte blanca), 50 g de aceite, 3 dientes de ajo, 150 g de tomate natural triturado, 1 manzana verde Granny Smith, pelada y sin corazón","cantidad":null,"resto":"Sofrito: 150 g de puerro (sólo la parte blanca), 50 g de aceite, 3 dientes de ajo, 150 g de tomate natural triturado, 1 manzana verde Granny Smith, pelada y sin corazón","escalable":false},{"texto":"Resto: 100 g de biscotes de pan, 50 g de anís seco (o Pernod), 2 pastillas de caldo de pescado, pimienta recién molida, el agua que admita hasta llenar el vaso","cantidad":null,"resto":"Resto: 100 g de biscotes de pan, 50 g de anís seco (o Pernod), 2 pastillas de caldo de pescado, pimienta recién molida, el agua que admita hasta llenar el vaso","escalable":false},{"texto":"Para servir: 6 mejillones que habremos reservado, unos tomatitos cherry partidos en rodajitas","cantidad":null,"resto":"Para servir: 6 mejillones que habremos reservado, unos tomatitos cherry partidos en rodajitas","escalable":false}],"elaboracion":["Limpie los mejillones y deposítelos en el recipiente Varoma. Reserve.","Ponga en el vaso de la Thermomix ½ l. de agua y programe 6 min., temp. Varoma, vel. 2. Cuando acabe, coloque el recipiente Varoma sobre la tapadera y programe 12 min. temp. Varoma, vel. 2.","Acabado el tiempo, saque y reserve el líquido del vaso. Saque los mejillones de su concha quitándoles el borde negro que les rodea. Resérvelos, separando 6 de ellos para servir.","Ponga en el vaso los ingredientes del sofrito y programe 10 seg. vel. 5. Baje lo que haya quedado en las paredes con la espátula y vuelva a programar 10 min. temp. Varoma, vel. 2. Cuando termine, añada los mejillones, los biscotes, el anís, y un poco del agua reservada y programe 2 min. en vel. 9 para que se triture bien.","Baje los restos de las paredes con la espátula y añada el resto del líquido, los calditos, y la pimienta, mezcle 30 seg. en vel. 9. A continuación, programe 10 min. temp. Varoma, vel. 2.","Cuando termine añada agua hasta llenar el vaso y mezcle 20 seg. en vel. 6. Rectifique la sazón.","Para servirlo trocee los mejillones dejándolos menuditos, eche la crema en tazas de consomé, ponga en el centro un biscote pequeño y sobre él una rodajita de tomate con trocitos de mejillón por encima. Sírvalo muy caliente.","Nota: también puede espolvorear con perejil picado si lo desea."]},{"categoria":"CREMAS","titulo":"Crema de Naranja (asun)","raciones":"4 personas","racionesBase":4,"tiempo":"40 minutos","ingredientes":[{"texto":"2 naranjas","cantidad":2.0,"resto":"naranjas","escalable":true,"modo":"simple"},{"texto":"400 g de zanahorias","cantidad":400.0,"resto":"g de zanahorias","escalable":true,"modo":"simple"},{"texto":"1 cebolla","cantidad":1.0,"resto":"cebolla","escalable":true,"modo":"simple"},{"texto":"750 g de caldo vegetal","cantidad":750.0,"resto":"g de caldo vegetal","escalable":true,"modo":"simple"},{"texto":"1 cucharada de cilantro","cantidad":1.0,"resto":"cucharada de cilantro","escalable":true,"modo":"simple"},{"texto":"Pimienta negra recién molida al gusto","cantidad":null,"resto":"Pimienta negra recién molida al gusto","escalable":false},{"texto":"1 cucharada de aceite","cantidad":1.0,"resto":"cucharada de aceite","escalable":true,"modo":"simple"},{"texto":"Sal al gusto","cantidad":null,"resto":"Sal al gusto","escalable":false}],"elaboracion":["Picar la cebolla y las zanahorias en velocidad 3 y ½ durante 6 segundos.","Poner un chorrito (poquito) de aceite y programar 5 minutos temperatura varoma, velocidad 1.","Añadir la naranja picada, el caldo vegetal, la pimienta negra y la sal, y programar 30 minutos velocidad 1, temp. 100.","Una vez cocido, poner la máquina en velocidad 5-7-9 progresivo para hacer la crema.","Servir adornada de cilantro picado."]},{"categoria":"CREMAS","titulo":"Crema de Necoras (asun)","raciones":"6 personas","racionesBase":6,"tiempo":"45 minutos","ingredientes":[{"texto":"Para el paté: ½ kg de cangrejos o necoras, ¼ de gambas, ½ de mejillones, 2 varitas de sucedáneo, ¼ parte de cebolla, 1 diente de ajo, ½ cubilete de salsa de tomate o 1 tomate, 2 ramitas de perejil, 1 pastilla de avecrem, 1 cucharada de harina, 3 cucharadas de pan rallado, 70 g de aceite","cantidad":null,"resto":"Para el paté: ½ kg de cangrejos o necoras, ¼ de gambas, ½ de mejillones, 2 varitas de sucedáneo, ¼ parte de cebolla, 1 diente de ajo, ½ cubilete de salsa de tomate o 1 tomate, 2 ramitas de perejil, 1 pastilla de avecrem, 1 cucharada de harina, 3 cucharadas de pan rallado, 70 g de aceite","escalable":false},{"texto":"Para la crema: agua al gusto, 70 a 100 g de nata, ½ cubilete de sofrito de tomate","cantidad":null,"resto":"Para la crema: agua al gusto, 70 a 100 g de nata, ½ cubilete de sofrito de tomate","escalable":false}],"elaboracion":["1ª opción: triturar los cangrejos, junto con las cabezas y pieles de gambas y pasarlos por un colador grande ayudándonos con el líquido de abrir al vapor los mejillones (trituración durante pocos segundos aprox. 10 a 15 dependiendo que sean cangrejos o necoras, si trituramos en exceso se nos colarán cascarillas).","2ª opción: preparar un fumet con las pieles y cabezas de las gambas junto con 150 g de agua 5' 100° v 5, con este líquido y el de los mejillones nos ayudamos a colar. Trituración: preparamos el sofrito con el aceite, cebolla, ajo, perejil 3' 100° v5, añadimos el tomate y sofreímos 3' 100° v5. Al pasar este tiempo ponemos el resto de los ingredientes (la crema de los cangrejos, las gambas, las varitas, los mejillones, el avecrem, la harina y el pan rallado), salpimentamos y programamos 10' 100° v5.","CREMA: a la preparación anterior le añadimos agua al gusto, la nata y el sofrito de tomate, salpimentando al gusto programamos 5' 100° v3.","Notas: es un poco laboriosa pero está de muerte y quedaréis como auténticas profesionales de la cocina."]},{"categoria":"CREMAS","titulo":"Crema de Patatas y Calabaza (asun)","raciones":"4 personas","racionesBase":4,"tiempo":"40 minutos","ingredientes":[{"texto":"400 g de calabaza","cantidad":400.0,"resto":"g de calabaza","escalable":true,"modo":"simple"},{"texto":"300 g de patatas","cantidad":300.0,"resto":"g de patatas","escalable":true,"modo":"simple"},{"texto":"2 medidas de agua de la cocción","cantidad":2.0,"resto":"medidas de agua de la cocción","escalable":true,"modo":"simple"},{"texto":"2 medidas de leche","cantidad":2.0,"resto":"medidas de leche","escalable":true,"modo":"simple"},{"texto":"1 cucharadita de hierbas provenzales","cantidad":1.0,"resto":"cucharadita de hierbas provenzales","escalable":true,"modo":"simple"},{"texto":"Sal y pimienta al gusto","cantidad":null,"resto":"Sal y pimienta al gusto","escalable":false}],"elaboracion":["Corta las patatas y la calabaza a trozos. Ponlos dentro del Iber Gourmet y cúbrelo con agua. Programa 30 minutos, temperatura máxima, sin velocidad.","Cuela en el cestillo las patatas y la calabaza y reserva dos medidas de agua de la cocción. A continuación vuelve a colocar las patatas y las calabazas. Añade el resto de ingredientes y programa 2 minutos, a la máxima velocidad. Rectifica de sal y comprueba que esté todo bien triturado.","Sirve en soperas individuales bien caliente."]},{"categoria":"CREMAS","titulo":"Crema de Pimientos (asun)","raciones":"4 personas","racionesBase":4,"tiempo":"50 minutos","ingredientes":[{"texto":"5 pimientos rojos enteros (asados en el horno)","cantidad":5.0,"resto":"pimientos rojos enteros (asados en el horno)","escalable":true,"modo":"simple"},{"texto":"Media cebolla (opcional) en trozos grandes","cantidad":null,"resto":"Media cebolla (opcional) en trozos grandes","escalable":false},{"texto":"Medio litro de nata","cantidad":null,"resto":"Medio litro de nata","escalable":false},{"texto":"1 Pastilla de caldo","cantidad":1.0,"resto":"Pastilla de caldo","escalable":true,"modo":"simple"}],"elaboracion":["Asar en el horno, precalentado a 200°C, 5 pimientos rojos (enteros) y media cebolla (opcional) en trozos grandes, durante 30-40 minutos, hasta que la piel esté ennegrecida.","Sacar los pimientos del horno y pelarlos, quitando las pepitas.","Meter en la Thermomix los pimientos, la cebolla, 1 pastilla de caldo, 5-6 minutos, 100°C, velocidad 4.","Cuando falte 1 minuto, echar medio litro de nata.","Esta receta es de: Pepe Cubas."]},{"categoria":"CREMAS","titulo":"Crema de Tomate y Zanahoria (asun)","raciones":"6 personas","racionesBase":6,"tiempo":"35 minutos","ingredientes":[{"texto":"1 cucharada de mantequilla","cantidad":1.0,"resto":"cucharada de mantequilla","escalable":true,"modo":"simple"},{"texto":"¾ cubilete de aceite","cantidad":0.75,"resto":"cubilete de aceite","escalable":true,"modo":"simple"},{"texto":"2 puerros, sólo la parte blanca","cantidad":2.0,"resto":"puerros, sólo la parte blanca" n":["Poner los tomates en el vaso de la thermomix y triturar al 5,7,9 durante unos 30 segundos, cuando termine le pone el zumo del limón, un poco de sal de apio, los dos yogures y luego le echas sal y pimienta a tu gusto."]},{"categoria":"GAZPACHOS Y CREMAS FRÍAS","titulo":"Vichyssoise (asun)","raciones":"6 personas","racionesBase":6,"tiempo":"30 min","ingredientes":[{"texto":"4 puerros (sólo la parte blanca)","cantidad":4.0,"resto":"puerros (sólo la parte blanca)","escalable":true,"modo":"simple"},{"texto":"2 cucharadas de aceite","cantidad":2.0,"resto":"cucharadas de aceite","escalable":true,"modo":"simple"},{"texto":"2 cucharadas colmadas de mantequilla","cantidad":2.0,"resto":"cucharadas colmadas de mantequilla","escalable":true,"modo":"simple"},{"texto":"1 bote de leche evaporada o nata líquida","cantidad":1.0,"resto":"bote de leche evaporada o nata líquida","escalable":true,"modo":"simple"},{"texto":"6 medidas de agua o leche","cantidad":6.0,"resto":"medidas de agua o leche","escalable":true,"modo":"simple"},{"texto":"2 patatas medianas troceadas","cantidad":2.0,"resto":"patatas medianas troceadas","escalable":true,"modo":"simple"},{"texto":"2 pastillas de caldo de ave (opcional) o sal","cantidad":2.0,"resto":"pastillas de caldo de ave (opcional) o sal","escalable":true,"modo":"simple"},{"texto":"Pimienta al gusto","cantidad":null,"resto":"Pimienta al gusto","escalable":false}],"elaboracion":["En el vaso, triture los puerros pasando progresivamente por todas las velocidades hasta llegar a la máxima. A continuación añada la mantequilla y el aceite, y programe velocidad 1, temperatura 100°, durante 8 minutos.","Cuando pare, añada las patatas, la leche evaporada, las pastillas de caldo, un poco de pimienta y 3 medidas de agua o leche. De nuevo programe velocidad 1, temperatura 100° durante 20 minutos. Añada el resto de agua o leche si la quiere más líquida, y programe unos segundos a velocidad 1.","Sugerencia: se sirve con daditos de pan frito. Se puede tomar fría o caliente."]},{"categoria":"PURÉS","titulo":"Puré de Berenjenas (asun)","raciones":"4 personas","racionesBase":4,"tiempo":"45 min","ingredientes":[{"texto":"Berenjenas (la cantidad: las que os quepan)","cantidad":null,"resto":"Berenjenas (la cantidad: las que os quepan)","escalable":false},{"texto":"Ajos al gusto","cantidad":null,"resto":"Ajos al gusto","escalable":false},{"texto":"3 cucharadas de aceite","cantidad":3.0,"resto":"cucharadas de aceite","escalable":true,"modo":"simple"},{"texto":"Sal y especias al gusto (comino, picante)","cantidad":null,"resto":"Sal y especias al gusto (comino, picante)","escalable":false}],"elaboracion":["Hervir berenjenas en el cestillo (la cantidad: las que os quepan) hasta que queden blandas, aprox. 20 minutos.","Colar el agua. Secar el vaso. Calentar aceite a temperatura Varoma y añadir por el bocal a velocidad 8, unos cuantos ajos (la cantidad: según vuestro gusto). Poner velocidad 2 y echar las berenjenas.","Añadir sal y especias al gusto (yo eché cominos y un poco de picante). Dejar unos 15 minutos y comerlo con pan de pita tostado en el horno a 180°C durante 4-5 minutos, hasta que esté crujiente."]},{"categoria":"PURÉS","titulo":"Purés de Frutas (asun)","raciones":"3 raciones (potitos de bebé)","racionesBase":3,"tiempo":"10 min","ingredientes":[{"texto":"Fruta 1: ½ plátano maduro, ⅓ naranja pelada (sin parte blanca), ⅓ manzana madura y zumo de limón","cantidad":null,"resto":"Fruta 1: ½ plátano maduro, ⅓ naranja pelada (sin parte blanca), ⅓ manzana madura y zumo de limón","escalable":false},{"texto":"Fruta 2: 1 plátano maduro, 1 pera madura, 1 naranja de zumo bien pelada","cantidad":null,"resto":"Fruta 2: 1 plátano maduro, 1 pera madura, 1 naranja de zumo bien pelada","escalable":false},{"texto":"Fruta 3: 1 yogur natural, 2 frutas a elegir, 3 galletas","cantidad":null,"resto":"Fruta 3: 1 yogur natural, 2 frutas a elegir, 3 galletas","escalable":false}],"elaboracion":["Para cada combinación: 3 minutos, temperatura 40°, velocidad 4."]},{"categoria":"PURÉS","titulo":"Puré de Calabaza y Patata (asun)","raciones":"4 personas","racionesBase":4,"tiempo":"35 min","ingredientes":[{"texto":"500 g de calabaza pelada y cortada en trocitos","cantidad":500.0,"resto":"g de calabaza pelada y cortada en trocitos","escalable":true,"modo":"simple"},{"texto":"300 g de patata pelada y cortada en trocitos","cantidad":300.0,"resto":"g de patata pelada y cortada en trocitos","escalable":true,"modo":"simple"},{"texto":"1 cebolla grande","cantidad":1.0,"resto":"cebolla grande","escalable":true,"modo":"simple"},{"texto":"40 g de aceite de oliva","cantidad":40.0,"resto":"g de aceite de oliva","escalable":true,"modo":"simple"},{"texto":"100 g (un cubilete) de leche","cantidad":100.0,"resto":"g (un cubilete) de leche","escalable":true,"modo":"simple"},{"texto":"Sal (a gusto)","cantidad":null,"resto":"Sal (a gusto)","escalable":false}],"elaboracion":["Pelar la cebolla y partirla en cuatro trozos, echar en el vaso y trocear 6 segundos a velocidad 3 y ½. Añadir el aceite y programar 3 minutos, 100° velocidad 1.","Poner la mariposa en las cuchillas y echar la calabaza y patata, la leche y la sal. Programar 20 minutos, 100°, velocidad 1.","Al terminar, quitar la mariposa y batir 15 segundos a velocidad 6 (con cuidado y manteniendo el vaso tapado para no quemarnos)."]},{"categoria":"PURÉS","titulo":"Puré de Zanahoria (asun)","raciones":"4 personas","racionesBase":4,"tiempo":"40 min","ingredientes":[{"texto":"500 g de zanahorias","cantidad":500.0,"resto":"g de zanahorias","escalable":true,"modo":"simple"},{"texto":"200 g de coliflor","cantidad":200.0,"resto":"g de coliflor","escalable":true,"modo":"simple"},{"texto":"Una patata mediana","cantidad":null,"resto":"Una patata mediana","escalable":false},{"texto":"Una cebolla mediana","cantidad":null,"resto":"Una cebolla mediana","escalable":false},{"texto":"50 g de aceite","cantidad":50.0,"resto":"g de aceite","escalable":true,"modo":"simple"},{"texto":"750 g de agua","cantidad":750.0,"resto":"g de agua","escalable":true,"modo":"simple"},{"texto":"Una pastilla de caldo de verduras o sal","cantidad":null,"resto":"Una pastilla de caldo de verduras o sal","escalable":false},{"texto":"Pimienta al gusto","cantidad":null,"resto":"Pimienta al gusto","escalable":false},{"texto":"Una pizca de nuez moscada","cantidad":null,"resto":"Una pizca de nuez moscada","escalable":false}],"elaboracion":["Poner el aceite en el vaso 3\" Varoma velocidad 1. Añadir la cebolla 2\" Varoma velocidad 1. Triturar a 3/5 unos segundos.","Poner la mariposa en las cuchillas y añadir el resto de los ingredientes, 30\" 100° velocidad 1 (se puede poner en Varoma para que evapore líquido, depende del gusto).","Quitar la mariposa, y triturar 30 segundos 5-7-9.","Observaciones: yo utilicé las zanahorias y coliflor congeladas, ya que por mi horario me es imposible comprar muy a diario, si son frescas se puede reducir el tiempo de cocción."]},{"categoria":"PURÉS","titulo":"Puré de Remolacha Asada con Mousse de Queso Mascarpone (asun)","raciones":"4 personas","racionesBase":4,"tiempo":"30 min (+ 3 h 30 min en el horno)","ingredientes":[{"texto":"300 g de remolacha","cantidad":300.0,"resto":"g de remolacha","escalable":true,"modo":"simple"},{"texto":"100 gr de aceite de oliva","cantidad":100.0,"resto":"gr de aceite de oliva","escalable":true,"modo":"simple"},{"texto":"40 g de queso Mascarpone","cantidad":40.0,"resto":"g de queso Mascarpone","escalable":true,"modo":"simple"},{"texto":"5 g de nata líquida","cantidad":5.0,"resto":"g de nata líquida","escalable":true,"modo":"simple"},{"texto":"Una pizca de pimienta de sechuan","cantidad":null,"resto":"Una pizca de pimienta de sechuan","escalable":false},{"texto":"Sal al gusto","cantidad":null,"resto":"Sal al gusto","escalable":false},{"texto":"1 cucharada de ciboulette picado","cantidad":1.0,"resto":"cucharada de ciboulette picado","escalable":true,"modo":"simple"},{"texto":"1 cucharadita de sésamo","cantidad":1.0,"resto":"cucharadita de sésamo","escalable":true,"modo":"simple"}],"elaboracion":["Cortar los tallos de la remolacha, lavarlas exhaustivamente y envolverlas en papel de aluminio (previamente untado con aceite para que no se adhieran en la cocción). Precalentar un horno a 100 grados, y cocer las remolachas durante 3 horas y media (también posible una cocción más rápida a mayor temperatura, pero es más aconsejable cocerla más tiempo y a menor temperatura, queda más tierna).","Retirar las remolachas del horno, retirarles el papel de aluminio. Pelarlas (mejor en caliente) y cortarlas en 4 partes aproximadamente.","Ponemos la remolacha en el vaso del Thermomix y le daremos unos golpes de turbo, añadiendo un poco de agua mineral progresivamente para que sea posible el triturado. Programamos 5-7-9. Una vez triturada y emulsionada la remolacha, la podemos colar por un tamiz o por el cestillo, para eliminar grumos e impurezas. Rectificamos de sal y pimienta.","Reservamos en frío hasta el momento de servir.","A continuación haremos en la Thermomix una mousse de Mascarpone: montaremos la nata, junto con el queso crema, el mascarpone, programando velocidad 3-4 durante 2-3 minutos aproximadamente (vigilando para no pasarnos y que la nata llegue a cortarse). Emulsionaremos hasta lograr una textura densa, que tenga cuerpo y se mantenga en el plato o copa. Salpimentamos igualmente de sal y pimienta. El cebollino lo picaremos muy finamente.","Montaremos la copa: rellenaremos un biberón dosificador con la crema de remolacha. Usaremos para el montaje una copa de cóctel o un vaso de chupito. Rellenaremos la mitad de la copa con el puré de remolacha (ayudándonos del biberón) y sobre ella colocaremos la mousse de mascarpone. Por último decoraremos con cebollino picado, pimienta de sechouan y sésamo."]},{"categoria":"PURÉS","titulo":"Potitos (asun) (variantes 5 a 9)","raciones":"5 potitos individuales","racionesBase":5,"tiempo":"30 min","ingredientes":[{"texto":"Potito 5: 100 g zanahoria, un poco de apio, ucharada de aceite en crudo al final, mezclando unos segundos más."]},{"categoria":"ARROCES","titulo":"Risotto de Verduras y Setas (mar)","raciones":"4 personas","racionesBase":4,"tiempo":"35 min","ingredientes":[{"texto":"400 gr arroz","cantidad":400.0,"resto":"gr arroz","escalable":true,"modo":"simple"},{"texto":"1-2 cebolletas","cantidad":1.0,"cantidad2":2.0,"resto":"cebolletas","escalable":true,"modo":"rango"},{"texto":"1 zanahoria","cantidad":1.0,"resto":"zanahoria","escalable":true,"modo":"simple"},{"texto":"1 puerro hermoso","cantidad":1.0,"resto":"puerro hermoso","escalable":true,"modo":"simple"},{"texto":"500 gr setas (variadas si es posible)","cantidad":500.0,"resto":"gr setas (variadas si es posible)","escalable":true,"modo":"simple"},{"texto":"1 litro de caldo de verduras caliente","cantidad":1.0,"resto":"litro de caldo de verduras caliente","escalable":true,"modo":"simple"}],"elaboracion":["Se van rehogando todas las verduras en una paellera con aceite, a fuego medio, removiendo de vez en cuando, hasta que estén blanditas, unos 8-10 minutos. Luego se añaden las setas, que también se rehogan unos 3-4 minutos hasta que suelten el agua y se doren un poco. Al final se añade el arroz, rehogándolo también un par de minutos para que se impregne bien de todo.","En una cazuela aparte tenemos el caldo de verduras caliente y se lo vamos añadiendo al arroz poco a poco, removiendo sin parar y dejando que se absorba antes de añadir el siguiente cucharón. Se mantiene el fuego medio-bajo durante unos 18-20 minutos, hasta que el arroz esté en su punto. Tiene que quedar caldoso, espeso."]},{"categoria":"ARROCES","titulo":"Risotto a la Milanesa (diegodoal)","raciones":"4 personas","racionesBase":4,"tiempo":"35 min","ingredientes":[{"texto":"1,5 litros de caldo de ternera","cantidad":1.5,"resto":"litros de caldo de ternera","escalable":true,"modo":"simple"},{"texto":"1 hoja de laurel","cantidad":1.0,"resto":"hoja de laurel","escalable":true,"modo":"simple"},{"texto":"Unos  antes en el propio caldo de pollo o verduras","escalable":true,"modo":"simple"},{"texto":"1,5 l de caldo de pollo (o de verduras)","cantidad":1.5,"resto":"l de caldo de pollo (o de verduras)","escalable":true,"modo":"simple"},{"texto":"100 g de cebolla, picada fina","cantidad":100.0,"resto":"g de cebolla, picada fina","escalable":true,"modo":"simple"},{"texto":"50 g de mantequilla","cantidad":50.0,"resto":"g de mantequilla","escalable":true,"modo":"simple"},{"texto":"Un chorrito de aceite de oliva virgen extra","cantidad":null,"resto":"Un chorrito de aceite de oliva virgen extra","escalable":false},{"texto":"150 g de vino blanco","cantidad":150.0,"resto":"g de vino blanco","escalable":true,"modo":"simple"},{"texto":"100 g de queso parmesano rallado","cantidad":100.0,"resto":"g de queso parmesano rallado","escalable":true,"modo":"simple"},{"texto":"75 g de nata líquida","cantidad":75.0,"resto":"g de nata líquida","escalable":true,"modo":"simple"},{"texto":"Sal y pimienta negra al gusto","cantidad":null,"resto":"Sal y pimienta negra al gusto","escalable":false}],"elaboracion":["Poner el caldo de pollo (o verduras) a calentar en una cazuela aparte, a fuego suave, y mantenerlo caliente (nunca frío) durante toda la elaboración: añadir caldo frío al arroz corta la cocción y estropea la textura cremosa del risotto. Si las setas son deshidratadas, hidratarlas primero en un cazo aparte con un poco de ese mismo caldo caliente durante al menos 20-30 minutos, hasta que estén blandas; escurrirlas bien reservando ese líquido de hidratación (que se puede colar y añadir también al caldo, aporta muchísimo sabor) y trocearlas.","En una sartén o cazuela amplia y de fondo grueso, rehogar la cebolla muy picada con la mitad de la mantequilla y un chorrito de aceite de oliva a fuego suave, removiendo de vez en cuando, durante unos 5-6 minutos, hasta que quede blanda y transparente pero sin llegar a dorarse.","Añadir las setas limpias y troceadas, subir un poco el fuego, salpimentar y rehogar unos 8-10 minutos, hasta que suelten su agua y esta se evapore casi por completo, concentrando su sabor.","Incorporar el arroz directamente a la sartén, sin lavarlo antes (su almidón es lo que dará la cremosidad al plato), y nacararlo un par de minutos a fuego medio-alto, removiendo constantemente para que cada grano se impregne bien de la grasa y quede ligeramente translúcido por los bordes.","Añadir el vino blanco de golpe y remover sin parar hasta que se evapore el alcohol y el arroz absorba casi todo el líquido.","A partir de aquí empieza la parte que requiere más paciencia: añadir el caldo caliente poco a poco, cucharón a cucharón, sin dejar de remover con una cuchara de madera, y esperando siempre a que el arroz haya absorbido casi todo el líquido antes de añadir el siguiente cucharón. Mantener el fuego medio y este ritmo de cocción durante unos 15-16 minutos en total: el movimiento constante es lo que libera el almidón del arroz y crea la textura cremosa (la llamada 'mantecatura') típica del risotto.","Ir probando el punto del arroz hacia el final: debe quedar al dente, con un ligero mordisco en el centro del grano, y el conjunto con una consistencia melosa, ni seco ni caldoso. Retirar del fuego, añadir el resto de la mantequilla bien fría, el parmesano y la nata, y mezclar enérgicamente (esto es lo que da el brillo y la cremosidad final). Tapar y dejar reposar 2 minutos antes de servir, con unas virutas de parmesano por encima y pimienta negra recién molida."]},{"categoria":"ARROCES","titulo":"Risotto de Setas (diegodoal)","raciones":"4 personas","racionesBase":4,"tiempo":"40 min (+ 2 h de cocción del caldo)","ingredientes":[{"texto":"500 g de setas variadas","cantidad":500.0,"resto":"g de setas variadas","escalable":true,"modo":"simple"},{"texto":"Para el caldo: 1 cebolla, 2 zanahorias, 2 ramas de apio, 1 vaina de cardamomo negro, 3 granos de pimienta de Jamaica, 1 hoja de laurel","cantidad":null,"resto":"Para el caldo: 1 cebolla, 2 zanahorias, 2 ramas "simple"},{"texto":"Para terminar: 350 g de arroz","cantidad":null,"resto":"Para terminar: 350 g de arroz","escalable":false}],"elaboracion":["Ponga las almejas con agua y sal para que suelten la arena.","Eche las cáscaras de las gambas y las cabezas en el vaso del Thermomix (reserve los cuerpos para el final) y el agua del primer paso y programe 3 minutos, temperatura Varoma, velocidad 4. Mientras tanto lave bien las almejas cambiando varias veces el agua. Colóquelas en el recipiente Varoma. Coloque el recipiente sobre la tapadera y vuelva a programar 10 minutos, temperatura Varoma, velocidad 2. Procure que caiga dentro del vaso todo el jugo de las almejas. Cuando termine, reserve las almejas para el final de la receta, cuele el fumet por un colador fino y reserve el líquido.","Lave muy bien el vaso y la tapadera. Ponga en el vaso los ajos, el perejil y las pastillas de caldo del 2° paso y triture 10 segundos en velocidad 4. Añada el líquido del fumet, el agua, el zumo de limón y el azafrán y programe 30 segundos en velocidad 8. Reserve este líquido.","Ponga la mariposa en las cuchillas, eche el aceite, los ajos y el tomate del sofrito y programe 5 minutos, 100°, velocidad 1. Cuando termine, añada los champiñones y programe 5 minutos temperatura Varoma, velocidad 1. Sin abrir la máquina, incorpore a través del bocal el arroz y rehóguelo programando 2 minutos, temperatura Varoma, velocidad 1. Incorpore todo el líquido que teníamos reservado y vuelva a programar 12 min., temperatura Varoma, velocidad 1 (coloque encima de la tapadera el cestillo invertido para evitar salpicaduras).","Cuando acabe el tiempo programado, eche los cuerpos de las gambas a través del bocal y deje reposar durante un minuto dentro del vaso. Mientras tanto ponga las almejas en una fuente grande de servir. Eche el arroz sobre las mismas extendiéndolo bien y moviéndolo con la espátula para que absorba todo el líquido. Sirva.","Nota: los ingredientes son para 6 personas.","Consejo: las setas le dan al arroz mucho aroma. Puede sustituirlas por los champiñones o bien poner 100 g de setas y 150 g de champiñones."]},{"categoria":"ARROCES","titulo":"Arroz de la Yaya Elo (asun) (Libro Menús de Fiesta)","raciones":"4 personas","racionesBase":4,"tiempo":"40 min","ingredientes":[{"texto":"Primer paso, para el fumet: 250 g de gambas peladas reservando las cáscaras","cantidad":null,"resto":"Primer paso, para el fumet: 250 g de gambas peladas reservando las cáscaras","escalable":false},{"texto":"250 g de agua","cantidad":250.0,"resto":"g de agua","escalable":true,"modo":"simple"},{"texto":"Segundo paso: 50 g de zumo de naranja","cantidad":null,"resto":"Segundo paso: 50 g de zumo de naranja","escalable":false},{"texto":"50 g de zumo de limón","cantidad":50.0,"resto":"g de zumo de limón","escalable":true,"modo":"simple"},{"texto":"500 g de agua","cantidad":500.0,"resto":"g de agua","escalable":true,"modo":"simple"},{"texto":"El líquido del fumet reservado","cantidad":null,"resto":"El líquido del fumet reservado","escalable":false},{"texto":"4 dientes de ajo","cantidad":4.0,"resto":"dientes de ajo","escalable":true,"modo":"simple"},{"texto":"2 1/2 pastillas de caldo","cantidad":2.0,"resto":"1/2 pastillas de caldo","escalable":true,"modo":"simple"},{"texto":"6 ramas de perejil","cantidad":6.0,"resto":"ramas de perejil","escalable":true,"modo":"simple"},{"texto":"Unas hebras de azafrán","cantidad":null,"resto":"Unas hebras de azafrán","escalable":false},{"texto":"1 cayena (opcional)","cantidad":1.0,"resto":"cayena (opcional)","escalable":true,"modo":"simple"},{"texto":"Tercer paso para el sofrito: 100 g de aceite","cantidad":null,"resto":"Tercer paso para el sofrito: 100 g de aceite","escalable":false},{"texto":"100 g de pimiento verde","cantidad":100.0,"resto":"g de pimiento verde","escalable":true,"modo":"simple"},{"texto":"100 g de pimiento rojo","cantidad":100.0,"resto":"g de pimiento rojo","escalable":true,"modo":"simple"},{"texto":"250 g de tomate natural triturado"," },{"texto":"10 g de sal","cantidad":10.0,"resto":"g de sal","escalable":true,"modo":"simple"},{"texto":"Para el montaje: 2 cebollas grandes","cantidad":null,"resto":"Para el montaje: 2 cebollas grandes","escalable":false},{"texto":"Una nuez de mantequilla y un chorrito de aceite de oliva","cantidad":null,"resto":"Una nuez de mantequilla y un chorrito de aceite de oliva","escalable":false},{"texto":"2 guindillas verdes frescas","cantidad":2.0,"resto":"guindillas verdes frescas","escalable":true,"modo":"simple"},{"texto":"½ cucharadita de cúrcuma","cantidad":0.5,"resto":"cucharadita de cúrcuma","escalable":true,"modo":"simple"},{"texto":"½ cucharadita de guindilla de Cachemira","cantidad":0.5,"resto":"cucharadita de guindilla de Cachemira","escalable":true,"modo":"simple"},{"texto":"3 vainas de cardamomo verde","cantidad":3.0,"resto":"vainas de cardamomo verde","escalable":true,"modo":"simple"},{"texto":"2 clavos","cantidad":2.0,"resto":"clavos","escalable":true,"modo":"simple"},{"texto":"1 hoja de laurel","cantidad":1.0,"resto":"hoja de laurel","escalable":true,"modo":"simple"},{"texto":"1 cucharadita de semillas de comino","cantidad":1.0,"resto":"cucharadita de semillas de comino","escalable":true,"modo":"simple"},{"texto":"½ cucharadita de garam masala","cantidad":0.5,"resto":"cucharadita de garam masala","escalable":true,"modo":"simple"},{"texto":"Una pizca de azafrán","cantidad":null,"resto":"Una pizca de azafrán","escalable":false},{"texto":"60 ml de leche entera","cantidad":60.0,"resto":"ml de leche entera","escalable":true,"modo":"simple"},{"texto":"25 g de cilantro fresco","cantidad":25.0,"resto":"g de cilantro fresco","escalable":true,"modo":"simple"},{"texto":"10 g de menta fresca","cantidad":10.0,"resto":"g de menta fresca","escalable":true,"modo":"simple"},{"texto":"25 g de mantequilla fundida","cantidad":25.0,"resto":"g de mantequilla fundida","escalable":true,"modo":"simple"},{"texto":"1 limón","cantidad":1.0,"resto":"limón","escalable":true,"modo":"simple"}],"elaboracion":["Cortar los contramuslos en 3-4 trozos cada uno. Mezclarlos con el yogur, la sal, el jengibre y el ajo rallados, el garam masala, el zumo de lima, la cúrcuma y la guindilla de Cachemira. Dejar marinar un mínimo de 2 horas, mejor toda la noche.","Cortar las cebollas en medias lunas y caramelizarlas en una olla amplia con mantequilla, aceite y sal durante 45 minutos, hasta que queden bien doradas y dulces.","Lavar el arroz bajo el grifo hasta que el agua salga clara y dejarlo en remojo 30 minutos. Hervir 3 litros de agua con el cardamomo, los clavos, la canela, el anís, el laurel y la sal; añadir el arroz escurrido, hervir 3 minutos, escurrir y retirar las especias enteras.","Reservar dos tercios de la cebolla caramelizada. Al tercio restante, añadir la cúrcuma, la guindilla de Cachemira, el cardamomo, los clavos, el laurel, el comino y el garam masala; sofreír 30 segundos y añadir el pollo con su adobo; cocinar 2 minutos.","Infusionar el azafrán en la leche templada. Picar el cilantro y la menta.","Retirar la olla del fuego y montar por capas: las hierbas, la mitad del arroz, la mitad de la cebolla caramelizada reservada, más hierbas y la mitad del zumo de limón. Cubrir con el resto del arroz, la leche con azafrán, la mantequilla fundida, el resto de la cebolla, más hierbas y el resto del zumo de limón.","Tapar y cocinar a fuego muy bajo 20 minutos sin destapar en ningún momento. Retirar del fuego y dejar reposar 5 minutos antes de servir, mezclando bien las capas al emplatar."]},{"categoria":"ARROCES","titulo":"Bibimbap (diegodoal) (Poke Bowl Coreano)","raciones":"2 personas","racionesBase":2,"tiempo":"1 hora","ingredientes":[{"texto":"Para la zanahoria encurtida: 2 zanahorias","cantidad":null,"resto":"Para la zanahoria encurtida: 2 zanahorias","escalable":false},{"texto":"15 ml de vinagre de arroz","cantidad":15.0,"resto":"ml de vinagre de arroz","escalable":true,"modo":"simple"},{"texto":"15 ml de salsa de soja","cantidad":15.0,"resto":"ml de
